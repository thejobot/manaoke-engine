<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My song library</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; padding:48px 24px; background:#0a0a0c; color:#efeae2;
         font:16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 480px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p  { color:#9b93a6; margin: 0 0 28px; }
  .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:14px; }
  a.card { display:block; aspect-ratio:1; border-radius:12px; overflow:hidden;
           position:relative; text-decoration:none; background:#131318; }
  a.card img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  a.card .cap { position:absolute; left:0; right:0; bottom:0; padding:20px 10px 9px;
                background:linear-gradient(transparent,#000c); }
  a.card .t { display:block; color:#fff; font-size:14px; }
  a.card .a { display:block; color:#d6cfe0; font-size:11px; }
  .empty { color:#6a6376; border:1px dashed #2a2630; border-radius:12px;
           padding:28px; text-align:center; }
</style>
</head>
<body>
<main>
  <h1>My song library</h1>
  <p>Built with the Manaoke engine.</p>
  <div class="grid" id="grid"></div>
</main>
<script>
// The build pipeline writes into this array — landing_card.py adds a card and
// `manaoke_build.py promote` repoints a song's url at its current build.
// Each entry: { title, artist, url, art, cardAccent }
const SONGS = [
];
const grid = document.getElementById('grid');
if (!SONGS.length) {
  grid.outerHTML = '<div class="empty">No songs yet.<br>Run <code>manaoke_build.py init &lt;key&gt;</code> to add one.</div>';
} else {
  grid.innerHTML = SONGS.map(s => `
    <a class="card" href="${s.url}" style="background:${s.cardAccent || '#131318'}">
      ${s.art ? `<img src="${s.art}" alt="">` : ''}
      <span class="cap"><span class="t">${s.title}</span><span class="a">${s.artist}</span></span>
    </a>`).join('');
}
</script>
</body>
</html>
