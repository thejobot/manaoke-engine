function _playWordDrillChained(parts, el){

  // still plays audio-only.

  // the whole sentence + its explanation, so a separate pill was redundant). Its
  // text now rides on the back face as data-explain, read here so the drill tail
  // still says the line's explanation at the very end.

    rows.forEach(r => r.classList.remove('drill-hot'));

  };

    if (el) el.classList.remove('playing');

    timers.forEach(id => clearTimeout(id));

    // connection a brand-new <audio>'s fetch can error or its play() reject,
    // and the old code dropped STRAIGHT to the English gloss — that's the
    // disjoint. opts.retries re-fetches the clip a few times with a short
    // backoff before ever giving up, so a single network blip no longer eats

        a.removeEventListener('loadeddata', arm);

    // Japanese always sounds first, the English follows; never disjointed.

  };

  if (grid && rows.length) grid.classList.add('drill-live');

}

// 2) If the aggregated file isn't in audioCache, fall back to per-
//    part sequential HQ playback (works on desktop; iOS Safari may
//    block the chained Audio.play() outside the originating user-
//    gesture chain).

//    speechSynthesis (Siri) - only happens when neither aggregated
//    nor parts are usable.

  // sequence only when drill parts are absent (old data).

  if (Array.isArray(_drill) && _drill.length) return playWordDrill(_drill, el);
  // Word-less lines (pure-EN lyrics) own no per-word parts but can still own
  // a DRILL_MAP concat (line + explainer tail). Dispatch it so the pill
  // teaches on EVERY line, not just JP ones. (Round 11)
  try {
    const _g = el ? el.closest('.card-face.back') : null;
    const _j = _g ? _g.querySelector('.brief-play--jp') : null;
    const _k = _j ? lineTrKey(_j.dataset.speak || '') : '';
    if (typeof DRILL_MAP !== 'undefined' && _k && DRILL_MAP[_k] && DRILL_MAP[_k].audio) return playWordDrill([], el);
  } catch(_){}
  const fullText = el.dataset.speak || '';
  // 1) Aggregated HQ clip keyed on the exact concatenated string, if it exists.
  if (fullText && audioCache['en-US:' + fullText]){
    return speakEN(fullText, el);
  }
  // 2) Otherwise speak the curated en_speak PARTS — NEVER the displayed gloss
  //    (data-speak). The gloss can contain romaji like "pinsaro (slang)", which
  //    the browser's English voice would mispronounce. This was the root cause
  //    of "English voice says pinsaro". (TTS language-safety.)

  try { parts = JSON.parse(el.dataset.enParts || '[]'); } catch(_){}
  parts = (Array.isArray(parts) ? parts : []).filter(Boolean);

// Background word-clip prewarm (boot)
// ------------------------------------------------------------------
// Bug this fixes: in the word-by-word drill the FIRST word would
// sometimes skip its Japanese clip and jump straight to the English
// gloss; tapping the word's note card "fixed" it only because that
// pulled the clip into the browser cache. Two compounding causes:
//   1. every clip response carried `Clear-Site-Data: "cache"` (from the
//      broad /songs/* header rule), so each clip the drill played WIPED
//      the cache of the others — the cold-fetch race never settled.
//      (Fixed in _headers: audio/* now caches immutable, no wipe.)
//   2. a brand-new <audio> for an un-cached clip can't start playing in
//      time, so playUrl()'s skip path falls through to the gloss.
// So at boot, once the page is interactive, quietly warm EVERY per-word
// clip into the (now-persistent) cache — lowest priority, drill clips
// (JP word + gloss) first, then the note-card definition/context clips.
// After this the drill + note cards always have an instant, already-
// loaded clip from the very first tap: the "loaded in memory, then it's
// fine" state the owner saw after tapping a card, but for every word up front.
// JP word clips are kept as fully-buffered, ready-to-play <audio> ELEMENTS in
// memory (not just bytes in the HTTP cache). That is the exact state the owner found
// "fine" after tapping a note card, and it's what makes the drill's FIRST JP
// clip start instantly instead of losing its race and skipping to the gloss —
// a brand-new <audio> for an un-cached clip can't start in time, but a pooled,
// already-decoded element can. The drill reuses these via _drillClip(). EN
// clips (gloss/def/context) only need to be in the HTTP cache, so they're
// fetch-warmed (lighter — they already play reliably).
const CLIP_POOL = new Map();   // jp-clip url -> ready HTMLAudioElement
function _drillClip(url){
  url = _withAudioV(url);   // mana: version stable clip names (see AUDIO_V)
  const p = CLIP_POOL.get(url);
  if (p && p.paused){ try { p.currentTime = 0; } catch(_){} return p; }
  return new Audio(url);
}

// plays its first JP clip from a 200ms setTimeout (cued off the pill tap), which
// on a fresh page can fall OUTSIDE that gesture window and get rejected — and a
// rejected JP attempt is exactly what lets the English gloss through ("says the
// English, not the Japanese"). Tapping a note card plays a clip from a DIRECT
// gesture, which unlocks audio for the whole session — which is also why it's
// "fine after." So unlock on the very first touch anywhere, before any drill
// runs, by playing a tiny silent clip inside the gesture + resuming the SFX
// AudioContext. One-shot; harmless (and a no-op) where audio is already free.

    const a = new Audio('data:audio/wav;base64,UklGRpwAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YXgAAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgIA=');

    // already silence (and volume=0), so keep it inaudible but NOT muted —

    let done = false, t = null;
    const cleanup = () => { a.removeEventListener('canplaythrough', ok); a.removeEventListener('loadeddata', ok); a.removeEventListener('error', no); };
    const finish = () => { if (done) return; done = true; if (t) clearTimeout(t); cleanup(); res(); };
    const ok = () => finish();
    const no = () => { CLIP_POOL.delete(url); finish(); };
    // Watchdog: a stalled cellular fetch would otherwise NEVER resolve and would
    // permanently occupy a concurrency slot — 6 stalls freeze the whole warm
    // queue. Time out, abort the download (src=''), drop the half-loaded element
    // from the pool, and free the slot. _drillClip falls back to a fresh <audio>
    // on the HTTP cache, so dropping a slow element can't break the drill.
    t = setTimeout(() => { try { a.src = ''; a.load(); } catch(_){} CLIP_POOL.delete(url); finish(); }, 9000);
    a.addEventListener('canplaythrough', ok, { once: true });
    a.addEventListener('loadeddata', ok, { once: true });   // belt-and-suspenders
    a.addEventListener('error', no, { once: true });
    CLIP_POOL.set(url, a);
    a.src = url;
    try { a.load(); } catch(_){ no(); }
  });
  // EN clips: pull the FULL body so the whole file lands in the HTTP cache; a
  // later `new Audio(url)` then plays from cache with no network round-trip.
  // 404s are swallowed; force-cache + the immutable _headers rule mean we never
  // refetch a clip we already have.
  const warmFetch = (url) => {
    // Same stall protection for the EN fetch-warm: abort after 9s so a hung
    // socket releases its slot instead of wedging the queue.
    const ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    const t = ctrl ? setTimeout(() => { try { ctrl.abort(); } catch(_){} }, 9000) : null;
    return fetch(url, { cache: 'force-cache', signal: ctrl ? ctrl.signal : undefined })
      .then(r => (r && r.ok) ? r.arrayBuffer() : null)
      .catch(() => {})
      .then(() => { if (t) clearTimeout(t); });
  };
  // The Word-by-Word drill now plays ONE concatenated file per line (DRILL_MAP);
  // warm those first — they're the drill's actual sound. The per-word JP/EN clips
  // still warm behind them for the note cards + pitch cards + chained fallback.
  const drillUrls = [];
  try {
    if (typeof DRILL_MAP !== 'undefined') Object.keys(DRILL_MAP).forEach(k => {
      const a = DRILL_MAP[k] && DRILL_MAP[k].audio;
      if (a && !seen.has(a)){ seen.add(a); drillUrls.push(a); }
    });
  } catch(_){}
  // JP first (the headline fix), then the EN clips.
  const queue = [...drillUrls.map(u => () => warmFetch(u)),
                 ...jpUrls.map(u => () => warmJp(u)), ...enUrls.map(u => () => warmFetch(u))];
  if (!queue.length) return;
  let i = 0;
  const pump = () => {
    if (i >= queue.length) return;
    // Foreground priority: pause background warming while EITHER a drill/vocab
    // clip is speaking OR the song itself is playing — never steal bandwidth
    // from foreground audio or the YouTube stream (owner: the background load must
    // not screw up song playback). The study clips are only needed once the user
    // opens a card, which pauses the song — so warming resumes exactly when it's
    // wanted (song paused / studying) and stays out of the way during playback.
    const _busy = (typeof currentSeq !== 'undefined' && currentSeq) ||
                  (typeof isPlaying !== 'undefined' && isPlaying);
    if (_busy){ setTimeout(pump, 600); return; }
    queue[i++]().then(pump);
  };
  for (let k = 0; k < Math.min(_conc, queue.length); k++) pump();
}

// v6: mirror existing v24 topbar spans into the master transport row
(function mirrorV24Topbar(){
  const pairs = [['lineNow','lineNowTop'],['lineTotal','lineTotalTop'],['timeNow','timeNowTop']];
  for (const [srcId, dstId] of pairs){
    const src = document.getElementById(srcId);
    const dst = document.getElementById(dstId);
    if (!src || !dst) continue;
    const sync = () => { if (window.__pillScrub) return; dst.textContent = src.textContent; };
    sync();
    new MutationObserver(sync).observe(src, {childList:true, characterData:true, subtree:true});

})();

// Keep the transport's play icon in sync with v24's existing setPlayIcon()
// by observing the hidden #topPlayIcon that v24 updates directly.
(function mirrorPlayIcon(){
  const source = document.querySelector('#topPlayIcon use');
  if (!source || !uTpPlayIcon) return;
  const ppIcon = document.getElementById('uTimePPIcon');
  const mo = new MutationObserver(() => {
    const href = source.getAttribute('href');
    const use = uTpPlayIcon.querySelector('use');
    // E6: the VISIBLE transport glyphs get the dip-and-return swap
    // (#topPlayIcon itself is hidden chrome — it stays instant).
    if (use && href) swapUseGlyph(use, href);
    // Mirror the same state into the elapsed-time cell's mini glyph.
    if (ppIcon && href){
      const ppUse = ppIcon.querySelector('use');
      if (ppUse) swapUseGlyph(ppUse, href);
    }
  });
  mo.observe(source, {attributes:true, attributeFilter:['href','xlink:href']});
})();

if (uTpPlay){
  uTpPlay.addEventListener('click', () => {
    // Route to the current mode's primary media
    const mode = U_APP.dataset.currentMode;
    if (mode === 'sing'){
      if (!ytReady || !player) return;
      if (isPlaying){ SFX.pause(); player.pauseVideo(); }
      else {
        SFX.play();
        const target = lines[activeLineIdx] ? lines[activeLineIdx].t + offset : 0;
        if (studyMode || playbackMode === 'study'){
          // In study mode, play always means "play this line from the
          // top" — including after the auto-pause at line end, so
          // hitting play again restarts the same line instead of
          // resuming at lineEnd. Bump lastManualNavAt so the tick's
          // pause-at-line-end branch is gated for 500ms; otherwise the
          // YT seek can lag behind playVideo and the tick would
          // re-pause based on the stale getCurrentTime() at lineEnd.
          // Applies to both the legacy back-flip studyMode and the
          // new topbar playbackMode='study' chip.
          lastManualNavAt = Date.now();
          player.seekTo(target, true);
          player.playVideo();
        } else {
          const cur = player.getCurrentTime();
          if (Math.abs(cur - target) > 3){
            // resume where video is, not where card is, unless we're way off-section
            player.playVideo();
          } else {
            player.seekTo(target, true);
            player.playVideo();
          }
        }
      }
    } else if (mode === 'immerse'){
      const audio = document.getElementById('uPodcastAudio');
      if (audio){
        if (!audio.src) audio.src = _withAudioV(PODCAST_URL);
        if (audio.paused) audio.play().catch(()=>{});
        else audio.pause();
      }
    } else {
      // Listen mode - no media routing for v2 (iframe handles its own)
      SFX.tap();
    }
  });
}
if (uTpFirst){
  uTpFirst.addEventListener('click', () => {
    SFX.tap();
    const mode = U_APP.dataset.currentMode;
    if (mode === 'immerse'){
      const audio = document.getElementById('uPodcastAudio');
      if (audio){ audio.currentTime = 0; }
      return;
    }
    if (mode !== 'sing' || !lines.length) return;
    // Back-to-start: jump to first card, seek video to 0, respect browse mode
    goToLine(0, {seek:true, play:isPlaying, manual:true});
    if (browseMode && ytReady && player){
      // even in browse mode, "back to start" resets the playhead
      try { player.seekTo(0, true); } catch(e){}
    }
  });
}
if (uTpPrev){
  uTpPrev.addEventListener('click', () => {
    if (U_APP.dataset.currentMode !== 'sing' || !lines.length) return;
    SFX.tap();
    const target = Math.max(0, activeLineIdx - 1);
    if (target !== activeLineIdx) goToLine(target, {seek:true, play:isPlaying && !browseMode, manual:true});
  });
}
if (uTpNext){
  uTpNext.addEventListener('click', () => {
    if (U_APP.dataset.currentMode !== 'sing' || !lines.length) return;
    SFX.tap();
    const target = Math.min(lines.length - 1, activeLineIdx + 1);
    if (target !== activeLineIdx) goToLine(target, {seek:true, play:isPlaying && !browseMode, manual:true});
  });
}
if (uTpNextSection){
  uTpNextSection.addEventListener('click', () => {
    if (U_APP.dataset.currentMode !== 'sing' || !lines.length) return;
    SFX.tap();
    // Jump to the first line of the next section after the active one.
    // Sections are shared object refs across matched lines, so an identity
    // change between adjacent lines marks a boundary.
    let target = -1;
    for (let i = activeLineIdx + 1; i < lines.length; i++){
      const prev = lines[i-1] ? lines[i-1].section : null;
      if (lines[i].section && lines[i].section !== prev){ target = i; break; }
    }
    if (target === -1) target = lines.length - 1;
    if (target !== activeLineIdx) goToLine(target, {seek:true, play:isPlaying && !browseMode, manual:true});
  });
}

// Topbar menu toggle: tapping the album art reveals the row holding the
// LISTEN/SING/IMMERSE chips and the Aa/theme/gear buttons.
(function initTopbarMenu(){
  const topbar = document.querySelector('.u-master-topbar');
  const btn = document.getElementById('uMenuToggle');
  const row = document.getElementById('uTbMenuRow');
  if (!topbar || !btn || !row) return;
  const open = () => {
    topbar.dataset.menuOpen = 'true';
    row.hidden = false;
    btn.setAttribute('aria-expanded', 'true');
    SFX.tap();
  };
  const close = () => {
    topbar.dataset.menuOpen = 'false';
    btn.setAttribute('aria-expanded', 'false');
    // Let the uMenuClose exit animation (0.15s) play before display:none.
    // Guard: if reopened during the wait, don't hide the now-open menu.
    setTimeout(() => { if (topbar.dataset.menuOpen !== 'true') row.hidden = true; }, 160);
  };
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (topbar.dataset.menuOpen === 'true') close(); else open();
  });
  // Close on ANY interaction outside the menu (tap, click, scroll-press).
  // Use capture-phase pointerdown, NOT bubbling click: (1) pointerdown fires
  // on every element regardless of whether it's "clickable" — iOS Safari does
  // not emit click for taps on plain divs like the lyric stage; (2) capture
  // phase runs before any target handler can stopPropagation() (transport
  // buttons, cards, etc. all do), which would otherwise swallow a bubbling
  // click before it reached the document.
  const dismissOnOutside = (e) => {
    if (topbar.dataset.menuOpen !== 'true') return;
    if (row.contains(e.target) || btn.contains(e.target)) return;
    close();
  };
  document.addEventListener('pointerdown', dismissOnOutside, true);
  // Fallback for environments without Pointer Events.
  if (!window.PointerEvent){
    document.addEventListener('touchstart', dismissOnOutside, true);
    document.addEventListener('mousedown', dismissOnOutside, true);
  }
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && topbar.dataset.menuOpen === 'true') close();
  });
  // After picking a mode, collapse the menu so the user can see their pick.
  row.querySelectorAll('.u-mode-chip').forEach(chip => {
    chip.addEventListener('click', () => setTimeout(close, 0));
  });
  // Opening the gear drawer should also close the topbar menu so the
  // disclosed row isn't lingering behind the drawer.
  const gearBtn = document.getElementById('uGearBtn');
  if (gearBtn) gearBtn.addEventListener('click', () => setTimeout(close, 0));
})();

// ============================================================
// iOS-style drum wheel picker (build 84d9lk). Replaces the old
// horizontal line-slider and the section drop-down list. Tapping
// the Verse or Line cell opens a momentum wheel you spin up/down;
// the centered row is the value, Done commits, Cancel/backdrop
// dismisses. Native overflow-scroll gives touch momentum + snap;
// pointer-drag adds the same feel for a desktop mouse.
// ============================================================
function openWheel(opts){
  const ITEM_H = 44, VP = 220, PAD = (VP - ITEM_H) / 2;
  const esc = (s) => String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  let overlay = document.getElementById('uWheelOverlay');
  if (!overlay){
    overlay = document.createElement('div');
    overlay.id = 'uWheelOverlay';
    overlay.className = 'u-wheel-overlay';
    overlay.hidden = true;
    overlay.innerHTML =
      '<div class="u-wheel" role="dialog" aria-modal="true" aria-label="picker">'
      + '<div class="u-wheel-head">'
      +   '<button type="button" class="u-wheel-btn u-wheel-btn--cancel">Cancel</button>'
      +   '<span class="u-wheel-title"></span>'
      +   '<button type="button" class="u-wheel-btn u-wheel-btn--done">Done</button>'
      + '</div>'
      + '<div class="u-wheel-viewport"><div class="u-wheel-band"></div>'
      +   '<div class="u-wheel-scroll" tabindex="0"></div></div>'
      + '</div>';
    document.body.appendChild(overlay);
  }
  const titleEl  = overlay.querySelector('.u-wheel-title');
  const scroll   = overlay.querySelector('.u-wheel-scroll');
  const btnCancel= overlay.querySelector('.u-wheel-btn--cancel');
  const btnDone  = overlay.querySelector('.u-wheel-btn--done');
  titleEl.textContent = opts.title || '';

  // Build rows with top/bottom spacers so first/last can center.
  scroll.innerHTML = '';
  const spacer = () => { const d = document.createElement('div'); d.style.height = PAD + 'px'; d.setAttribute('aria-hidden','true'); return d; };
  scroll.appendChild(spacer());
  opts.items.forEach((it, i) => {
    const el = document.createElement('div');
    el.className = 'u-wheel-item';
    el.dataset.i = i;
    let html = '';
    if (it.idx != null) html += '<span class="wi-idx">' + esc(it.idx) + '</span>';
    html += '<span class="wi-main">' + esc(it.main) + '</span>';
    if (it.sub) html += '<span class="wi-sub">' + esc(it.sub) + '</span>';
    el.innerHTML = html;
    // Tapping the row that's already centered (landed) confirms it and goes —
    // no separate Done tap needed. Tapping any other row brings it to center
    // first (a second tap then commits it).
    el.addEventListener('click', () => {
      if (i === centeredIndex()) commit();
      else scrollToIndex(i, true);
    });
    scroll.appendChild(el);
  });
  scroll.appendChild(spacer());
  const itemEls = Array.prototype.slice.call(scroll.querySelectorAll('.u-wheel-item'));
  const N = itemEls.length;

  const clamp = (i) => Math.max(0, Math.min(N - 1, i));
  const centeredIndex = () => clamp(Math.round(scroll.scrollTop / ITEM_H));
  const scrollToIndex = (i, smooth) => scroll.scrollTo({ top: clamp(i) * ITEM_H, behavior: smooth ? 'smooth' : 'auto' });

  const updateDrum = () => {
    const vpMid = scroll.scrollTop + VP / 2;
    for (let i = 0; i < N; i++){
      const elMid = PAD + i * ITEM_H + ITEM_H / 2;
      const norm = (elMid - vpMid) / (VP / 2);          // -1..1 across half the drum
      const a = Math.max(-1.5, Math.min(1.5, norm));
      const ang = a * 56;                                // drum tilt
      const op  = Math.max(0.16, 1 - Math.abs(norm) * 0.72);
      const sc  = Math.max(0.8, 1 - Math.abs(norm) * 0.16);
      const el = itemEls[i];
      el.style.transform = 'rotateX(' + ang.toFixed(1) + 'deg) scale(' + sc.toFixed(3) + ')';
      el.style.opacity = op.toFixed(3);
      el.classList.toggle('is-centered', Math.abs(elMid - vpMid) < ITEM_H / 2);
    }
  };

  let rafPending = false, settleTimer = 0, lastTick = -1;
  const onScroll = () => {
    if (!rafPending){ rafPending = true; requestAnimationFrame(() => { rafPending = false; updateDrum(); }); }
    const c = centeredIndex();
    if (c !== lastTick){ lastTick = c; if (window.SFX && SFX.tap) try { SFX.tap(); } catch(e){} }
    clearTimeout(settleTimer);
    settleTimer = setTimeout(() => { if (!dragging) scrollToIndex(centeredIndex(), true); }, 110);
  };
  scroll.addEventListener('scroll', onScroll, { passive: true });

  // Pointer-drag spin (mouse only; touch uses native momentum scroll).
  let dragging = false, drag = null;
  const onDown = (e) => {
    if (e.pointerType === 'touch') return;
    dragging = true;
    drag = { y: e.clientY, top: scroll.scrollTop, lastY: e.clientY, lastT: performance.now(), v: 0 };
    scroll.style.scrollSnapType = 'none';
    try { scroll.setPointerCapture(e.pointerId); } catch(e2){}
    e.preventDefault();
  };
  const onMove = (e) => {
    if (!dragging) return;
    scroll.scrollTop = drag.top - (e.clientY - drag.y);
    const now = performance.now(), dt = now - drag.lastT || 1;
    drag.v = (e.clientY - drag.lastY) / dt;
    drag.lastY = e.clientY; drag.lastT = now;
  };
  const onUp = () => {
    if (!dragging) return;
    dragging = false;
    let vel = -(drag.v) * 14;
    const glide = () => {
      if (Math.abs(vel) < 0.5){ scroll.style.scrollSnapType = 'y mandatory'; scrollToIndex(centeredIndex(), true); return; }
      scroll.scrollTop += vel; vel *= 0.92; requestAnimationFrame(glide);
    };
    requestAnimationFrame(glide);
  };
  scroll.addEventListener('pointerdown', onDown);
  scroll.addEventListener('pointermove', onMove);
  scroll.addEventListener('pointerup', onUp);
  scroll.addEventListener('pointercancel', onUp);

  const close = () => {
    overlay.classList.remove('is-open');
    document.removeEventListener('keydown', onKey);
    setTimeout(() => { overlay.hidden = true; }, 260);
  };
  const commit = () => { const i = centeredIndex(); close(); if (opts.onCommit) opts.onCommit(i); };
  const onKey = (e) => {
    if (e.key === 'Escape'){ close(); }
    else if (e.key === 'Enter'){ commit(); }
    else if (e.key === 'ArrowDown'){ e.preventDefault(); scrollToIndex(centeredIndex() + 1, true); }
    else if (e.key === 'ArrowUp'){ e.preventDefault(); scrollToIndex(centeredIndex() - 1, true); }
  };
  btnCancel.onclick = close;
  btnDone.onclick = commit;
  overlay.onclick = (e) => { if (e.target === overlay) close(); };
  document.addEventListener('keydown', onKey);

  overlay.hidden = false;
  requestAnimationFrame(() => {
    scroll.scrollTop = clamp(opts.selected || 0) * ITEM_H;
    updateDrum();
    requestAnimationFrame(() => overlay.classList.add('is-open'));
  });
}

// Line cell → wheel of every line (number + lyric snippet).
(function initLineWheel(){
  const btn = document.getElementById('uLineBtn');
  if (!btn) return;
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (U_APP.dataset.currentMode !== 'sing') return;
    if (!lines || !lines.length) return;
    const items = lines.map((ln, i) => ({
      idx: String(i + 1).padStart(2, '0'),
      main: (ln && ln.text) ? ln.text : (ln && ln.intro ? '— intro —' : '·')
    }));
    openWheel({
      title: 'Skip to line', items, selected: activeLineIdx,
      onCommit: (i) => goToLine(i, { seek: true, play: isPlaying && !browseMode, manual: true })
    });
  });
})();

// Verse cell → wheel of every section.
(function initSectionWheel(){
  const btn = document.getElementById('uSectionBtn');
  if (!btn) return;
  const fmtTime = (t) => {
    if (!Number.isFinite(t)) return '';
    return Math.floor(t / 60) + ':' + Math.floor(t % 60).toString().padStart(2, '0');
  };
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (U_APP.dataset.currentMode !== 'sing') return;
    if (!lines || !lines.length) return;
    // Mirror distinctSections(): include instrumental runs (intro + interludes)
    // as their own jump targets, labelled "Intro" / "Interlude".
    let lastSec = null; let inInstr = false; const seen = [];
    lines.forEach((ln, i) => {
      if (ln && ln.instrumental){
        if (!inInstr){ seen.push({ name: instrumentalSectionName(ln), idx: i, t: ln.t }); inInstr = true; }
        return;
      }
      inInstr = false;
      const s = ln.section;
      if (!s || s === lastSec) return;
      lastSec = s; seen.push({ section: s, idx: i, t: ln.t });
    });
    if (!seen.length) return;
    // Select the entry the current line falls in (last entry starting at/before it).
    let sel = 0;
    for (let k = 0; k < seen.length; k++){ if (seen[k].idx <= activeLineIdx) sel = k; else break; }
    const items = seen.map((x) => ({
      main: x.name || (x.section.name || x.section.id || 'Section'),
      sub: fmtTime(x.t),
    }));
    openWheel({
      title: 'Jump to section', items, selected: sel,
      onCommit: (i) => goToLine(seen[i].idx, { seek: true, play: isPlaying && !browseMode, manual: true })
    });
  });
})();

// Mode chip: tap to cycle Sing ↔ Study. Label is persistent and
// reflects the current state ("Sing Mode" / "Study Mode") so a glance
// at the chip tells you which policy is live. Colour reinforces it
// (purple = sing, green = study); pulse animation acknowledges the
// cycle. Playback-policy enforcement happens in startTick() (no
// auto-advance when in study mode, hard pause at line end).
(function initModeCycle(){
  const btn = document.getElementById('uModeBtn');
  if (!btn) return;
  const MODE_LABEL = {sing: 'Sing Mode', study: 'Study Mode'};
  const syncUi = () => {
    btn.dataset.mode = playbackMode;
    btn.textContent = MODE_LABEL[playbackMode] || 'Sing Mode';
    U_APP.dataset.playbackMode = playbackMode;
  };
  syncUi();
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (U_APP.dataset.currentMode !== 'sing') return;
    playbackMode = (playbackMode === 'sing') ? 'study' : 'sing';
    try { localStorage.setItem('tapLines_playbackMode', playbackMode); } catch {}
    // Changing playback policy stops any in-flight word/clip audio.
    try { stopVocabAudio(); } catch(_){}
    SFX.toggle();
    syncUi();
    // k0dxk2: tell the user what they just switched into.
    showCornerToast(playbackMode === 'study' ? 'focus line by line' : 'continuous play for singing');

// ------------------------------------------------------------------
// Press-drag scrub on the four counter cells (Section · Line · Time · Mode)
// ------------------------------------------------------------------
// Each cell is grabbable: press and drag to preview a target, release to
// commit. A plain tap (movement under TAP_SLOP) falls through to the cell's
// existing click handler (open the wheel picker / cycle the mode); a drag
// suppresses that click so the two interactions never both fire.
//
//   Section / Line / Mode  — VERTICAL drag. Finger DOWN moves BACKWARD
//     through the song (earlier section / earlier line / previous mode),
//     finger UP moves FORWARD. Release selects the previewed item.
//   Time                   — HORIZONTAL drag. Finger LEFT scrubs BACKWARD,
//     RIGHT scrubs FORWARD. Release seeks to the previewed time.
//
// While a drag previews a label, window.__pillScrub gates the topbar mirror
// (mirrorV24Topbar) and goToLine's label writes so an auto-advance running
// underneath can't stomp the value the finger is parked on.
(function initPillScrub(){
  const counter = document.querySelector('.u-master-topbar .u-counter');
  if (!counter) return;
  const MODES = ['sing', 'study'];
  const MODE_LABEL = {sing: 'Sing Mode', study: 'Study Mode'};
  const TAP_SLOP = 8;        // px of movement below which it's a tap, not a drag
  const STEP = {section: 30, line: 24, mode: 36}; // px of vertical travel per step
  const clamp = (v, lo, hi) => v < lo ? lo : (v > hi ? hi : v);
  const fmtClock = (t) => {
    t = Math.max(0, Math.floor(t)); const m = Math.floor(t / 60), s = t % 60;
    return m + ':' + String(s).padStart(2, '0');
  };
  // Distinct sections in song order, each tagged with the line index it starts
  // on. Instrumental stretches (intro + no-lyric interludes) have no section, so
  // they'd be skipped — instead emit one entry per instrumental RUN, flagged so
  // the navigator shows a music-note glyph. (A section that resumes the same
  // name after an instrumental break does NOT re-emit — `last` is preserved.)
  const distinctSections = () => {
    let last = null; let inInstr = false; const out = [];
    lines.forEach((ln, i) => {
      if (ln && ln.instrumental){
        if (!inInstr){ out.push({ name: instrumentalSectionName(ln), idx: i }); inInstr = true; }
        return;
      }
      inInstr = false;
      const s = ln && ln.section;
      if (!s || s === last) return;
      last = s; out.push({ name: (s.name || s.id || 'Section'), idx: i });
    });
    return out;
  };

  const pills = [
    { kind: 'section', el: document.getElementById('uSectionBtn'), axis: 'y' },
    { kind: 'line',    el: document.getElementById('uLineBtn'),    axis: 'y' },
    { kind: 'time',    el: counter.querySelector('[data-page-item="timeNow"]'), axis: 'x' },
    { kind: 'mode',    el: document.getElementById('uModeBtn'),    axis: 'y' },
  ].filter(p => p.el);

  let active = null;  // {pill, pointerId, x0, y0, moved, base, list, secPerPx, dur, preview, shown}
  // Only block page scroll WHILE a pill is being dragged. A permanent
  // document touchmove(passive:false) listener disables the browser's native
  // fast-scroll path everywhere — that's what made the lyric scroll sometimes
  // fail to register. Add on grab, remove on release.
  const blockTouch = (e) => e.preventDefault();

  // Song-progress bar: thin grey track under the row that fills white with
  // elapsed progress. startTick() calls window.__setCounterProgress(ratio)
  // every frame when not scrubbing; the time scrub drives the fill directly
  // while the finger is down (and thickens the bar via .is-scrubbing).
  const progEl    = document.getElementById('uCounterProgress');
  const progFill  = document.getElementById('uCounterProgressFill');
  const setProgress = (ratio) => {
    // Round 12: scaleX, not width — compositor-only, zero topbar layout.
    if (progFill) progFill.style.transform = 'scaleX(' + (Math.max(0, Math.min(1, ratio || 0))).toFixed(4) + ')';
  };
  window.__setCounterProgress = setProgress;

  function render(a, np){
    const { kind, el } = a.pill;
    if (kind === 'section'){
      renderSectionLabel(document.getElementById('sectionTop'), a.list[np]);
    } else if (kind === 'line'){
      const ln = document.getElementById('lineNowTop');
      if (ln) ln.textContent = String(np + 1);
    } else if (kind === 'time'){
      const tn = document.getElementById('timeNowTop');
      if (tn) tn.textContent = fmtClock(np);
      if (a.dur > 0) setProgress(np / a.dur);   // fill follows the scrub
    } else if (kind === 'mode'){
      el.dataset.mode = MODES[np];
      el.textContent = MODE_LABEL[MODES[np]];
    }
  }

  function commit(a, np){
    const { kind, el } = a.pill;
    if (kind === 'section'){
      goToLine(a.list[np].idx, { seek: true, play: isPlaying && !browseMode, manual: true });
    } else if (kind === 'line'){
      goToLine(np, { seek: true, play: isPlaying && !browseMode, manual: true });
    } else if (kind === 'time'){
      if (ytReady && player && player.seekTo){
        // Snap the card view to the line that contains the landed time (so the
        // lyrics + section/line pills match), but seek to the EXACT scrubbed
        // position — not the line's start — leaving the playhead where you let
        // go. In study mode we DON'T auto-play on release (same policy as a
        // study-mode swipe); sing mode resumes from the drop point.
        const tt = np - offset;
        let li = 0;
        for (let k = 0; k < lines.length; k++){ if (lines[k].t <= tt) li = k; else break; }
        goToLine(li, { seek: false, play: false, manual: true });
        player.seekTo(np, true);
        const studyNow = studyMode || playbackMode === 'study';
        if (!studyNow && player.playVideo) player.playVideo();
      }
    } else if (kind === 'mode'){
      const next = MODES[np];
      if (next !== playbackMode){
        playbackMode = next;
        try { localStorage.setItem('tapLines_playbackMode', playbackMode); } catch {}
        U_APP.dataset.playbackMode = playbackMode;
        SFX.toggle();
        el.classList.remove('is-pulse'); void el.offsetWidth; el.classList.add('is-pulse');
      }
      el.dataset.mode = playbackMode;
      el.textContent = MODE_LABEL[playbackMode];
    }
  }

  function onMove(e){
    if (!active || e.pointerId !== active.pointerId) return;
    const a = active;
    const dx = e.clientX - a.x0, dy = e.clientY - a.y0;
    if (!a.moved && Math.hypot(dx, dy) < TAP_SLOP) return;  // still within tap slop
    if (!a.moved){
      a.moved = true; window.__pillScrub = true;
      // Time scrub just began: thicken the progress bar for visibility.
      if (a.pill.kind === 'time' && progEl) progEl.classList.add('is-scrubbing');
    }
    e.preventDefault();

    let np;
    if (a.pill.kind === 'time'){
      // The song scrubber is a true 2-D drag: RIGHT and DOWN both move forward,
      // LEFT and UP both move back, and the two axes ADD together. Summing
      // (rather than letting one axis win) keeps a mostly-horizontal drag going
      // forward even when the finger drifts vertically — so left/right and
      // up/down each work in their own right instead of fighting each other.
      const move = dx + dy;   // right + down = forward, left + up = back
      np = clamp(a.base + move * a.secPerPx, 0, a.dur);
    } else {
      // Section/line/mode: up (negative dy) = forward, down = backward.
      // Wrap around instead of clamping: dragging past the last item loops
      // back to the first (and vice versa), so you can keep scrolling through.
      const steps = Math.round(-dy / STEP[a.pill.kind]);
      const n = a.list.length;
      np = ((a.base + steps) % n + n) % n;
    }

    // Re-render + tick the scrub SFX only when the *shown* value changes
    // (whole clock-seconds for time; discrete index for the others).
    const shown = a.pill.kind === 'time' ? fmtClock(np) : np;
    if (shown !== a.shown){
      a.shown = shown; a.preview = np;
      render(a, a.pill.kind === 'time' ? np : np);
      try { SFX.scrub(); } catch {}
    } else if (a.pill.kind === 'time'){
      a.preview = np;  // keep sub-second precision for the eventual seek
    }
  }

  function onUp(e){
    if (!active || e.pointerId !== active.pointerId) return;
    const a = active; active = null;
    document.removeEventListener('touchmove', blockTouch, { passive: false });
    const { el } = a.pill;
    el.classList.remove('is-scrubbing');
    if (progEl) progEl.classList.remove('is-scrubbing');  // bar returns to thin
    try { el.releasePointerCapture(a.pointerId); } catch {}
    window.__pillScrub = false;
    if (a.moved){
      el.__scrubbed = true;          // suppress the synthetic click that follows
      commit(a, a.preview);
    }
    // A pure tap leaves the labels untouched (we only render after moving),
    // so the cell's own click handler picks it up unchanged.
  }

  function onDown(e){
    if (active) return;
    if (U_APP.dataset.currentMode !== 'sing') return;  // counter is live only in Sing
    if (!lines || !lines.length) return;
    const pill = pills.find(p => p.el === e.currentTarget);
    if (!pill) return;
    // mana (owner): the play/time pill no longer hold-to-scrubs in karaoke. A tap
    // still toggles play/pause (the click handler below); scrubbing lives only in
    // the white play-line bar under the pills (#uCounterScrub) — same as immerse.
    if (pill.kind === 'time') return;
    const a = { pill, pointerId: e.pointerId, x0: e.clientX, y0: e.clientY, moved: false };
    if (pill.kind === 'section'){
      a.list = distinctSections();
      if (!a.list.length) return;
      const li = activeLineIdx; let r = 0;
      for (let k = 0; k < a.list.length; k++){ if (a.list[k].idx <= li) r = k; else break; }
      a.base = r;
    } else if (pill.kind === 'line'){
      a.list = lines; a.base = activeLineIdx;
    } else if (pill.kind === 'mode'){
      a.list = MODES; a.base = Math.max(0, MODES.indexOf(playbackMode));
    } else if (pill.kind === 'time'){
      a.dur = songDuration || (player && player.getDuration ? player.getDuration() : 0) || 0;
      if (a.dur <= 0) return;
      // Start the scrub from your CURRENT place in the song, not the start.
      // If the video is actually rolling, that's the playhead. If it isn't
      // (e.g. study mode, where you've been tapping lines and the YT clock is
      // still parked at 0), fall back to the active line's song-time so the
      // scrub picks up where you are rather than rewinding to the beginning.
      const ct = (ytReady && player && player.getCurrentTime) ? player.getCurrentTime() : 0;
      const lineT = ((lines[activeLineIdx] ? lines[activeLineIdx].t : 0) || 0) + offset;
      a.base = clamp(ct > 0.5 ? ct : lineT, 0, a.dur);
      a.secPerPx = clamp(a.dur / 350, 0.15, 0.6);
    }
    a.preview = a.base;
    a.shown = pill.kind === 'time' ? fmtClock(a.base) : a.base;
    active = a;
    document.addEventListener('touchmove', blockTouch, { passive: false });
    pill.el.__scrubbed = false;
    try { pill.el.setPointerCapture(e.pointerId); } catch {}
    pill.el.classList.add('is-scrubbing');
  }

  // Only pointerdown lives on the pill. Move/up/cancel are bound to the
  // WINDOW so the drag survives even when the finger leaves the small pill
  // and pointer capture doesn't hold (iOS can drop capture on a vertical
  // gesture, which made downward drags appear dead — events stopped reaching
  // a pill-only listener the moment the finger slid off the pill).
  pills.forEach((p) => { p.el.addEventListener('pointerdown', onDown); });
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);
  // (The page-scroll block while a pill drag is live is now attached on
  // pointerdown and removed on pointerup — see blockTouch — so it never
  // degrades the native lyric scroll when no pill is being dragged.)

  // Swallow the click that a drag leaves behind so the cell's own handler
  // (wheel picker / mode cycle) doesn't also fire. The guard lives on the
  // counter — an ANCESTOR of the cells — so its capture phase runs before
  // any of the cells' own click listeners (at the target element itself,
  // capture and bubble listeners fire in registration order, not
  // capture-first, so a guard on the cell would lose the race).
  counter.addEventListener('click', (ev) => {
    const cell = ev.target.closest && ev.target.closest('.u-tp-info');
    if (cell && cell.__scrubbed){ ev.stopPropagation(); ev.preventDefault(); cell.__scrubbed = false; }
  }, true);

  // Tap (no drag) on the elapsed-time cell = play/pause. A drag is swallowed
  // by the guard above (cell.__scrubbed), so only a genuine tap gets here.
  // Route through the canonical play button so all the mode-aware logic runs.
  const timePill = pills.find(p => p.kind === 'time');
  if (timePill){
    timePill.el.addEventListener('click', () => {
      const btn = document.getElementById('uTpPlay');
      if (btn) btn.click();
    });
  }

  // The always-on loop / slow toggles in the play pill are TAPPABLE = toggle that
  // feature on/off (study book still works too). They live inside the time pill,
  // so a tap would otherwise bubble to the tap-to-play click above (and the scrub
  // pointerdown) — stopPropagation on both keeps the tap on the toggle alone. The
  // matching study key + the chip fill sync for free: setLoop / applyPlaybackRate
  // re-render the DOM (the flag's own .is-on and the card key's .active).
  const armFlagToggle = (id, toggle) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('pointerdown', (ev) => { ev.stopPropagation(); });
    el.addEventListener('click', (ev) => { ev.stopPropagation(); ev.preventDefault(); toggle(); });
  };
  armFlagToggle('uFlagLoop', () => {
    if (loopingIdx >= 0){ try { SFX.loopOff(); } catch(_){} setLoop(-1); }
    else { try { SFX.loopOn(); } catch(_){} setLoop(activeLineIdx >= 0 ? activeLineIdx : 0); }
  });
  armFlagToggle('uFlagSpeed', () => {
    try { SFX.toggle(); } catch(_){}
    playbackRate = (playbackRate < 1) ? 1 : 0.75;
    applyPlaybackRate();
  });
})();

// ------------------------------------------------------------------
// Direct scrubbing on the always-visible progress bar
// ------------------------------------------------------------------
// The progress bar IS a slider: touch anywhere on it and slide to scrub. The
// position you touch maps directly to a position in the song (absolute, not a
// relative drag) — exactly how a normal media scrubber feels. The fill, thumb
// and time label preview your finger; the player seeks to the landed spot on
// release, leaving the playhead where you let go. In study mode it doesn't
// auto-play. While dragging, window.__pillScrub gates the playback tick so the
// fill doesn't fight the finger.
(function initProgressScrub(){
  const scrub = document.getElementById('uCounterScrub');
  const track = document.getElementById('uCounterProgress');
  if (!scrub || !track) return;
  const fmtClock = (t) => {
    t = Math.max(0, Math.floor(t)); const m = Math.floor(t / 60), s = t % 60;
    return m + ':' + String(s).padStart(2, '0');
  };
  let dragging = false, pid = null, dur = 0, preview = 0, lastSec = -1;
  const stackEl = document.getElementById('cardStack');
  const SP = (typeof SPACING_Y !== 'undefined') ? SPACING_Y : 180;
  const ratioFromX = (clientX) => {
    const r = track.getBoundingClientRect();
    if (r.width <= 0) return 0;
    return Math.max(0, Math.min(1, (clientX - r.left) / r.width));
  };
  // Scroll the native lyric list in real time to follow the scrubbed time.
  // scrollTop is interpolated between the current line's centre and the next
  // line's centre by the fraction into the line, so the lyrics glide smoothly
  // under the finger (no transform — the same buttery native scroll).
  const centerScrollFor = (row) => row.offsetTop - (stackEl.clientHeight - row.offsetHeight) / 2;
  const scrollLyricsTo = (previewT) => {
    if (!stackEl || !lines.length) return;
    const tt = previewT - offset;
    let k = 0;
    for (let i = 0; i < lines.length; i++){ if (lines[i].t <= tt) k = i; else break; }
    let frac = 0;
    const next = lines[k + 1];
    if (next){
      const span = Math.max(0.05, next.t - lines[k].t);
      frac = Math.max(0, Math.min(1, (tt - lines[k].t) / span));
    }
    const rowK = stackEl.querySelector(`.card[data-idx="${k}"]`);
    if (rowK){
      const sK = centerScrollFor(rowK);
      const rowN = next ? stackEl.querySelector(`.card[data-idx="${k + 1}"]`) : null;
      const sN = rowN ? centerScrollFor(rowN) : sK;
      stackEl.scrollTop = Math.max(0, sK + (sN - sK) * frac);
      window.__followWrites = (window.__followWrites || 0) + 1; window.__lastFollowTs = performance.now();
    }
    if (k !== activeLineIdx){
      activeLineIdx = k;
      positionCards(k);
      syncLineMeta(k);
    }
  };
  const showRatio = (ratio) => {
    // mana (owner): music-relative clock — the bar's 0 is the music onset, so the
    // scrub maps ratio onto [musicT0, duration] and can never land in the MV's
    // silent pre-roll. preview stays ABSOLUTE (seek/scroll downstream unchanged);
    // only the displayed clock subtracts the onset.
    const _mt0 = _musicT0();
    preview = _mt0 + ratio * Math.max(0, dur - _mt0);
    if (window.__setCounterProgress) window.__setCounterProgress(ratio);
    const tn = document.getElementById('timeNowTop');
    if (tn) tn.textContent = fmtClock(preview - _mt0);
    scrollLyricsTo(preview);
    const sec = Math.floor(preview);
    if (sec !== lastSec){ lastSec = sec; try { SFX.scrub(); } catch {} }
  };
  // Block page scroll ONLY while the bar is actively being dragged. Attaching
  // this to document permanently (passive:false) kills the native fast-scroll
  // path for the whole page — that's what made the lyric scroll intermittently
  // not register. Add on grab, remove on release.
  const blockTouch = (e) => e.preventDefault();
  function onDown(e){
    if (U_APP.dataset.currentMode !== 'sing') return;   // transport is live only in Sing
    dur = songDuration || (player && player.getDuration ? player.getDuration() : 0) || 0;
    if (dur <= 0) return;
    dragging = true; pid = e.pointerId; lastSec = -1;
    window.__pillScrub = true;
    document.addEventListener('touchmove', blockTouch, { passive: false });
    // Pause playback for the duration of the drag so the audio doesn't garble
    // and the playback tick can't auto-advance the line under the scrub.
    if (isPlaying){ try { player.pauseVideo(); } catch(_){} }
    scrub.classList.add('is-scrubbing');
    try { scrub.setPointerCapture(pid); } catch {}
    e.preventDefault();
    showRatio(ratioFromX(e.clientX));
  }
  function onMove(e){
    if (!dragging || e.pointerId !== pid) return;
    e.preventDefault();
    showRatio(ratioFromX(e.clientX));
  }
  function onUp(e){
    if (!dragging || e.pointerId !== pid) return;
    dragging = false; window.__pillScrub = false;
    document.removeEventListener('touchmove', blockTouch, { passive: false });
    scrub.classList.remove('is-scrubbing');
    try { scrub.releasePointerCapture(pid); } catch {}
    if (ytReady && player && player.seekTo){
      // Snap the card view to the line that contains the landed time, seek to
      // the exact scrubbed position, and leave the playhead there.
      const tt = preview - offset;
      let li = 0;
      for (let k = 0; k < lines.length; k++){ if (lines[k].t <= tt) li = k; else break; }
      lastManualNavAt = Date.now();
      goToLine(li, { seek: false, play: false, manual: true });
      player.seekTo(preview, true);
      const studyNow = studyMode || playbackMode === 'study';
      if (!studyNow && player.playVideo) player.playVideo();
    }
  }
  scrub.addEventListener('pointerdown', onDown);
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);

(function wireWheelNav(){
  const stage = document.getElementById('stage');
  if (!stage) return;
  let wheelAccum = 0;
  let wheelCommitLock = 0;
  const COMMIT_PX = 80;
  stage.addEventListener('wheel', (e) => {
    if (U_APP.dataset.currentMode !== 'sing' || !lines.length) return;
    // Don't grab horizontal wheel scrolls
    if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;

    // Scroll-chaining for the card back: when the cursor is over a
    // flipped card whose study/brief content overflows, let the inner
    // panel consume the wheel first. Only fall through to card-advance
    // once that scroll has hit its top/bottom boundary.
    const inner = e.target.closest('.card-face.back');
    if (inner && inner.scrollHeight > inner.clientHeight + 1){
      const atTop = inner.scrollTop <= 0;
      const atBottom = inner.scrollTop + inner.clientHeight >= inner.scrollHeight - 1;
      if ((e.deltaY < 0 && !atTop) || (e.deltaY > 0 && !atBottom)){
        // Inner can still absorb this wheel - let the browser scroll it
        // and reset the card-advance accumulator so we don't carry
        // stale momentum into the next boundary hit.
        wheelAccum = 0;
        return;
      }
    }

    e.preventDefault();
    wheelAccum += e.deltaY;
    const now = performance.now();
    if (now - wheelCommitLock < 120) return;
    if (Math.abs(wheelAccum) >= COMMIT_PX){
      const dir = wheelAccum > 0 ? 1 : -1;
      wheelAccum = 0;
      wheelCommitLock = now;
      const target = Math.max(0, Math.min(lines.length - 1, activeLineIdx + dir));
      if (target !== activeLineIdx){
        SFX.tap();
        goToLine(target, {seek:true, play:isPlaying && !browseMode, manual:true});
      }
    }
  }, {passive:false});
})();

function setUnifiedMode(mode, opts = {}){
  const {save = true} = opts;
  const valid = ['sing', 'immerse'];
  if (!valid.includes(mode)) mode = 'sing';
  const prev = U_APP.dataset.currentMode;
  if (prev === mode) return;

  U_APP.dataset.currentMode = mode;
  // owner: audio belongs to the surface that started it — leaving a surface
  // silences it. Switching Sing<->Immerse closes any open word-card overlay
  // and stops all word/clip/drill audio so nothing keeps talking off-screen.
  try { collapsePitchRow(); } catch(_){}
  try { stopVocabAudio(); } catch(_){}
  document.querySelectorAll('.u-mode-section').forEach(sec => {
    const isActive = sec.dataset.mode === mode;
    sec.hidden = !isActive;
    // Crossfade the INCOMING section (display:none can't transition, so a
    // one-shot class drives a short fade-in; the topbar chrome is untouched).
    if (isActive){
      sec.classList.remove('mode-entering');
      void sec.offsetWidth;             // restart the animation
      sec.classList.add('mode-entering');
      sec.addEventListener('animationend', () => sec.classList.remove('mode-entering'), { once:true });
    }
  });
  document.querySelectorAll('.u-mode-chip').forEach(chip => {
    const isActive = chip.dataset.mode === mode;
    chip.classList.toggle('active', isActive);
    chip.setAttribute('aria-selected', String(isActive));
  });
  // mana2: the in-pill switch swaps label + action by mode (Immerse → podcast,
  // Karaoke → back to lyrics). Same pill, same place.
  const _ms = document.getElementById('uModeSwitch');
  if (_ms){
    if (mode === 'immerse'){ _ms.textContent = 'Karaoke'; _ms.setAttribute('aria-label', 'back to the lyrics'); }
    else { _ms.textContent = 'Immerse'; _ms.setAttribute('aria-label', 'switch to the podcast'); }
  }
  // v5: auto-play chip is sing–only
  try { applyBrowseModeUI(); } catch {}

  // Leaving Learn - pause podcast audio
  if (prev === 'immerse'){
    const audio = document.getElementById('uPodcastAudio');
    if (audio && !audio.paused) audio.pause();
  }
  // Leaving Sing - pause YT player so it doesn't keep playing hidden
  if (prev === 'sing'){
    if (ytReady && player && typeof player.pauseVideo === 'function'){
      try { player.pauseVideo(); } catch(e){}
    }
  }
  if (save) localStorage.setItem(UNIFIED_MODE_KEY, mode);
  SFX.tap();
}

// ------------------------------------------------------------------
// mana2 (owner): follow-along podcast transcript (immerse). Renders the deep-dive
// script under the play (top bar). The line the podcast is on lights up WORD BY
// WORD (karaoke fill) and stays CENTERED — when you skip/scrub/tap it re-centers
// on screen. Per-line + per-word start times are force-aligned from the audio
// (data.json podcast_script[i] = [spk, text, lineStart, [wordStarts...]], seconds).
// ------------------------------------------------------------------
let _trLines = [];          // [{el, t, words:[{el,t}]}]
let _trActive = -1;
let _trUserScrollUntil = 0; // pause auto-follow briefly after a manual scroll

function renderTranscript(){
  const list = document.getElementById('uTranscriptList');
  if (!list || !songData || !Array.isArray(songData.podcast_script)) return;
  const audio = document.getElementById('uPodcastAudio');
  list.innerHTML = '';
  _trLines = []; _trActive = -1;
  songData.podcast_script.forEach((entry, i) => {
    const spk  = entry[0] || 'HOST';
    const text = entry[1] || '';
    const t    = (entry.length > 2 && typeof entry[2] === 'number') ? entry[2] : null;
    const raw  = Array.isArray(entry[3]) ? entry[3] : null;
    const el = document.createElement('button');
    el.type = 'button';
    el.className = 'u-tr-line';
    el.dataset.spk = spk;
    el.dataset.idx = i;
    // Per-WORD karaoke spans. entry[3] is now an array of [tokenText, startSec]
    // pairs baked PER LANGUAGE (English words via English whisper, Japanese words
    // via Japanese whisper + fugashi) so EVERY word — EN or JP — has its own
    // timing and its own highlight. JP lines used to be one block; now each
    // Japanese word lights in turn. Legacy [number,...] arrays (or none) fall
    // back to a whitespace split sharing the line start time.
    const isJP = spk === 'JP';
    let parts;
    if (raw && raw.length && Array.isArray(raw[0])){
      parts = raw;                                                  // [[tok, t], ...]
    } else {
      // Safety net: a JP line without pair-format tokens collapses to ONE
      // whitespace span = the old "no per-word JP highlight" bug. Warn loudly so
      // a future data.json regen by an older tool can't silently revert it.
      if (isJP) console.warn('[transcript] JP line ' + i + ' lacks [token,time] pairs — per-word JP karaoke disabled; regenerate data.json with the forced-alignment pipeline');
      const ws = text.trim().length ? text.trim().split(/\s+/) : [text];
      parts = ws.map((w, k) => [w, (raw && typeof raw[k] === 'number') ? raw[k] : t]);
    }
    const words = [];
    parts.forEach(([w, wt], k) => {
      const span = document.createElement('span');
      span.className = 'u-tr-w';
      span.textContent = w;
      words.push({ el: span, t: (typeof wt === 'number' ? wt : t) });
      el.appendChild(span);
      // English is space-separated; Japanese is not — don't inject spaces that
      // would break the JP line's rendering.
      if (!isJP && k < parts.length - 1) el.appendChild(document.createTextNode(' '));
    });
    el.addEventListener('click', () => {
      if (t == null || !audio) return;
      if (!audio.src) audio.src = _withAudioV(PODCAST_URL);
      try { SFX.tap(); } catch(_){}
      _trUserScrollUntil = 0;          // a tap is intent to follow — re-enable scroll
      audio.currentTime = Math.max(0, t + 0.02);
      audio.play().catch(()=>{});
      _setActiveTranscript(i, true);   // force re-center now
    });
    list.appendChild(el);
    _trLines.push({ el, t, words });
  });
}

function _activeTrIdxFor(time){
  let idx = -1;
  for (let i = 0; i < _trLines.length; i++){
    const t = _trLines[i].t;
    if (t == null) continue;
    if (t <= time + 0.12) idx = i; else break;
  }
  return idx;
}

// Karaoke word fill within the active line: every word whose start has passed is
// "lit"; the latest one is "cur". Only the active line is touched (cheap per-tick).
function _clearWordMarks(i){
  if (i < 0 || i >= _trLines.length) return;
  _trLines[i].words.forEach(w => w.el.classList.remove('lit','cur'));
}
function updateWordHighlight(time){
  if (_trActive < 0) return;
  const L = _trLines[_trActive];
  // The active line ends when the NEXT timed line begins. The word fill must
  // COMPLETE by then. Otherwise a final word whose baked start lands at/after
  // the next line's start — common when the English host says a Japanese word
  // the aligner couldn't place (e.g. a band name the lyrics never sing) —
  // never lights, and the karaoke "breaks" one word short right as the other
  // speaker comes in. So once we're inside the hand-off window, force a full
  // fill. lineEnd = next timed line's start (∞ for the last line).
  let lineEnd = Infinity;
  for (let j = _trActive + 1; j < _trLines.length; j++){
    if (_trLines[j].t != null){ lineEnd = _trLines[j].t; break; }
  }
  // Hand-off window sits just BEFORE _activeTrIdxFor flips the active line
  // (which happens at lineEnd - 0.12), so the line is briefly, visibly complete.
  const handingOff = time >= lineEnd - 0.25;
  let cur = -1;
  for (let k = 0; k < L.words.length; k++){
    const wt = L.words[k].t;
    if (wt != null && wt <= time + 0.06) cur = k; else if (wt != null) break;
  }
  if (handingOff) cur = L.words.length - 1;   // never freeze mid-line at the speaker change
  for (let k = 0; k < L.words.length; k++){
    const cl = L.words[k].el.classList;
    cl.toggle('lit', k <= cur);
    cl.toggle('cur', k === cur);
  }
}

function _setActiveTranscript(idx, force){
  const changed = idx !== _trActive;
  if (!changed && !force){ return; }
  if (changed){
    _clearWordMarks(_trActive);        // drop the old line's word fill
    _trActive = idx;
    for (let i = 0; i < _trLines.length; i++){
      const cl = _trLines[i].el.classList;
      cl.toggle('active', i === idx);
      cl.toggle('played', i < idx);
    }
  }
  if (idx < 0) return;
  // Keep the active line CENTERED on screen (immerse only). On a normal line change
  // re-center unless the user just scrolled to read ahead; a forced call (seek / scrub
  // / skip / tap) always re-centers so the line is never left off-screen.
  if (typeof U_APP !== 'undefined' && U_APP.dataset.currentMode !== 'immerse') return;
  if (!force && performance.now() < _trUserScrollUntil) return;
  const el = _trLines[idx].el;
  try { el.scrollIntoView({ block:'center', behavior: force ? 'auto' : 'smooth' }); }
  catch(_){ try { el.scrollIntoView(); } catch(__){} }
}

function syncTranscript(time, force){
  if (!_trLines.length) return;
  _setActiveTranscript(_activeTrIdxFor(time), !!force);
  updateWordHighlight(time);
}

// A real user scroll (wheel / touch drag) pauses auto-follow for a few seconds so
// reading ahead isn't yanked back. scrollIntoView() does NOT emit wheel/touchmove,
// so the auto-scroll never trips this guard. NOTE: dragging the top-bar scrub also
// fires touchmove → sets this guard, but the audio 'seeked' handler calls
// syncTranscript(time, true) which FORCES a re-center past the guard.
(function wireTranscriptScrollGuard(){
  const bump = () => { _trUserScrollUntil = performance.now() + 2600; };
  window.addEventListener('wheel', bump, { passive:true });
  window.addEventListener('touchmove', bump, { passive:true });
})();

})();

<script>
/* ═══ Pitch reveal · uyrjr7 ═══════════════════════════════════════════
 * Self-contained module. Reads pitch_data/{pitch,timing}.json on demand
 * (already kicked off by loadPitchData() near renderWordGrid). Hooks
 * into per-row taps wired in line 7126-7136.
 *
 * Behavior:
 *   - Tap a word row → expand it in place, draw the pitch contour,
 *     animate the contour synced to audio.currentTime, brighten morae
 *     in time.
 *   - Tap outside the expanded row → collapse.
 *   - Tap another row → collapse current, expand the new one.
 *   - Tap on empty card surface → flips the card back (existing behavior;
 *     we don't interfere with that).
 * ─────────────────────────────────────────────────────────────────────*/

let _expandedRow = null;
let _expandedAudio = null;
let _expandedRaf = null;
let _expandedStill = null;   // D2 still-beat timer (entry/replay → audio)

function _patternFor(accent, n) {
  if (n === 0) return '';
  if (accent === 0) return 'L' + 'H'.repeat(n-1);
  if (accent === 1) return 'H' + 'L'.repeat(n-1);
  if (accent >= n)  return 'L' + 'H'.repeat(n-1);
  return 'L' + 'H'.repeat(accent-1) + 'L'.repeat(n-accent);
}

function _romUid(rom) {
  return String(rom||'').replace(/ /g,'-').replace(/·/g,'').replace(/\//g,'_').replace(/^-+|-+$/g,'');
}


// Scene-image lightbox: the word card shows a small thumbnail; tapping it
// expands full-screen. Appended to <body> (NOT inside the card) because the
// card sits in a rotateY flip container that would clip + mirror a fixed
// overlay. Tap anywhere to close.
function openSceneLightbox(frame){
  const img = frame.querySelector('.pb-img');
  if (!img || !img.currentSrc) return;
  if (document.querySelector('.scene-lightbox')) return;   // one at a time
  // Round 12 (D4): the image FLIPs out of the thumbnail — read the thumb's
  // rect once, now (user-initiated, off the hot path).
  const thumbRect = img.getBoundingClientRect();
  const lb = document.createElement('div');
  lb.className = 'scene-lightbox';
  lb.innerHTML = `<button class="scene-lightbox-x" aria-label="Close image">\u2715</button>
    <img src="${img.currentSrc}" alt="">
    <div class="scene-cap">${escapeHtml(frame.dataset.word || '')}<small>${escapeHtml(frame.dataset.rom || '')}</small></div>`;
  const bornAt = performance.now();
  const close = (e) => {
    if (e) { e.stopPropagation(); e.preventDefault(); }
    // The tap that OPENED the lightbox synthesizes a trailing click that
    // lands on the lightbox itself — ignore dismissals in the first 400ms.
    if (performance.now() - bornAt < 400) return;
    lb.classList.add('is-closing');
    // D4 close: the image retreats toward the thumbnail while the lightbox
    // dim fades (its opacity is gone by 160ms via the is-closing keyframe).
    const bigClosing = lb.querySelector('img');
    if (bigClosing && lb._flipVec){
      const v = lb._flipVec;
      bigClosing.style.transition = 'transform 240ms var(--ease-in), opacity 160ms var(--ease-in)';
      bigClosing.style.transform = `translate(${v.dx.toFixed(1)}px,${v.dy.toFixed(1)}px) scale(${v.sc.toFixed(3)})`;
      bigClosing.style.opacity = '0';
    }
    // The closing tap's trailing synthetic events (click + mouse compat
    // events on iOS) fire AFTER pointerup and hit-test through the fading
    // lightbox onto whatever sits beneath the finger — the owner kept firing the
    // share button hidden under the photo. Eat the ENTIRE tail, capture-
    // phase + immediate, for 450ms before dropping pointer-events.
    const _swal = (ce) => { ce.stopImmediatePropagation(); ce.stopPropagation(); ce.preventDefault(); };
    const _SWT = ['click', 'mousedown', 'mouseup', 'pointerup', 'touchend'];
    _SWT.forEach(t => document.addEventListener(t, _swal, true));
    setTimeout(() => _SWT.forEach(t => document.removeEventListener(t, _swal, true)), 450);
    // Keep the fading lightbox INTERCEPTING for its whole close — pointer-
    // events:none here was the actual hole: the synthetic tail hit-tested
    // straight through the fade onto the toolbar. 260ms covers the image's
    // 240ms retreat (was 170ms for the plain fade).
    setTimeout(() => { try { lb.remove(); } catch(_){} }, 260);
    document.removeEventListener('keydown', onKey);
  };
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  // pointerup (not click-only): immune to the overlay's capture-phase
  // ghost-click swallow; click kept as keyboard/AT fallback.
  lb.addEventListener('pointerup', close);
  lb.addEventListener('click', close);
  document.addEventListener('keydown', onKey);
  // The word-card overlay pins itself at z-index 2147483647 (max int, inline
  // !important) — NOTHING at body level can stack above it. So the lightbox
  // must live INSIDE the overlay's stacking context (its strip is z2, toolbar
  // z3; our 10050 wins there). The overlay's backdrop-filter makes it the
  // containing block for our position:fixed, but it's inset-0 full-viewport,
  // so the geometry is identical. Falls back to body when no overlay is open.
  (document.querySelector('.pitch-overlay') || document.body).appendChild(lb);
  // D4 entry: FLIP the image from the thumbnail's rect to its centered
  // resting place — one rect read after layout (tap time, off the hot path),
  // then transform-to-identity on 340ms spring-gentle, opacity 120ms. The
  // source bitmap is the thumb's (already decoded), so layout is immediate;
  // the load fallback covers a cold cache.
  const big = lb.querySelector('img');
  const _flipIn = () => {
    const r = big.getBoundingClientRect();
    if (!r.width || !thumbRect.width) return;   // nothing to fly from — keep the plain fade
    const dx = (thumbRect.left + thumbRect.width / 2) - (r.left + r.width / 2);
    const dy = (thumbRect.top + thumbRect.height / 2) - (r.top + r.height / 2);
    const sc = thumbRect.width / r.width;
    lb._flipVec = { dx, dy, sc };
    big.style.transform = `translate(${dx.toFixed(1)}px,${dy.toFixed(1)}px) scale(${sc.toFixed(3)})`;
    big.style.opacity = '0';
    void big.offsetWidth;   // commit the start state
    big.style.transition = 'transform 340ms var(--spring-gentle), opacity 120ms var(--ease-out)';
    big.style.transform = 'translate(0px,0px) scale(1)';
    big.style.opacity = '1';
  };
  if (big){
    if (big.complete && big.naturalWidth) requestAnimationFrame(_flipIn);
    else big.addEventListener('load', () => requestAnimationFrame(_flipIn), { once:true });
  }
}
