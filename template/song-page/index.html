        try {
          fetch(LOG, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(rec), keepalive: true }).catch(()=>{});
        } catch(_){}
      }, 380);
    }, { passive: true });
  })();
}

function positionCards(idx){
  const cards = document.querySelectorAll('.card');
  // ---- Native-scroll flat list (Sing) -------------------------------
  // The browser owns the layout + scrolling; all we do here is move the
  // highlight to the current line. No transforms, no per-card geometry —
  // that's what keeps it collision-free and 60fps.
  if (inSingList()){
    cards.forEach((card, i) => {
      card.classList.remove('flying-right','flying-left','flipped','pre-live');
      card.classList.add('in-view');
      card.classList.toggle('is-active', i === idx);
      // Round 12: .is-live carries the 1.06 pop. Granted on arrival (the
      // spring rise); the handoff scheduler removes it during long gaps
      // (recede — the stage empties while nobody is singing).
      card.classList.toggle('is-live', i === idx);
      // Distance-staged fade classes (replaces :has()/sibling-combinator CSS
      // — those are re-evaluated by the style engine on every class flip
      // across the whole list; plain classes are set once per line change).
      const _d = i - idx;
      card.classList.toggle('dist-p1', _d === 1);
      card.classList.toggle('dist-p2', _d === 2);
      card.classList.toggle('dist-p3', _d === 3);
      card.classList.toggle('dist-m1', _d === -1);
      card.classList.toggle('dist-m2', _d === -2);
      card.classList.toggle('dist-m3', _d === -3);
      // drop any inline transform/opacity left over from the legacy stack
      if (card.style.transform || card.style.opacity || card.style.zIndex){
        card.style.transform = ''; card.style.opacity = ''; card.style.visibility = '';
        card.style.zIndex = ''; card.style.pointerEvents = '';
      }
    });
    updateCardPlayIcons(); updateLoopStates(); updateMinimapThumb();
    return;
  }
  // ---- Legacy absolute stack (flipped study / non-sing) -------------
  cards.forEach((card, i) => {
    const d = i - idx; const absD = Math.abs(d);
    card.classList.remove('flying-right','flying-left');
    card.classList.toggle('flipped', studyMode);
    const REACH = 5;
    if (absD > REACH){
      card.style.opacity = '0'; card.style.visibility = 'hidden'; card.style.pointerEvents = 'none';
      card.classList.remove('in-view','is-active');
      card.style.transform = `translate3d(-50%, calc(-50% + ${d * SPACING_Y}px), 0)`;
      card.style.zIndex = '1'; return;
    }
    const opacity = d === 0 ? 1 : Math.max(0.12, 1 - absD * 0.26);
    card.style.opacity = String(opacity);
    card.style.visibility = 'visible';
    card.style.pointerEvents = 'auto';
    card.style.transform = `translate3d(-50%, calc(-50% + ${d * SPACING_Y}px), 0)`;
    card.style.zIndex = String(100 - absD);
    card.classList.add('in-view');
    card.classList.toggle('is-active', d === 0);
  });
  updateCardPlayIcons(); updateLoopStates(); updateMinimapThumb();
}

// Update the topbar line-number + section name to a given index. Used by the
// continuous scroll paths (drag + inertial momentum + progress scrub) which
// move the active line without going through goToLine.
// Section-navigator label. Instrumental stretches have no section name, so we
// give them a word: the opening one reads "Intro", any mid-song no-lyric break
// reads "Interlude".
function instrumentalSectionName(L){ return (L && L.intro) ? 'Intro' : 'Interlude'; }
function renderSectionLabel(el, label){
  if (!el) return;
  el.textContent = (label && label.name) || '';
}
// Label descriptor for a given line index (used by the resting-state writers).
function sectionLabelForLine(idx){
  const L = lines[idx];
  if (L && L.instrumental) return { name: instrumentalSectionName(L) };
  return { name: (L && L.section && L.section.name) ? L.section.name : '' };
}

function syncLineMeta(idx){
  const ln = document.getElementById('lineNow'); if (ln) ln.textContent = String(idx + 1);
  renderSectionLabel(document.getElementById('sectionTop'), sectionLabelForLine(idx));
}
/* af3r1o — the stationary #singFocusFrame box + updateFocusFrame() are GONE.
   The read anchor is now the frosted blur-behind that rides the active line
   itself (CSS .card.is-active .card-text-wrap::before); FOLLOW_ANCHOR still
   parks the active line at the 40% band, so the eye still gets one anchor. */

function goToLine(idx, opts = {}){
  const {seek=true, play=true, manual=false, explicitPlay=false} = opts;
  if (idx < 0 || idx >= lines.length) return;
  // v5iiv3 — moving to a different line closes the corner study sheet so it
  // always reflects the line you're on (and its moved-out node is restored).
  if (idx !== activeLineIdx && (cardsAreOpen() || _sheetBackNode)) closeCards();
  if (manual) lastManualNavAt = Date.now();
  if (manual && loopingIdx !== idx && loopingIdx !== -1) loopingIdx = -1;
  if (activeLineIdx !== idx){
    const old = document.querySelector(`.card[data-idx="${activeLineIdx}"]`);
    if (old){
      old.querySelectorAll('.tok').forEach(el => el.classList.remove('singing','sung'));
      old.querySelectorAll('.tok-char').forEach(el => el.classList.remove('pre','hit'));
      old.querySelectorAll('.rom').forEach(el => el.classList.remove('singing','sung'));
      // The previously-active card has lyric-wipe inline state on its
      // text + romaji from updateHighlight (--line-fill-px,
      // --rom-fill-px, --wipe-row-*-px). Those values feed the
      // .lyric-layer--sung mask, which is a CSS rule that doesn't care
      // whether the card is .is-active. If we leave them set, the
      // .sung layer of a now-non-active card renders an extra masked
      // copy of the text on top of .upcoming — visually that reads as
      // slightly bolder lyrics on the d=+1 card. Clear them so a card
      // looks identical whether it was previously active or never.
      const oldText = old.querySelector('.card-face.front .card-text');
      if (oldText){
        oldText.style.removeProperty('--line-fill-px');
        oldText.style.removeProperty('--wipe-row-top-px');
        oldText.style.removeProperty('--wipe-row-bottom-px');
      }
      const oldRom = old.querySelector('.card-face.front .card-romaji');
      if (oldRom){
        oldRom.style.removeProperty('--rom-fill-px');
        oldRom.style.removeProperty('--rom-row-top-px');
        oldRom.style.removeProperty('--rom-row-bottom-px');
      }
    }
    // In study mode, swiping between cards must stop any chip / blurb
    // audio that was speaking on the previous card — it's off-screen
    // now and shouldn't keep talking. If the song was playing, pause
    // it too: the user is studying, not following the song through the
    // stack. They'll hit play to hear the next line.
    if (studyMode){
      stopVocabAudio();
      if (isPlaying){ try { player.pauseVideo(); } catch(_){} }
    }
  }
  activeLineIdx = idx;
  positionCards(idx);
  // Apple-Music-style auto-follow: a PLAYBACK-driven line change glides the
  // active line to a fixed anchor. Manual nav (tap / swipe / scrub all pass
  // manual:true) keeps the old "play the line where it is" behavior — no jump.
  // Stands down while the user is driving the scroll, so a manual scroll-away
  // is honored until the next line begins (then it re-anchors). See
  // followActiveLine().
  fitActiveCardText();
  if (inSingList() && !_userScrolling){
    const _studyNow = (studyMode || playbackMode === 'study');
    // Sing playback follows the auto-advance (a tap "plays the line where it
    // is"). Study mode never auto-advances, so the line you tap/navigate to is
    // the one to re-center on — otherwise a scroll-away strands you with no way
    // back to the current line.
    if (_studyNow ? manual : (!manual && isPlaying)) followActiveLine();
  }
  // While a press-drag scrub is previewing a target on the line/section
  // pills, don't let an auto-advance underneath stomp the previewed label.
  if (!window.__pillScrub){
    document.getElementById('lineNow').textContent = String(idx + 1);
    // Section name in the topbar counter (replaces the old star counter).
    // Instrumental stretches show a music-note glyph instead of a name.
    renderSectionLabel(document.getElementById('sectionTop'), sectionLabelForLine(idx));
  }
  // Manual nav (tap, swipe, scrub) honors the caller's seek/play directly.
  // The legacy `browseMode` flag used to gate this so manual navigation
  // stayed silent unless a caller passed `explicitPlay:true`; that fought
  // both modes' mental model — Sing wants tap-a-line → play + continue,
  // Study wants tap-a-line → play-just-that-line. Both need taps to
  // actually trigger audio, so the gate is gone. browseMode survives
  // only at the few callsites that still pass `play: !browseMode`
  // (section jump, line scrubber drag), which can be cleaned up later.
  const effSeek = seek;
  const effPlay = play;
  if (effSeek && ytReady){
    const t = Math.max(0, lines[idx].t + offset);
    player.seekTo(t, true);
    estClock.snap(t);
    if (effPlay) player.playVideo();
  }
}

// Auto-shrink the active card's big JP line so it never overflows the
// card width. Uses --fit-shrink as a multiplier on the existing font-size
// chain (so the lyric tweaker's --text-size still works as the upper
// bound; long lines get nudged smaller, short lines stay full size).
function fitCardText(textEl){
  const wrap = textEl.closest('.card-text-wrap');
  if (!wrap) return;
  const maxW = wrap.clientWidth - 4; // tiny safety margin
  if (maxW < 40) return;             // card not laid out / hidden — don't collapse
  textEl.style.removeProperty('--fit-shrink');
  // Wait one frame so layout settles after the reset.
  requestAnimationFrame(() => {
    // Force single-line layout so scrollWidth reflects the unwrapped
    // length (CSS already sets white-space:nowrap on .card.is-active
    // .card-text, but this guards against future style changes and
    // covers measuring elements that aren't the active card yet).
    const prev = textEl.style.whiteSpace;
    textEl.style.whiteSpace = 'nowrap';
    const natural = textEl.scrollWidth;
    textEl.style.whiteSpace = prev;
    if (!natural || natural <= maxW){ invalidateWipeGeom(); return; }
    const scale = Math.max(0.4, (maxW / natural) * 0.98);
    textEl.style.setProperty('--fit-shrink', scale.toFixed(3));
    // The shrink changes glyph layout — the wipe geometry cache re-measures
    // lazily on the next frame.
    invalidateWipeGeom();
  });
}
function fitActiveCardText(){
  const card = document.querySelector('.card.is-active');
  if (!card) return;
  const text = card.querySelector('.card-text');
  if (text) fitCardText(text);
  // Romaji line uses the same shrink mechanism on its own font-size.
  const rom = card.querySelector('.card-romaji');
  if (rom) fitCardText(rom);
}
// Round 22 (owner): fit EVERY line to one row (not just the active one) so the
// vertical rhythm is consistent — long lines were wrapping to two rows while
// the active/short lines stayed one. Cheap: content is static, runs at render
// + resize; fitCardText no-ops lines that already fit.
function fitAllCardText(){
  // af3r1o — BATCHED to kill the reflow storm. The old version called
  // fitCardText() per element (~58×), each doing write→rAF→read scrollWidth→
  // write = ~58 interleaved forced reflows on load + on every resize. Now: one
  // rAF, write-all (reset + nowrap), read-all (single layout), write-all (apply
  // shrink). Exact same nowrap measurement semantics, ~1 layout instead of ~58.
  const els = [];
  document.querySelectorAll('#cardStack .card').forEach(c => {
    const t = c.querySelector('.card-text'); if (t) els.push(t);
    const r = c.querySelector('.card-romaji'); if (r) els.push(r);
  });
  if (!els.length) return;
  requestAnimationFrame(() => {
    const prevWS = [];
    for (const el of els){ el.style.removeProperty('--fit-shrink'); prevWS.push(el.style.whiteSpace); el.style.whiteSpace = 'nowrap'; }
    const data = els.map(el => {
      const wrap = el.closest('.card-text-wrap');
      return { natural: el.scrollWidth, maxW: wrap ? wrap.clientWidth - 4 : 0 };
    });
    for (let i = 0; i < els.length; i++){
      els[i].style.whiteSpace = prevWS[i];
      const { natural, maxW } = data[i];
      if (maxW < 40 || !natural || natural <= maxW) continue;
      els[i].style.setProperty('--fit-shrink', Math.max(0.4, (maxW / natural) * 0.98).toFixed(3));
    }
    invalidateWipeGeom();
  });
}
// af3r1o — the :root[style] MutationObserver that re-fit on EVERY inline-style
// write is GONE: the live style-tweaker that wrote there was baked off, so it
// only churned on the ~80 boot setProperty calls. The two remaining runtime
// writers (translation toggle, album-art apply) call fitActiveCardText()
// explicitly instead. Resize is coalesced into one handler (see below).

// ===== Apple-style playback auto-follow (sing list) =========================
// Modeled on Apple Music's verified lyric behavior:
//   - The active line parks at a FIXED anchor (~40% down from the top), not
//     dead-center.
//   - Motion is STEPPED per line-change, not per-frame: we only glide when the
//     active line actually changes (called from goToLine on a playback advance).
//   - Recenter is purely line-change-driven — there is NO idle timeout. If you
//     scroll away, the list stays where you left it until the next line begins,
//     then it re-anchors. (Apple has no "resume" button; neither do we.)
//   - The user's drag always wins: the glide yields the instant _userScrolling
//     is set (touchstart/touchmove/wheel), so it never fights your finger.
// Only one scrollTop tween runs per line (~every few seconds), and we NEVER
// write scrollTop from a touch handler — that's the iOS first-swipe-freeze bug
// the sing list was rebuilt to avoid.
const FOLLOW_ANCHOR = 0.40;   // active line center, as a fraction down the stack (Apple ~= upper-third, buffer above)
let _followRaf = 0;
function followActiveLine(){
  const stack = document.getElementById('cardStack');
  if (!stack) return;
  // Never pull the intro line into the focus band. When you tap to start, the
  // countdown should stay resting where "Tap to start" loaded (near the top),
  // not drop to center. This gates only AUTO-follow (the play-start re-center
  // and the per-tick follow) — manual nav in sing mode doesn't route here, and
  // the moment the song advances to the first real lyric this no-ops away.
  if (lines[activeLineIdx] && lines[activeLineIdx].intro && !isPlaying) return;
  const card = stack.querySelector('.card.is-active');
  if (!card) return;
  const maxTop = Math.max(0, stack.scrollHeight - stack.clientHeight);
  const cardCenter = card.offsetTop + card.offsetHeight / 2;
  const target = Math.max(0, Math.min(maxTop, cardCenter - stack.clientHeight * FOLLOW_ANCHOR));
  if (_followRaf){ cancelAnimationFrame(_followRaf); _followRaf = 0; }
  const from = stack.scrollTop;
  const dist = target - from;
  if (Math.abs(dist) < 1) return;
  const DUR = 340;                              // ms — matches Apple's settle feel
  const ease = x => 1 - Math.pow(1 - x, 3);     // easeOutCubic
  let t0 = null;
  const step = (now) => {
    if (t0 === null) t0 = now;
    if (_userScrolling){ _followRaf = 0; return; }   // your finger wins, always
    const p = Math.min(1, (now - t0) / DUR);
    stack.scrollTop = from + dist * ease(p);
    window.__followWrites = (window.__followWrites || 0) + 1;
    _followRaf = (p < 1) ? requestAnimationFrame(step) : 0;
  };
  _followRaf = requestAnimationFrame(step);
}

// Toggle YouTube play/pause for a given line index. Mirrors the logic
// formerly inlined in the 'play' card-button handler so it can be
// invoked from a lyric tap as well.
// "Tap to start" -> YouTube can stall (slow connection, embed buffering).
// Mark the intro CTA as loading when a start is requested from the intro
// line; onPlayerState's PLAYING branch clears it, and a 6s watchdog restores
// the CTA so a never-starting embed re-offers the tap instead of looking dead.
let _ctaPendingTimer = 0;
function markStartPending(){
  const cta = document.querySelector('.card.intro .intro-cta');
  if (!cta || isPlaying) return;
  if (!cta.dataset.label) cta.dataset.label = cta.textContent;
  cta.classList.add('is-loading');
  cta.textContent = 'Loading\u2026';
  clearTimeout(_ctaPendingTimer);
  _ctaPendingTimer = setTimeout(() => { if (!isPlaying) clearStartPending(); }, 6000);
}
function clearStartPending(){
  clearTimeout(_ctaPendingTimer); _ctaPendingTimer = 0;
  const cta = document.querySelector('.card.intro .intro-cta');
  if (!cta || !cta.classList.contains('is-loading')) return;
  cta.classList.remove('is-loading');
  if (cta.dataset.label) cta.textContent = cta.dataset.label;
}

function togglePlayForCard(idx){
  // af3r1o — a real user play abandons any in-progress background warm so the
  // next BUFFERING/PLAYING is treated as genuine playback, never swallowed.
  _warming = false;
  if (idx === activeLineIdx){
    if (!ytReady) return;
    if (isPlaying){ SFX.pause(); player.pauseVideo(); }
    else {
      SFX.play();
      const target = lines[idx].t + offset;
      const next = lines[idx+1];
      const lineEnd = (next ? next.t : (lines[idx].end_t || lines[idx].t + 6)) + offset;
      if (studyMode || playbackMode === 'study'){
        // In study mode, play always restarts the active line from the
        // top — including after the auto-pause-at-line-end. The bump
        // to lastManualNavAt gates the tick's pause-at-line-end branch
        // for 500ms so the YT seek can land before getCurrentTime()
        // stops reporting ~lineEnd and triggers an immediate re-pause.
        // Both the legacy back-flip studyMode and the new topbar
        // playbackMode='study' chip want this behavior.
        lastManualNavAt = Date.now();
        player.seekTo(target, true);
      } else {
        const cur = player.getCurrentTime();
        if (cur < target - 1 || cur > lineEnd + 0.5) player.seekTo(target, true);
      }
      player.playVideo();
      if (idx === 0) markStartPending();
    }
  } else { SFX.play(); goToLine(idx, {seek:true, play:true, manual:true, explicitPlay:true}); if (idx === 0) markStartPending(); }
}

// v5iiv3 — the card no longer flips in place. Instead, the active line's
// study (back) face "comes out" of the bottom-right corner as a sheet, so
// the karaoke lyric stays visible and keeps playing behind it. The same
// entry points that used to flip (double-tap, L/R swipe) now toggle the
// sheet, and the bottom-right corner button does too.
let _sheetBackNode = null;     // the moved .card-face.back
let _sheetOriginParent = null; // its home (.card-inner) to return it to
let _sheetBusy = false;        // debounce during the open/close animation
let _sheetWasPlaying = false;  // was the song playing when the sheet opened?

function cardsAreOpen(){
  const app = document.querySelector('.u-app');
  return !!(app && app.dataset.cards === 'open');
}

function openCards(){
  if (_sheetBusy || cardsAreOpen()) return;
  const card = document.querySelector('.card.is-active');
  const sheet = document.getElementById('cardSheet');
  const body = document.getElementById('sheetBody');
  if (!card || !sheet || !body) return;
  const back = card.querySelector('.card-face.back');
  if (!back) return;
  _sheetOriginParent = back.parentNode;   // the .card-inner
  _sheetBackNode = back;
  body.scrollTop = 0;
  body.appendChild(back);                 // move node + its live listeners
  studyMode = true;
  const app = document.querySelector('.u-app');
  if (app) app.dataset.cards = 'open';
  sheet.setAttribute('aria-hidden', 'false');
  SFX.toggle();
  // Pause the song while studying the card; remember so we can resume on close.
  _sheetWasPlaying = isPlaying;
  pauseSongForVocab();
  // Round 12 (D1): no pre-scroll — the sheet shows ONE card's back (the
  // active line), not a scrollable multi-line list, so there is no "current
  // line's row" to bring into the top third. scrollTop=0 above is the whole
  // story. Arrival pulse: 120ms after the panel finishes its bloom, the
  // line-identifying header (the section brief — .card-meta is chrome'd off)
  // takes one lavender breath so the eye lands where the lesson starts.
  const panel = sheet.querySelector('.sheet-panel');
  if (panel){
    // lw4x1m (owner): the QUICK GUIDE / how-to card must NOT highlight itself on open.
    // It has no .section-brief, so the old firstElementChild fallback flashed the
    // eyebrow. Skip the arrival pulse entirely for the how-to back.
    const pulseTarget = back.querySelector('.section-brief')
      || (back.querySelector('.howto-menu') ? null : back.firstElementChild);
    const onOpenEnd = (ev) => {
      if (ev.target !== panel || ev.propertyName !== 'transform') return;
      panel.removeEventListener('transitionend', onOpenEnd);
      if (!cardsAreOpen() || !pulseTarget) return;
      setTimeout(() => {
        if (!cardsAreOpen()) return;
        pulseTarget.classList.add('sheet-arrive');
        pulseTarget.addEventListener('animationend', () => pulseTarget.classList.remove('sheet-arrive'), { once:true });
      }, 120);
    };
    panel.addEventListener('transitionend', onOpenEnd);
  }
  // next frame so the open transition runs from the collapsed corner state
  requestAnimationFrame(() => sheet.classList.add('open'));
}

function closeCards(){
  const sheet = document.getElementById('cardSheet');
  if (!sheet) return;
  if (!_sheetBackNode && !sheet.classList.contains('open') && !cardsAreOpen()) return;
  _sheetBusy = true;
  // Silence any in-flight study-card chip/TTS playback (Explainer, Word by
  // Word, brief-play, word chips) so it doesn't keep talking after the card
  // is gone.
  stopVocabAudio();
  // If a single-word overlay is open on top of the sheet, remove it too so it
  // doesn't linger (silent) after the study card is gone.
  try { collapsePitchRow(); } catch(_){}
  // 1at6n6: keep .open so the studying-look rules stay applied during the
  // fade; .closing drives the panel opacity out. .open comes off in finishClose.
  sheet.classList.add('closing');
  const app = document.querySelector('.u-app');
  // 4wx1pz: 'closing' (not delete) so the lyrics/topbar/corner btns fade back IN
  // on a deliberate eased curve (see [data-cards="closing"] rules) instead of
  // snapping. Removed once that return finishes, below, so the fade isn't cut.
  if (app) app.dataset.cards = 'closing';
  studyMode = false;
  const back = _sheetBackNode, parent = _sheetOriginParent;
  _sheetBackNode = null; _sheetOriginParent = null;
  SFX.toggle();
  // Closing the card does NOT auto-resume the song — it stays paused and the
  // user taps the lyric to play (consistent "tap = play, double-tap = back").
  _sheetWasPlaying = false;
  // Round 12 (D1): reparent exactly when the collapse transform LANDS
  // (transitionend) instead of a guessed timeout — the old 340ms timer vs
  // 380ms transition mismatch reparented a still-visible panel and double-
  // flashed the back face (the visibility band-aid this replaces). The
  // panel's opacity (180ms + 80ms delay) settles before the 320ms transform,
  // so the face is already invisible at the swap. 600ms backstop in case the
  // transitionend never fires (display flip, background tab).
  const panel = sheet.querySelector('.sheet-panel');
  let _closed = false;
  const finishClose = () => {
    if (_closed) return;
    _closed = true;
    if (panel) panel.removeEventListener('transitionend', onCloseEnd);
    // 1at6n6: now drop the studying-look hooks — panel is already invisible.
    sheet.classList.remove('open');
    sheet.classList.remove('closing');
    if (back && parent && parent.isConnected) parent.appendChild(back);
    sheet.setAttribute('aria-hidden', 'true');
    _sheetBusy = false;
    // af3r1o — re-settle the sing view on exit so closing the study book (esp.
    // with repeat armed) never strands the lyric view (the old close left the
    // active line un-anchored, so the reading band showed empty). Re-apply the
    // active-line classes, re-fit the active card, and re-anchor it to the 40%
    // band — the same idempotent work goToLine does on every line change. Skip
    // the re-anchor while the user is deliberately scrolling to read ahead.
    try {
      if (inSingList()){
        positionCards(activeLineIdx);
        if (typeof fitActiveCardText === 'function') fitActiveCardText();
        if (!_userScrolling) followActiveLine();
      }
    } catch(_){}
    // 4wx1pz: drop the 'closing' flag only after the layer-return fade (delay
    // .12s + .24s) has finished, so removing it never cuts the dissolve short.
    // Guard against a re-open in the meantime (which sets cards='open').
    setTimeout(() => {
      if (app && app.dataset.cards === 'closing') delete app.dataset.cards;
    }, 380);
  };
  const onCloseEnd = (ev) => {
    if (ev.target !== panel || ev.propertyName !== 'opacity') return;
    finishClose();
  };
  if (panel) panel.addEventListener('transitionend', onCloseEnd);
  setTimeout(finishClose, 600);
}

function toggleCards(){
  if (_sheetBusy) return;
  if (cardsAreOpen()) closeCards(); else openCards();
}

// Legacy entry point (double-tap / swipe handlers) now opens the corner sheet.
function flipActiveCard(){ toggleCards(); }

// v21: momentum scroll (carried from v20). Activated only when
// scrollBehavior === 'momentum'.
function cancelMomentum(){
  if (momentumAnim != null){
    cancelAnimationFrame(momentumAnim);
    momentumAnim = null;
    const stack = document.getElementById('cardStack');
    if (stack){ stack.classList.remove('momenting'); stack.style.transform = ''; }
  }
}
// Inertial lyric scroll. Carries a release velocity (px/ms; negative = up =
// forward) into a decelerating glide, rolling the active line over as it
// crosses each card boundary, then — once slow — easing the leftover residual
// onto the NEAREST line centre (so it never snaps back to where the swipe
// started). `initialDisp` lets a finger-drag hand its current on-screen offset
// straight into the glide with no jump. Ends stop dead at the first/last line.
function startMomentum(initialV, initialDisp){
  if (momentumAnim != null){ cancelAnimationFrame(momentumAnim); momentumAnim = null; }
  const stack = document.getElementById('cardStack');
  if (!stack) return false;
  const friction = 0.94;   // velocity decay per 16ms
  const snapV = 0.12;      // px/ms; below this we switch from fling to snap
  const snapStiff = 0.16;  // how hard the residual is pulled to a line centre
  // Clamp peak velocity so an extreme flick can't sail off for many lines —
  // the glide stays proportional to swipe speed but bounded and controllable.
  let v = Math.max(-2.6, Math.min(2.6, initialV || 0));
  let displacement = initialDisp || 0;
  let lastIdx = activeLineIdx;
  let lastT = performance.now();
  stack.classList.add('momenting');
  function finish(){
    stack.classList.remove('momenting');
    stack.classList.add('momentum');   // springy settle of the final residual
    stack.style.transform = '';
    setTimeout(() => { stack.classList.remove('momentum'); }, 460);
    momentumAnim = null;
    lastManualNavAt = Date.now();
    positionCards(activeLineIdx);
    syncLineMeta(activeLineIdx);
    if (ytReady && player){
      const t = Math.max(0, lines[activeLineIdx].t + offset);
      try { player.seekTo(t, true); } catch(_){}
      const studyNow = studyMode || playbackMode === 'study';
      if (studyNow){ if (isPlaying){ try { player.pauseVideo(); } catch(_){} } }
      else if (isPlaying){ try { player.playVideo(); } catch(_){} }
    }
  }
  function frame(now){
    const dt = Math.min(40, now - lastT); lastT = now;
    const fast = Math.abs(v) > snapV;
    if (fast){
      displacement += v * dt;
      v *= Math.pow(friction, dt / 16);
    } else {
      // Snap phase: commit to the nearest line. If the residual is past the
      // half-way point, roll the active line over NOW (a discrete index step,
      // keeping the offset continuous by shifting it a full line) so what's
      // left is always < half a line — then ease that remainder to the centre.
      // (Easing toward ±SPACING_Y instead would only ever approach the wrap
      // boundary asymptotically and stall a hair short of it.)
      if (displacement <= -SPACING_Y / 2 && activeLineIdx < lines.length - 1){ activeLineIdx++; displacement += SPACING_Y; }
      else if (displacement >= SPACING_Y / 2 && activeLineIdx > 0){ activeLineIdx--; displacement -= SPACING_Y; }
      displacement += (0 - displacement) * snapStiff;
      v = 0;
    }
    while (displacement <= -SPACING_Y && activeLineIdx < lines.length - 1){ activeLineIdx++; displacement += SPACING_Y; }
    while (displacement >=  SPACING_Y && activeLineIdx > 0){ activeLineIdx--; displacement -= SPACING_Y; }
    // Hard stop at the ends — nothing to reveal past the first/last line.
    if (activeLineIdx <= 0 && displacement > 0){ displacement *= 0.4; v = 0; if (displacement < 0.6) displacement = 0; }
    if (activeLineIdx >= lines.length - 1 && displacement < 0){ displacement *= 0.4; v = 0; if (displacement > -0.6) displacement = 0; }
    if (activeLineIdx !== lastIdx){ positionCards(activeLineIdx); syncLineMeta(activeLineIdx); lastIdx = activeLineIdx; }
    stack.style.transform = `translate3d(0, ${displacement}px, 0)`;
    if (!fast && Math.abs(displacement) < 0.6){ finish(); return; }
    momentumAnim = requestAnimationFrame(frame);
  }
  momentumAnim = requestAnimationFrame(frame);
  return true;
}

// Round 12 (E6): play/pause glyphs no longer hard-swap. The host svg dips
// (scale .8 / opacity .4, 80ms), the <use> href changes at the bottom of the
// dip, and it returns over 140ms — see .icon-swap-host CSS. _pendingHref
// makes re-entrant calls during the 80ms window idempotent.
function swapUseGlyph(use, href){
  if (!use) return;
  const cur = use._pendingHref || use.getAttribute('href');
  if (cur === href) return;
  const svg = use.closest ? use.closest('svg') : null;
  if (!svg){ use.setAttribute('href', href); return; }
  use._pendingHref = href;
  svg.classList.add('icon-swap-host', 'icon-out');
  if (svg._iconTimer) clearTimeout(svg._iconTimer);
  svg._iconTimer = setTimeout(() => {
    svg._iconTimer = null;
    use.setAttribute('href', use._pendingHref || href);
    use._pendingHref = null;
    svg.classList.remove('icon-out');
  }, 80);
}

(function(){
  const minimap = document.getElementById('minimap'); const track = document.getElementById('mmTrack');
  let mmDragging = false;
  function mmIdxFromEvent(e){
    const rect = track.getBoundingClientRect();
    const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
    const ratio = Math.max(0, Math.min(1, y / rect.height));
    return Math.round(ratio * (lines.length - 1));
  }
  function mmDown(e){
    e.preventDefault(); e.stopPropagation();
    mmDragging = true; minimap.classList.add('active');
    const idx = mmIdxFromEvent(e);
    if (idx !== activeLineIdx){ SFX.scrub(); goToLine(idx, {seek:!freeScroll, play:!freeScroll, manual:true}); }
  }
  function mmMove(e){
    if (!mmDragging) return;
    e.preventDefault(); e.stopPropagation();
    const idx = mmIdxFromEvent(e);
    if (idx !== activeLineIdx){ SFX.scrub(); goToLine(idx, {seek:!freeScroll, play:!freeScroll, manual:true}); }
  }
  function mmUp(){ if (!mmDragging) return; mmDragging = false; setTimeout(() => minimap.classList.remove('active'), 500); }

  minimap.addEventListener('touchmove', mmMove, {passive:false});
  minimap.addEventListener('touchend', mmUp);

  window.addEventListener('mouseup', mmUp);
})();

function onYouTubeIframeAPIReady(){

    events:{

      onStateChange: onPlayerState,

window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;

// af3r1o — best-effort BACKGROUND WARM so the first real tap is instant. Passing
// videoId only CUES the video (no media bytes); a muted play forces YouTube to
// fetch the initial buffer during idle. The first warm-up BUFFERING/PLAYING tick
// is swallowed in onPlayerState (the _warming guard) which pauses, seeks to 0 and
// unmutes — leaving a primed buffer with no audible blip and no UI side-effects.
// Graceful: mobile WebKit may refuse muted programmatic play, so we abandon the
// warm after 1.5s (and a real user tap abandons it immediately) — the normal tap
// path then works exactly as before.
let _warming = false, _warmed = false;
function warmPlayer(){
  if (_warmed || _warming) return;
  try {
    _warming = true; player.mute(); player.playVideo();
    setTimeout(() => { if (_warming){ _warming = false; try { player.unMute(); } catch(_){} } }, 1500);
  } catch(_){ _warming = false; }
}

function onPlayerState(e){
  try { window.__ytState = e.data; window.__ytStateTs = performance.now(); } catch(_){}   // telemetry
  // af3r1o — swallow the background WARM: when the muted warm reaches
  // BUFFERING/PLAYING, pause + seek to 0 + unmute and bail BEFORE any real-play
  // side-effects (isPlaying / SFX / recession / followActiveLine) fire.
  if (_warming && (e.data === YT.PlayerState.PLAYING || e.data === YT.PlayerState.BUFFERING)){
    try { player.pauseVideo(); player.seekTo(0, true); player.unMute(); } catch(_){}
    _warming = false; _warmed = true;
    return;
  }
  // af3r1o — a real (post-warm) buffering pass: keep the intro CTA in its
  // Loading… state and stretch the bounce-back backstop to 15s so a legitimately
  // slow embed never flips back to "Tap to start" mid-buffer (onError handles a
  // truly dead embed).
  if (e.data === YT.PlayerState.BUFFERING && !isPlaying){
    clearTimeout(_ctaPendingTimer);
    _ctaPendingTimer = setTimeout(() => { if (!isPlaying) clearStartPending(); }, 15000);
  }
  if (e.data === YT.PlayerState.PLAYING){ isPlaying = true; document.getElementById('statusDot').classList.add('playing'); setPlayIcon(true);
    clearStartPending();
    /* Round 13 chrome recession (FINAL-DESIGN §5): on play the room blacks
       out and the chrome rail/keys recede (CSS handles the 600ms ease). Fires
       at play start only — the wipe engine below is untouched. */
    try { document.querySelector('.u-app')?.setAttribute('data-recessed','1'); } catch(_){}
    setWipePaused(false);
    try { estClock.snap(player.getCurrentTime()); } catch(_){}
    // Pressing play re-anchors the current line — the always-visible transport
    // is the reliable "bring me back" after a scroll-away, in study mode (which
    // never auto-advances) as much as sing.
    if (inSingList() && !_userScrolling) followActiveLine();
    // Song just started → silence any chip TTS and the podcast so nothing
    // overlaps the backing track.
    try { stopVocabAudio(); } catch(_){}
    try { pausePodcastAudio(); } catch(_){}
  }
  else if (e.data === YT.PlayerState.PAUSED || e.data === YT.PlayerState.ENDED){ isPlaying = false; document.getElementById('statusDot').classList.remove('playing'); setPlayIcon(false);
    /* Pause/stop = the room lights come back instantly: drop the recession so
       the chrome restores (touching transport to pause is the "touch restores"
       path). mana2: but NOT if the podcast is currently playing — the YT pause
       event is async, so switching to immerse + starting the podcast could let a
       late PAUSED event clear the recession the podcast just set (killing the
       shared field's animation). Keep recessed while the deep-dive plays. */
    try { const _pod = document.getElementById('uPodcastAudio'); if (!(_pod && !_pod.paused)) document.querySelector('.u-app')?.removeAttribute('data-recessed'); } catch(_){}
    setWipePaused(true); }
}

// ==================================================================
// Round-12 motion engine (FINAL-SPEC §A)
// ==================================================================
// YT's getCurrentTime() is a cached value refreshed by infoDelivery
// postMessages — on iOS it can hold 100–250ms between updates, wider than
// the whole audiovisual binding window. estClock extrapolates between
// samples with performance.now() (playbackRate-aware), slews small
// disagreements at ~10%/frame so the wipe glides instead of stepping,
// snaps on big ones (seek/stall), and never lets the estimate lag a
// fresh sample by more than LAG_CLAMP.
const LEAD_VIS = 0.060;      // A4: wipe+lift run at est+60ms (vision leads audio)
const LAG_CLAMP = 0.040;     // the edge may never lag the raw clock by more
const PAUSE_DEBOUNCE = 150;  // ms of stillness before the pause look (B5)
const estClock = {
  base: 0, ts: 0, disp: 0, rate: 1, _raw: -1,
  snap(t){ this.base = t; this.ts = performance.now(); this.disp = t; this._raw = -1; },
  tick(raw, playing){
    const now = performance.now();
    const dt = Math.min(0.1, Math.max(0, (now - (this._lastNow || now)) / 1000));
    this._lastNow = now;
    if (raw !== this._raw){ this._raw = raw; this.base = raw; this.ts = now; }
    if (!playing){ this.disp = raw; this.base = raw; this.ts = now; return raw; }
    const ext = this.base + ((now - this.ts) / 1000) * this.rate;
    // Advance by wall-clock dt (smooth by construction), then decay the
    // drift against the freshest extrapolated sample at 10%/frame — zero
    // steady-state lag, so LEAD_VIS arrives intact. Pure pursuit (slewing
    // TOWARD ext each frame) equilibrates a full frame-budget behind and
    // rides the lag clamp, eating most of the lead.
    this.disp += dt * this.rate;
    const err = this.disp - ext;
    if (Math.abs(err) > 0.08) this.disp = ext;     // seek / stall → snap
    else this.disp -= err * 0.10;                  // gentle resync
    if (this.disp < ext - LAG_CLAMP) this.disp = ext - LAG_CLAMP;
    return this.disp;
  }
};

// B5 pause look (150ms debounce): html[data-wipe-paused] raises ghost +
// romaji readability via CSS, lifted chars release to baseline on the
// standing settle transition, the glow dims to .35 at its frozen position.
// The task flips from tracking to reading; the edge marks "you are here".
let _wipePaused = false, _pauseTimer = 0;
function setWipePaused(on){
  clearTimeout(_pauseTimer);
  if (on){
    _pauseTimer = setTimeout(() => {
      _wipePaused = true;
      document.documentElement.setAttribute('data-wipe-paused', '1');
      if (_wgeom && _wgeom.ok){
        for (let i = 0; i < _wgeom.charPhase.length; i++){
          const ph = _wgeom.charPhase[i];
          for (let c = 0; c < ph.length; c++){
            if (ph[c]){ ph[c] = 0; _setCharClass(_wgeom, i, c, 0); }
          }
        }

      }
    }, PAUSE_DEBOUNCE);

// FINAL-SPEC C2–C6: handoff scheduler. During real gaps ≥900ms the outgoing
// line recedes after a short closed-chunk hold (the chunk closes, memory
// consolidates at the boundary) and the stage stays EMPTY — no line at 1.06
// because nobody is singing — until the incoming line pre-rises at
// onset−750ms. Short gaps keep the immediate handoff (goToLine grants
// .is-live with the spring rise). Runs at housekeeping cadence, raw clock.
function scheduleHandoff(t){
  if (!isPlaying || studyMode || playbackMode === 'study' || !inSingList()) return;
  const ln = lines[activeLineIdx]; if (!ln) return;
  const nx = lines[activeLineIdx + 1]; if (!nx) return;
  const lineEnd = (ln.end_t ? ln.end_t : nx.t) + offset;
  const nextOn = nx.t + offset;
  const gap = nextOn - lineEnd;
  if (!ln.instrumental && gap >= 0.9){
    const hold = Math.min(0.25, Math.max(0.12, gap - 1.11));
    if (t >= lineEnd + hold){
      const cur = document.querySelector(`.card[data-idx="${activeLineIdx}"]`);
      if (cur && cur.classList.contains('is-live')) cur.classList.remove('is-live');
    }
  }
  if ((ln.instrumental || gap >= 0.9) && t >= nextOn - 0.75){
    const nxt = document.querySelector(`.card[data-idx="${activeLineIdx + 1}"]`);
    if (nxt && !nxt.classList.contains('pre-live')) nxt.classList.add('pre-live');
  }
}

// mana (owner): "make the clock show 0 at start to play." The measured music
// onset (music_start_ms, skipped by playback) is the listener's time zero.
function _musicT0(){ return ((songMeta && songMeta.musicStartMs) || 0) / 1000; }

function startTick(){
  if (tickInterval) clearInterval(tickInterval);
  if (window._wipeRaf) cancelAnimationFrame(window._wipeRaf);
  // ---- Housekeeping at 60ms: labels, counter fill, countdown, loop,
  // auto-advance, handoff scheduling. Cheap — the per-frame wipe moved to
  // the rAF below, so this can't contend with scroll or paint. ----
  tickInterval = setInterval(() => {
    if (!player || !player.getCurrentTime) return;
    // While the user is actively scrolling the lyric list, SKIP the karaoke
    // work so it can't contend with the JS-owned scroll (iOS dead-swipe fix).
    if (_userScrolling) return;
    const t = player.getCurrentTime();
    // Time label: write only when the displayed second changes — a per-tick
    // textContent write re-triggered the topbar MutationObserver mirror 16×/s.
    // mana (owner): the clock is MUSIC-relative — playback starts at the measured
    // music onset (silent MV pre-rolls are skipped), so the listener's zero is
    // where the music begins. Display max(0, t - musicT0); the progress bar
    // spans [musicT0, duration]. Seeking/scrubbing stays in absolute seconds.
    const _mt0 = _musicT0();
    const td = Math.max(0, t - _mt0);
    const mm = Math.floor(td/60); const ss = Math.floor(td - mm*60);
    const tlbl = `${mm}:${ss.toString().padStart(2,'0')}`;
    const tEl = document.getElementById('timeNow');
    if (tEl && tEl.textContent !== tlbl) tEl.textContent = tlbl;
    // Counter progress bar (compositor scaleX). Skip while a scrub owns it.
    if (window.__setCounterProgress && !window.__pillScrub && songDuration > 0){
      window.__setCounterProgress(td / Math.max(1, songDuration - _mt0));
    }

    // Live intro countdown: while the intro card is the active one and the
    // player is running, show seconds-to-first-lyric as a single big number
    // that fades in and out each second. Auto-advance (below) takes over
    // when t crosses lines[1].t.
    const introCard = document.querySelector('.card.intro');
    if (introCard){
      const cd = introCard.querySelector('.intro-countdown');
      const cdNum = cd && cd.querySelector('.intro-cd-num');
      const firstT = cd ? Number(cd.dataset.firstT || 0) : 0;
      const musicT = cd ? Number(cd.dataset.musicT || 0) : 0;
      if (cdNum && firstT > 0 && isPlaying){
        // Pre-roll: music hasn't started yet — keep the numeral BLANK (the
        // dancing ♪ notes stay, dimmed via .pre-music) so nothing counts down
        // over dead air. From musicT the numeral appears and counts as before.
        if (t < musicT){
          cd.classList.add('pre-music');
          if (cdNum.textContent !== '') cdNum.textContent = '';
        } else {
          cd.classList.remove('pre-music');
          const remainSec = Math.max(0, Math.ceil(firstT - t));
          if (cdNum.textContent !== String(remainSec)){
            cdNum.textContent = String(remainSec);
            // k0dxk2: the numeral now DANCES continuously (cdDance) like the
            // instrumental line, flanked by drifting notes — so we just swap the
            // text each second instead of re-firing a one-shot fade pulse.
          }
        }
      }
    }

    if (isPlaying && loopingIdx >= 0 && loopingIdx < lines.length){
      const ln = lines[loopingIdx]; const next = lines[loopingIdx+1];
      const endTarget = (ln.end_t || (next ? next.t : ln.t + 6)) + offset;
      if (t >= endTarget - 0.05){
        const startT = Math.max(0, ln.t + offset); player.seekTo(startT, true);
        // The wipe state machine diffs against the jumped-back clock on the
        // next frame and resets every token/char class itself.
        estClock.snap(startT);
      }
      return;
    }

    if (isPlaying && Date.now() - lastManualNavAt > 500){
      // Study policy: tap a line to hear it; don't auto-advance. Same
      // applies when the active card is flipped to its vocab side
      // (legacy studyMode) so taps on word chips don't fight with the
      // lyrics rolling forward. Either way, hard-pause at line end so
      // the next line doesn't bleed through.
      if (playbackMode === 'study' || studyMode){
        // Intro card: let audio flow INTO the first lyric line, then let
        // pause-at-line-end fire on that real line. Without this advance,
        // ln=lines[0] (the intro pseudo-line) makes lineEnd = lines[1].t
        // (the START of the first line), so playback cuts out the moment
        // the first line begins. Advancing past the intro without a
        // re-seek hands control to the real line's end_t below.
        const cur = lines[activeLineIdx];
        if (cur && cur.intro){
          const next = lines[activeLineIdx + 1];
          if (next && t >= (next.t + offset) - 0.05){
            goToLine(activeLineIdx + 1, {seek: false, play: false});
          }
          return;
        }
        const ln = lines[activeLineIdx];
        const nextLn = lines[activeLineIdx + 1];
        const lineEnd = ((ln && ln.end_t) ? ln.end_t : (nextLn ? nextLn.t : (ln ? ln.t + 6 : 0))) + offset;
        if (t >= lineEnd - 0.05){
          try { player.pauseVideo(); } catch(_){}
        }
        return;
      }
      let nextIdx = activeLineIdx + 1;
      if (starsOnly && favorites.size > 0){ while (nextIdx < lines.length && !favorites.has(nextIdx)) nextIdx++; }
      if (nextIdx < lines.length){
        const nextT = lines[nextIdx].t + offset;
        if (t >= nextT - 0.05){ goToLine(nextIdx, {seek: starsOnly && nextIdx !== activeLineIdx + 1, play: false}); }
      }
      scheduleHandoff(t);
    }
  }, 60);

  // ---- The wipe: one rAF per display frame while playing (A2). Per frame:
  // interpolated clock → pure arithmetic → CSS var writes. Zero DOM reads
  // (geometry is cached per line-change/resize by buildWipeGeom). Paused:
  // fully idle except one update per raw-clock change (paused seeks). ----
  const frame = () => {
    window._wipeRaf = requestAnimationFrame(frame);
    if (!player || !player.getCurrentTime || !ytReady || _userScrolling) return;
    if (!isPlaying){
      const raw = player.getCurrentTime();
      if (raw !== window.__lastPausedRaw){
        window.__lastPausedRaw = raw;
        estClock.snap(raw);
        updateHighlight(raw + LEAD_VIS);
      }
      return;
    }
    window.__lastPausedRaw = undefined;
    const raw = player.getCurrentTime();
    const est = estClock.tick(raw, true);
    if (window.__diagClock) window.__diagClock(raw, est);
    updateHighlight(est + LEAD_VIS);
  };
  window._wipeRaf = requestAnimationFrame(frame);
}

// ==================================================================
// Wipe geometry cache (A3) — measured ONCE per line-change/resize/fit,
// pure arithmetic per frame. offset* layout values are PRE-transform, so
// the active line's scale pop needs no compensation factor (the old
// per-frame k = offsetWidth/rect.width dance) and the cache stays valid
// through the rise/recede transitions.
// ==================================================================
let _wgeom = null;
let _glowEl = null;
function invalidateWipeGeom(){ if (_wgeom) _wgeom.dirty = true; }
// af3r1o — resize is now handled by the single coalesced handler in initLyricScroll
// (setupLyricScrollPadding -> fitAllCardText -> invalidateWipeGeom); the separate
// listener here was part of the unthrottled multi-listener storm.

function _pageOff(el){
  let x = 0, y = 0, n = el;
  while (n){ x += n.offsetLeft; y += n.offsetTop; n = n.offsetParent; }
  return {x, y};
}
function _relTo(el, anc){
  const a = _pageOff(el), b = _pageOff(anc);
  return {x: a.x - b.x, y: a.y - b.y};
}

function _setCharClass(g, i, c, want){
  // BOTH layers in the same frame — different transforms per layer would
  // ghost at the mask edge.
  const a = g.upChars[i][c], b = g.sgChars[i] && g.sgChars[i][c];
  if (a){ a.classList.toggle('pre', want === 1); a.classList.toggle('hit', want === 2); }
  if (b){ b.classList.toggle('pre', want === 1); b.classList.toggle('hit', want === 2); }
}

// A5: onset-weighted fill — auditory and visual systems bind on transients,
// not steady states. Units ≥250ms: cover the first 30% of the glyph width
// in min(100ms, 0.4×dur), then glide so the remainder completes ~60ms
// before the unit ends (the next onset). Short units at tempo are already
// transients — plain linear.
function _warpFill(f, durMs){
  if (durMs < 250) return f;
  const aT = Math.min(100, 0.4 * durMs) / durMs;
  const usable = Math.max(aT + 0.01, (durMs - 60) / durMs);
  const ff = Math.min(1, f / usable);
  return ff <= aT ? (ff / aT) * 0.30 : 0.30 + ((ff - aT) / (1 - aT)) * 0.70;
}

function buildWipeGeom(){
  const card = document.querySelector(`.card[data-idx="${activeLineIdx}"]`);
  const line = lines[activeLineIdx];
  const g = { idx: activeLineIdx, dirty: false, ok: false, romOk: false, card,
              sungCount: -1, singing: -2, rowKey: -1, romRowKey: -1e9,
              romSungCount: -1, romSinging: -2,
              lastFillPx: -1, lastRomFillPx: -1, glowOp: -1, charPhase: [] };
  _wgeom = g;
  if (!card || !line) return g;
  const textEl = card.querySelector('.card-face.front .card-text');
  if (textEl && line.tokens && line.tokens.length){
    const ups = textEl.querySelectorAll('.lyric-layer--upcoming .tok');
    const sgs = textEl.querySelectorAll('.lyric-layer--sung .tok');
    if (ups.length === line.tokens.length){
      g.textEl = textEl; g.upToks = ups; g.sgToks = sgs;
      g.upChars = []; g.sgChars = []; g.toks = []; g.charTimes = [];
      const rowTops = [];
      line.tokens.forEach((tok, i) => {
        const box = ups[i].querySelector('.tok-glow') || ups[i];
        const p = _relTo(box, textEl);
        const w = box.offsetWidth, h = box.offsetHeight;
        g.toks.push({left: p.x, width: w, top: p.y, bottom: p.y + h, clampBottom: p.y + h, row: 0});
        if (!rowTops.some(rt => Math.abs(rt - p.y) < 3)) rowTops.push(p.y);
        const uc = ups[i].querySelectorAll('.tok-char');
        const sc = sgs[i] ? sgs[i].querySelectorAll('.tok-char') : [];
        uc.forEach(el => el.classList.remove('pre', 'hit'));
        sc.forEach(el => el.classList.remove('pre', 'hit'));
        g.upChars.push(uc); g.sgChars.push(sc);
        const nc = uc.length || 1;
        const dur = Math.max(0.001, tok.end - tok.start);
        const ct2 = [];
        for (let c = 0; c < nc; c++) ct2.push({on: tok.start + dur * c / nc, off: tok.start + dur * (c + 1) / nc});
        g.charTimes.push(ct2);
        g.charPhase.push(new Array(nc).fill(0));
      });
      rowTops.sort((a, b) => a - b);
      g.toks.forEach(tk => {
        tk.row = rowTops.findIndex(rt => Math.abs(rt - tk.top) < 3);
        // Clamp the band at the NEXT visual row's top: glyph boxes overrun
        // the line-height by a few px (JP ascenders) and any spill paints
        // the top of the row below during the reveal.
        const nextTop = rowTops.find(rt => rt > tk.top + 2);
        if (nextTop !== undefined && nextTop < tk.bottom) tk.clampBottom = nextTop - 1;
      });
      g.height = textEl.offsetHeight;
      g.firstOn = line.tokens[0].start;
      g.lastOff = line.tokens[line.tokens.length - 1].end;
      // B2: the glow strip — one element painted once, moved forever by
      // transform from the same vars the mask consumes.
      if (!_glowEl){
        _glowEl = document.createElement('div');
        _glowEl.className = 'wipe-glow';
        _glowEl.setAttribute('aria-hidden', 'true');
      }
      if (_glowEl.parentNode !== textEl) textEl.appendChild(_glowEl);
      g.glow = _glowEl;
      g.ok = true;
    }
  }
  const romEl = card.querySelector('.card-face.front .card-romaji');
  if (romEl && line.romajiParts && line.romajiParts.length){
    const upRoms = romEl.querySelectorAll('.rom-layer--upcoming .rom');
    if (upRoms.length === line.romajiParts.length){
      g.romEl = romEl; g.upRomEls = upRoms;
      g.sgRomEls = romEl.querySelectorAll('.rom-layer--sung .rom');
      g.romParts = [];
      line.romajiParts.forEach((p, i) => {
        const el = upRoms[i];
        const pos = _relTo(el, romEl);
        g.romParts.push({top: pos.y, bottom: pos.y + el.offsetHeight, left: pos.x, width: el.offsetWidth});
      });
      g.romHeight = romEl.offsetHeight;
      g.romOk = true;
    }
  }
  return g;
}

// B3: glow lifecycle — one opacity var, sparse state changes. The glow is
// the cursor, not a VU meter: steady while the voice is live, dim (.45) in
// true vocal silence >300ms (during a HOLD the singer IS singing — the
// dim only fires between notes), re-brightens 150ms before the next onset,
// dark outside the line, .35 while paused (the frozen "you are here").
function _applyGlow(ct){
  const g = _wgeom;
  if (!g || !g.ok || !g.glow) return;
  if (ct === undefined) ct = g._lastCt || 0; else g._lastCt = ct;
  let target;
  if (ct < g.firstOn - 0.15 || ct >= g.lastOff + 0.05) target = 0;
  else if (_wipePaused) target = 0.35;
  else {
    let live = g.singing >= 0;
    if (!live){
      const toks = lines[activeLineIdx].tokens;
      const lastEnd = g.sungCount > 0 ? toks[g.sungCount - 1].end : g.firstOn;
      const nextOn = toks[g.sungCount] ? toks[g.sungCount].start : Infinity;
      live = (ct - lastEnd) < 0.3 || (nextOn - ct) <= 0.15;
    }
    target = live ? 1 : 0.45;
  }
  if (target !== g.glowOp){
    const prev = g.glowOp;
    g.glowOp = target;
    g.glow.style.transitionDuration =
      (target === 1 && prev <= 0) ? '120ms' : (target === 0 ? '180ms' : '350ms');
    g.glow.style.opacity = String(target);
  }
}

function updateHighlight(currentTime){
  if (activeLineIdx < 0) return;
  const line = lines[activeLineIdx];
  if (!line) return;
  let g = _wgeom;
  if (!g || g.idx !== activeLineIdx || g.dirty) g = buildWipeGeom();
  const ct = currentTime - offset;

  if (g.ok){
    const toks = line.tokens, n = toks.length;
    // Boundary scan — pure JS, no DOM.
    let singing = -1, sungCount = 0;
    for (let i = 0; i < n; i++){
      if (ct >= toks[i].end) sungCount = i + 1;
      else if (ct >= toks[i].start && singing < 0) singing = i;
    }
    // Token classes, state-diffed (A6): touch only tokens whose state
    // changed this frame. Handles arbitrary jumps (seek/loop) because the
    // comparison is per-token old-state vs new-state.
    if (sungCount !== g.sungCount || singing !== g.singing){
      const first = g.sungCount < 0;
      for (let i = 0; i < n; i++){
        const st = (i < sungCount) ? 2 : (i === singing ? 1 : 0);
        const old = (i < g.sungCount) ? 2 : (i === g.singing ? 1 : 0);
        if (st === old && !first) continue;
        const a = g.upToks[i], b = g.sgToks[i];
        if (st === 2){
          a.classList.add('sung'); a.classList.remove('singing');
          if (b){ b.classList.add('sung'); b.classList.remove('singing'); }
        } else if (st === 1){
          a.classList.add('singing'); a.classList.remove('sung');
          if (b){ b.classList.add('singing'); b.classList.remove('sung'); }
        } else {
          a.classList.remove('singing', 'sung');
          if (b) b.classList.remove('singing', 'sung');
        }
      }
      g.sungCount = sungCount; g.singing = singing;
    }
    // B4: three-phase per-char lift, scheduled from the timing data (we
    // know the future). State-diffed: DOM is touched only when a char
    // crosses a phase boundary.
    if (!_wipePaused){
      for (let i = 0; i < n; i++){
        const times = g.charTimes[i], ph = g.charPhase[i];
        for (let c = 0; c < times.length; c++){
          const tm = times[c];
          const want = (ct >= tm.on && ct < tm.off) ? 2
                     : (ct >= tm.on - 0.15 && ct < tm.on) ? 1 : 0;
          if (want !== ph[c]){ ph[c] = want; _setCharClass(g, i, c, want); }
        }
      }
    }
    // Fill + row band (A5 warp inside) — arithmetic on cached geometry.
    const refIdx = singing >= 0 ? singing : (sungCount - 1);
    let fillPx = 0, rowKey = 0, tk = null;
    if (refIdx >= 0){
      tk = g.toks[refIdx];
      rowKey = tk.row;
      if (singing >= 0){
        const tok = toks[singing];
        const durS = Math.max(0.001, tok.end - tok.start);
        const f = _warpFill(Math.min(1, Math.max(0, (ct - tok.start) / durS)), durS * 1000);
        fillPx = tk.left + tk.width * f;
      } else {
        fillPx = tk.left + tk.width;
      }
    }
    if (Math.abs(fillPx - g.lastFillPx) > 0.05){
      g.lastFillPx = fillPx;
      g.textEl.style.setProperty('--line-fill-px', fillPx.toFixed(2) + 'px');
    }
    if (rowKey !== g.rowKey){
      const top = tk ? tk.top : 0;
      const bottom = tk ? tk.clampBottom : g.height;
      g.textEl.style.setProperty('--wipe-row-top-px', top.toFixed(2) + 'px');
      g.textEl.style.setProperty('--wipe-row-bottom-px', bottom.toFixed(2) + 'px');
      g.textEl.style.setProperty('--wipe-row-mid-px', ((top + bottom) / 2).toFixed(2) + 'px');
      // B3 row switch: dark window — fade out 70ms, teleport with the row
      // vars, fade back in 90ms. Never streak the glow across the card.
      if (g.rowKey >= 0 && g.glow){
        const gl = g.glow;
        gl.style.transitionDuration = '70ms';
        gl.style.opacity = '0';
        g.glowOp = 0;
        clearTimeout(g._rowGlowTimer);
        g._rowGlowTimer = setTimeout(() => {
          gl.style.transitionDuration = '90ms';
          _applyGlow();
        }, 80);
      }
      g.rowKey = rowKey;
    }
    _applyGlow(ct);
  }

  if (g.romOk){
    const parts = line.romajiParts, rn = parts.length;
    let rSinging = -1, rSung = 0;
    for (let i = 0; i < rn; i++){
      if (ct >= parts[i].end) rSung = i + 1;
      else if (ct >= parts[i].start && rSinging < 0) rSinging = i;
    }
    if (rSung !== g.romSungCount || rSinging !== g.romSinging){
      const first = g.romSungCount < 0;
      for (let i = 0; i < rn; i++){
        const st = (i < rSung) ? 2 : (i === rSinging ? 1 : 0);
        const old = (i < g.romSungCount) ? 2 : (i === g.romSinging ? 1 : 0);
        if (st === old && !first) continue;
        const a = g.upRomEls[i], b = g.sgRomEls[i];
        if (st === 2){
          if (a){ a.classList.add('sung'); a.classList.remove('singing'); }
          if (b){ b.classList.add('sung'); b.classList.remove('singing'); }
        } else if (st === 1){
          if (a){ a.classList.add('singing'); a.classList.remove('sung'); }
          if (b){ b.classList.add('singing'); b.classList.remove('sung'); }
        } else {
          if (a) a.classList.remove('singing', 'sung');
          if (b) b.classList.remove('singing', 'sung');
        }
      }
      g.romSungCount = rSung; g.romSinging = rSinging;
    }
    // Romaji fill anchored to the CURRENT part's own row-relative box, the
    // same way the JP text wipe uses tk.left+tk.width. A single global
    // romLeft/romWidth strip is only valid when every part sits on ONE visual
    // row; once the romaji wraps, that strip spans both rows anchored at
    // row 1's x-origin, so the carried-over cursor pops row 2 in already
    // half-revealed instead of wiping from its own left edge.
    const rRef = rSinging >= 0 ? rSinging : rSung - 1;
    let rFillPx = 0;
    if (rRef >= 0){
      const rp = g.romParts[rRef];
      if (rSinging >= 0){
        const pt = parts[rSinging];
        const durS = Math.max(0.001, pt.end - pt.start);
        const f = _warpFill(Math.min(1, Math.max(0, (ct - pt.start) / durS)), durS * 1000);
        rFillPx = rp.left + rp.width * f;
      } else {
        rFillPx = rp.left + rp.width;
      }
    }
    if (Math.abs(rFillPx - g.lastRomFillPx) > 0.05){
      g.lastRomFillPx = rFillPx;
      g.romEl.style.setProperty('--rom-fill-px', rFillPx.toFixed(2) + 'px');
    }
    const rKey = rRef >= 0 ? g.romParts[rRef].top : -1;
    if (rKey !== g.romRowKey){
      g.romRowKey = rKey;
      const rp = rRef >= 0 ? g.romParts[rRef] : {top: 0, bottom: g.romHeight};
      g.romEl.style.setProperty('--rom-row-top-px', rp.top.toFixed(2) + 'px');
      g.romEl.style.setProperty('--rom-row-bottom-px', rp.bottom.toFixed(2) + 'px');
    }
  }
  // Pause behavior lives in setWipePaused (B5): the wipe freezes exactly
  // where it is (position is truth — never creep it), the ghost layer and
  // romaji rise to readable 0.85, the glow dims to .35 at the edge.
}

// ==================================================================
// Gestures - horizontal swipe rates in drill mode, flips otherwise
// ==================================================================

(function(){
  const stage = document.getElementById('stage');
  const stack = document.getElementById('cardStack');
  const tintL = document.getElementById('drillTintLeft');
  const tintR = document.getElementById('drillTintRight');
  let sx=0, sy=0, dx=0, dy=0, sw=false, axis=null, justSwiped=false;
  // Inertial-scroll bookkeeping (y axis): yDisp = continuous drag offset with
  // whole lines already rolled out; yVisual = what's actually on screen (yDisp
  // plus end-elastic); lastY = last sampled finger Y; lastPosIdx = last line we
  // re-laid-out, so positionCards only runs on a real line change.
  let yDisp=0, lastY=0, yVisual=0, lastPosIdx=0;
  let velocitySamples = [];
  // When a touch starts inside a scrollable back face, we let the
  // browser's native scroll consume vertical drag until the back hits
  // a scroll boundary. Only then does this gesture handler take over
  // and translate the stack for the next/prev-card preview.
  let backScrollEl = null;
  function activeCard(){ return document.querySelector('.card.is-active'); }
  function sampleVelocity(y){
    const t = performance.now();
    velocitySamples.push({y, t});
    const cutoff = t - 100;
    while (velocitySamples.length > 2 && velocitySamples[0].t < cutoff) velocitySamples.shift();
  }
  function computeVelocity(){
    if (velocitySamples.length < 2) return 0;
    const first = velocitySamples[0], last = velocitySamples[velocitySamples.length-1];
    const dt = last.t - first.t; if (dt < 5) return 0;
    return (last.y - first.y) / dt;
  }
  function clearTints(){ tintL.style.opacity = 0; tintR.style.opacity = 0; }

  function onDown(e){
    if (e.touches && e.touches.length > 1) return;
    if (window.__pgGestures && window.__pgGestures.editMode) return;
    // Sing = native-scroll list: the browser fully owns the drag. Bail out of
    // the custom gesture entirely so it can never swallow a scroll. (Tap-to-
    // play still works — that's the separate 'click' listener below.)
    if (inSingList()) return;
    if (e.target.closest('.card-btn') || e.target.closest('.wc-jp') || e.target.closest('.wc-en') || e.target.closest('.brief-play') || e.target.closest('.card-star') || e.target.closest('.card-gear') || e.target.closest('.minimap') || e.target.closest('.drill-rate-row')) return;
    cancelMomentum(); // v21: any new touch interrupts an in-flight fling
    stack.classList.remove('momentum'); // drop a lingering settle transition so this drag tracks 1:1
    const t = e.touches ? e.touches[0] : e;
    sx = t.clientX; sy = t.clientY;
    dx = 0; dy = 0; sw = true; axis = null;
    yDisp = 0; yVisual = 0; lastY = t.clientY; lastPosIdx = activeLineIdx;
    velocitySamples = []; sampleVelocity(sy);
    // Touch only: if the touch started inside an active card's back
    // face that has room to scroll, defer to native scroll on the Y
    // axis until the back hits a boundary, then take over. Mouse
    // doesn't scroll via drag, so leave the existing drag-to-advance
    // behavior alone on desktop.
    const back = e.touches ? e.target.closest('.card-face.back') : null;
    if (back && back.closest('.card.is-active') &&
        back.scrollHeight > back.clientHeight + 1) {
      backScrollEl = back;
    } else {
      backScrollEl = null;
    }
  }

  function onMove(e){
    if (!sw) return;
    // Sing = native-scrolling list: the browser owns vertical drag/momentum.
    // Do nothing here so we never fight it with a JS transform.
    if (inSingList()) return;
    const t = e.touches ? e.touches[0] : e;
    const mx = t.clientX - sx; const my = t.clientY - sy;
    if (axis === null){
      if (Math.abs(mx) > 8 || Math.abs(my) > 8){
        axis = Math.abs(mx) > Math.abs(my) ? 'x' : 'y';
        stack.classList.add('dragging');
      } else return;
    }
    if (axis === 'y'){
      // While the back face has room to scroll in the drag direction,
      // let the browser's native scroll handle it. Rebase sy each frame
      // so when the boundary IS hit, dy starts counting from there.
      if (backScrollEl){
        const max = backScrollEl.scrollHeight - backScrollEl.clientHeight;
        const s = backScrollEl.scrollTop;
        const dragDown = my > 0; // finger down → reveal content above (scroll up)
        const canScroll = dragDown ? (s > 0) : (s < max - 0.5);
        if (canScroll){
          sy = t.clientY; dy = 0; lastY = t.clientY; yDisp = 0; yVisual = 0;
          velocitySamples = []; sampleVelocity(sy);
          stack.style.transform = '';
          return;
        }
        // Boundary hit — release lock, take over from current position
        backScrollEl = null;
        sy = t.clientY; dy = 0; lastY = t.clientY; yDisp = 0; yVisual = 0;
        velocitySamples = []; sampleVelocity(sy);
        return;
      }
      // 1:1 finger-following scroll. Accumulate the frame-to-frame delta so a
      // long drag rolls through many lines (wrap below), and the lyrics track
      // the finger directly — no damping, no fixed advance threshold. The
      // release velocity carries into an inertial glide in onUp.
      const cy = t.clientY;
      yDisp += cy - lastY; lastY = cy;
      dy = my; sampleVelocity(cy);
      while (yDisp <= -SPACING_Y && activeLineIdx < lines.length - 1){ activeLineIdx++; yDisp += SPACING_Y; }
      while (yDisp >=  SPACING_Y && activeLineIdx > 0){ activeLineIdx--; yDisp -= SPACING_Y; }
      // Soft elastic past the very first / last line (nothing to reveal there).
      let vis = yDisp;
      if (activeLineIdx <= 0 && yDisp > 0) vis = Math.pow(yDisp, 0.82) * 1.2;
      else if (activeLineIdx >= lines.length - 1 && yDisp < 0) vis = -Math.pow(-yDisp, 0.82) * 1.2;
      yVisual = vis;
      if (activeLineIdx !== lastPosIdx){ positionCards(activeLineIdx); syncLineMeta(activeLineIdx); lastPosIdx = activeLineIdx; }
      stack.classList.add('momenting'); stack.classList.remove('momentum'); // transitions off → direct tracking + seamless line re-centre
      stack.style.transform = `translate3d(0, ${vis}px, 0)`;
    } else if (axis === 'x'){
      dx = mx;
      const ac = activeCard();
      if (ac){
        if (drillMode){
          // drill: drag active card sideways, tint glows in
          ac.style.transform = `translate3d(calc(-50% + ${dx}px),-50%,0) rotate(${dx * 0.04}deg)`;
          const p = Math.min(1, Math.abs(dx) / 180);
          if (dx > 0) { tintR.style.opacity = p; tintL.style.opacity = 0; }
          else { tintL.style.opacity = p; tintR.style.opacity = 0; }
        } else if (!window.__pgGestures || window.__pgGestures.swipeLRFlip) {
          // normal: flip preview (only when LR-swipe-to-flip is enabled)
          const inner = ac.querySelector('.card-inner');
          if (inner){
            const flipped = ac.classList.contains('flipped');
            const base = flipped ? 180 : 0;
            inner.style.transition = 'none';
            inner.style.transform = `rotateY(${base + dx * 0.4}deg)`;
          }
        }
      }
    }
  }

  function onUp(){
    if (!sw) return;
    if (inSingList()){ sw = false; axis = null; return; }   // native scroll handled it
    const velocity = computeVelocity(); const absV = Math.abs(velocity);
    sw = false;
    backScrollEl = null;
    stack.classList.remove('dragging');
    clearTints();
    const ac = activeCard();
    if (ac){
      if (drillMode){
        ac.style.transform = ''; // reset inline
      }
      const inner = ac.querySelector('.card-inner');
      if (inner){ inner.style.transition = ''; inner.style.transform = ''; }
    }

    if (axis === 'y'){
      // Inertial scroll: hand the finger's current on-screen offset + release
      // velocity to the momentum glide. It decelerates, rolls through lines in
      // proportion to swipe speed, and eases onto the nearest line — no fixed
      // threshold, no rubber-band back to the start. Seek-on-settle keeps the
      // audio in sync (study mode lands paused; sing resumes if it was playing).
      if (absV > 0.3) SFX.fling();
      startMomentum(velocity, yVisual);
      justSwiped = true; setTimeout(() => { justSwiped = false; }, 320);
    } else if (axis === 'x' && Math.abs(dx) > 80){

      stack.classList.add('momentum'); stack.style.transform = '';

let currentAudio = null; let currentAudioEl = null;

// v1lwdk: tap-the-same-chip-to-pause / tap-another-chip-to-switch.
// Defensive against (a) state drift between Audio instances and the
// .playing class, (b) iOS Safari pause()-while-loading races, (c) the
// fallbackTTS speechSynthesis path leaving the prior chip "active".
// mana (owner): audio content version. Per-word clips + drill concats are served
// immutable (1yr) under STABLE filenames — replacing a clip in place (e.g. the
// curated に fix) never reaches devices or even the CF edge. assemble_page
// splices a sha8 of the song's audio content here; '?v=' rides every clip URL
// so changed audio mints a fresh cache key. '' (template default) = no query.
// Idempotent: URLs that already carry a query (DRILL_MAP ?v=) or are absolute
// (R2 podcast) pass through untouched.
const AUDIO_V = '3ace9e08';
function _withAudioV(u){
  if (!AUDIO_V || !u || u.indexOf('?') !== -1 || /^[a-z][a-z0-9+.-]*:/i.test(u)) return u;
  return u + '?v=' + AUDIO_V;
}

function playAudio(url, el){
  url = _withAudioV(url);

  if (currentAudio && currentAudioEl === el && !currentAudio.paused){
    try { currentAudio.pause(); currentAudio.currentTime = 0; } catch(_){}
    if (el) el.classList.remove('playing');
    currentAudio = null; currentAudioEl = null;
    return;
  }
  // Different chip tapped, or stale state → stop everything first.
  if (currentAudio){ try { currentAudio.pause(); currentAudio.currentTime = 0; } catch(_){} currentAudio = null; }

  // its OWN currentSeq state — it is NOT tracked by currentAudio. Cancel it
  // here too, otherwise tapping the section-overview pill (which routes
  // through playAudio) leaves a running gloss-pill sequence talking
  // underneath it → overlapping audio.

  // behind (re-render, fallbackTTS exit, etc.) so only the new chip
  // shows the active outline.
  document.querySelectorAll('.playing').forEach(x => { if (x !== el) x.classList.remove('playing'); });

}
// TTS language-safety: a single source of truth for "this string contains
// Japanese". Covers hiragana, katakana, half-width katakana, and CJK
// ideographs. Romaji (latin) is intentionally NOT flagged here — the romaji
// defense is structural (English speak paths read curated en_speak, never the
// display gloss). See speakEN / speakTranslationPill / validate_tts_safety.py.
const HAS_CJK = s => /[぀-ヿ㐀-鿿ｦ-ﾟ]/.test(String(s||''));

// Punctuation the browser voice trips on. A bare em/en dash makes the model
// stop dead — an over-long, awkward pause mid-sentence ("life [....] fragile").
// A comma gives the natural short breath the dash actually stands in for. The
// on-screen text keeps its em dashes (they read well typographically); only the
// SPOKEN string is normalized. The pre-baked clips get the same treatment at
// generation time (tools/normalize_tts_text.py), so display and audio diverge
// on purpose, exactly like the CJK-clean spoken variants already do.
function ttsClean(s){
  return String(s == null ? '' : s)
    .replace(/\s*[—–]\s*/g, ', ')
    .replace(/\s+([,.!?;:])/g, '$1')
    .replace(/,\s*,/g, ',')
    .replace(/\s{2,}/g, ' ')

function fallbackTTS(text, lang, el){

  // must NEVER read Japanese. If we'd be about to hand Japanese text to a
  // non-Japanese browser voice, refuse and log instead. This is the last line
  // of defense behind the structural en_speak decoupling.
  if (!lang.startsWith('ja') && HAS_CJK(text)){
    console.warn('[tts-safety] blocked non-JP voice from reading Japanese:', String(text).slice(0,40), '(lang=' + lang + ')');
    return;
  }
  // Stop any audio-element playback before falling back to native TTS,
  // and tear down any leftover .playing decorations so visual state
  // matches what's actually about to speak.
  if (currentAudio){ try { currentAudio.pause(); currentAudio.currentTime = 0; } catch(_){} currentAudio = null; }
  if (typeof currentSeq !== 'undefined' && currentSeq){ try { currentSeq.cancel(); } catch(_){} currentSeq = null; }
  document.querySelectorAll('.playing').forEach(x => { if (x !== el) x.classList.remove('playing'); });
  try { speechSynthesis.cancel(); } catch {}
  // Track the chip on currentAudioEl so the next playAudio call (or
  // another fallbackTTS) clears it correctly.

// vocab word's EN speak text — those are the SAME keys used by the
// individual wc-en chips, so audioCache should have an HQ TTS file
// for each. Passing the whole concatenated phrase to speakEN misses
// the cache and falls through to speechSynthesis (Siri voice).
// Playing the parts one-by-one keeps every part in HQ, only falling
// back to Siri per-part if a specific entry isn't in the manifest.
let currentSeq = null;
function playSequentialEN(parts, el){

  if (currentAudioEl){ currentAudioEl.classList.remove('playing'); currentAudioEl = null; }
  try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch(_){}
  if (!parts || !parts.length) return;

  const finish = () => {
    if (el) el.classList.remove('playing');
    if (currentSeq && currentSeq.el === el) currentSeq = null;

  const cancel = () => {
    cancelled = true;
    if (activeAudio){ try { activeAudio.pause(); } catch(_){} activeAudio = null; }
    try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch(_){}

// give the transfer (JP form → EN meaning) time to land. Visual track rides
// the sheet's word rows (1:1 with parts): everything dims to 0.35, the live
// row lifts 200ms BEFORE its JP clip (the eye arrives first) and holds
// through the gloss, settling at glossEnd+380ms; the next row rises at
// glossEnd+500ms — its own JP−200ms. Same currentSeq contract as
// playSequentialEN: tap-again cancels; swipes / sheet close / song start

  // written by build_drill_concat.py

// Keep the lit drill word inside the scrolling study grid. A long line's later
// words sit below the anchored Word-by-Word pill; without this the drill lights
// them up where you can't see them (owner). Centers the active row in .study-wrap;
// the browser clamps at the ends so the final words settle just above the pill,
// still visible. No-op on short lines that don't scroll.
function scrollDrillRowIntoView(row){
  const wrap = row && row.closest('.study-wrap');
  if (!wrap || wrap.scrollHeight <= wrap.clientHeight + 2) return;
  // mana (owner): center-anchor the heard row like the sing list's followActiveLine
  // ("centering ... like the lyrics when being played") — park the row's center
  // ~0.44 down the scroller, clamped to the scroll range so the ends settle
  // naturally. The runway padding (addDrillRunway) lets the FIRST and LAST words
  // reach the anchor. rect math is offsetParent-agnostic.
  const ANCHOR = 0.44;
  const rr = row.getBoundingClientRect(), wr = wrap.getBoundingClientRect();
  const maxTop = Math.max(0, wrap.scrollHeight - wrap.clientHeight);
  const rowCenter = (rr.top - wr.top) + wrap.scrollTop + rr.height / 2;
  const target = Math.max(0, Math.min(maxTop, rowCenter - wrap.clientHeight * ANCHOR));
  try { wrap.scrollTo({ top: target, behavior: 'smooth' }); }
  catch(_){ wrap.scrollTop = target; }
}
// mana (owner): word-level focus grading — the heard row is .drill-hot (full); its
// neighbours grade down by distance (d1/d2/d3, CSS above) instead of the flat dim,
// so the eye lands on the spoken word. Cleared each step; classes only (no blur).
function gradeDrillRows(rows, hot){
  for (let i = 0; i < rows.length; i++){
    const r = rows[i];
    r.classList.remove('drill-d1','drill-d2','drill-d3');
    if (i === hot) continue;
    const d = Math.abs(i - hot);
    r.classList.add(d === 1 ? 'drill-d1' : d === 2 ? 'drill-d2' : 'drill-d3');
  }
}
function clearDrillGrade(rows){
  rows.forEach(r => r.classList.remove('drill-d1','drill-d2','drill-d3'));
}
// mana (owner): runway so the FIRST and LAST words can still center. While a drill
// runs, pad the scroller symmetrically (half a viewport minus one row) so the top/
// bottom rows can reach the center anchor; restore the compact padding when it ends
// so manual browsing keeps today's layout. Only when the content already overflows
// (else the pad would invent pointless scroll). Original inline padding is saved so
// the restore is exact.
function addDrillRunway(wrap, rows){
  if (!wrap || wrap.__drillPad) return;
  if (wrap.scrollHeight <= wrap.clientHeight + 2) return;
  const rowH = (rows && rows[0]) ? rows[0].offsetHeight : 44;
  const pad = Math.max(0, (wrap.clientHeight - rowH) / 2);
  if (pad <= 0) return;
  const cs = getComputedStyle(wrap);
  wrap.__drillPad = { top: wrap.style.paddingTop, bottom: wrap.style.paddingBottom };
  wrap.style.paddingTop = Math.max(parseFloat(cs.paddingTop) || 0, pad) + 'px';
  wrap.style.paddingBottom = Math.max(parseFloat(cs.paddingBottom) || 0, pad) + 'px';
}
function removeDrillRunway(wrap){
  if (!wrap || !wrap.__drillPad) return;
  wrap.style.paddingTop = wrap.__drillPad.top;
  wrap.style.paddingBottom = wrap.__drillPad.bottom;
  wrap.__drillPad = null;
}

    if (cancelled) return;
    cancelled = true;
    if (raf){ cancelAnimationFrame(raf); raf = 0; }
    try { audio.pause(); } catch(_){}
    if (el) el.classList.remove('playing');
    rows.forEach(r => r.classList.remove('drill-hot')); clearDrillGrade(rows); curRow = -1;
    if (grid) grid.classList.remove('drill-live');
    removeDrillRunway(wrap);
    if (currentAudio === audio) currentAudio = null;
    if (currentSeq && currentSeq.el === el) currentSeq = null;
  };

  currentAudio = audio;

  if (grid && rows.length) grid.classList.add('drill-live');
  addDrillRunway(wrap, rows);
  // A8: pull the visual mapping back by the device output latency so the lit
  // row tracks the HEARD word, not the decoded one (same estimate the pitch card
  // uses; cached on window across the page).
  const _lat = (window.__outLat !== undefined) ? window.__outLat
    : (window.__outLat = (() => { try { const c = new (window.AudioContext||window.webkitAudioContext)(); const v = c.outputLatency || 0.02; c.close(); return v; } catch(_){ return 0.02; } })());

    const t = Math.max(0, audio.currentTime - _lat);
    let active = -1;
    for (let i = 0; i < words.length; i++){ if (t >= words[i].s && t < words[i].e){ active = i; break; } }
    if (active >= 0) setRow(active); else clearRows();   // inter-word gaps + tail = no lit row
    raf = requestAnimationFrame(tick);
  };
  audio.onended = finish;

  // file is immutable-cached, so this is cheap) before giving up gracefully.
  audio.onerror = () => {
    if (cancelled) return;
    if (!retried){ retried = true; try { audio.load(); const p = audio.play(); if (p && p.catch) p.catch(()=>{}); } catch(_){} return; }
    finish();
  };
  const pr = audio.play();
  if (pr && pr.catch) pr.catch(() => {});   // rejection surfaces via onerror/tick
