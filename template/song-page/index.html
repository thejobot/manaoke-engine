    </symbol>
    <symbol id="i-back" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter">
      <polyline points="13,3 5,10 13,17"/>
    </symbol>
    <symbol id="i-chevron-right" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter">
      <polyline points="7,3 15,10 7,17"/>
    </symbol>
    <!-- Three-dot "kebab" / overflow-menu glyph. Vertical by default
         (standard mobile pattern); rotates 90deg to horizontal when
         the tray is open as a visual cue. -->
    <symbol id="i-chevron" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter">
      <polyline points="4,7 10,13 16,7"/>
    </symbol>

    <!-- Repeat / loop / refresh - chunky 3/4 arc + arrowhead -->
    <symbol id="i-repeat" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
      <polyline points="4,8 4,5 14,5"/>
      <polyline points="12,2 15,5 12,8"/>
      <polyline points="16,12 16,15 6,15"/>
      <polyline points="8,12 5,15 8,18"/>
    </symbol>
    <symbol id="i-loop" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
      <polyline points="4,8 4,5 14,5"/>
      <polyline points="12,2 15,5 12,8"/>
      <polyline points="16,12 16,15 6,15"/>
      <polyline points="8,12 5,15 8,18"/>
    </symbol>

    <!-- Pencil: solid angular body, no inner dividers - reads as a mass -->
    <!-- Pencil (kept for any future "edit text" use case) -->

    <!-- TUNE (lyric tweaker): "Aa" type glyph above a slider track + handle.
         Reviewers all flagged the pencil as "edit text" / "annotate"; this
         glyph reads as "type styling control" - letters + a knob. -->

    <!-- SETUP / GEAR (canonical 6-tooth gear with center hole). Real settings
         vocabulary. Replaces the EQ-sliders icon that reviewers said
         "rendered as a kanji blob" on a Japanese-learning app. -->
    <symbol id="i-setup" viewBox="0 0 20 20" fill="currentColor" stroke="none" fill-rule="evenodd">
      <path d="M10 1 L11.5 3.5 L14 2.5 L14.5 5.2 L17 5.5 L16 8 L18 9.5 L16 11 L17 13.5 L14.5 13.8 L14 16.5 L11.5 15.5 L10 18 L8.5 15.5 L6 16.5 L5.5 13.8 L3 13.5 L4 11 L2 9.5 L4 8 L3 5.5 L5.5 5.2 L6 2.5 L8.5 3.5 Z M10 7 a3 3 0 1 0 0 6 a3 3 0 1 0 0 -6 Z"/>
    </symbol>

    <!-- CARD-VIEW (per-card display options): 2×2 grid - web convention
         for "layout / display density". Panel said the 3-fader version
         read as "barcode with dust" at 14px. This reads crisp. -->

    <!-- REPLAY (play this line one more time): hook arrow with a small "1"
         inside. Distinct from i-loop (closed-loop continuous). Reviewers
         all flagged loop+refresh side-by-side as a coin-flip failure. -->
    <symbol id="i-replay" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square" stroke-linejoin="miter">
      <path d="M16 10 a6 6 0 1 1 -2 -4.5"/>
      <polyline points="16,2 16,6 12,6"/>
      <text x="10" y="13" font-size="6" font-family="'DotGothic16',monospace" font-weight="900" fill="currentColor" stroke="none" text-anchor="middle">1</text>
    </symbol>

    <!-- SLOW (0.75× playback): tempo dial rotated CCW with a pointer notch
         at the 7-o'clock position. Panel fired the play-triangle version
         because at 14px the triangle dominated and it read as PLAY.
         Standalone icon for any glyph-only surface; the TV cabinet uses
         a labeled round button + LED instead (period-correct). -->

    <!-- FLAG (mark "needs work"): a pennant on a flagpole - replaces the X
         which reviewers said reads as DELETE / dismiss. Flag = "needs
         attention", a flag-for-review semantic. -->
    <symbol id="i-flag" viewBox="0 0 20 20" fill="currentColor" stroke="none">
      <rect x="4" y="2" width="1.6" height="16"/>
      <path d="M5.6 3 L16 3 L13.5 7 L16 11 L5.6 11 Z"/>
    </symbol>

    <!-- Eyedropper: filled diamond-tip + short top stroke -->

    <!-- Turtle: chunky silhouette - big shell, square feet, square head -->
    <symbol id="i-turtle" viewBox="0 0 20 20" fill="currentColor" stroke="none">
      <path d="M3,13 a7,7 0 0 1 14,0 Z"/>
      <rect x="16.5" y="10" width="3" height="4"/>
      <rect x="5" y="13" width="2.5" height="3"/>
      <rect x="12.5" y="13" width="2.5" height="3"/>
      <polygon points="3,11.5 0.5,13 3,14.5"/>
    </symbol>

    <!-- Sun: hollow ring + 4 axis rays. Reads "sun" with a clear center hole
         so it can't be mistaken for the gear/sliders icon. -->

    <!-- Moon: thick left-facing crescent. Outer disc (cx=9 r=8) minus
         a larger offset disc (cx=14 r=7.5) - the offset is big enough
         that the resulting crescent is ~5px thick on the left and
         tapers to nothing on the right. -->

    <!-- THEME toggle (single static glyph for the theme button - no longer
         swaps between sun/moon; the button now signals state via .on class

         "duality / light + dark" without committing to one state. -->

    <!-- Flick (up arrow) -->

    <!-- Star: solid 5-point + outlined variant -->
    <symbol id="i-star" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="miter">
      <polygon points="10,1.5 12.6,7.5 19,8 14.1,12.6 15.6,19 10,15.7 4.4,19 5.9,12.6 1,8 7.4,7.5"/>
    </symbol>
    <symbol id="i-star-filled" viewBox="0 0 20 20" fill="currentColor" stroke="none">
      <polygon points="10,1.5 12.6,7.5 19,8 14.1,12.6 15.6,19 10,15.7 4.4,19 5.9,12.6 1,8 7.4,7.5"/>
    </symbol>

    <!-- Check and X - thick square strokes -->
    <symbol id="i-check" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter">
      <polyline points="3,10 8,15 17,4"/>
    </symbol>
    <symbol id="i-x" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square">
      <path d="M4 4 L16 16 M16 4 L4 16"/>
    </symbol>
    <symbol id="i-close" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square">
      <path d="M4 4 L16 16 M16 4 L4 16"/>
    </symbol>

    <!-- Brain: blocky two-lobed silhouette, 2px miter -->

    <!-- Sliders: three rows, square handles -->
    <symbol id="i-sliders" viewBox="0 0 20 20">
      <line x1="5" y1="3" x2="5" y2="17" stroke="currentColor" stroke-width="1.6" stroke-linecap="square"/>
      <line x1="10" y1="3" x2="10" y2="17" stroke="currentColor" stroke-width="1.6" stroke-linecap="square"/>
      <line x1="15" y1="3" x2="15" y2="17" stroke="currentColor" stroke-width="1.6" stroke-linecap="square"/>
      <rect x="3" y="6" width="4" height="3" fill="currentColor"/>
      <rect x="8" y="11" width="4" height="3" fill="currentColor"/>
      <rect x="13" y="8" width="4" height="3" fill="currentColor"/>
    </symbol>

    <!-- Settings "gear" - solid 8-tooth hub, no cutout so it reads clean on
         any button color (hollow gear becomes muddy when currentColor =
         button-bg). This one is more like a rivet / bolt-head cluster. -->

    <!-- Translate: Japanese/English glyphs, solid -->

    <!-- Copy / save / trash -->
    <symbol id="i-save" viewBox="0 0 20 20">
      <polygon points="3,3 14,3 17,6 17,17 3,17" fill="currentColor" stroke="none"/>
    </symbol>
    <symbol id="i-trash" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
      <polyline points="3,6 17,6"/>
      <polyline points="8,6 8,3 12,3 12,6"/>
      <polyline points="5,6 6,17 14,17 15,6"/>

    <!-- iOS-style share: box with an arrow pointing up out of it. -->

      <polyline points="6,5 10,1.5 14,5"/>

    <!-- Speaker + JP / EN tag -->
    <symbol id="i-jp-speak" viewBox="0 0 20 20">

      <text x="11" y="15.5" font-size="9" font-family="'M PLUS Rounded 1c',sans-serif" font-weight="900" fill="currentColor" stroke="none">日</text>
    </symbol>

      <text x="11" y="15.5" font-size="9" font-family="'M PLUS Rounded 1c',sans-serif" font-weight="900" fill="currentColor" stroke="none">A</text>
    </symbol>
    <!-- z8h4v2: bottom-right "study" — an open book (reading/studying), replaces the speech bubble -->
    <symbol id="i-cards-corner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 6.6V20"/>
      <path d="M12 6.6C10.3 5.2 7.7 4.6 4.4 4.7a1 1 0 0 0-1 1v10.7a1 1 0 0 0 1 1c3.1-.1 5.6.4 7.6 1.6 2-1.2 4.5-1.7 7.6-1.6a1 1 0 0 0 1-1V5.7a1 1 0 0 0-1-1c-3.3-.1-5.9.5-7.6 1.9Z"/>
    </symbol>
    <!-- v5iiv3: bottom-left "translations" — the universally legible 日 / A mark -->
    <symbol id="i-xlate-corner" viewBox="0 0 24 24">

      <text x="11.5" y="21.5" font-size="11.5" font-family="'M PLUS Rounded 1c',sans-serif" font-weight="900" fill="currentColor" stroke="none">A</text>

    <!-- v5iiv3: section overview blurb — a paragraph of text -->

</svg>

<div class="u-app" data-current-mode="sing" data-playback-mode="sing" data-chrome-translation="on" data-chrome-section-overview="on" data-chrome-star="off" data-chrome-gear="back" data-chrome-meta="off" data-chrome-romaji="on" data-chrome-overview="on" data-chrome-wordhl="on" data-page-linepos="on" data-page-timenow="on" data-page-starcount="on" data-page-btnfirst="on" data-page-btnprev="on" data-page-btnplay="on" data-page-btnnextsection="on" data-page-btnnext="on" data-page-btnbrowse="on">

  <!-- mana2 (owner): ONE living field for the whole app. Sing + Immerse used to have
       their own field elements (sing absolute-in-.stage, immerse fixed-viewport) at
       different boxes + animation phases, so the gradient SHIFTED and RESET on every
       lyrics⇄immerse switch. This single persistent fixed field sits behind both
       modes and is never touched by the switch — the background never changes. -->
  <div class="living-field" id="livingField" aria-hidden="true">
    <div class="fb fb1"></div><div class="fb fb2"></div><div class="fb fb3"></div>

  <header class="u-master-topbar" role="banner" data-menu-open="false">
    <div class="u-tb-stack">
    <div class="u-tb-row u-tb-row--meta">
      <div class="u-song-meta">

      </div>

    <div class="u-tb-row u-tb-row--transport" id="uTransport">
      <a href="/" id="uBack" class="u-back" aria-label="back">
        <svg class="ui-icon" aria-hidden="true"><use href="#i-back"/></svg>
      </a>
      <div class="u-tp-spacer"></div>
      <!-- mana2: the counter window is the ONE transport surface for the whole
           song. Its contents swap by mode: lyrics (time + Sing/Study) vs podcast
           (15s-back / play / 15s-fwd + time). The Immerse⇄Karaoke switch and the
           play-line (scrub) live in the same place in both modes. -->
      <div class="u-counter">
        <!-- SING transport -->
        <!-- k0dxk2 round2: repeat + slow flags live INSIDE the play/pause pill,
             right after the time, so they read as one "play + status" readout.
             Hidden until armed (.is-on); the pill's u-tp-sing hides them in immerse. -->
        <span class="u-tp-info u-tp-info--dim u-tp-sing" data-page-item="timeNow"><svg class="u-time-pp ui-icon ui-icon--filled" id="uTimePPIcon" aria-hidden="true"><use href="#i-play"/></svg><span class="u-tp-div" aria-hidden="true"></span><b id="timeNowTop">0:00</b><span class="u-tp-div" aria-hidden="true"></span><span class="u-tp-flag" id="uFlagLoop" role="button" aria-label="toggle repeat"><svg class="ui-icon" aria-hidden="true"><use href="#i-loop"/></svg></span><span class="u-tp-div" aria-hidden="true"></span><span class="u-tp-flag" id="uFlagSpeed" role="button" aria-label="toggle slow playback"><svg class="ui-icon ui-icon--filled" aria-hidden="true"><use href="#i-turtle"/></svg></span></span>

                id="uModeBtn" aria-label="toggle Sing / Study mode" data-mode="sing">Sing Mode</button>

<script>
// ==================================================================
// Tap Lines v24 core - wrapped by Unified Song Page v3
// (transport row, browse mode, per-mode settings, flippable preview).
// ==================================================================

// Gesture defaults. The interactive editor that used to write these is
// gone; the gesture guards below still read window.__pgGestures, so seed
// the production-intended defaults once at boot.
// uzz2ej: NO double-tap anywhere. The whole gesture grammar is single-tap now:
// tap a thing to act on it; tap the backdrop outside a card to go back a level.
// doubleTapWindow / tapProximityPx are vestigial (no live consumers). Keep
// flipTrigger:'double-tap' — it's what holds the legacy back-face play/pause
// fallback (line ~7833) and the LR-swipe flip (line ~9061) disabled.
window.__pgGestures = { swipeLRFlip: false, flipTrigger: 'double-tap', doubleTapWindow: 280, tapProximityPx: 48, editMode: false };

const SONG = 'SLUG';
const YT_ID = '';
const SONG_DATA_URL = `/songs/${SONG}/data.json?v=55dcab45`;
const FAVS_KEY = `tapLines_favs_${SONG}`;
const RATES_KEY = `tapLines_rates_${SONG}`;
// v1 of unified song pages: extra keys specific to this experiment
// v2 bump: mode names renamed (lyric-hero→sing, play→lyric-hero, learn→immerse),
// so legacy stored values can't be interpreted safely. Use a fresh key.
const UNIFIED_MODE_KEY = `unifiedSongs_mode_v2_${SONG}`;
const UNIFIED_STUDY_GRID_KEY = `unifiedSongs_studyGrid_${SONG}`;
const PODCAST_URL = 'audio/SONG_FAMILY_podcast.mp3';

let lines = [];
let songMeta = null;
let songData = null;
let audioCache = {};
let wordsFlat = [];
let globalVocabSorted = [];
let player = null;
let ytReady = false;

let activeLineIdx = 0;
let isPlaying = false;
// Study mode: true while the user has any card flipped to its vocab
// face. Swiping between cards in this mode keeps the next card on the
// back face — only double-tap returns to the lyric side.
let studyMode = false;
// Top-bar Mode chip picks the playback policy.
//   'sing'  → karaoke: autoplay, auto-advance, section-jump-plays
//   'study' → tap-only: no autoplay, no advance, section-jump-navigates
// (Behavior wiring lands in a follow-up build. This build only wires the
// chip picker + persistence.) Distinct from the legacy `studyMode` flag
// above, which controls the back-face card-flip state, not playback.
let playbackMode = (localStorage.getItem('tapLines_playbackMode') === 'study') ? 'study' : 'sing';
// Action tray is global state: opening it on any card opens it on every
// card so it stays visible as playback advances; closing it collapses
// everywhere. (Per-card state would close the tray every time the
// active card changed, which fights how people actually use it.)
let trayOpen = false;
let tickInterval = null;
let lastManualNavAt = 0;
let songDuration = 0;
let loopingIdx = -1;
// af3r1o — single source of truth for the repeat/loop line. Always pair the
// state write with a chip refresh so the loop indicator can never desync (the
// sheet's loop button lives outside .card, so a bare assignment used to leave
// it stale). Callers decide whether to also navigate/play.
function setLoop(i){ loopingIdx = i; try { updateLoopStates(); } catch(_){} }

// Baked default: romaji on. (Customization UI removed.)
let showRomaji = true;
// Click SFX default on.
let clickSoundOn = (localStorage.getItem('tapLines_clicks') ?? '1') === '1';
// v21: scroll behavior is a named mode instead of a boolean
// free/momentum retired: those branches pass seek:false, which decouples the
// card from the audio (swipe moves the card but NOT the song) in BOTH sing and
// study. A stale 'tapLines_scroll' value (e.g. left by the old 'casual listen'
// preset) silently kept that on with no way back once the chooser was removed,
// producing "the line stays on screen, no reveal, the song keeps playing, it
// jumps far back". Hard-pin snap so every swipe seeks and card+audio stay synced.
let scrollBehavior = 'snap'; // 'snap' | 'free' | 'momentum' — pinned to snap
let freeScroll = false; // legacy alias used by existing code
try { localStorage.removeItem('tapLines_scroll'); } catch {}
// v24: default cardButtons = transport (prev/play/next) + speak/slow/loop
// Topbar transport buttons are hidden; these are the canonical transport
// controls now. Order: navigation first, then per-line tools.
// Default cardButtons trimmed to the 6 that actually belong in the
// back-of-card kebab tray: speed/loop tools, primary play, share, and
// the two replay/audio helpers. Transport (first/prev/next/nextsection)
// stays in the topbar — the kebab is for per-line tools only.
// hcdyg2: the always-visible bottom toolbar — slow / loop / play / share.
// Repeat and Speak-EN removed. These show as uniform circular buttons (matching
// the book button) in a fixed centered row, no kebab/chevron.
// Baked fixed toolbar: slow / loop / play / share. (Button-picker UI removed.)
const DEFAULT_CARD_BUTTONS = ['slowdown','loop','play','share'];
let cardButtons = DEFAULT_CARD_BUTTONS.slice();
let momentumAnim = null;

// Side rail retired - superseded by the next-section topbar button. Force off
// regardless of any previously-saved preference so the rail never appears.
let minimapShow = false;
let minimapAutoHide = true;

// Baked panel-visibility defaults (Immerse mode). Customization UI removed.
let showPodcast = true;
let showTrivia = true;
// Baked: drill / filter modes retired from the UI — pinned off.
let advancedOpen = false;
let starsOnly = false;
let needOnly = false;
let drillMode = false;
// Baked: translation overlay off by default (the base experience is the two
// animated rows; the bottom-left corner toggle ADDS the English row).
let showTranslation = true;
// Baked: section-overview blurb on by default.
let showSectionOverview = true;
// Offset/rate were only adjustable via the removed advanced settings — bake.
let offset = 0;
let playbackRate = 1;

// Favorites/ratings UI retired. Keep empty collections so the card renderer's
// favorites.has(i) / ratings.get(i) reads (no stamp = default look) still work.
let favorites = new Set();
let ratings = new Map(); // idx → 'got' | 'need' — always empty now

// ==================================================================
// Sounds
// ==================================================================

let audioCtx = null;
function getAudioCtx(){
  if (!audioCtx){ try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch {} }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function clickSound(freq, duration, vol){
  if (!clickSoundOn) return;
  freq = freq || 620; duration = duration || 0.055; vol = vol || 0.07;
  const ctx = getAudioCtx(); if (!ctx) return;
  const now = ctx.currentTime;
  const osc = ctx.createOscillator(); const gain = ctx.createGain();
  osc.type = 'sine'; osc.frequency.setValueAtTime(freq, now);
  osc.frequency.exponentialRampToValueAtTime(Math.max(60, freq*0.6), now+duration);
  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(vol, now+0.005);
  gain.gain.exponentialRampToValueAtTime(0.0001, now+duration);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(now); osc.stop(now+duration+0.01);
}
const SFX = {
  play:   () => clickSound(720, 0.06, 0.07),
  pause:  () => clickSound(520, 0.06, 0.07),
  repeat: () => clickSound(900, 0.04, 0.06),
  loopOn: () => { clickSound(620, 0.05, 0.06); setTimeout(() => clickSound(820, 0.05, 0.06), 60); },
  loopOff:() => { clickSound(820, 0.05, 0.06); setTimeout(() => clickSound(520, 0.05, 0.06), 60); },
  starOn: () => { clickSound(880, 0.05, 0.07); setTimeout(() => clickSound(1100, 0.08, 0.06), 70); },
  starOff:() => clickSound(500, 0.06, 0.05),
  gotIt:  () => { clickSound(700, 0.05, 0.07); setTimeout(() => clickSound(1050, 0.1, 0.06), 60); },
  needWork:() => { clickSound(420, 0.07, 0.07); setTimeout(() => clickSound(340, 0.12, 0.06), 70); },
  tool:   () => clickSound(400, 0.05, 0.05),
  tap:    () => clickSound(560, 0.04, 0.045),
  fling:  () => clickSound(480, 0.08, 0.05),
  toggle: () => clickSound(480, 0.05, 0.05),
  scrub:  () => clickSound(640, 0.03, 0.03),
};

// ==================================================================
// Load
// ==================================================================

async function loadAll(){
  try {
    // PERF: only data.json + the TTS manifest are fetched at boot. The old
    // build also did fetch(PROD_URL) — the page's OWN directory — and regexed
    // the 665KB HTML for a `var audioCache={...}` block that does not exist in
    // this build (audioCache is fully populated from tts_manifest.json below).
    // That re-downloaded the whole page on the boot critical path (a no-cache
    // 304 round-trip, or a full 665KB transfer on a changed edge) and competed
    // with the YouTube stream + word-clip warm on cellular. Removed.
    const [dataR, manifestR] = await Promise.all([
      fetch(SONG_DATA_URL),
      fetch('./tts_manifest.json?v=f6a4f233').catch(() => null)
    ]);
    songData = await dataR.json();
    let src, raw;
    if (songData.apple_lyrics){ src = 'apple'; raw = songData.apple_lyrics; }
    else if (songData.lrclib_lyrics){ src = 'lrclib'; raw = songData.lrclib_lyrics; }
    else { throw new Error('data.json missing apple_lyrics or lrclib_lyrics'); }
    // Fallback: build audioCache from tts_manifest.json for songs that
    // don't have an inline var audioCache={} block baked in. Without this,
    // every speakJP/speakEN call falls through to browser TTS synthesis.
    if (manifestR && manifestR.ok){
      try {
        const manifest = await manifestR.json();
        // 4jiox4 build: filenames in this manifest are full relative paths
        // (e.g. "audio/jp/word_v1_yogoreta.mp3") pointing at bundled clips
        // inside this song directory. Fully local + MLX:
        //   JP   = Irodori-TTS-500M v3 (8-bit), male clone via
        //          voice_matsukaze.wav reference. Switched from Qwen
        //          because Qwen rushed short words (~0.18 s/mora,
        //          producing "nanb" perception) and its speed param
        //          didn't actually slow render. Irodori on the same
        //          reference paces correctly (~0.22 s/mora) and gives
        //          a natural male timbre. Tail-padded 200ms via apad.
        //   EN   = Kokoro-82M (am_michael, 0.95×) with inline JP
        //          segments rendered by Irodori (same male clone) and
        //          ffmpeg filter_complex concat — sample-accurate.
        // Don't prepend a base URL and don't URI-encode — slashes are
        // intentional.
        manifest.forEach(entry => {
          if (!Array.isArray(entry) || entry.length < 4) return;
          const [lang, speakText, , filename] = entry;
          if (!lang || !speakText || !filename) return;
          const key = `${lang}:${speakText}`;
          if (!audioCache[key]) audioCache[key] = filename;
        });
      } catch(e){ console.warn('tts_manifest load failed', e); }
    }

    const sections = songData.sections || [];
    sections.forEach(sec => {
      // r2txev: mutate originals to add sectionId — _vocabSorted references
      // (used by collectStudyWords) need to carry sectionId so renderWordGrid
      // can build the timingKey ${sectionId}/${rom} for pitch alignment lookup.
      (sec.words || []).forEach(w => { w.sectionId = sec.id; wordsFlat.push({...w, section: sec.name, sectionId: sec.id}); });
      sec._vocabSorted = [...(sec.words || [])].filter(w => w.jp).sort((a,b) => b.jp.length - a.jp.length);
    });
    globalVocabSorted = wordsFlat.filter(w => w.jp).sort((a,b) => b.jp.length - a.jp.length);

    lines = (src === 'apple') ? normalizeApple(raw) : normalizeLrclib(raw);
    lines.forEach((ln, i) => {
      if (ln.instrumental || !ln.text){ ln.section = null; ln.studyWords = []; ln.romajiParts = []; return; }
      ln.section = matchLineToSection(ln.text, sections);
      const primary = ln.section ? ln.section._vocabSorted : [];
      if (!ln.tokens || !ln.tokens.length){

// re-inserting a whitespace token wherever `text` has a space between them — so a

// one run-together string (creep hype has no English so it never hit this; only
// songs with English lyric lines did). Japanese lines (no spaces) are unchanged.

      // not have proper space"); between two Japanese words Apple's phrasing space

// Mouse-only horizontal drag-to-scroll helper. Touch already scrolls
// natively when the element has overflow-x:auto. If the mouse moves
// more than 4px while held, we treat it as a drag: scroll the content
// and install a one-shot capture-phase click blocker so the resulting
// mouseup→click doesn't fire the tap handler. The blocker self-removes
// after 100ms in case no click follows.
function attachDragScroll(el){
  let isDown = false, startX = 0, scrollLeft = 0, dragged = false;
  el.addEventListener('mousedown', e => {
    isDown = true; dragged = false;
    startX = e.pageX; scrollLeft = el.scrollLeft;
  });
  el.addEventListener('mousemove', e => {
    if (!isDown) return;
    const dx = e.pageX - startX;
    if (!dragged && Math.abs(dx) > 4) dragged = true;
    if (dragged){
      el.scrollLeft = scrollLeft - dx;
      e.preventDefault();
    }
  });
  function end(){
    if (dragged){
      const blocker = (ev) => {
        ev.stopImmediatePropagation();
        ev.preventDefault();
        window.removeEventListener('click', blocker, true);
      };
      window.addEventListener('click', blocker, true);
      setTimeout(() => window.removeEventListener('click', blocker, true), 100);
    }
    isDown = false; dragged = false;
  }
  el.addEventListener('mouseup', end);
  el.addEventListener('mouseleave', end);
}

                 card with its steps (initHowtoCards). Keeps this view SHORT so the
                 bottom toolbar never floats over scrolling text. -->
            <div class="howto-menu">
              <button type="button" class="howto-sec" data-howto="lyrics"><span class="howto-sec-label">Karaoke</span><svg class="ui-icon howto-sec-arrow" aria-hidden="true"><use href="#i-chevron-right"/></svg></button>
              <button type="button" class="howto-sec" data-howto="modes"><span class="howto-sec-label">Sing Mode and Study Mode</span><svg class="ui-icon howto-sec-arrow" aria-hidden="true"><use href="#i-chevron-right"/></svg></button>

              <button type="button" class="howto-sec" data-howto="more"><span class="howto-sec-label">Immerse</span><svg class="ui-icon howto-sec-arrow" aria-hidden="true"><use href="#i-chevron-right"/></svg></button>
            </div>

    const mm = Math.floor(ln.t/60);
    const ss = (ln.t - mm*60).toFixed(1);
    const timeStr = `${mm}:${ss.padStart(4,'0')}`;
    const sec = ln.section;

    const frontText = ln.instrumental ? instrumentalLyric() : renderTokens(ln.tokens);
    const studyHtml = (ln.studyWords||[]).length

    const romajiHtml = renderRomaji(ln.romajiParts);
    const romajiCls = romajiHtml ? 'has-romaji' : '';
    // Explainer (learner redesign): explain THIS line, not just the verse. Prefer
    // the line-level explanation; fall back to the section overview when a line
    // has no entry. The verse-level context still shows in the section-brief above.
    const _lineExplain = (typeof LINE_EXPLAIN !== 'undefined') ? (LINE_EXPLAIN[lineTrKey(ln.text)] || '') : '';
    // Earned Explainer (pedagogy spec): only lines whose meaning exceeds the
    // displayed translation carry one. No section-intro fallback — an empty
    // explainerSpeak means NO pill (a pill that always exists must always say
    // something, which forces padding).
    const explainerSpeak = _lineExplain || '';
    const briefHtml = (sec && sec.speak_en) ? `
      <div class="section-brief">

    const starBtn = ln.instrumental ? '' : `

    const gearBtn = `
      <button class="card-gear" data-action="card-settings" aria-label="card display options">

      </button>`;

    card.innerHTML = `
      <div class="rate-stamp rate-stamp--got">✓ GOT IT</div>
      <div class="rate-stamp rate-stamp--need">⚠ NEED WORK</div>
      <div class="card-inner">
        <div class="card-face front">
          ${gearBtn}
          ${starBtn}
          <div class="card-meta">
            ${sectionLabel ? `<span class="card-section">${escapeHtml(sectionLabel)}</span>` : ''}
            <span class="card-idx">${i+1}/${lines.length}</span>
            <span class="card-time">${timeStr}</span>
          </div>
          <div class="card-text-wrap">
            <div class="card-text"><span class="lyric-layer lyric-layer--upcoming" aria-hidden="true">${frontText}</span><span class="lyric-layer lyric-layer--sung">${frontText}</span></div>
            <div class="card-romaji ${romajiCls}"><span class="rom-layer rom-layer--upcoming" aria-hidden="true">${romajiHtml}</span><span class="rom-layer rom-layer--sung">${romajiHtml}</span></div>
            <div class="card-en-row ${ln.enInline ? 'has-en' : ''}" data-speak="${escapeAttr(ln.enInline || '')}" data-en-parts="${escapeAttr(JSON.stringify(ln.translationSpeakParts || []))}" data-drill="${escapeAttr(JSON.stringify(ln.drillParts || []))}">${escapeHtml(ln.enInline || '')}</div>

        </div>
        <div class="card-face back" data-explain="${escapeAttr(explainerSpeak)}">

            <span class="card-time" style="margin-left:auto">${timeStr}</span>
          </div>
          ${briefHtml}
          <div class="study-wrap">${studyHtml}</div>
          <div class="card-translation labeled-pill ${(ln.translation || explainerSpeak) ? 'has-translation' : ''}" data-speak="${escapeHtml(ln.translation || '')}" data-en-parts="${escapeAttr(JSON.stringify(ln.translationSpeakParts || []))}" data-drill="${escapeAttr(JSON.stringify(ln.drillParts || []))}"><span class="pill-label">Word by Word</span></div>

    stack.appendChild(card);
  });

  // pccqv1 — the owner reports "nothing happens" on iOS tap. The .card stage
  // has a touchstart/touchmove/touchend gesture handler (line 8547+) that
  // tracks swipe-vs-tap and consumes touches it interprets as swipes. On
  // iOS, if the gesture handler ends with the touch interpreted as a
  // swipe, the synthesized `click` event never reaches us.
  //
  // Fix: bind on `touchend` directly with CAPTURE phase so we fire BEFORE
  // the parent stage handler decides what to do. Also keep `click` as a
  // fallback for desktop. Tiny dedupe so we don't fire twice when both
  // touchend + click both make it through.
  // Also: REMOVED the duplicate speakFn call. expandPitchRow plays audio
  // via the overlay — calling speakFn too made two sounds at once.
  const _attachPitchExpand = (el, lang) => {
    let _lastFire = 0;
    const fire = (e, src) => {
      const now = Date.now();
      if (now - _lastFire < 400) return; // dedupe touch+click double-fire
      _lastFire = now;
      try { e.stopPropagation(); } catch(_){}
      try { e.stopImmediatePropagation(); } catch(_){}
      try { e.preventDefault(); } catch(_){}
      try { SFX.tap(); } catch(_){}
      const row = el.closest('.word-row');
      _showPitchToast('tap (' + src + '): ' + (row && row.dataset.pitchKey || '?'));
      try { expandPitchRow(row, lang); }
      catch(err) { _showPitchToast('expand err: ' + err.message); console.error('expandPitchRow', err); }
    };
    // CAPTURE phase touchend — fires before parent stage handler consumes it.
    // Gate to actual taps (touchstart→touchend with < 10px movement and < 500ms);
    // a vertical swipe over a chip should NOT open its pitch overlay.
    let _tsY = null, _tsX = null, _tsT = 0;
    el.addEventListener('touchstart', (e) => {
      const t = e.touches[0]; if (!t) return;
      _tsY = t.clientY; _tsX = t.clientX; _tsT = Date.now();
    }, { capture: true, passive: true });
    el.addEventListener('touchend', (e) => {
      if (_tsY === null) return;
      const t = e.changedTouches[0]; if (!t) { _tsY = null; return; }
      const dy = t.clientY - _tsY, dx = t.clientX - _tsX, dt = Date.now() - _tsT;
      _tsY = null;
      if (Math.abs(dy) > 10 || Math.abs(dx) > 10 || dt > 500) return; // swipe / long-press, not a tap
      fire(e, 'touch');
    }, { capture: true, passive: false });
    el.addEventListener('click',    (e) => fire(e, 'click'), { capture: true });
    // Mark the element so CSS can give visual feedback on press
    el.style.touchAction = 'manipulation';
  };
  stack.querySelectorAll('.wc-jp').forEach(el => _attachPitchExpand(el, 'jp'));
  stack.querySelectorAll('.wc-en').forEach(el => _attachPitchExpand(el, 'en'));
  // Translation tap → speak the full English line. Audio falls back to
  // browser TTS via speakEN until a recorded file is added to
  // tts_manifest.json under the key 'en-US:<translation text>'.
  stack.querySelectorAll('.card-translation.has-translation').forEach(el => {
    el.addEventListener('click', (e) => { e.stopPropagation(); SFX.tap(); speakTranslationPill(el); });
    attachDragScroll(el);
  });
  // Section blurb tap → speak section.speak_en (same path the kebab's
  // enspeak action uses). Same TTS fallback applies.
  stack.querySelectorAll('.card-section-overview.has-overview').forEach(el => {
    el.addEventListener('click', (e) => { e.stopPropagation(); SFX.tap(); speakEN(el.dataset.speak, el); });
    attachDragScroll(el);
  });
  stack.querySelectorAll('.brief-play').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation(); SFX.tap();
      if (el.classList.contains('brief-play--jp')) speakJP(el.dataset.speak, el);
      else speakEN(el.dataset.speak, el);
    });
  });
  // Favorite (.card-star) and settings gear (.card-gear) are hidden chrome now
  // (the favorites + settings subsystems were removed). The elements still
  // render — kept hidden by the baked data-chrome-* attrs — but their taps are
  // inert so nothing references the removed code.
  // Back-of-card tap routing.
  //   - Word chips speak (via their own stopPropagation handler above).
  //   - Empty area plays/pauses.
  //   - When double-tap-to-flip is configured, both actions are deferred
  //     by doubleTapWindow ms so a second tap can convert into a flip
  //     instead. This matches the front face's stage handler, which
  //     never reaches word-chip taps because they stopPropagation.
  stack.querySelectorAll('.card-face.back').forEach(face => {
    // Capture phase so we run before .wc-jp/.wc-en/.brief-play handlers
    // (which stopPropagation in bubble). On the first tap we intercept
    // and schedule the original action; on the second tap we flip.
    face.addEventListener('click', (e) => {
      if (e.target.closest('.card-btn') || e.target.closest('.card-star') ||
          e.target.closest('.card-gear') || e.target.closest('.minimap') ||
          e.target.closest('.drill-rate-row') || e.target.closest('.card-actions-tray')) return;
      // d4wg0s — desktop fix: this capture handler swallows the click on
      // back-face before our .wc-jp click listener ever runs. Catch the
      // word-chip case here and open the pitch overlay immediately,
      // bypassing the double-tap window (users don't double-tap a word
      // chip — single tap means "show me the pitch"). On iOS, our
      // capture-touchend on .wc-jp fires earlier and already handles this;
      // on desktop without touch, this branch is the only path that works.
      const wcjp = e.target.closest('.wc-jp');
      const wcen = e.target.closest('.wc-en');
      if (wcjp || wcen) {
        e.stopImmediatePropagation();
        const row = (wcjp || wcen).closest('.word-row');
        const lang = wcjp ? 'jp' : 'en';
        try { SFX.tap(); } catch(_){}
        try { _showPitchToast('tap (back-capture): ' + (row && row.dataset.pitchKey || '?')); } catch(_){}
        try { expandPitchRow(row, lang); }
        catch(err) { try { _showPitchToast('expand err: ' + err.message); } catch(_){} console.error('expandPitchRow', err); }
        return;
      }
      const card = face.closest('.card'); if (!card) return;
      const idx = parseInt(card.dataset.idx);
      if (idx !== activeLineIdx) return;
      // 732p4w: the back face no longer runs its own double-tap detector.
      // Closing the card (double-tap to go back) is owned SOLELY by the sheet
      // wrapper's handler — one detector, one window, no race. Here we only
      // fire the single-tap action, immediately (no defer). Content elements
      // speak on tap; empty card chrome is inert (its double-tap = close is
      // caught by the sheet wrapper, so a single tap must do nothing here).
      const bp = e.target.closest('.brief-play');
      const tr = e.target.closest('.card-translation.has-translation');
      const so = e.target.closest('.card-section-overview.has-overview');
      if (!bp && !tr && !so) return;  // empty chrome → inert; double-tap closes
      e.stopImmediatePropagation();
      if (bp) {
        SFX.tap();
        if (bp.classList.contains('brief-play--jp')) speakJP(bp.dataset.speak, bp);
        else speakEN(bp.dataset.speak, bp);
      } else if (tr) {
        SFX.tap(); speakTranslationPill(tr);
      } else if (so) {
        SFX.tap(); speakEN(so.dataset.speak, so);
      }
    }, true);
    // Fallback for non-double-tap flip modes (swipe-LR or none): preserve
    // the original empty-back-tap play/pause behavior. Word chips still
    // stopPropagation, so they don't reach here.
    face.addEventListener('click', (e) => {
      const card = face.closest('.card'); if (!card) return;
      const idx = parseInt(card.dataset.idx);
      if (idx !== activeLineIdx) return;
      const cfg = window.__pgGestures || {};
      if (cfg.flipTrigger === 'double-tap') return;
      togglePlayForCard(idx);
    });
  });
  stack.querySelectorAll('.card-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      // v5iiv3 — when the back face is moved into the corner sheet it no
      // longer has a .card ancestor, so fall back to the active line. Without
      // this every action button (chevron tray, play, slowdown, …) silently
      // dies in the sheet.
      const card = btn.closest('.card');
      const idx = card ? parseInt(card.dataset.idx) : activeLineIdx;
      if (idx == null || isNaN(idx)) return;
      const action = btn.dataset.action;
      // hcdyg2: the in-row book button (rightmost in the toolbar) closes the
      // study card — same effect as the floating corner book.
      if (action === 'studyclose'){ closeCards(); return; }
      // Transport actions consolidated from the (now-hidden) topbar.
      if (action === 'first' || action === 'prev' || action === 'next' || action === 'nextsection'){
        const id = ({first:'uTpFirst', prev:'uTpPrev', next:'uTpNext', nextsection:'uTpNextSection'})[action];
        document.getElementById(id)?.click();
        return;
      }
      // Chevron toggles the action-tray slide-in. Global state — every
      // card's tray syncs so opening on card N keeps the tray visible
      // when playback advances to card N+1, until the user collapses.
      if (action === 'chevron'){
        trayOpen = !trayOpen;
        document.querySelectorAll('.card-actions').forEach(a => a.classList.toggle('open', trayOpen));
        try { SFX.toggle(); } catch {}
        return;
      }
      if (action === 'play'){
        togglePlayForCard(idx);
      } else if (action === 'loop'){
        if (loopingIdx === idx){ SFX.loopOff(); setLoop(-1); }
        else {
          SFX.loopOn();
          // af3r1o — toggling repeat from INSIDE the study sheet must only ARM
          // the loop, never goToLine(play:true) (that started YouTube behind the
          // closed-looking sheet + corrupted the resume flag). The looped line is
          // the active line; closing the sheet re-anchors it and tap resumes.
          if (cardsAreOpen() || studyMode){ setLoop(idx); }
          else { setLoop(idx); goToLine(idx, {seek:true, play:true, manual:true}); }
        }
      } else if (action === 'slowdown'){
        SFX.toggle();
        playbackRate = (playbackRate < 1) ? 1 : 0.75;
        localStorage.setItem('tapLines_rate', String(playbackRate));
        applyPlaybackRate();
      } else if (action === 'share'){
        SFX.tap();
        shareLyricLine(idx, btn);
      }
    });
  });
  // Sync newly-rendered cards' trays with the global open state so
  // re-renders don't reset what the user just opened.
  if (trayOpen){
    stack.querySelectorAll('.card-actions').forEach(a => a.classList.add('open'));
  }
}

// Instrumental gaps have no lyric to reveal, so the placeholder used to just
// sit there as dead text. Give it the same VISUAL language as the karaoke
// reveal — a soft glow that travels across the letters — so the empty stage
// breathes instead of freezing. Each letter carries its index (--di) so the
// CSS wave can stagger left-to-right, like the wipe sweeping a real line.
function instrumentalLyric(){
  const word = 'instrumental';
  const letters = [...word].map((ch, i) =>
    `<span class="inst-ltr" style="--di:${i}">${ch}</span>`).join('');
  return `<span class="inst-dance" aria-label="instrumental break">`
    + `<span class="inst-note inst-note--l" aria-hidden="true">♪</span>`
    + `<span class="inst-word">${letters}</span>`
    + `<span class="inst-note inst-note--r" aria-hidden="true">♫</span>`
    + `</span>`;
}
function renderTokens(tokens){
  if (!tokens || !tokens.length) return '';
  // Per-character spans so each char can lift the moment the wipe
  // finishes passing it (rather than when the whole token starts).
  // The .tok carries --nc (number of chars) so CSS can derive each
  // char's reveal threshold from the token's --fill (set per frame
  // by updateHighlight as wipe progress 0..1). Each .tok-char carries
  // its ordinal --ci. Array.from to preserve surrogate pairs.
  return tokens.map((tok, i) => {
    const isWs = tok.ws || /^\s+$/.test(tok.text || '');
    const chars = Array.from(tok.text || '');
    const n = chars.length;
    const charsHtml = chars.map((ch, ci) =>
      `<span class="tok-char" style="--ci:${ci}">${escapeHtml(ch)}</span>`
    ).join('');
    // A whitespace token is a real word gap (English lyric lines need it); a lone
    // space collapses inside the inline-block .tok-glow, so tag it and let CSS give
    // it a reliable space width.
    return `<span class="tok${isWs ? ' tok-ws' : ''}" data-ti="${i}" style="--nc:${n}"><span class="tok-glow">${charsHtml}</span></span>`;
  }).join('');
}

// v21: card-action button registry - renderActions() assembles from cardButtons
const ACTION_BUTTONS = {
  // Transport (consolidated from the topbar). Each delegates to the
  // matching uTp* button so the existing handler logic stays canonical.
  first:       {icon: 'i-first',         label: 'back to start of song', filled: true},
  prev:        {icon: 'i-back',          label: 'previous line'},
  next:        {icon: 'i-chevron-right', label: 'next line'},
  nextsection: {icon: 'i-first',         label: 'jump to next section', filled: true, cls: 'card-btn--flip'},

  loop:     {icon: 'i-loop',    label: 'loop line continuously'},
  slowdown: {icon: 'i-turtle', label: 'slow 0.75×', filled: true, cls: 'card-btn--slow'},
  // Shares a YouTube link deep-linked to this line's timestamp.
  share:    {icon: 'i-share',   label: 'share this lyric (YouTube timestamp)'},
};
// v23: renderActions iterates cardButtons as-is (including play, which can be anywhere)
function renderActions(){
  // hcdyg2: no chevron/kebab. The toolbar is ALWAYS visible — a fixed centered
  // bottom row of uniform circular buttons (slow / loop / play / share) that
  // match the book button's style, with the book at bottom-right.
  const tray = cardButtons.map(act => {
    if (act === 'play'){
      return `<button class="card-btn primary" data-action="play" aria-label="play/pause"><svg class="ui-icon ui-icon--filled card-play-icon" aria-hidden="true"><use href="#i-play"/></svg></button>`;
    }
    const btn = ACTION_BUTTONS[act];
    if (!btn) return '';
    const cls = ['card-btn'];
    if (btn.cls) cls.push(btn.cls);
    const filled = btn.filled ? ' ui-icon--filled' : '';
    return `<button class="${cls.join(' ')}" data-action="${act}" aria-label="${btn.label}"><svg class="ui-icon${filled}" aria-hidden="true"><use href="#${btn.icon}"/></svg></button>`;
  }).join('');
  // hcdyg2: the book is the rightmost button in the SAME row (matches the
  // corner book exactly; tapping it closes the study card). The floating corner
  // book is hidden while open, so there's one book — here, in the symmetric row.
  // The studyclose control is a BACK button (owner): it steps back one level —
  // from the word card to the word grid, or from the study sheet to the song.
  // Back-arrow icon everywhere it appears.
  const book = `<button class="card-btn card-btn--studybook" data-action="studyclose" aria-label="back"><svg class="ui-icon" aria-hidden="true"><use href="#i-back"/></svg></button>`;
  return `<div class="card-actions-tray">${tray}${book}</div>`;
}
function renderRomaji(parts){
  if (!parts || !parts.length) return '';
  return parts.map((p, i) => `<span class="rom" data-ri="${i}">${escapeHtml(p.rom)}</span>`).join(' ');
}
function renderWordGrid(words){
  let html = '<div class="word-grid">';
  words.forEach(w => {
    const partCls = w.particle ? ' particle' : '';
    // Pitch-data join: look up by jp_speak (matches uid scheme used for audio)
    const pitchKey = w.jp_speak || w.jp;
    const pitchClass = pitchClassFor(pitchKey);
    // English meaning rides along as data-attrs (the pitch overlay's back
    // face reads them) — we no longer render a separate blue EN tile, since
    // the meaning now lives on the flip side of the pitch card.
    const rowAttrs = `data-pitch-key="${escapeAttr(pitchKey)}" data-rom="${escapeAttr(w.rom||'')}" data-uid="${escapeAttr(w.uid||'')}" data-particle="${w.particle ? '1' : ''}" data-section-id="${escapeAttr(w.sectionId||'')}" data-en="${escapeAttr(w.en||'')}" data-en-hint="${escapeAttr(w.hint||w.section||'')}" data-en-speak="${escapeAttr(w.en_speak||w.en||'')}" data-en-context="${escapeAttr(w.context||'')}"`;
    html += `
      <div class="word-row word-row--jp-only ${pitchClass}" ${rowAttrs}>
        <div class="wc wc-jp${partCls}" data-speak="${escapeAttr(w.jp_speak || w.jp)}">
          <div class="wc-main">${escapeHtml(w.jp)}</div>
          <div class="wc-sub">${escapeHtml(w.rom || '')}</div>
        </div>
      </div>`;
  });
  html += '</div>';
  return html;
}
// === Pitch integration · uyrjr7 build ============================
// Look up which accent type a JP word has — drives the underline color
// on the back-face vocab row. Falls back to 'unknown' when pitch data
// hasn't loaded or doesn't have an entry. PITCH_DATA / PITCH_TIMING are
// populated by loadPitchData() on first card render.
let PITCH_DATA = null;     // pitch_data/pitch.json — accent type lookup
let PITCH_TIMING = null;   // pitch_data/timing.json — per-mora boundaries
let pitchLoadPromise = null;

function loadPitchData(){
  if (pitchLoadPromise) return pitchLoadPromise;
  pitchLoadPromise = Promise.all([
    fetch('pitch_data/pitch.json').then(r => r.ok ? r.json() : null).catch(() => null),
    fetch('pitch_data/timing.json').then(r => r.ok ? r.json() : null).catch(() => null),
  ]).then(([p, t]) => { PITCH_DATA = p || {}; PITCH_TIMING = t || {}; refreshPitchClasses(); });
  return pitchLoadPromise;
}

function pitchClassFor(jpKey){
  if (!PITCH_DATA) return 'pitch-pending';
  const p = PITCH_DATA[jpKey];
  if (!p) return 'pitch-unknown';
  if (p.confidence === 'kansai') return `pitch-${p.accent_type} pitch-kansai`;
  return `pitch-${p.accent_type}`;
}

// When pitch data finishes loading after grid is already in the DOM,
// re-apply the accent classes so the underlines appear.
function refreshPitchClasses(){
  document.querySelectorAll('.word-row[data-pitch-key]').forEach(row => {
    const key = row.dataset.pitchKey;
    // Strip prior pitch-* classes
    row.className = row.className.split(' ').filter(c => !c.startsWith('pitch-')).join(' ');
    row.classList.add(...pitchClassFor(key).split(' '));
  });
}

loadPitchData();

// Share a deep-link to this lyric line. URL is the YouTube watch URL with
// ?t=<seconds> floored to the line's start, so the recipient lands a beat
// before the line is sung. Uses the Web Share sheet when available, falls
// back to copying the URL to the clipboard. Briefly swaps the button icon
// to a check as visual feedback either way.
function shareLyricLine(idx, btn){
  const ln = lines[idx]; if (!ln) return;
  const ytId = (typeof songData !== 'undefined' && songData && songData.youtube_id) || YT_ID;
  const t = Math.max(0, Math.floor(ln.t || 0));
  const url = `https://youtu.be/${ytId}?t=${t}`;
  const titleJp = (songData && songData.title_jp) || '';
  const titleEn = (songData && songData.title_en) || '';
  const artist  = (songData && songData.artist) || '';
  const lyric   = (ln.text || '').trim();
  const songLabel = [titleJp || titleEn, artist].filter(Boolean).join(' — ');
  const text = lyric
    ? (songLabel ? `“${lyric}” — ${songLabel}` : `“${lyric}”`)
    : (songLabel || 'Manaoke');
  const flashCheck = () => {
    const useEl = btn && btn.querySelector('use'); if (!useEl) return;
    const orig = useEl.getAttribute('href');
    useEl.setAttribute('href', '#i-check');
    setTimeout(() => useEl.setAttribute('href', orig), 1200);
  };
  if (navigator.share){
    navigator.share({title: songLabel || 'Manaoke', text, url}).then(flashCheck).catch(() => {});
    return;
  }
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(flashCheck).catch(() => {
      window.prompt('Copy this link:', url);
    });
    return;
  }
  window.prompt('Copy this link:', url);
}

// Flat lyric-list row pitch. Lines are uniform-height rows stacked this far
// apart (centre-to-centre); the active line sits at stage centre with lines
// above and below, fading out by distance. (Was 180 with an oversized active
// card — that overlapped neighbours and collided while scrolling.)
const SPACING_Y = 88;

// Native-scroll lyric list is active whenever we're in Sing mode and not in
// the (legacy, now-unreachable) flipped study view. Queried fresh to dodge
// the U_APP const's temporal-dead-zone during early init.
function inSingList(){
  const a = document.querySelector('.u-app');
  return !!a && a.dataset.currentMode === 'sing' && !studyMode;
}

// User-scroll guard: while the finger (or wheel) is driving the scroll, pause
// the per-frame karaoke work (see updateHighlight) so it can't contend with the
// scroll. The list NEVER auto-follows playback — a tap plays the exact line and
// the view only ever moves when you move it. (No follow modes, no pills.)
let _userScrolling = false, _userScrollTimer = null;
function _markUserScroll(holdMs){
  _userScrolling = true;
  clearTimeout(_userScrollTimer);
  _userScrollTimer = setTimeout(() => { _userScrolling = false; }, holdMs || 350);
}
/* R36 (owner): the depth-of-field blur lifts WHILE the user scrolls and eases back
   when the current line re-focuses. Driven off real scroll MOVEMENT (engage past
   threshold / wheel / momentum glide) — deliberately NOT touchstart, so a plain
   tap-to-play doesn't flicker the blur. Toggles .user-scrolling on the sing
   section; the CSS filter transition handles the glide off and back on. The
   engine's auto-follow never calls this, so playback alone never lifts the blur. */
let _uScrollVisTimer = null;
function _markUserScrollVisual(holdMs){
  const sec = document.querySelector('.u-mode-section[data-mode="sing"]');
  if (sec) sec.classList.add('user-scrolling');
  clearTimeout(_uScrollVisTimer);
  _uScrollVisTimer = setTimeout(() => {
    const s = document.querySelector('.u-mode-section[data-mode="sing"]');
    if (s) s.classList.remove('user-scrolling');
  }, holdMs || 550);
}

// Set the native scroll container's centring padding so the first and last
// lines can sit at stage centre. Called on init / resize / mode-enter.
function setupLyricScrollPadding(){
  const stack = document.getElementById('cardStack');
  if (!stack || !inSingList()) return;
  // Rows are auto-height now (Apple-style wrapped slots) — measure a real row
  // instead of assuming the old fixed 88px pitch.
  const probe = stack.querySelector('.card:not(.intro)') || stack.querySelector('.card');
  const rowH = probe ? probe.offsetHeight : 110;
  const pad = Math.max(0, (stack.clientHeight - rowH) / 2);
  stack.style.paddingTop = pad + 'px';
  stack.style.paddingBottom = pad + 'px';
}

// Load-time resting scroll. The intro is line 0, so at scrollTop 0 the centering
// padding parks it in the focus band with a big empty void above it. Instead,
// rest the initial view near the top so the song's first lines fill the screen
// (a tap or playback then re-centers as normal). Load-only: we don't override
// this once the user has scrolled/played.
function setIntroLoadScroll(){
  const stack = document.getElementById('cardStack');
  if (!stack || !inSingList()) return;
  const padTop = parseFloat(stack.style.paddingTop) || 0;
  const gap = Math.round(stack.clientHeight * 0.13);   // intro top, below the stage top
  const maxTop = Math.max(0, stack.scrollHeight - stack.clientHeight);
  stack.scrollTop = Math.max(0, Math.min(maxTop, padTop - gap));
}

// One-time wiring for the native lyric scroll: detect when the USER is driving
// the scroll (so playback-follow stands down), and keep the centring padding
// correct on resize. The #cardStack element persists across renderCardStack
// (only its innerHTML changes), so these bind once.
let _lyricScrollWired = false;
function initLyricScroll(){
  if (_lyricScrollWired) return;
  const stack = document.getElementById('cardStack');
  if (!stack) return;
  _lyricScrollWired = true;

  // down). CRITICAL: do NOT write scrollTop here. Writing scrollTop inside a
  // touchstart on a -webkit-overflow-scrolling container is a known iOS bug
  // that freezes the FIRST swipe ("double tap to scroll"). Auto-follow is now
  // instant (no animation to cancel), so there is nothing to grab.

  stack.addEventListener('touchmove',  () => _markUserScroll(450), { passive:true });
  stack.addEventListener('wheel',      () => { _markUserScroll(500); _markUserScrollVisual(550); }, { passive:true });

  // unthrottled resize listeners — padding, fit, wipe-geom — that each fired the
  // full storm many times/sec during the mobile URL-bar show/hide). Order is the
  // only constraint: scroll padding before the text fit.
  let _resizeRaf = 0;
  window.addEventListener('resize', () => {
    if (_resizeRaf) return;
    _resizeRaf = requestAnimationFrame(() => {
      _resizeRaf = 0;
      setupLyricScrollPadding();
      fitAllCardText();
      invalidateWipeGeom();

      // geometry; while playing the follow loop self-heals, so only step in when
      // paused/idle. Same rule as the translation toggle + closeCards re-settle.
      if (typeof inSingList === 'function' && inSingList() &&

  // race and no double-drive: every gesture is handled here, deterministically.

  // readable), so this path is finally testable headless.

      // scroll, and the tap that follows should NOT also play a line — you just
      // grabbed the moving list. The click handler consumes this flag. A touch
      // that starts while the list is already at rest sets it false, so a normal
      // tap on a still list plays the line as before.

        startX: t ? t.clientX : null,
        t0: tn,

        topTrail: [stack.scrollTop],
        followAtStart: fw,
        engagedAtMove: -1, engageLatencyMs: null,
        maxAbsV: 0,
        moveCount: 0,

        startActive: (typeof activeLineIdx !== 'undefined' ? activeLineIdx : null),

          hud.style.color = moved ? '#7ff5c8' : '#ffb4a0';
          hud.textContent = 'swipe #' + idx + ' ' + dir + '  ' + (moved ? 'SCROLLED ✓' : 'NO MOVE ✗')
            + '\nΔ=' + deltaSettled + ' v=' + relV + ' eng@' + cur.engagedAtMove
            + '\nprev=' + cur.prevDir + '/' + cur.prevMoved + ' gap=' + cur.gapMs + ' sinceFollow=' + cur.msSinceLastFollow
            + '\nyt=' + cur.ytState + ' play=' + cur.playing;
