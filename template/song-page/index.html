<!-- Belt-and-suspenders HTTPS enforcement. _headers + Cloudflare's
     "Always Use HTTPS" setting are the proper layers; these are
     in-page fallbacks for browsers that loaded an http:// bookmark
     before the network edge can redirect. -->
<meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
<script>if(location.protocol==='http:'){location.replace('https:'+location.href.slice(5));}</script>
<!-- Per-build storage nuke. Every generated slug is treated as a fresh world.
     localStorage/cookies are keyed by ORIGIN (manaoke.app), not the URL path, so
     a new slug alone does NOT isolate them — settings/progress silently carry
     across every build (this is what stranded a stale scroll-mode setting). On
     the first load of a slug we've never stamped, wipe localStorage,
     sessionStorage, and any JS-readable first-party cookies, then stamp this
     slug so reloads of the SAME build keep their state. Must run before any
     code reads storage, so it lives here at the top of <head>. Cloudflare
     HttpOnly cookies (__cf_bm/cf_clearance) aren't set on this site and can't be
     touched from JS anyway — they're infra, not app state, so leaving them is
     correct. Carried forward automatically by `cp -R` into every future build. -->
<script>
(function(){
  try {
    var m = location.pathname.match(/SONG_FAMILY-[a-z0-9]+/);
    var BUILD = m ? m[0] : location.pathname;
    if (localStorage.getItem('manaoke_build') !== BUILD) {
      var KEEP = [];   /* nothing survives the per-build nuke */
      var saved = {};
      try { KEEP.forEach(function(k){ var v = localStorage.getItem(k); if (v !== null) saved[k] = v; }); } catch(e){}
      try { localStorage.clear(); } catch(e){}
      try { Object.keys(saved).forEach(function(k){ localStorage.setItem(k, saved[k]); }); } catch(e){}
      try { sessionStorage.clear(); } catch(e){}
      try {
        document.cookie.split(';').forEach(function(c){
          var k = c.split('=')[0].trim();
          if (k) document.cookie = k + '=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/';
        });
      } catch(e){}
      try { localStorage.setItem('manaoke_build', BUILD); } catch(e){}
    }
  } catch(e){}
})();
</script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
/* ============================================================
   ROUND 13 — "THE BOX" tokens (FINAL-DESIGN §3)
   A 1989 Japanese karaoke room: LD screen + denmoku remote +
   paper songbook + dark room. Four artifacts, one room. These
   tokens are the material vocabulary; older chrome / lab /
   pastel vars are re-pointed at them downstream.
   ============================================================ */
:root{
  /* ROOM */
  --room-black:#0B0A10; --room-wall:#15121E; --room-line:#2B2438;
  /* SCREEN (LD monitor) */
  --screen-navy:#071A63;        /* flat matte where text lives */
  --screen-cobalt:#1240C4;      /* top bloom ONLY, never behind text */
  --screen-vignette:#02103B;    /* corners, >=1em from glyphs */
  /* CAPTIONS (karaoke telop) */
  --lyric-sung-gold:#FFD23F;    /* sung gold, 10.9:1 on navy */
  --lyric-sung-stroke:rgba(0,0,0,.82);  /* active line only — BLACK sticker outline (amedqe: was red #C7321E) */
  --lyric-sung-shadow:#000;  /* hard drop — BLACK (amedqe: was #4A0E08) */
  /* amedqe — UNIFIED "embossed sticker" ink (the giant-katakana treatment generalised):
     a black outline + hard black drop, expressed in EM so the same rule scales down on
     small text instead of muddying it. Outline rides paint-order:stroke-fill (fill covers
     the inner half → ~half-width effective, counters stay open). */
  --ink-stroke:rgba(0,0,0,.82);  --ink-drop:#000;
  --ink-stroke-w:.06em;          --ink-drop-y:.07em;
  --ink-stroke-w-sm:.05em;       --ink-drop-y-sm:.06em;  /* romaji / secondary mono */
  --lyric-ghost:#737CB0;        /* upcoming periwinkle, no stroke */
  --lyric-rom-sung:#FFD23F;
  --lyric-rom-ghost:#A9B2D8;
  --lyric-glow:rgba(225,236,255,.18);  /* THE ONLY BLUR IN THE APP */
  --lyric-bright:#F4F6FF;       /* headers/telop/intro */
  /* DENMOKU (graphite remote, amber LCD) */
  --den-body:#1E2228; --den-hi:#3A424D; --den-lo:#0C0E12;
  --den-lcd:#0F1206; --den-amber:#FFB000; --den-amber-ghost:rgba(255,176,0,.16);
  --den-red:#FF3B30;
  /* SONGBOOK (paper) */
  --paper:#F4EDDC; --paper-shade:#E5DCC4; --paper-ink:#26221A; --paper-rule:#C9BFA4;
  /* ROLES (LAW — two grades). Dark surfaces: */
  --role-jp:#B794F6; --role-en:#60A5FA; --role-prt:#FBBF24;
  /* Paper inks: */
  --role-jp-ink:#4C2691; --role-en-ink:#2563EB; --role-prt-ink:#9A4A00;
  /* GEOMETRY */
  --grid:8px; --r-key:8px; --r-lcd:4px; --r-bezel:12px; --travel:2px;
  /* FONT ROLES */
  --f-voice:'M PLUS Rounded 1c','Hiragino Sans',sans-serif;  /* every learner-read glyph */
  --f-dot:'DotGothic16',monospace;                            /* LCD/LED wells only */
  --f-mono:ui-monospace,'SF Mono',Menlo,monospace;            /* romaji + incidental code */
  --f-ui:-apple-system,'Hiragino Sans',system-ui,sans-serif;  /* incidental UI */
  --f-caption:clamp(1.9rem,8vw,2.3rem);                       /* active sing line size */
}
:root{
  --bg:#08080b;--surface:#111116;--surface2:#18181f;--surface3:#1f1f28;
  --border:#252532;--border-light:#2e2e3e;
  --text:#e2e2e8;--text-muted:#8888a0;--text-dim:#5c5c72;
  --accent:#e63946;--accent-dim:#a12734;
  --blue:#60a5fa;--green:#6ee7b7;--orange:#fbbf24;--teal:#5eead4;
  --red:#f87171;--pink:#f0abfc;--pink-dim:#c26ecf;
  --lab:#c4b5fd;--lab-dim:#8b7dcf;--gold:#fbbf24;
  --mint:#7ff5c8;
  --paper-texture:none;
  /* Dark-mode defaults for every lyric/card/text/button var. Tweaker
     sliders mutate these inline on :root, so they now affect dark mode
     too (previously the dark-mode rules were hardcoded and ignored the
     vars entirely). Light theme overrides a subset below. */
  --lyric-upcoming:#ffffff;
  --lyric-upcoming-alpha:75%;
  --lyric-upcoming-glow:#c4b5fd;
  --lyric-upcoming-glow-intensity:0%;
  --lyric-upcoming-glow-blur:0em;
  --lyric-wipe-sung:#ffffff;
  --lyric-wipe-trail:#FFD23F;
  --lyric-wipe-trail-alpha:30%;
  /* Round 13: the leading-edge backlight is amber (--lyric-glow), the
     only blur permitted in the app. */
  --lyric-wipe-glow:#eaf1ff;
  --lyric-wipe-glow-intensity:55%;
  --lyric-wipe-glow-blur:.12em;
  --lyric-wipe-fade-start:.3em;
  --lyric-wipe-fade-end:.2em;
  --lyric-sung:#ffffff;
  --lyric-rom-singing:#ffffff;
  --lyric-rom-sung:#ffffff;
  --lyric-rom-sung-alpha:36%;
  --lyric-rom-scale:1.08;
  --rom-singing-shadow-blur:10px;
  --rom-singing-shadow-color:rgba(196,181,253,.7);
  /* Active-line readability pins (dark default). The lyric tweaker
     panel doesn't know these names, so localStorage can't recolour
     them. Light theme overrides below flip them to dark-on-light.
     Upcoming alphas are low enough to read as visibly translucent
     so the karaoke wipe to 100% is a perceptible reveal, not a
     subtle shade shift. */
  /* Round 13: caption colors (FINAL-DESIGN §3). Sung gold, ghost
     periwinkle, romaji gold/periwinkle. The paused-raise vars are
     deleted (their consuming rules were removed for pause=freeze). */
  /* Round 14 (owner, 2026-06-13): pure white-alpha captions, Apple-Music
     model — no gold, no periwinkle. Unsung-in-current-line is a dim white
     ghost; the sung sweep just brightens it to full. Same hue throughout,
     so a syllable lights up rather than swapping colour.
     x7tzqy (owner): these were translucent white, so over the living-gradient
     field (and the layer sitting behind) each glyph read as TWO tones — the
     fill plus the field bleeding through. Now OPAQUE flat colours: sung = one
     solid white, upcoming = one solid grey. No see-through, single colour per
     state; the wipe is a clean white<->grey swap, still clearly legible. */
  --lyric-pin-upcoming:#b0acb8;
  --lyric-pin-sung:#ffffff;
  --lyric-pin-rom-upcoming:#aaa6b4;   /* 8lz054 (owner): romaji brighter for readability (was #96929e), still under kanji-upcoming */
  --lyric-pin-rom-sung:#f4f2f8;       /* near-white sung romaji (was #e8e6ee) */
  --text-font:var(--f-voice);
  --text-size:1;
  --text-weight:700;
  --text-tracking:.01em;
  --text-shadow1-x:0px;--text-shadow1-y:0px;--text-shadow1-color:transparent;
  --text-shadow2-x:0px;--text-shadow2-y:0px;--text-shadow2-color:transparent;
  /* Round 13: each study card is a small LD monitor — navy screen front,
     room-wall back, 2px den-body bezel at radius 12, hard offset shadow
     (no soft Gaussian, no lavender tint). */
  --card-bg:var(--screen-navy);
  --card-back-bg:var(--room-wall);
  --card-border:var(--den-body);
  --card-border-w:2px;
  --card-radius:12px;
  --card-shadow-x:0px;--card-shadow-y:4px;--card-shadow-blur:0px;
  --card-shadow-color:#000;
  --card-halo:0 0 0 1px var(--den-lo);
  --card-active-tint:var(--screen-cobalt);
  --card-active-intensity:18%;
  --card-active-angle:180deg;
  /* ===== Round-12 motion tokens (FINAL-SPEC §H) =====
     Every animation on the page draws from this small system. Durations
     scale with distance/size, never importance. --ease-out for arrivals,
     --ease-in for exits, --ease-in-out for on-screen moves, springs only
     for large-surface spatial moves (sheet, word card, flip, line rise). */
  --dur-instant:80ms;
  --dur-fast:160ms;
  --dur-std:280ms;
  --dur-gentle:440ms;
  --dur-lyric:650ms;
  --ease-out:cubic-bezier(0.2,0.7,0.2,1);
  --ease-in:cubic-bezier(0.45,0,0.85,0.3);
  --ease-in-out:cubic-bezier(0.45,0.05,0.2,1);
  --ease-lift:cubic-bezier(0.33,0,0.25,1);
  /* Spring fallbacks (older WebKit) — real linear() solutions below. */
  --spring-pop:cubic-bezier(0.30,1.15,0.35,1);
  --spring-gentle:cubic-bezier(0.25,0.80,0.25,1);
  /* Romaji wipe feather (subordinate layer: softer lead than JP). */
  --rom-wipe-fade-start:.04em;
  --rom-wipe-fade-end:.16em;
}
@supports (transition-timing-function: linear(0, 1)) {
  :root{
    /* zeta=0.74 omega0=16, 3.1% overshoot — pair with 460ms */
    --spring-pop:linear(0, 0.0563 5%, 0.1864 10%, 0.3459 15%, 0.5059 20%,
      0.6498 25%, 0.7694 30%, 0.8626 35%, 0.9308 40%, 0.9775 45%, 1.007 50%,
      1.0233 55%, 1.0304 60%, 1.0314 65%, 1.0287 70%, 1.0242 75%, 1.0191 80%,
      1.0141 85%, 1.0098 90%, 1.0063 95%, 1);
    /* critically damped omega0=16 — pair with 500ms */
    --spring-gentle:linear(0, 0.0902 6.2%, 0.2642 12.5%, 0.4422 18.8%,
      0.594 25%, 0.7127 31.2%, 0.8009 37.5%, 0.8641 43.8%, 0.9084 50%,
      0.9389 56.2%, 0.9596 62.5%, 0.9734 68.8%, 0.9826 75%, 0.9887 81.2%,
      0.9927 87.5%, 0.9953 93.8%, 1);
  }
}
/* Light (paper) theme — "the box at opening time" (FINAL-DESIGN §8).
   The room goes pale, the denmoku goes brushed silver, but THE SCREENS
   ARE ALWAYS ON: lyric stage / intro / word-card front / drill keep the
   identical navy+cobalt screen and gold/periwinkle captions — so the
   lyric pins are NOT flipped here (zero lyric regression by construction). */
/* ============================================================
   ROUND 13 — MATERIAL RECIPES (FINAL-DESIGN §4). The only five.
   Reusable classes for the four artifacts. SHADOW LAW: every
   shadow is a hard offset (0 Npx 0 solid); the lyric glow strip
   is the ONLY blur in the app.
   ============================================================ */
/* 1 · LD SCREEN — lyric stage, intro card, word-card front, drill */
.ld-screen{
  position:relative;
  background:
    radial-gradient(120% 220px at 50% -60px, var(--screen-cobalt), transparent 70%),
    var(--screen-navy);
}
.ld-screen::after{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(140% 120% at 50% 45%, transparent 62%, var(--screen-vignette) 100%);
}
/* 2 · KARAOKE CAPTION — sung-layer static treatment, ACTIVE LINE ONLY */
.cap-sung{
  font:800 var(--f-caption)/1.05 var(--f-voice);
  -webkit-text-stroke:2.5px var(--lyric-sung-stroke);
  paint-order:stroke fill;
  text-shadow:0 3px 0 var(--lyric-sung-shadow);
}
/* 3 · DENMOKU KEY — every chrome button */
.den-key{
  background:linear-gradient(180deg,#262B33,#1A1E24 55%,#14171C);
  border:1px solid var(--den-lo);
  border-radius:var(--r-key);
  box-shadow:inset 0 1px 0 var(--den-hi), 0 2px 0 #000;
  color:#E6E9EE;
  transition:none;
}
.den-key:active{
  transform:translateY(var(--travel));
  box-shadow:inset 0 1px 0 var(--den-hi);
}
/* 4 · LCD WELL — counters, mode legends, index chips */
.lcd{
  background:var(--den-lcd);
  border-radius:var(--r-lcd);
  box-shadow:inset 0 2px 6px rgba(0,0,0,.8), 0 1px 0 rgba(255,255,255,.05);
  font:.9rem/1 var(--f-dot);
  color:var(--den-amber);
}
/* 5 · SONGBOOK — study sheet paper */
.songbook{
  background:var(--paper);
  color:var(--paper-ink);
  border-radius:var(--r-bezel) var(--r-bezel) 0 0;
  box-shadow:0 -2px 0 var(--paper-shade), 0 -8px 24px rgba(0,0,0,.5);
}
/* ============================================================
   ROUND 13 — THE DENMOKU PUNCH (FINAL-DESIGN §6). Every tappable
   chrome control flashes inverse video for 100ms (steps(1)) before
   its action. A single delegated pointerdown listener (below in JS)
   adds .punch; animationend removes it. NEVER inside the lyric stage,
   never on the wipe. Two surface families:
     amber-on-black <-> black-on-amber  (den-keys / LCD / transport)
     paper <-> ink                      (songbook print rows)
   ============================================================ */
/* den-key / LCD / transport family: black-on-amber flash (amber bg, black ink). */
@keyframes denPunch{
  /* acv8v7 (owner: sitewide accent = WHITE): the tap-flash inverse-video was amber;
     now a white flash. Fires on every chrome control's tap (corner/card/transport/
     counter pills/chips). */
  0%,100%{ background:rgba(255,255,255,.92); color:#000; }
  50%{ background:rgba(255,255,255,.92); color:#000; }
}
/* songbook print row: paper <-> ink inversion. */
@keyframes paperPunch{
  0%,100%{ background-color:var(--paper-ink); color:var(--paper); }
  50%{ background-color:var(--paper-ink); color:var(--paper); }
}
.punch{ animation:denPunch 100ms steps(1) 1; }
.punch *{ color:#000 !important; fill:#000 !important; stroke:#000 !important; }
#cardSheet .card-face.back .wc.punch{ animation:paperPunch 100ms steps(1) 1; }
#cardSheet .card-face.back .wc.punch *{ color:var(--paper) !important; }
@media (prefers-reduced-motion: reduce){ .punch{ animation:none !important; } }
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
/* mana (owner): palette-derived field literals — DEFAULTS below are the reference song's
   approved look (visual no-op); assemble_page.py swaps these per-song from the
   album cover, exactly like --field-c1..hi. fb* = drifting-bloom HERO accents
   (rgb triples, used inside rgba()); base* = #livingField base-radial stops;
   body-g* = body/html safe-area gradient stops. Palette identity, NOT neutral
   chrome — keep them var-driven so every clone inherits its own cover. */
:root{
  /* GRADIENT LAB (Round 11): animation dials. Durations/amp are spliced by
     assemble_page from design.gradient (speed = divisor on these bases);
     --field-amp scales translate/rotate spans inside the keyframes.
     Parity: parity_audit stubs the --fdur dials, --field-amp, and
     data-field-motion. */
  --fdur-drift:20s; --fdur-breath:11s; --fdur-a:15s; --fdur-b:21s; --fdur-c:13s;
  --fdur-drift-sheet:22s; --field-amp:1;
  --field-fb1:194,132,159; --field-fb2:175,119,144; --field-fb3:150,102,124;
  --field-base1:#2a0f1b; --field-base2:#18080f; --field-base3:#0c0408;
  --body-g1:#3b2730; --body-g2:#4a313c; --body-g3:#2a1820; --body-g4:#160a0f;
}
html{background:var(--body-g1)}  /* seam-fix: field-dark base so Safari overscroll/toolbar never flashes a mismatched colour */
body{
  font-family:var(--f-voice);
  background:linear-gradient(180deg,var(--body-g1) 0%,var(--body-g2) 16%,var(--body-g3) 74%,var(--body-g4) 100%) fixed;color:var(--text);line-height:1.5;
  -webkit-tap-highlight-color:rgba(255,176,0,.12);
}
/* Body chrome:
   - ::before used to paint a 3%-opacity SVG fractal-noise grain on
     top of var(--bg). On dark mode that grain was visible as soft
     bands against the clean black page. Killed entirely.
   - ::after used to paint two radial-gradient glow zones (lavender
     top, pink bottom) in dark mode. Visible as horizontal seams.
     Background nulled here for dark; the light-theme override below
     re-uses ::after to paint the paper texture (kept). */
body::before{content:none}
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:-1;
  background:none;
}
/* Light theme: hide dark-only noise/glow, add paper texture */
/* Light theme: neutralize hardcoded dark overlays inside Sing/Lyric-Hero */

/* ======================================================
   Unified song page v1 - master topbar + mode router
   ====================================================== */
.u-app{
  height:100%;display:flex;flex-direction:column;overflow:hidden;
  /* mana2: the living-field palette lived only on the mode sections; the ONE shared
     #livingField sits at the app root, so the vars must be here too (it inherits). */
  --field-c1:173,87,125; --field-c2:107,54,77; --field-c3:38,30,28; --field-hi:206,103,149;
}

/* ===== mana2: ONE shared living field (no reset on lyrics⇄immerse) ============
   A single persistent fixed full-viewport field behind BOTH modes. Same element,
   same box, same animation phase in every mode → switching never shifts/resets the
   gradient. Values are the established sing-field look (verified). Animation is gated
   on .u-app[data-recessed] (set on song-play AND podcast-play) so it stays static +
   cheap when idle, in BOTH modes consistently — the field is the same node throughout,
   so even when motion starts/stops the blooms never teleport. */
#livingField{
  position:fixed; inset:0; z-index:0; display:block;
  pointer-events:none; overflow:hidden;
  background:radial-gradient(140% 130% at 50% 42%, var(--field-base1) 0%, var(--field-base2) 55%, var(--field-base3) 100%);
}
#livingField::before{
  content:''; position:absolute; inset:-22%;
  background:
    linear-gradient(160deg, rgba(var(--field-c1),.30) 0%, rgba(var(--field-c2),.24) 42%, rgba(var(--field-c3),.36) 100%),
    radial-gradient(ellipse 140% 100% at 16% 18%, rgba(var(--field-c1),.58), transparent 64%),
    radial-gradient(ellipse 160% 110% at 84% 26%, rgba(var(--field-c2),.50), transparent 60%),
    radial-gradient(ellipse 135% 98% at 38% 76%, rgba(var(--field-c1),.56), transparent 68%),
    radial-gradient(ellipse 150% 104% at 78% 82%, rgba(var(--field-c3),.54), transparent 66%),
    radial-gradient(ellipse 116% 86% at 50% 46%, rgba(var(--field-hi),.22), transparent 60%);
  animation:fieldDrift var(--fdur-drift) ease-in-out infinite, fieldBreath var(--fdur-breath) ease-in-out infinite;
  animation-play-state:paused;
  will-change:transform, opacity; opacity:.62;
}
#livingField::after{
  content:''; position:absolute; inset:0;
  background:radial-gradient(150% 108% at 50% 45%, rgba(5,3,9,.10), rgba(5,3,9,.30) 100%);
}
#livingField .fb{
  position:absolute; border-radius:50%;
  filter:blur(62px); mix-blend-mode:screen; opacity:.62;
  will-change:transform; pointer-events:none; animation-play-state:paused;
}
#livingField .fb1{
  width:80vw; height:72vh; left:-14%; top:-12%;
  background:radial-gradient(circle at 50% 50%, rgba(var(--field-fb1),.95), rgba(var(--field-fb1),0) 60%);
  animation:fbDriftA var(--fdur-a) ease-in-out infinite;
}

/* mana2 (owner): follow-along transcript. Reads under the play (top bar); each line
   lights as the podcast reaches it and the active line eases to the reading band.
   Tap a line to jump there. JP (sung) lines read in the song's voice font + accent
   so they stand apart from the hosts' English. */
.u-transcript{margin-top:20px}
.u-transcript-list{display:flex;flex-direction:column;gap:2px}
.u-tr-line{
  position:relative;display:block;width:100%;text-align:left;
  font-family:var(--f-ui);font-size:.92rem;line-height:1.5;
  color:var(--text-dim);background:transparent;border:0;border-radius:10px;
  padding:9px 12px 9px 16px;cursor:pointer;
  opacity:.5;transition:opacity .25s var(--ease-out),color .25s var(--ease-out),background .25s var(--ease-out);
  -webkit-tap-highlight-color:transparent;
}
.u-tr-line::before{
  content:'';position:absolute;left:5px;top:50%;transform:translateY(-50%);
  width:3px;height:0;border-radius:2px;background:rgb(var(--field-hi));
  transition:height .25s var(--ease-out);
}
.u-tr-line[data-spk="JP"]{font-family:var(--f-voice);font-weight:600;color:rgba(var(--field-hi),.75)}
.u-tr-line:hover{opacity:.8}
.u-tr-line.played{opacity:.66}
.u-tr-line.active{
  opacity:1;color:#fff;background:rgba(255,255,255,.07);
}
.u-tr-line.active::before{height:62%}
.u-tr-line.active[data-spk="JP"]{color:rgb(var(--field-hi))}
/* mana2 (owner): word-by-word karaoke fill INSIDE the active line. Unspoken words sit
   dim; each word brightens as the podcast reaches it; the current word is brightest.
   Only the active line dims its words — other lines keep their line colour. */
/* Karaoke REVEAL. The per-word progression has to be UNMISTAKABLE in BOTH
   languages. Unspoken words sit clearly dim; each word reveals to full, crisp
   brightness as it's spoken; the current word leads with a bright pop + glow.
   The old Japanese treatment was a MUTED pink (rgb ~182,126,144) sweeping only
   .40->1.0 opacity — invisible on the pink living-field. Now Japanese reveals
   as a BRIGHT warm pink (keeps the JP accent, reads hard on the dark field) and
   English as crisp white, both off a much dimmer unspoken state for real
   contrast. Spoken words also gain weight so the boundary reads at a glance. */
.u-tr-w{transition:color .13s var(--ease-out), text-shadow .13s var(--ease-out), opacity .13s var(--ease-out)}
.u-tr-line.active .u-tr-w{color:rgba(255,255,255,.24)}
.u-tr-line.active .u-tr-w.lit{color:#fff}
.u-tr-line.active .u-tr-w.cur{color:#fff;text-shadow:0 0 16px rgba(255,255,255,.55)}
.u-tr-line.active[data-spk="JP"] .u-tr-w{color:rgba(255,221,232,.24)}
.u-tr-line.active[data-spk="JP"] .u-tr-w.lit{color:rgb(255,221,232);font-weight:700}
.u-tr-line.active[data-spk="JP"] .u-tr-w.cur{color:#fff;text-shadow:0 0 17px rgba(255,196,222,.75)}

/* ============================================================
   IMMERSE = the living-gradient world (g5myub)
   owner: "ensure consistency — the immerse needs updating."
   Lyrics + study already float on the breathing album-palette
   field. Immerse now does too: the SAME fixed field sits behind
   a scrolling stack of frosted-glass tiles, in the song's own
   palette. The graphite "machine" + amber-LED colour language is
   retired here so the whole app speaks ONE colour per song.
   Mirrors the Sing field (uses the shared @keyframes); .fb blooms
   derive from the palette vars so a new song needs no extra edits.
   ============================================================ */
.u-mode-section[data-mode="immerse"]{position:relative}
.u-mode-section[data-mode="immerse"] .sing-field{
  display:block;position:fixed;inset:0;z-index:0;
  pointer-events:none;overflow:hidden;
  /* mana2 (owner): immerse must share the SAME background as karaoke — no change on
     the switch. The dark wine base lived only on the sing field; add it here too. */
  background:radial-gradient(140% 130% at 50% 42%, var(--field-base1) 0%, var(--field-base2) 55%, var(--field-base3) 100%);
}
.u-mode-section[data-mode="immerse"] .sing-field::before{
  content:'';position:absolute;inset:-22%;
  background:
    linear-gradient(160deg, rgba(var(--field-c1),.30) 0%, rgba(var(--field-c2),.24) 42%, rgba(var(--field-c3),.36) 100%),
    radial-gradient(ellipse 140% 100% at 16% 18%, rgba(var(--field-c1),.58), transparent 64%),
    radial-gradient(ellipse 160% 110% at 84% 26%, rgba(var(--field-c2),.50), transparent 60%),
    radial-gradient(ellipse 135% 98% at 38% 76%, rgba(var(--field-c1),.56), transparent 68%),
    radial-gradient(ellipse 150% 104% at 78% 82%, rgba(var(--field-c3),.54), transparent 66%),
    radial-gradient(ellipse 116% 86% at 50% 46%, rgba(var(--field-hi),.22), transparent 60%);
  animation:fieldDrift var(--fdur-drift) ease-in-out infinite, fieldBreath var(--fdur-breath) ease-in-out infinite;
  will-change:transform, opacity;opacity:.62;
}
.u-mode-section[data-mode="immerse"] .sing-field::after{
  content:'';position:absolute;inset:0;
  /* mana2 (owner): match the Sing field vignette exactly so immerse is NOT darker
     than the lyrics view — the top bar (transparent over the field) reads the
     same in both. Was .16/.44 (visibly dimmer); now .10/.30 like Sing. */
  background:radial-gradient(150% 108% at 50% 45%, rgba(5,3,9,.10), rgba(5,3,9,.30) 100%);
}
.u-mode-section[data-mode="immerse"] .sing-field .fb{
  position:absolute;border-radius:50%;
  filter:blur(62px);mix-blend-mode:screen;opacity:.62;
  will-change:transform;pointer-events:none;

.shell{width:100%;max-width:600px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding:10px 12px 14px}

/* Sing mode: the per-shell topbar is hidden (see .u-mode-section[data-mode="sing"]
   .shell > .topbar rule below), so the shell can give all its horizontal space
   to the stage. Cards drop every surface — no borders, no radius, no bg, no
   shadow — so the lyric (front) and vocab chips (back) float directly on the
   page and use the whole viewport. backface-visibility:hidden still hides
   the off-axis face during the rotateY flip so you never see both sides of
   the same card at once. Neighbour cards collapse to opacity 0 while the
   active card is flipped, so context lyrics don't bleed through the chips. */
.u-mode-section[data-mode="sing"] .shell{max-width:none;padding-left:0;padding-right:0}
/* Round 13: the singing stage IS the laser-disc screen — flat navy where
   the lyrics sit, with the cobalt bloom pinned to the TOP only (>=1em above
   the first line so gold-on-cobalt never trips the 7:1 floor; gold on flat
   navy = 10.9:1). No scanlines, ever. */
.u-mode-section[data-mode="sing"] .stage{
  border-radius:0;
  position:relative;
  /* Round 15 (owner): match Apple's LIVING ARTWORK FIELD. Apple paints a canvas
     mesh-gradient from the album-art palette + a rgba(0,0,0,.45) backdrop so
     white captions read. Ours: a dark wine BASE, the colour + slow drift come
     from .sing-field (GPU transform-only), and a centre scrim keeps captions legible.
     me8vg9 (owner: "large notch… sharp change"): the wine base USED to live here on
     .stage, which only spans y≈138↓. With the topbar hidden (study cards open) the
     body gradient showed above y138 and this wine base below → a hard seam at the
     stage top. Moved the wine base onto the full-viewport .sing-field (below) so the
     base is ONE continuous gradient from the very top through the study cards; the
     stage is transparent now and just clips the drift layer. */
  background:transparent;
}
/* Artwork palette — sampled from the cover art. Per-song
   overridable; silhouette will set its own rgb triples. */
.u-mode-section[data-mode="sing"],
.u-mode-section[data-mode="immerse"]{
  --field-c1:173,87,125;  /* R29 dusty rose (Apple-matched) */
  --field-c2:107,54,77;    /* deep wine */
  --field-c3:38,30,28; --field-hi:206,103,149;     /* maroon base / dusty-rose highlight — R32.1: deepened off near-white so white lyric letters keep contrast (RULE: no whitish tones in the field). g5myub: Immerse now shares this palette so the whole app is one colour world. */
}
/* The living field sits below the transparent card-stack. overflow:hidden
   clips the oversized, slowly-drifting colour layer to the stage. */
.sing-field{display:none}
.u-mode-section[data-mode="sing"] .sing-field{
  display:block; position:absolute; inset:0; z-index:0;
  pointer-events:none; overflow:hidden;
  /* me8vg9: the dark wine BASE lives here now (was on .stage, which caused the
     y138 seam — see .stage note above). On the full-viewport fixed field it is one
     continuous gradient top-to-bottom, behind the drifting mesh (::before) + blooms. */
  background:radial-gradient(140% 130% at 50% 42%, var(--field-base1) 0%, var(--field-base2) 55%, var(--field-base3) 100%);
}
/* ::before = the colour. Oversized (-28%) so the drift never reveals an edge;
   animated with transform ONLY = GPU composited, no per-frame repaint. */
.u-mode-section[data-mode="sing"] .sing-field::before{
  content:''; position:absolute; inset:-22%;
  /* Round 17 (owner): "there's no gradient — it's an active gradient not a static
     one." The old field bloomed in only two corners over a near-black base, so
     the lower ~60% read flat black. Apple's living field covers the WHOLE
     viewport. Four drifting blooms — one per quadrant — at presence-level alpha
     so the mauve/pink reads everywhere, still transform-only (GPU). */
  background:
    linear-gradient(160deg, rgba(var(--field-c1),.30) 0%, rgba(var(--field-c2),.24) 42%, rgba(var(--field-c3),.36) 100%),
    radial-gradient(ellipse 140% 100% at 16% 18%, rgba(var(--field-c1),.58), transparent 64%),
    radial-gradient(ellipse 160% 110% at 84% 26%, rgba(var(--field-c2),.50), transparent 60%),
    radial-gradient(ellipse 135% 98% at 38% 76%, rgba(var(--field-c1),.56), transparent 68%),
    radial-gradient(ellipse 150% 104% at 78% 82%, rgba(var(--field-c3),.54), transparent 66%),
    radial-gradient(ellipse 116% 86% at 50% 46%, rgba(var(--field-hi),.22), transparent 60%);
  animation:fieldDrift var(--fdur-drift) ease-in-out infinite, fieldBreath var(--fdur-breath) ease-in-out infinite;
  will-change:transform, opacity;
  opacity:.62;
}
/* ::after = legibility scrim, STATIC (not on the drifting layer) so the dark
   centre stays under the active line wherever the colour drifts. */
.u-mode-section[data-mode="sing"] .sing-field::after{
  content:''; position:absolute; inset:0;
  background:radial-gradient(150% 92% at 50% 47%, rgba(6,3,6,.12), rgba(6,3,6,.46) 100%);
}
@keyframes fieldDrift{

  50%{transform:translate3d(calc(8%*var(--field-amp)),calc(7.5%*var(--field-amp)),0) scale(1.24) rotate(calc(3.5deg*var(--field-amp)))}
  100%{transform:translate3d(calc(-8%*var(--field-amp)),calc(-7%*var(--field-amp)),0) scale(1.08) rotate(calc(-3.5deg*var(--field-amp)))}
}
/* Motion presets (GRADIENT LAB): mesh path alternates. fb blooms keep their
   own drift (background bokeh) — presets restyle the mesh only. All
   transform+opacity, never scale on .fb (af3r1o perf rule). */
@keyframes fieldOrbit{
  0%{transform:translate3d(calc(-7%*var(--field-amp)),0,0) scale(1.12) rotate(0deg)}
  25%{transform:translate3d(0,calc(-6%*var(--field-amp)),0) scale(1.18) rotate(calc(1.5deg*var(--field-amp)))}
  50%{transform:translate3d(calc(7%*var(--field-amp)),0,0) scale(1.24) rotate(0deg)}
  75%{transform:translate3d(0,calc(6%*var(--field-amp)),0) scale(1.18) rotate(calc(-1.5deg*var(--field-amp)))}

  100%{transform:translate3d(calc(-10%*var(--field-amp)),calc(-2%*var(--field-amp)),0) scale(1.14) rotate(calc(-2deg*var(--field-amp)))}

   edge — the most perceptible alive-cue, palette untouched. */
@keyframes fieldBreath{ 0%{opacity:.5} 50%{opacity:.74} 100%{opacity:.5} }
/* Round 17 (owner): "the gradient takes tones and highlights from the artwork
   and blends them — it lives and breathes." Three soft colour blobs from the
   cover palette (--field-c1/c3 + a lighter --field-hi highlight), screen-blended
   over the wash, each drifting on its own slow loop so the field morphs
   organically like Apple's mesh. Transform-only animation = GPU, 60fps. The
   ::after scrim sits above these (source order) to keep captions legible. */
.u-mode-section[data-mode="sing"] .sing-field .fb{
  position:absolute; border-radius:50%;
  filter:blur(62px); mix-blend-mode:screen; opacity:.62;
  will-change:transform; pointer-events:none;
}
.u-mode-section[data-mode="sing"] .sing-field .fb1{
  width:80vw; height:72vh; left:-14%; top:-12%;
  background:radial-gradient(circle at 50% 50%, rgba(var(--field-fb1),.95), rgba(var(--field-fb1),0) 60%);
  animation:fbDriftA var(--fdur-a) ease-in-out infinite;
}
.u-mode-section[data-mode="sing"] .sing-field .fb2{
  width:90vw; height:84vh; right:-16%; bottom:-14%;
  background:radial-gradient(circle at 50% 50%, rgba(var(--field-fb2),.82), rgba(var(--field-fb2),0) 60%);
  animation:fbDriftB var(--fdur-b) ease-in-out infinite;
}
.u-mode-section[data-mode="sing"] .sing-field .fb3{
  width:66vw; height:60vh; left:22%; top:24%;
  background:radial-gradient(circle at 50% 50%, rgba(var(--field-fb3),.9), rgba(var(--field-fb3),0) 62%);
  animation:fbDriftC var(--fdur-c) ease-in-out infinite;
}
/* R32: blooms now travel far enough to sweep the WHOLE field (top↔bottom), and
   each waxes/wanes opacity out of phase so the colour reads as morphing, not
   sitting still. Bigger translate spans carry the accent into the upper + lower
   thirds the old tight orbit never reached. */
/* af3r1o (perf): scale() removed — animating it re-rasterizes the blur(62px)
   layer every frame on mobile WebKit. Drift (translate) + waxing opacity carry
   the morph as pure compositor ops, so lyric-following stays smooth. */
@keyframes fbDriftA{0%{transform:translate(calc(-14%*var(--field-amp)),calc(-18%*var(--field-amp)));opacity:.5}50%{transform:translate(calc(26%*var(--field-amp)),calc(34%*var(--field-amp)));opacity:.78}100%{transform:translate(calc(-14%*var(--field-amp)),calc(-18%*var(--field-amp)));opacity:.5}}
@keyframes fbDriftB{0%{transform:translate(calc(18%*var(--field-amp)),calc(16%*var(--field-amp)));opacity:.74}50%{transform:translate(calc(-30%*var(--field-amp)),calc(-26%*var(--field-amp)));opacity:.48}100%{transform:translate(calc(18%*var(--field-amp)),calc(16%*var(--field-amp)));opacity:.74}}
@keyframes fbDriftC{0%{transform:translate(calc(-12%*var(--field-amp)),calc(20%*var(--field-amp)));opacity:.52}50%{transform:translate(calc(24%*var(--field-amp)),calc(-30%*var(--field-amp)));opacity:.8}100%{transform:translate(calc(-12%*var(--field-amp)),calc(20%*var(--field-amp)));opacity:.52}}
/* R30 (owner): gradient drift is gentle ambient motion he explicitly wants — do NOT freeze it under reduce-motion */
/* af3r1o (perf, the big one): the living field animates ONLY while the song
   plays. data-recessed is set on PLAY and removed on PAUSE/STOP (onPlayerState),
   so when the learner is idle / paused / reading a study card the whole field is
   STATIC — that kills the dominant always-on cost: a full-screen blur(62px) mesh

/* ===== Flat lyric list — NATIVE SCROLL (sing mode) ===================
   The lyric view is a real native-scrolling list: the card-stack is the
   scroll container and every line is a uniform-height row in normal flow.
   The browser handles the scroll + momentum on the GPU (buttery on iOS via
   -webkit-overflow-scrolling), so there is ZERO per-frame JS and nothing to
   collide — cards can't overlap because they're laid out, not transformed.
   The current line is marked by colour only; the container edges fade. */

  position:absolute !important; inset:0 !important;
  display:block !important;
  overflow-y:auto !important; overflow-x:hidden !important;
  /* NO -webkit-overflow-scrolling:touch — that deprecated momentum-layer is a
     known iOS bug where touches intermittently fail to engage the scroll while
     the container's contents mutate (telemetry showed 22/29 real swipes dead,
     none preventDefaulted). Modern iOS has momentum natively without it. */
  overscroll-behavior:contain;
  touch-action:none;                 /* JS owns the scroll (jsScroll); no native flick */
  /* Plain native scroller — no transform/will-change (a transform on an iOS
     overflow scroller is itself dubious and didn't help). */
  /* Disable scroll-anchoring: it's ON by default and re-adjusts scrollTop to
     "hold" content when the DOM mutates — the karaoke wipe mutates the active
     line every 60ms during playback, so anchoring was fighting the user's
     scroll DIRECTIONALLY (telemetry: finger-up/scroll-down-the-list died ~50%,
     finger-down always worked). */
  overflow-anchor:none;
  /* No scroll-snap: it free-scrolls and rests anywhere (no snap/threshold feel). */
  /* touch-action:none — the browser does NO native scroll/zoom here. iOS native
     flick-scroll on this nested mutating scroller failed ~50% of fast flicks
     (telemetry: dead swipes never moved scrollTop, yet every touch EVENT arrived).
     So JS owns the scroll entirely (jsScroll() in initLyricScroll): drive scrollTop
     from touch events + a momentum rAF. Deterministic on every flick, and testable
     with synthetic touch (which can't drive native scroll but can drive scrollTop).
     Taps still fire click (touch-action only gates panning/zoom). overflow-y:auto
     stays for layout + programmatic scrollTop range; wheel still scrolls on desktop. */
  /* Round 12: the edge-fade mask that lived here is GONE — a mask on a
     scrolling element makes WebKit re-composite the scrolled contents on
     every scroll frame. The fixed stage::before/after gradient overlays
     below achieve the identical dissolve for free (opaque --bg behind). */
}
.u-mode-section[data-mode="sing"] .card *{ overflow-anchor:none; }
.u-mode-section[data-mode="sing"] .card-stack::-webkit-scrollbar{width:0;height:0;display:none}
/* ===== Round 13: chrome recession on play (FINAL-DESIGN §5) =====

   only authority is the screen. The body fades to pure room-black; the denmoku
   rail recedes to 40% and the corner keys to 30% over 600ms. JS sets
   [data-recessed] at play start and clears it on pause (lights come back
   instantly). Scoped to sing mode. The wipe + LCD digits are the only mid-vocal
   movers — these transitions fire once at play start, never per-frame. */

.u-app[data-recessed][data-current-mode="sing"]{background-color:var(--room-black)}

.u-app[data-recessed][data-current-mode="sing"] .u-master-topbar{
  opacity:1;transition:opacity 600ms var(--ease-in-out);

/* mana2 (owner): the "light the corner keys back up while playing" rule has
   higher specificity than the [data-cards="open"] hide, so when the study sheet
   was open AND playback started, the translation + book corner keys reappeared
   ON TOP of the sheet toolbar (translation over slow, book over back). Gate the
   recessed re-light on the study sheet being CLOSED (:not([data-cards])) so the
   corners stay hidden whenever the sheet/word-card is up. */

/* Touch the chrome and it lights right back up (restore instantly). */
.u-app[data-recessed][data-current-mode="sing"] .u-master-topbar:active,
.u-app[data-recessed][data-current-mode="sing"]:not([data-cards]) .corner-btn:active{

/* ROOT-CAUSE FIX: the lyric rows are tappable (tap a word/line to play), so the

   touch. If it guesses "tap", the whole drag is ignored (dead swipe); sometimes

.u-mode-section[data-mode="sing"] .card-stack,
.u-mode-section[data-mode="sing"] .card-stack *{ touch-action:none !important; }

.u-mode-section[data-mode="sing"] .stage::after{display:none !important}  /* R33 (owner): kill the bottom fade scrim — its hard edge was the bottom seam on the main page */
.u-mode-section[data-mode="sing"] .card{
  position:relative !important; left:auto !important; top:auto !important; right:auto !important;
  transform:none !important;
  width:100% !important; max-width:none !important;

.u-mode-section[data-mode="sing"] .card.is-active .card-text{

.u-mode-section[data-mode="sing"] .card .card-text-wrap{transform:scale(1);transition:transform 200ms var(--ease-out)}
.u-mode-section[data-mode="sing"] .card.is-active.is-live .card-text-wrap,
.u-mode-section[data-mode="sing"] .card.pre-live .card-text-wrap{

/* ===== Round 13: karaoke caption sizing + sung-layer static treatment =====

/* Round 16 (owner): NO caption font-bump on the active line. The round-13

.u-mode-section[data-mode="sing"] .card .lyric-layer--upcoming .tok{

   bderry (owner): "all the lines, not just the current" — wrapper opacity was the

.u-mode-section[data-mode="sing"] .card.instrumental.is-active .card-text-wrap::before,
.u-mode-section[data-mode="sing"] .card.instrumental.pre-live .card-text-wrap::before{

.u-mode-section[data-mode="sing"].user-scrolling .card.is-active .card-text-wrap{opacity:1}

.u-mode-section[data-mode="sing"].user-scrolling .card.is-active .card-text-wrap::before,

.icon-btn.primary{
  width:44px;height:44px;border-radius:14px;font-size:17px;
  background:var(--lab);color:#0a0a0c;border-color:var(--lab);
  box-shadow:0 2px 0 #000;
}
.icon-btn.primary:hover,.icon-btn.primary:active{background:#dcc8ff}


/* v3 (drawer): the SING tab no longer shows the YouTube video - the
   LISTEN tab's Watchman TV is the only video surface. The iframe still
   exists in the DOM (it's how the JS API drives audio playback on SING)
   but is moved out of layout flow and made invisible. */
.video-drawer{
  position:fixed; left:-9999px; top:-9999px;
  width:1px; height:1px; overflow:hidden;
  opacity:0; pointer-events:none;
}
.video-drawer #player,.video-drawer iframe{display:block;width:1px;height:1px;border:0}

.stage{
  flex:1;min-height:0;position:relative;overflow:hidden;border-radius:20px;
  /* mana2: transparent so the ONE shared #livingField (behind .stage now) reads
     identically to immerse. The old center-darkening band lived only here (sing),
     which would make sing's center darker than immerse — a mode difference. The
     field's own ::after scrim carries legibility in BOTH modes equally. */
  background:transparent;
  touch-action:pan-y;user-select:none;-webkit-user-select:none;
}

/* drill-mode side tints that bloom as you drag */
.drill-tint-left,.drill-tint-right{
  position:absolute;top:0;bottom:0;width:35%;pointer-events:none;opacity:0;z-index:40;
  transition:opacity .15s;
}
.drill-tint-left{left:0;background:linear-gradient(90deg,rgba(251,146,60,.2),transparent)}
.drill-tint-right{right:0;background:linear-gradient(270deg,rgba(110,231,183,.2),transparent)}

.minimap{
  position:absolute;top:20px;bottom:20px;right:6px;
  width:22px;z-index:60;
  display:flex;align-items:center;justify-content:center;
  opacity:.55;transition:opacity .2s;touch-action:none;
}
.minimap:hover,.minimap.active{opacity:1}
.minimap.mm-auto-hide{opacity:.18}
.minimap.mm-auto-hide:hover,.minimap.mm-auto-hide.active,.minimap.mm-auto-hide.touching{opacity:1}
.minimap.mm-hidden{display:none}
.mm-track{position:relative;width:3px;height:100%;background:var(--border);border-radius:2px;cursor:grab}
.mm-track:active{cursor:grabbing}
.mm-dash{position:absolute;height:2px;border-radius:1px;background:var(--text-dim);left:-2px;right:-2px;transform:translateY(-1px)}
.mm-dash.instrumental{background:var(--border-light);left:0;right:0}
.mm-dash.star{background:var(--gold);left:-4px;right:-4px;height:3px}
.mm-dash.rated-got{background:var(--green);left:-3px;right:-3px;height:3px}
.mm-dash.rated-need{background:var(--orange);left:-3px;right:-3px;height:3px}
.mm-thumb{
  position:absolute;height:14px;width:13px;left:-5px;border-radius:3px;
  background:var(--lab);
  box-shadow:0 0 0 1px rgba(255,255,255,.55);/* acv8v7: white ring, not amber */
  /* Round 12 (E2): thumb tracks instantly — a positional indicator, not a
     performer (the eased `top` also fought fast scrubs). */
  transform:translateY(-7px);pointer-events:none;
}
.mm-labels{position:absolute;left:-52px;top:0;bottom:0;width:48px;opacity:0;pointer-events:none;transition:opacity .2s}
.minimap.active .mm-labels{opacity:1}
.mm-label{
  position:absolute;right:0;transform:translateY(-50%);
  font-family:var(--f-mono);font-size:.55rem;color:var(--text-dim);
  background:rgba(17,17,22,.85);padding:2px 5px;border-radius:4px;border:1px solid var(--border);white-space:nowrap;
}
.mm-label.active{color:var(--lab);border-color:var(--lab-dim)}

.card-stack{position:absolute;inset:0;transform:translate3d(0,0,0);transition:transform .32s cubic-bezier(.2,.7,.3,1.05), opacity .2s var(--ease-out);will-change:transform}/* pks9m4: lyrics are the ARRIVING layer on book-close → delayed opacity-in (120ms) so they don't ghost over the leaving study card */
.card-stack.dragging{transition:none}
.card-stack.momenting{transition:none}
.card-stack.momenting .card{transition:none}
.card-stack.momentum{transition:transform 500ms var(--spring-gentle)}

.card{
  position:absolute;left:50%;
  /* Active card is flush with the stage top (which is right below the
     topbar). Because the transform is translate3d(-50%, -50%, 0) — the
     `top` value is the card's CENTER. Setting it to height/2 puts the
     card's top edge at stage Y=0. Independent of viewport / percentage
     math, so the gap between topbar and card stays zero on every size. */
  top:calc(var(--card-height,290px) / 2);
  width:var(--card-width,92%);max-width:var(--card-max-width,480px);height:var(--card-height,290px);
  transform:translate3d(-50%,-50%,0) scale(.55);
  opacity:0;visibility:hidden;pointer-events:none;z-index:1;
  /* No opacity transition on the base: when a card loses .is-active
     during a swipe, the .is-active rule (which DOES transition opacity)
     stops applying and the card should snap straight to its non-active
     opacity. Otherwise the previously-active card lingers near 1.0 for
     ~.3s as it fades down to .55, and the lyric text reads as if the
     next card "got closer" mid-swipe. The .is-active rule keeps an
     opacity transition for the fade-in when a card becomes active. */
  transition:transform .42s cubic-bezier(.2,.75,.3,1.05);
  perspective:1000px;
}
.card.in-view{visibility:visible;pointer-events:auto}
.card.is-active{will-change:transform}

/* 480kek — physical-object flip. Old curve cubic-bezier(.2,.7,.3,1.05) at
 * 550ms was front-loaded: ~70% of the rotation completed in the first
 * 110ms, leaving the eye reading "pop out" + "slide down" instead of one
 * fluid arc. Asymmetric replacement: bouncy open with overshoot (feels
 * like the card flips into hand), critically damped close (clean return).
 * One spring per gesture; transform-only; will-change permanent. */
.card-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform 380ms cubic-bezier(.4,0,.2,1)}/* af3r1o — dropped permanent will-change:transform: the in-place flip was replaced by the corner study sheet, so this only pre-promoted 29 idle GPU layers. preserve-3d stays (the back-face hide depends on it). */
.card.flipped .card-inner{transform:rotateY(180deg);transition:transform 460ms var(--spring-pop)}

.card-face{
  position:absolute;inset:0;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--card-bg);border:var(--card-border-w) solid var(--card-border);
  border-radius:var(--card-radius);
  box-shadow:var(--card-shadow-x) var(--card-shadow-y) var(--card-shadow-blur) 0 var(--card-shadow-color);
  padding:14px 18px 12px;display:flex;flex-direction:column;overflow:hidden;
  /* Round 13: fractal-noise "paper fiber" KILLED — no texture behind JP text
     (guardrail), and the card is now a clean LD monitor, not paper. */
}
/* Round 13: study-card front = the LD screen (cobalt bloom pinned to top). */
.card-face.front{
  background:
    radial-gradient(120% 140px at 50% -30px, var(--screen-cobalt), transparent 70%),
    var(--screen-navy);
}
.card-face.back{background:var(--card-back-bg)}
.card.is-active .card-face{
  border-color:var(--card-border);
  background:
    linear-gradient(var(--card-active-angle),
      color-mix(in srgb,var(--card-active-tint) var(--card-active-intensity),transparent),
      transparent 60%),
    var(--card-bg);
  box-shadow:
    var(--card-shadow-x) var(--card-shadow-y) var(--card-shadow-blur) 0 var(--card-shadow-color),
    var(--card-halo);
}
/* Round 13: the active study-card front stays an LD screen — the cobalt
   bloom is re-pinned to the TOP (the .card-face.front rule already supplies
   the bloom; the active rule above only deepens the tint). No texture. */
.card.is-active .card-face.front{
  background:
    radial-gradient(120% 160px at 50% -30px, var(--screen-cobalt), transparent 70%),
    var(--screen-navy);
}
.card.starred .card-face{
  background:linear-gradient(160deg,rgba(251,191,36,.08),rgba(251,191,36,0) 55%),var(--room-wall);
  border-color:rgba(251,191,36,.35);
}
.card.rated-got .card-face{border-color:rgba(110,231,183,.5)}
.card.rated-got .card-face::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--green),transparent)}
.card.rated-need .card-face{border-color:rgba(251,146,60,.5)}
.card.rated-need .card-face::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--orange),transparent)}

.card-face.back{transform:rotateY(180deg);padding:12px 14px;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:var(--text-dim) transparent}
.card-face.back::-webkit-scrollbar{width:11px}
.card-face.back::-webkit-scrollbar-track{background:transparent}
.card-face.back::-webkit-scrollbar-thumb{background:var(--text-dim);border-radius:6px;border:2px solid var(--card-back-bg);min-height:30px}
.card-face.back::-webkit-scrollbar-thumb:hover{background:var(--text-muted)}
/* af3r1o WebKit fix — backface-visibility:hidden is NOT honored on this
   preserve-3d / rotateY(180deg) back face in WebKit (Safari/iOS), so the
   mirrored study back bled through the FRONT in the sing lyric list ("How to
   use this" guide + vocab sides showing reversed). Hard-hide the back whenever
   it is still inside a card and not flipped. The study sheet's back is
   reparented OUT to #sheetBody (no longer a .card descendant), so this rule
   never touches it and the sheet stays fully visible + upright. */
.card:not(.flipped) .card-face.back{visibility:hidden;opacity:0}

.card-star{
  position:absolute;top:10px;right:10px;
  width:28px;height:28px;border-radius:50%;padding:0;
  background:rgba(17,17,22,.7);border:1px solid var(--border-light);
  color:var(--text-dim);cursor:pointer;font-size:13px;
  display:flex;align-items:center;justify-content:center;
  transition:all .18s cubic-bezier(.2,.7,.3,1);z-index:5;
}
.card-star:hover,.card-star:active{color:var(--gold);border-color:rgba(251,191,36,.5);transform:scale(1.08)}
.card.starred .card-star{color:var(--gold);background:rgba(251,191,36,.15);border-color:rgba(251,191,36,.5);box-shadow:0 0 10px rgba(251,191,36,.25)}
.card-star.burst{animation:starBurst 450ms var(--ease-out)}

/* v5: card gear button (opens settings) - twin of .card-star, sits left of it */
.card-gear{
  position:absolute;top:10px;right:46px;
  width:28px;height:28px;border-radius:50%;padding:0;
  background:rgba(17,17,22,.7);border:1px solid var(--border-light);
  color:var(--text-dim);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .18s cubic-bezier(.2,.7,.3,1);z-index:5;
}
.card-gear:hover,.card-gear:active{color:var(--lab);border-color:var(--lab-dim);transform:scale(1.08)}
.card-gear .ui-icon{width:17px;height:17px}

/* v5: chrome visibility driven by .u-app[data-chrome-*] attributes.
   Each item has three states: off | front | back (both when both set).
   These attrs live on .u-app and card parts live inside .card. */
.u-app[data-chrome-meta="off"] .card-meta{display:none}
.u-app[data-chrome-meta="front"] .card-face.back .card-meta{display:none}
.u-app[data-chrome-meta="back"] .card-face.front .card-meta{display:none}

.u-app[data-chrome-section="off"] .card-section{display:none}
.u-app[data-chrome-time="off"] .card-time{display:none}
.u-app[data-chrome-idx="off"] .card-idx{display:none}

.u-app[data-chrome-star="off"] .card-star{display:none}
.u-app[data-chrome-star="back"] .card-face.front .card-star{display:none}
.u-app[data-chrome-star="front"] .card-face.back .card-star{display:none}

.u-app[data-chrome-gear="off"] .card-gear{display:none}
.u-app[data-chrome-gear="back"] .card-face.front .card-gear{display:none}
.u-app[data-chrome-gear="front"] .card-face.back .card-gear{display:none}

.u-app[data-chrome-romaji="off"] .card-romaji{display:none !important}
.u-app[data-chrome-translation="off"] .card-translation{display:none !important}
.u-app[data-chrome-overview="off"] .card-section-overview{display:none !important}

.u-app[data-chrome-wordhl="off"] .card .tok.singing .tok-glow,
.u-app[data-chrome-wordhl="off"] .card .rom.singing{background:none;background-image:none;color:inherit;text-shadow:none;transform:none;box-shadow:none;filter:none;animation:none;-webkit-background-clip:border-box;background-clip:border-box}

/* v5: front/back gear lives inside face so it flips with it */
.card-face .card-gear,.card-face .card-star{position:absolute}
.card-face.back .card-gear{right:10px}
.card-face.back .card-star{right:46px}
/* When the favorite star is off, the gear naturally sits flush right.
   When star is on, push the gear left of it so both stay visible. */
.u-app:not([data-chrome-star="off"]) .card-face.back .card-gear{right:46px}
.u-app[data-chrome-star="off"] .card-face.back .card-gear{right:10px}

@keyframes starBurst{0%{transform:scale(1) rotate(0)}33%{transform:scale(1.25) rotate(8deg)}66%{transform:scale(.96) rotate(-3deg)}100%{transform:scale(1) rotate(0)}}

/* rating stamp: big badge that fades in on rate */
.rate-stamp{
  position:absolute;top:50%;left:50%;
  padding:10px 22px;border-radius:14px;
  font-family:var(--f-ui);font-size:1.2rem;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;
  pointer-events:none;opacity:0;
  transform:translate(-50%,-50%) scale(.7) rotate(-8deg);
  z-index:20;
}
.card.stamping-got .rate-stamp--got,
.card.stamping-need .rate-stamp--need{
  animation:stampIn 550ms var(--ease-out) forwards;
}
@keyframes stampIn{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-20deg)}
  30%{opacity:1;transform:translate(-50%,-50%) scale(1.15) rotate(-6deg)}
  60%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-4deg)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(.95) rotate(-4deg)}
}
.rate-stamp--got{background:rgba(110,231,183,.25);color:var(--green);border:2px solid var(--green);box-shadow:0 0 30px rgba(110,231,183,.5)}
.rate-stamp--need{background:rgba(251,146,60,.25);color:var(--orange);border:2px solid var(--orange);box-shadow:0 0 30px rgba(251,146,60,.5)}

.card.flying-right{animation:flyRight 480ms var(--ease-in) forwards}
.card.flying-left{animation:flyLeft 480ms var(--ease-in) forwards}
@keyframes flyRight{
  to{transform:translate3d(calc(-50% + 150vw),-50%,0) rotate(14deg) scale(.8);opacity:0}
}
@keyframes flyLeft{
  to{transform:translate3d(calc(-50% - 150vw),-50%,0) rotate(-14deg) scale(.8);opacity:0}
}

.card-meta{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-shrink:0;padding-right:32px}
.card-section{
  font-family:var(--f-ui);font-size:var(--cb-section-size,.52rem);font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:3px;
  background:var(--surface2);color:var(--cb-section-color,var(--text-dim));
}
.card.is-active .card-section{background:rgba(255,255,255,.12);color:#fff}/* acv8v7: white, not amber-ghost */
.card-time{font-family:var(--f-mono);font-size:.55rem;color:var(--text-dim);letter-spacing:.03em;margin-left:auto}
.card-idx{font-family:var(--f-mono);font-size:.55rem;color:var(--text-dim)}
.card-face.back .card-meta{padding-right:0}

.card-text-wrap{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;overflow:hidden}
.card-text{
  font-family:var(--f-voice);
  font-weight:900;font-size:1.1rem;line-height:1.5;
  color:var(--text);text-align:center;word-break:keep-all;overflow-wrap:normal;max-width:100%;
}
/* Active line uses font-weight:900 unconditionally - the tweaker's
   --text-weight knob lands at 600 by default, which Noto Sans JP
   doesn't actually load (it ships 400/500/700/900), so the browser
   falls back to a thinner weight. font-family is also pinned
   because the light-theme rule (`:root[data-theme="light"]
   .card.is-active .card-text` later in the file) reassigns
   font-family to var(--text-font), which the tweaker defaults to
   'VT323',monospace — a pixel font that only ships weight 400. So
   font-weight:900 silently fell back to regular and the active
   line stayed thin in light mode even when dark mode looked right.
   Pinning the font-family here neutralises that. */
.card.is-active .card-text{font-weight:900 !important;font-family:var(--f-voice) !important;font-size:calc(1.65rem * var(--fit-shrink,1));color:var(--text-color,#fff);letter-spacing:.01em;white-space:nowrap;overflow:hidden}
.card.instrumental .card-text{font-style:italic;color:var(--text-dim);font-family:var(--f-ui);font-size:.85rem;font-weight:400}
/* ── Instrumental "dance" ─────────────────────────────────────────────────
   The placeholder renders as per-letter spans (instrumentalLyric). The sung
   mask never advances on a gap, so only the upcoming layer paints — hide the
   duplicate. While the gap is the ACTIVE (playing) card, the letters ride a
   slow staggered glow-wave: the karaoke reveal's own visual language (the
   #eaf1ff wipe glow), looping, with no lyric to track. Small + calm, a breath
   of motion over the dead air — not a bounce. Idle gap cards stay still. */
.card.instrumental .lyric-layer--sung{display:none !important}
.card.instrumental .inst-dance{display:inline-flex;align-items:baseline;gap:.5em;white-space:nowrap}
.card.instrumental .inst-ltr{display:inline-block}
.card.instrumental .inst-note{display:inline-block;opacity:.5}
.card.instrumental .inst-ltr,.card.instrumental .inst-note{will-change:transform,opacity}
.card.instrumental:not(.is-active) .inst-ltr{opacity:.55}
/* active gap = playing: let the dance read (the parent .4 dim would crush it) */
.u-mode-section[data-mode="sing"] .card.instrumental.is-active .card-text{opacity:1;overflow:visible}
.u-mode-section[data-mode="sing"] .card.instrumental.is-active .inst-ltr,
.u-mode-section[data-mode="sing"] .card.instrumental.is-active .inst-note{color:rgba(255,255,255,.85)}
.card.instrumental.is-active .inst-ltr{
  animation:instLetterWave 2.1s var(--ease-in-out,ease-in-out) infinite;
  animation-delay:calc(var(--di) * 0.085s);
}
.card.instrumental.is-active .inst-note--l{animation:instNoteFloat 2.1s ease-in-out infinite}
.card.instrumental.is-active .inst-note--r{animation:instNoteFloat 2.1s ease-in-out infinite reverse;animation-delay:.45s}
@keyframes instLetterWave{
  0%,100%{transform:translateY(0);opacity:.5;text-shadow:none}
  45%{transform:translateY(-0.18em);opacity:1;
      text-shadow:0 0 10px color-mix(in srgb,var(--lyric-wipe-glow,#eaf1ff) 60%,transparent)}
}
@keyframes instNoteFloat{
  0%,100%{transform:translateY(0) rotate(-5deg);opacity:.4}
  50%{transform:translateY(-0.3em) rotate(5deg);opacity:.92}
}
@media (prefers-reduced-motion:reduce){
  .card.instrumental .inst-ltr,.card.instrumental .inst-note{animation:none !important;opacity:.72 !important;transform:none !important;text-shadow:none !important}
  /* k0dxk2: hold the count-in numeral still + readable for motion-sensitive users. */
  .card.intro.is-counting .intro-cd-num{animation:none !important;opacity:1 !important;transform:none !important;text-shadow:none !important}
}

/* Intro card: occupies the silent first ~12s. Styled like a vintage
   concert program / track 01 placard, in keeping with the paper/retro
   feel of the rest of the page. Sized to fit in the fixed 290px card. */
.card.intro .card-face.front{
  padding:14px 16px 12px;
  display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
  gap:8px;
  text-align:center;
  position:relative;
}
/* Intro front is now minimal: two centered CTAs and nothing else.
   The legacy cassette-corner brackets, marquee, title, rule, pictos,
   play button, and countdown are all gone — see renderCardStack. The
   "TAP TO PLAY" line blinks softly like an arcade "press start". */
.card.intro .card-face.front::before,
.card.intro .card-face.front::after{ display:none; }
.intro-cta-stack{
  flex:1; min-height:0;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap:36px;
  padding:24px;
}
/* Round 13: TAP TO START — the machine's amber legend, DotGothic16 (an LCD
   prompt on the LD screen). The blink lives on .intro-cta--blink below. */
.intro-cta{
  font-family:var(--f-dot);
  font-size:15px;
  font-weight:400;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:#fff;  /* acv8v7 (owner): TAP TO START prompt = white, not amber */
  text-align:center;
}
@keyframes intro-press-start {
  0%, 100% { opacity:1; }
  50%      { opacity:.32; }
}
/* Round 13 (taste law 6: steps or nothing): the LD title card's "TAP TO
   START" hard-blinks like a real PRESS-START prompt — a square on/off with
   no easing — instead of a soft breath. Pre-play only (hidden once singing).
   The instantaneous opacity jump comes from adjacent keyframe stops under
   linear timing; no smooth ease anywhere. */
@keyframes introBreath {
  0%, 55% { opacity:1; }
  55.01%, 100% { opacity:.35; }
}
.intro-cta--blink{ animation: introBreath 1.1s linear infinite; }
/* Pending start: the tap registered but YouTube hasn't reached PLAYING yet
   (slow network / embed still buffering). Without this a stalled embed looks
   identical to a dead button. Faster soft pulse = "the tap took"; cleared by
   the PLAYING state handler, or the watchdog re-offers TAP TO START. */
.intro-cta.is-loading{ animation: intro-press-start .7s ease-in-out infinite; }
/* "Tap to start" lives in the lyric list as the intro line, so it scrolls in
   order with everything else. In sing mode each lyric row's main JP line sits
   ~0.6rem ABOVE the row's geometric center (the romaji line below it pushes the
   centered text-pair up); the single-line CTA would center dead-on, reading
   ~0.6rem lower than the lyric rhythm. Lift it by that fixed offset so it lands
   exactly on the lyric baseline. (Sing-mode lyric font sizes are fixed, so the
   offset is constant.) */
.u-mode-section[data-mode="sing"] .card.intro .intro-cta{ transform: translateY(-0.6rem); }
/* Intro countdown: one big number, fades in and out each second.
   Hidden while the intro card isn't actively counting (i.e., not
   playing or not the active card). When .is-counting toggles on,
   the CTA stack hides and this takes the same centered slot. */
.intro-countdown{
  /* Round 12 (E3): countdown stacks absolutely over the CTA slot so the two
     can CROSSFADE (display-swap popped). CTA out 140ms scale .96; countdown
     in 200ms from scale 1.04, delayed 100ms so the handoff overlaps.
     pointer-events stays off — taps belong to the card / CTA layer. */
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
  padding:24px;
  opacity:0; transform:scale(1.04); pointer-events:none;
  transition:opacity 200ms var(--ease-out) 100ms, transform 200ms var(--ease-out) 100ms;
}
.card.intro.is-counting .intro-countdown{ opacity:1; transform:none; }
.intro-cta-stack{ transition:opacity 140ms var(--ease-in), transform 140ms var(--ease-in); }
.card.intro.is-counting .intro-cta-stack{ opacity:0; transform:scale(.96); pointer-events:none; }
/* Round 13: countdown numerals = DotGothic16 amber (the screen's count-in). */
.intro-cd-num{
  font-family:var(--f-dot);
  font-size:48px;
  font-weight:400;
  line-height:1;
  letter-spacing:.04em;
  color:#fff;  /* R25.5 (owner): countdown numerals white, not amber */
  opacity:0;
}
@keyframes intro-cd-pulse {
  0%   { opacity:0; transform:scale(.92); }
  40%  { opacity:1; transform:scale(1); }
  70%  { opacity:1; transform:scale(1); }
  100% { opacity:0; transform:scale(1.04); }
}
.intro-cd-num.intro-cd-pulse{
  animation:intro-cd-pulse 1s ease-in-out forwards;
}
/* k0dxk2: the count-in DANCES like the instrumental line — the numeral floats
   and glows on a continuous calm breath, flanked by the same drifting ♪ ♫ notes.
   The notes are .inst-note inside the .instrumental intro card, so they pick up
   the existing instNoteFloat automatically; here we size + space them and give
   the numeral its own readable float-and-glow. */
.intro-countdown{ gap:.5em; }
.intro-countdown .intro-cd-note{ font-size:26px; align-self:center; line-height:1; }
/* Pre-roll (music not started): numeral is blank, notes drift dim so the wait
   reads as intentional rather than a dead/frozen countdown. */
.card.intro.is-counting .intro-countdown.pre-music .intro-cd-note{ opacity:.4; }
@keyframes cdDance{
  0%,100%{ transform:translateY(0); opacity:.82; text-shadow:none; }
  45%    { transform:translateY(-0.16em); opacity:1;
           text-shadow:0 0 12px color-mix(in srgb,var(--lyric-wipe-glow,#eaf1ff) 65%,transparent); }
}
.card.intro.is-counting .intro-cd-num{
  opacity:1;
  animation:cdDance 2.1s var(--ease-in-out,ease-in-out) infinite;
}

/* Intro back face - quick reference guide. Colours target the dark
   theme via --text / --text-muted; the original --ink / --ink-muted
   were undefined here and fell back to near-black hexes meant for a
   paper background that never landed, so the whole guide was
   invisible against the dark page. */
.card.intro .card-face.back{
  padding:14px 18px 14px;
  display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
  gap:8px; text-align:center;
}
/* Front face's `TAP TO PLAY` has an infinite blink animation which
   on iOS Safari promotes it to a compositing layer that escapes
   backface-visibility:hidden — letters bleed through onto the back
   face. Mirror the defensive .card-text-wrap rule and hide the
   whole intro front when flipped. */
.card.intro.flipped .card-face.front{ visibility:hidden; }
/* The intro card's back is the QUICK GUIDE, and it now renders on the cream
   paper songbook surface — so every ink here is dark paper-ink, not the
   dark-theme light text it used to use (that failed badly on cream). */
.intro-back-eyebrow{
  font-family:var(--f-ui);
  font-size:.58rem; letter-spacing:.32em; text-transform:uppercase;
  color:color-mix(in srgb, var(--paper-ink) 58%, transparent);
}
.intro-back-title{
  font-family:var(--f-voice); font-weight:800;
  font-size:1.18rem; line-height:1.05; letter-spacing:0;
  margin:0; color:var(--paper-ink);
}
/* k0dxk2: a one-line welcome above the steps so the guide opens warmly. */
.intro-back-lead{
  font-family:var(--f-voice); font-size:.8rem; line-height:1.4;
  margin:0; max-width:40ch; text-align:center;
  color:color-mix(in srgb, var(--paper-ink) 88%, transparent);
}
.intro-back-list{
  list-style:none; padding:0; margin:4px 0 0;
  display:grid; gap:5px;
  font-family:var(--f-voice);
  font-size:.74rem; line-height:1.35;
  color:var(--paper-ink);
  text-align:left; max-width:36ch;
}
.intro-back-list li{ padding-left:14px; position:relative; }
.intro-back-list li::before{
  content:'›'; position:absolute; left:0; top:-1px;
  color:var(--role-prt-ink); font-weight:700;
}
.intro-back-list b{ color:var(--paper-ink); font-weight:700; }
.intro-back-list .intro-back-glyph{
  width:1em; height:1em; vertical-align:-0.15em; color:var(--paper-ink);
}
.intro-back-subhead{ margin-top:11px; }
.intro-back-foot{
  margin-top:auto;
  font-family:var(--f-ui);
  font-size:.56rem; letter-spacing:.18em; text-transform:uppercase;
  color:color-mix(in srgb, var(--paper-ink) 55%, transparent);
}

/* k0dxk2 round2: HOW-TO as tappable section cards + pop-up detail. The menu is
   short (no scroll), so the sheet's fixed toolbar never floats over the text.
   Colours come from the #cardSheet dark-paper override, so this reads as part of
   the study sheet. */
.howto-menu{ display:flex; flex-direction:column; gap:9px; width:100%; max-width:30ch; margin:10px auto 0; }
/* lw4x1m (owner): the section list now wears the SAME look as a study card's
   Explainer pill (paper-shade key, inset paper-rule ring, --r-key radius) — no
   coloured menu bars, so the how-to reads as part of the study sheet, not a
   settings list. */
.howto-sec{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  width:100%; min-height:46px; padding:11px 15px; cursor:pointer;
  font-family:var(--f-voice); font-weight:700; font-size:.95rem; text-align:left;
  color:var(--paper-ink); background:var(--paper-shade);
  border:0; border-radius:var(--r-key);
  box-shadow:inset 0 0 0 1px var(--paper-rule);
  -webkit-tap-highlight-color:transparent; transition:transform .1s, box-shadow .12s;
}
.howto-sec:active{ box-shadow:inset 0 0 0 1px var(--paper-rule), inset 0 0 0 2px color-mix(in srgb,var(--paper-ink) 22%,transparent); transform:scale(.985); }
.howto-sec-label{ pointer-events:none; }
.howto-sec-arrow{ width:16px; height:16px; flex:none; pointer-events:none; color:color-mix(in srgb,var(--paper-ink) 45%, transparent); }
/* Pop-up detail card (appended into #cardSheet so it inherits the dark paper). */
.howto-pop{
  position:fixed; inset:0; z-index:999;
  display:flex; align-items:center; justify-content:center; padding:22px;
  background:rgba(5,3,9,.58); opacity:0; transition:opacity .2s;
  -webkit-tap-highlight-color:transparent;
}
.howto-pop.show{ opacity:1; }
.howto-pop-card{
  position:relative; width:100%; max-width:33ch; max-height:74vh; overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  background:var(--paper-shade); color:var(--paper-ink);
  border:1px solid var(--paper-rule); border-radius:15px;
  padding:18px 18px 17px; box-shadow:0 22px 56px rgba(0,0,0,.55);
  transform:translateY(10px) scale(.97); transition:transform .2s;
}
.howto-pop.show .howto-pop-card{ transform:none; }
.howto-pop-x{
  position:absolute; top:5px; right:7px; width:32px; height:32px;
  border:0; background:transparent; cursor:pointer; line-height:1; font-size:22px;
  color:color-mix(in srgb,var(--paper-ink) 55%, transparent);
}
.howto-pop-title{
  font-family:var(--f-voice); font-weight:800; font-size:1.12rem;
  color:var(--paper-ink); margin:0 0 11px; padding-right:26px; text-align:left;
}
.howto-pop-list{
  list-style:none; padding:0; margin:0; display:grid; gap:10px; text-align:left;
  font-family:var(--f-voice); font-size:.9rem; line-height:1.42; color:var(--paper-ink);
}
.howto-pop-list li{ position:relative; padding-left:15px; }
.howto-pop-list li::before{ content:'\203A'; position:absolute; left:0; top:-1px; color:var(--role-prt-ink); font-weight:700; }
.howto-pop-list b{ color:var(--paper-ink); font-weight:700; }
.howto-pop-glyph{ width:1.05em; height:1.05em; vertical-align:-0.18em; color:var(--paper-ink); }
/* lw4x1m (owner): the "show the button" exhibit at the top of each popup — a
   non-interactive replica of the real control so "the button" is unmistakable.
   PILL mirrors a topbar pill (Sing/Study/Immerse); KEY mirrors a round
   corner/toolbar button with its glyph. */
.howto-pop-btns{ display:flex; flex-wrap:wrap; align-items:center; gap:9px; margin:-2px 0 13px; }
.howto-pop-pill{
  font-family:-apple-system,"Hiragino Sans",system-ui,sans-serif;
  font-size:.82rem; font-weight:600; color:#fff; letter-spacing:.01em;
  padding:7px 13px; border-radius:5px; white-space:nowrap;
  background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.24);
  text-shadow:0 1px 0 rgba(0,0,0,.5);
}
.howto-pop-key{
  display:inline-flex; align-items:center; justify-content:center;
  width:40px; height:40px; border-radius:50%; flex:none;
  background:rgba(255,255,255,.06); box-shadow:inset 0 0 0 1px rgba(255,255,255,.22);
  color:#E6E9EE;
}
.howto-pop-key svg{ width:21px; height:21px; }
@media (prefers-reduced-motion:reduce){
  .howto-pop, .howto-pop-card{ transition:none !important; }

}

.card-romaji{font-family:var(--f-mono);font-weight:700;font-size:calc(.78rem * var(--fit-shrink,1));color:var(--lyric-pin-rom-upcoming);letter-spacing:.04em;text-align:center;opacity:.85;line-height:1.4;display:none;word-break:keep-all;white-space:nowrap}
.card.is-active .card-romaji.has-romaji{display:block}
/* Apple Music feel: romaji also reads as a ghost on the ±1 neighbour
   cards in sing mode, so the prev/next line shows both kanji and
   pronunciation just like the active line (rather than romaji popping
   in only on the active card). Non-active romaji falls back to its
   base muted color since updateHighlight doesn't drive the wipe vars
   on those cards. */
.u-mode-section[data-mode="sing"] .card.in-view:not(.is-active) .card-romaji.has-romaji{display:block}
/* v17: line translation overlay (composed from vocab .en) */
.card-translation{

}
.card.is-active .card-translation.has-translation.show{display:block}
/* Panel fix: show translation when root attr is ON (survives re-render) */
.u-app[data-chrome-translation="on"] .card.is-active .card-translation.has-translation{display:block}
.u-app[data-chrome-section-overview="on"] .card.is-active .card-section-overview.has-overview{display:block}
.card-section-overview{

.rom{display:inline-block;padding:0 2px;transition:color .14s,text-shadow .14s,transform .14s}
.rom.singing{
  color:var(--lyric-rom-singing);
  text-shadow:0 0 var(--rom-singing-shadow-blur) var(--rom-singing-shadow-color);
  transform:none;
}
.rom.sung{color:color-mix(in srgb,var(--lyric-rom-sung) var(--lyric-rom-sung-alpha),transparent)}

/* ===== Romaji karaoke wipe: same two-layer technique as the main lyrics.
 * See songs/README.md → "Karaoke-wipe rendering". Mask composited from
 * (horizontal progress ∩ current row band) ∪ above rows. Driven by
 * --rom-fill-px / --rom-row-top-px / --rom-row-bottom-px set in JS. */
.card.is-active .card-romaji{position:relative}
.rom-layer{display:inline-block;white-space:inherit;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.rom-layer--upcoming{position:relative;z-index:1}
.rom-layer--sung{
  position:absolute;inset:0;z-index:2;pointer-events:none;
  -webkit-mask-image:
    linear-gradient(180deg,
      #000 0,
      #000 var(--rom-row-top-px,0px),
      transparent var(--rom-row-top-px,0px),
      transparent 100%),
    linear-gradient(90deg,
      #000 0,
      #000 calc(var(--rom-fill-px,0px) - var(--rom-wipe-fade-start,0em)),
      transparent calc(var(--rom-fill-px,0px) + var(--rom-wipe-fade-end,0em)),
      transparent 100%),
    linear-gradient(180deg,
      transparent 0,
      transparent var(--rom-row-top-px,0px),
      #000 var(--rom-row-top-px,0px),
      #000 var(--rom-row-bottom-px,100%),
      transparent var(--rom-row-bottom-px,100%),
      transparent 100%);
          mask-image:
    linear-gradient(180deg,
      #000 0,
      #000 var(--rom-row-top-px,0px),
      transparent var(--rom-row-top-px,0px),
      transparent 100%),
    linear-gradient(90deg,
      #000 0,
      #000 calc(var(--rom-fill-px,0px) - var(--rom-wipe-fade-start,0em)),
      transparent calc(var(--rom-fill-px,0px) + var(--rom-wipe-fade-end,0em)),
      transparent 100%),
    linear-gradient(180deg,
      transparent 0,
      transparent var(--rom-row-top-px,0px),
      #000 var(--rom-row-top-px,0px),
      #000 var(--rom-row-bottom-px,100%),
      transparent var(--rom-row-bottom-px,100%),
      transparent 100%);
  -webkit-mask-composite:source-over,source-in,source-over;
          mask-composite:add,intersect,add;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  -webkit-mask-size:100% 100%;mask-size:100% 100%;
}
/* Romaji colors mirror the MAIN lyric palette - sung layer uses
 * --lyric-wipe-sung (the main text's "becomes" color), upcoming layer
 * uses --lyric-upcoming at --lyric-upcoming-alpha (main text's pre-sung
 * color). Tuning the main text in the tweaker automatically drives the
 * pronunciation colors. --rom-singing-shadow-* still controls the halo. */
.card.is-active .rom-layer--sung .rom,
.card.is-active .rom-layer--sung .rom.singing,
.card.is-active .rom-layer--sung .rom.sung{
  color:var(--lyric-wipe-sung);
  text-shadow:0 0 var(--rom-singing-shadow-blur) var(--rom-singing-shadow-color);
}
.card.is-active .rom-layer--upcoming .rom,
.card.is-active .rom-layer--upcoming .rom.singing,
.card.is-active .rom-layer--upcoming .rom.sung{
  color:color-mix(in srgb,var(--lyric-upcoming) var(--lyric-upcoming-alpha),transparent);
  text-shadow:none;transform:none;
}

/* Pull the actions row past the card's content padding so the kebab
   sits closer to the painted card border. No gap between row items
   so the tray button group feels like it's emerging directly from
   the kebab when opened. */
.card-actions{
  flex-shrink:0;margin-top:10px;
  display:flex;align-items:center;justify-content:center;gap:0;
  margin-inline:-10px;padding:0 8px;
}
/* Kebab + sliding tray. Default: tray collapsed; only the kebab
   (3 vertical dots) shows, hugging the left side of the row taking
   minimal space. Tap the kebab → .open class added → tray slides
   out to the right and the dots rotate to horizontal. */
.card-actions-tray{
  display:flex; align-items:center; gap:12px;
  max-width:0; opacity:0; pointer-events:none;
  overflow:hidden;
  transition: max-width .35s ease, opacity .25s ease;
}
.card-actions.open .card-actions-tray{
  max-width:600px; opacity:1; pointer-events:auto;
}
/* Strip the button-frame styling from the kebab — no border, no
   background, no padding box. Just the bare icon. Padding kept tight
   so the tray buttons sit flush against the kebab when expanded. */
.card-btn{
  width:44px;height:44px;border-radius:50%;padding:0;flex-shrink:0;
  background:var(--surface2);border:1px solid var(--border-light);

.card-btn:hover,.card-btn:active{background:var(--surface3);color:var(--lab);border-color:var(--lab-dim);transform:translateY(-1px)}
.card-btn.primary{

}
.card-btn.primary:hover,.card-btn.primary:active{background:#dcc8ff;transform:translateY(-1px) scale(1.03)}
.card-btn.active{background:rgba(110,231,183,.2);border-color:var(--green);color:var(--green)}
.card-btn.active:hover,.card-btn.active:active{background:rgba(110,231,183,.3)}
/* v21: card button variants for user-picked action set */

.card-btn.card-btn--got:hover,.card-btn.card-btn--got:active{background:rgba(110,231,183,.22);border-color:var(--green);color:#fff}
.card-btn.card-btn--jp{background:rgba(196,181,253,.12);color:var(--lab);border-color:rgba(196,181,253,.4)}
.card-btn.card-btn--jp:hover,.card-btn.card-btn--jp:active{background:rgba(196,181,253,.22);color:#fff;border-color:var(--lab)}
.card-btn.card-btn--en{background:rgba(96,165,250,.12);color:var(--blue);border-color:rgba(96,165,250,.4)}

.card-btn.card-btn--slow{background:rgba(94,234,212,.12);color:var(--teal);border-color:rgba(94,234,212,.4)}

.card-btn.card-btn--starbtn{background:rgba(251,191,36,.12);color:var(--gold);border-color:rgba(251,191,36,.4)}
.card-btn.card-btn--starbtn:hover,.card-btn.card-btn--starbtn:active{background:rgba(251,191,36,.22);color:#fff;border-color:var(--gold)}
.card.is-active .card-btn:not(.primary):not(.active){color:var(--lab);border-color:var(--lab-dim);background:var(--surface3)}
/* af3r1o — removed dead .card-btn[data-action="repeat"] .spin CSS: the real
   repeat control's action is "loop", so this selector never matched anything. */

/* drill rate action buttons (replace tools-area for learners) */
/* Round 13: drill rate tray = graphite denmoku strip (no backdrop blur). */
.drill-rate-row{
  position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
  display:none;align-items:center;gap:10px;z-index:80;
  background:var(--den-body);border:1px solid var(--den-lo);

}

.drill-btn{
  width:40px;height:40px;border-radius:var(--r-key);padding:0;

  color:#E6E9EE;cursor:pointer;font-size:16px;
  display:flex;align-items:center;justify-content:center;
