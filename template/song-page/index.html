.drill-btn:active{transform:translateY(var(--travel));box-shadow:inset 0 1px 0 var(--den-hi)}
.drill-btn--need{color:var(--orange);border-color:rgba(251,146,60,.4);background:rgba(251,146,60,.1)}
.drill-btn--need:hover,.drill-btn--need:active{background:rgba(251,146,60,.2);border-color:var(--orange)}
.drill-btn--got{color:var(--green);border-color:rgba(110,231,183,.4);background:rgba(110,231,183,.1)}
.drill-btn--got:hover,.drill-btn--got:active{background:rgba(110,231,183,.2);border-color:var(--green)}
.drill-label{

  letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim);padding:0 4px;
}

.tok{display:inline;transition:color .18s}
/* .tok-glow stays inline-block: an inline-block can't split across rows,
   which guarantees a token wraps as one unit — the wipe geometry cache
   (buildWipeGeom) measures it as a single box. The per-token gradient +
   @property --fill machinery that used to live here was provably dead
   (the readability pins force background-image:none on both layers) and
   was removed in round 12 along with its per-frame style writes. */
.tok-glow{display:inline-block;padding:0;margin:0}
/* Whitespace token = a real word gap. English lyric lines ("It doesn't matter if
   it's Sunday") carry spaces between words; a lone space collapses inside the
   inline-block .tok-glow, so give the gap an explicit space width. Japanese lines
   have no spaces so they never emit these. */
.tok-ws .tok-glow{width:.28em}
/* Per-character lift, round-12 three-phase choreography (FINAL-SPEC B4),
   scheduled from kana timings by the rAF engine — we know the future, so
   the character draws breath BEFORE the voice hits it:
     .pre  at onset−150ms → translateY(-3%)  (anticipate; crests ~30ms early)
     .hit  at onset       → translateY(-8%)  (lands exactly on the vocal)
     (none) at charEnd    → baseline over 650ms (sustains hold the lift;
                            melisma reads as the character carrying the note)
   Classes are applied to BOTH text layers in the same frame — different
   transforms per layer would ghost at the mask edge. translateY only:
   scale changes glyph metrics and fights the wipe math. */
.card.is-active .tok-char{
  display:inline-block;
  transform-origin:50% 100%;
  transition:transform var(--dur-lyric) var(--ease-lift);
}
/* Round 17 (owner): per-character lift RESTORED to ~2px. Re-measured Apple's
   live amp-lyrics: each sung syllable carries an inline transform matrix with
   translateY about -1.15px mid-sweep and -2px once sung — Apple DOES raise the
   word as it lights; the round-16 "no movement" read was wrong. Matched in px
   (font-size independent), like Apple. */
.card.is-active .tok-char.pre{
  transform:translateY(-1px);
  transition:transform 120ms var(--ease-out);
}
.card.is-active .tok-char.hit{
  transform:translateY(-2px);
  transition:transform 160ms var(--ease-out);
}
.tok.sung{color:var(--text-dim)}
.card.is-active .tok{
  color:color-mix(in srgb,var(--lyric-upcoming) var(--lyric-upcoming-alpha),transparent);
  filter:drop-shadow(0 0 var(--lyric-upcoming-glow-blur)
    color-mix(in srgb,var(--lyric-upcoming-glow) var(--lyric-upcoming-glow-intensity),transparent));
}
.card.is-active .tok.sung{color:var(--lyric-sung);filter:none}

/* ===== Cross-letter karaoke wipe: two stacked text layers =====
 * Upcoming layer (below): renders in upcoming color for the whole line.
 * Sung layer (above): renders in sung color, mask-image sweeps the reveal
 * from left to right based on --line-fill-px (set by updateHighlight JS).
 * Because the mask is line-wide, the wipe flows through letter boundaries
 * continuously regardless of chromatic palette. */
.card.is-active .card-text{position:relative}
/* ===== Wipe glow strip (round 12, FINAL-SPEC B2/B3) =====
   The leading edge is a physical object: one element painted once (radial
   lavender ellipse) and MOVED forever by transform from the same CSS vars
   the mask consumes — replacing the old per-frame drop-shadow filters.
   z-index 0 = behind both text layers, so it reads as backlight under the
   edge, never haze over the glyphs. Opacity is its only animated property
   (sparse state changes from the glow lifecycle in the rAF engine). */
.wipe-glow{
  position:absolute;left:0;top:0;width:.9em;height:1.3em;
  pointer-events:none;z-index:0;opacity:0;
  /* Round 13: amber backlight strip = var(--lyric-glow), the sole blur. */
  background:radial-gradient(closest-side,
    var(--lyric-glow),
    transparent 72%);
  transform:translate(calc(var(--line-fill-px,0px) - .45em),
                      calc(var(--wipe-row-mid-px,0px) - .65em));
  transition:opacity 350ms var(--ease-in-out);
  will-change:transform,opacity;
}
.card:not(.is-active) .wipe-glow{display:none}
/* Wrapped lyric lines balance their rows (no lone ね orphan on row 2);
   the wipe measures real token rects per tick, so it adapts to wherever
   the balanced break lands. Romaji balances with it. */
.card .card-text, .card .card-romaji { text-wrap: balance; }
.lyric-layer{display:inline-block;white-space:inherit;backface-visibility:hidden;-webkit-backface-visibility:hidden}
/* mask-image on .lyric-layer--sung creates a compositing layer that can
 * escape the parent's backface-visibility. Belt-and-braces: when the card
 * is flipped, hide the front-face text wrap entirely. */
.card.flipped .card-face.front .card-text-wrap{visibility:hidden}
.lyric-layer--upcoming{position:relative;z-index:1}
.lyric-layer--sung{
  position:absolute;inset:0;z-index:2;pointer-events:none;
  /* 2D reading-order reveal via three mask layers composited:
   *   L3: fully-revealed rows above the current one (180deg)  [topmost]
   *   L1: horizontal progress (90deg) - black left of --line-fill-px
   *   L2: vertical band of current wrapped row (180deg)       [bottom]
   * mask-composite evaluates BOTTOM-UP: result = L3 add (L1 intersect L2)
   * = L3 ∪ (L1 ∩ L2). Current row gets the horizontal wipe; rows above
   * stay fully visible; rows below stay hidden. ORDER IS LOAD-BEARING:
   * with L1 on top the algebra becomes L1 ∩ (L2 ∪ L3) and rows above get
   * clipped by the fill — row 1 visibly re-reveals when row 2 starts. */
  -webkit-mask-image:
    linear-gradient(180deg,
      #000 0,
      #000 var(--wipe-row-top-px,0px),
      transparent var(--wipe-row-top-px,0px),
      transparent 100%),
    linear-gradient(90deg,
      #000 0,
      #000 calc(var(--line-fill-px,0px) - var(--lyric-wipe-fade-start,0em)),
      transparent calc(var(--line-fill-px,0px) + var(--lyric-wipe-fade-end,0em)),
      transparent 100%),
    linear-gradient(180deg,
      transparent 0,
      transparent var(--wipe-row-top-px,0px),
      #000 var(--wipe-row-top-px,0px),
      #000 var(--wipe-row-bottom-px,100%),
      transparent var(--wipe-row-bottom-px,100%),
      transparent 100%);
          mask-image:
    linear-gradient(180deg,
      #000 0,
      #000 var(--wipe-row-top-px,0px),
      transparent var(--wipe-row-top-px,0px),
      transparent 100%),
    linear-gradient(90deg,
      #000 0,
      #000 calc(var(--line-fill-px,0px) - var(--lyric-wipe-fade-start,0em)),
      transparent calc(var(--line-fill-px,0px) + var(--lyric-wipe-fade-end,0em)),
      transparent 100%),
    linear-gradient(180deg,
      transparent 0,
      transparent var(--wipe-row-top-px,0px),
      #000 var(--wipe-row-top-px,0px),
      #000 var(--wipe-row-bottom-px,100%),
      transparent var(--wipe-row-bottom-px,100%),
      transparent 100%);
  -webkit-mask-composite:source-over,source-in,source-over;
          mask-composite:add,intersect,add;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  -webkit-mask-size:100% 100%;mask-size:100% 100%;
}
/* Sung layer tokens: solid sung color, no per-letter gradient (the mask
 * handles reveal). Keep the bounce animation + glow on .singing. */
.card.is-active .lyric-layer--sung .tok,
.card.is-active .lyric-layer--sung .tok.sung,
.card.is-active .lyric-layer--sung .tok.singing .tok-glow,
.card.is-active .lyric-layer--sung .tok.sung .tok-glow{
  color:var(--lyric-wipe-sung);
  background-image:none;
  -webkit-background-clip:border-box;background-clip:border-box;
  filter:none;
}
.card.is-active .lyric-layer--sung .tok.singing .tok-glow{
  filter:drop-shadow(0 0 var(--lyric-wipe-glow-blur)
    color-mix(in srgb,var(--lyric-wipe-glow) var(--lyric-wipe-glow-intensity),transparent));
}
/* (v0.16's keyframe animation was replaced by a transition-driven
   transform set on .tok.singing / .tok.sung further up in the
   .tok-glow rule. No keyframes needed for a single-direction
   smooth lift.) */
/* Upcoming layer: always shows upcoming color; never paints the sung
 * gradient. The tok-glow inflate-and-lift animation lives in the
 * .tok.sung rule above (fires post-reveal, on both layers in sync). */
.card.is-active .lyric-layer--upcoming .tok.singing .tok-glow,
.card.is-active .lyric-layer--upcoming .tok.sung .tok-glow{
  color:inherit;background-image:none;
  -webkit-background-clip:border-box;background-clip:border-box;
  filter:none;
}
/* ===== Active-line readability floor (Apple-Music inspired) =====
 * The lyric tweaker writes inline values for --lyric-* on :root from
 * localStorage every page load, and existing saved state pins the
 * sung colour to a near-black (#1a1333) and the upcoming colour to
 * low-alpha purple - making the active line dimmer than its ghost
 * neighbours, which inverts every karaoke UX expectation.
 *
 * These rules bypass the tweaker entirely with hard-coded white
 * values and !important. The two-layer mask wipe on
 * .lyric-layer--sung still drives the reveal direction; only the
 * colours are pinned. Romaji gets the same treatment.
 *
 * Mask sharpness: --lyric-wipe-fade-start/end live in the tweaker
 * DEFAULTS at 0.8em each — almost a full character of soft gradient
 * on either side of the wipe boundary, so the reveal looked like a
 * mushy fade instead of an Apple-Music-style sharp paint-over. The
 * .card.is-active rule below pins them to .04em on the active card
 * scope; the tweaker writes to :root, .card.is-active is a closer
 * cascade ancestor for var() resolution inside the lyric-layer mask
 * gradients, so these wins without !important. */
.card.is-active{
  /* Asymmetric feather (round 12): behind the edge is fact — crisp;
     ahead is anticipation — soft. The wide lead is what makes per-frame
     motion read as liquid instead of a sliding crop. */
  --lyric-wipe-fade-start:.02em;  /* trailing (sung side) */
  --lyric-wipe-fade-end:.10em;    /* leading (unsung side) */
}
.card.is-active .lyric-layer--upcoming .tok,
.card.is-active .lyric-layer--upcoming .tok-glow,
.card.is-active .lyric-layer--upcoming .tok.singing .tok-glow,
.card.is-active .lyric-layer--upcoming .tok.sung .tok-glow{
  color:var(--lyric-pin-upcoming) !important;
  background-image:none !important;
  filter:none !important;
  -webkit-background-clip:border-box !important;
  background-clip:border-box !important;
}
.card.is-active .lyric-layer--sung .tok,
.card.is-active .lyric-layer--sung .tok-glow,
.card.is-active .lyric-layer--sung .tok.singing .tok-glow,
.card.is-active .lyric-layer--sung .tok.sung .tok-glow{
  color:var(--lyric-pin-sung) !important;
  background-image:none !important;
  filter:none !important;
  -webkit-background-clip:border-box !important;
  background-clip:border-box !important;
}
.card.is-active .rom-layer--upcoming .rom,
.card.is-active .rom-layer--upcoming .rom.singing,
.card.is-active .rom-layer--upcoming .rom.sung{
  color:var(--lyric-pin-rom-upcoming) !important;
  text-shadow:none !important;
  background-image:none !important;
}
.card.is-active .rom-layer--sung .rom,
.card.is-active .rom-layer--sung .rom.singing,
.card.is-active .rom-layer--sung .rom.sung{
  color:var(--lyric-pin-rom-sung) !important;
  text-shadow:none !important;
  background-image:none !important;
}

/* ===== amedqe — UNIFIED STICKER INK. The giant-katakana treatment (black outline +
   hard black drop) generalised across the readable DISPLAY text, em-scaled so the same
   rule auto-lightens on small type. paint-order:stroke-fill keeps the fill over the inner
   half of the stroke → counters stay open. Long sentence text (definition) gets the
   smaller variant; secondary mono romaji gets the hard drop only (a stroke muddies mono
   at these sizes). The sing active line + hero katakana are handled at their own rules. */
.wc-main{
  -webkit-text-stroke:var(--ink-stroke-w) var(--ink-stroke);
  paint-order:stroke fill;
  text-shadow:0 var(--ink-drop-y) 0 var(--ink-drop);
}
.pitch-detail .pd-def{
  -webkit-text-stroke:var(--ink-stroke-w-sm) var(--ink-stroke);
  paint-order:stroke fill;
  text-shadow:0 var(--ink-drop-y-sm) 0 var(--ink-drop);
}
.u-title{
  -webkit-text-stroke:var(--ink-stroke-w) var(--ink-stroke);
  paint-order:stroke fill;
  text-shadow:0 var(--ink-drop-y) 0 var(--ink-drop);
}
.wc-sub{ text-shadow:0 var(--ink-drop-y-sm) 0 var(--ink-drop); }
/* amedqe r2 (owner): lightly extend the sticker to the held-back text. "Lightly" = the
   small variant. Romaji rides its own SUNG (masked) layer so the light outline reveals
   with the wipe exactly like the kanji; the English translation row gets the same light
   outline on the active line (it has no per-word wipe, so it lifts with the line). */
.u-mode-section[data-mode="sing"] .card.is-active.is-live .rom-layer--sung .rom,
.u-mode-section[data-mode="sing"] .card.is-active.is-live .rom-layer--upcoming .rom,
.u-mode-section[data-mode="sing"] .card.pre-live .rom-layer--sung .rom,
.u-mode-section[data-mode="sing"] .card.pre-live .rom-layer--upcoming .rom,
.u-mode-section[data-mode="sing"] .card:not(.is-active) .rom-layer--upcoming .rom{
  -webkit-text-stroke:var(--ink-stroke-w-sm) var(--ink-stroke);
  paint-order:stroke fill;
  /* !important overrides the old `.rom text-shadow:none !important` (the pre-sticker
     clean-romaji rule) so the light drop matches the EN translation row. The
     upcoming layer is included now (slll4a) so the read-ahead romaji also gets the
     dark edge; this selector outranks the .card.is-active upcoming `none` rule. */
  text-shadow:0 var(--ink-drop-y-sm) 0 var(--ink-drop) !important;
}
.u-mode-section[data-mode="sing"] .card.is-active .card-face.front .card-en-row.has-en,
.u-mode-section[data-mode="sing"] .card.pre-live .card-face.front .card-en-row.has-en,
.u-mode-section[data-mode="sing"] .card:not(.is-active) .card-face.front .card-en-row.has-en{
  /* 69xgye (owner): the translation now carries the same sticker outline as the kanji
     + romaji in EVERY state (was: outline only on active/pre-live, none on the other
     lines, so the translation looked like a different family). */
  -webkit-text-stroke:var(--ink-stroke-w-sm) var(--ink-stroke);
  paint-order:stroke fill;
  text-shadow:0 var(--ink-drop-y-sm) 0 var(--ink-drop);
}
/* mono + UI micro-labels (IN CONTEXT / WORD / Word by Word / Explainer): light outline */
.pill-label, .pd-flip-label, .drill-label{
  -webkit-text-stroke:var(--ink-stroke-w-sm) var(--ink-stroke);
  paint-order:stroke fill;
  text-shadow:0 var(--ink-drop-y-sm) 0 var(--ink-drop);
}
/* VFD counter pills (DotGothic — Verse / Line / time / Sing Mode): hard drop only, no
   stroke (a stroke clots the dot-matrix glyphs). */
.u-counter .u-tp-info, .u-counter .u-tp-info b{
  text-shadow:0 var(--ink-drop-y-sm) 0 var(--ink-drop);
}
/* ===== R35 (owner, "look deeper" vs Apple): the SING lyric view goes fully
   Apple-clean — NO sticker outline, NO hard drop on the kanji/romaji/English.
   The reasons the stroke came back (amedqe/slll4a: contrast on the bright
   living field) are now carried by the R34 frosted highlight pill + the
   distance dimming, so the glyphs read as clean white like Apple. Two wins in
   one: (1) the heavy black edge no longer "pops in" glyph-by-glyph as the wipe
   passes, which is what made the reveal read chunky instead of gliding; (2) the
   text matches Apple's stroke-free caption. Sticker ink stays EVERYWHERE else —
   study cards, titles, hero katakana, pitch, browse — this is sing-scoped only.
   text-stroke/text-shadow are paint-only (no layout box), so the wipe geometry
   cache is untouched. ===== */
.u-mode-section[data-mode="sing"] .card .lyric-layer--sung .tok,
.u-mode-section[data-mode="sing"] .card .lyric-layer--upcoming .tok,
.u-mode-section[data-mode="sing"] .card .card-face.front .card-en-row.has-en{
  /* R37 (owner): a VERY THIN outline back on the letters — a .5px hairline (1
     device px at 2x, crisp on phone) instead of the old ~1.7px sticker edge.
     Just the outline, NO hard drop shadow (that was the heavy sticker look).
     paint-order:stroke fill keeps the fill over the stroke so counters stay open. */
  -webkit-text-stroke:.5px var(--ink-stroke) !important;
  paint-order:stroke fill;
  text-shadow:none !important;
}
/* Romaji: the originals (.card.is-active.is-live .rom-layer .rom etc., slll4a)
   carry !important at 5-class specificity, so the kill must MATCH that exact
   selector shape (later in source wins the tie) — a looser .card .rom-layer
   selector loses the cascade even with !important. */
.u-mode-section[data-mode="sing"] .card.is-active.is-live .rom-layer--sung .rom,
.u-mode-section[data-mode="sing"] .card.is-active.is-live .rom-layer--upcoming .rom,
.u-mode-section[data-mode="sing"] .card.pre-live .rom-layer--sung .rom,
.u-mode-section[data-mode="sing"] .card.pre-live .rom-layer--upcoming .rom,
.u-mode-section[data-mode="sing"] .card:not(.is-active) .rom-layer--upcoming .rom,
.u-mode-section[data-mode="sing"] .card .card-romaji{
  -webkit-text-stroke:.5px var(--ink-stroke) !important;
  paint-order:stroke fill;
  text-shadow:none !important;
}
/* Read-ahead (upcoming) text on the active line was 75% white — too bright next
   to the 100%-white sung text, so the wipe position was hard to read once the
   stroke was gone. Drop it to a clearly-muted ~55% so the white→grey reveal
   reads like Apple's (sung bright, upcoming receded). Non-active lines keep
   their own dimmer upcoming colour (set elsewhere). */
.u-mode-section[data-mode="sing"] .card.is-active,
.u-mode-section[data-mode="sing"] .card.pre-live{--lyric-upcoming-alpha:55%}

/* ========== the reference build polish (post Phase-1) ========== */

/* ========================================================================
 * the reference build - Pass A: paper palette patch
 * ------------------------------------------------------------------------
 * The old dark theme leaned on neon lavender `--lab:#c4b5fd` for active
 * state, primary action, hover chrome, AND Japanese-language emphasis -
 * four unrelated semantics all wearing the same color. Landing pulls them
 * apart: red `#e63946` carries STATE + PRIMARY, lavender `#a89fc8` is
 * reserved for JAPANESE-LANGUAGE semantics only, chrome is ink-on-paper.
 *
 * Strategy: keep original rules intact; let them cascade. This block runs
 * later in the stylesheet and wins on specificity/order. `--lab` becomes a
 * graceful alias to `--lavender`, so every JP-bucket rule that still reads
 * `var(--lab)` auto-translates to the retro purple. Non-JP buckets get
 * explicit overrides. No soft glows survive - landing has none.
 * ====================================================================== */

:root{
  --lavender:#a89fc8;
  --lavender-dim:#7a6f9f;
  /* Round 13: --lab was the page-wide "interactive accent" lavender — exactly
     the pastel the KILL LIST targets. Re-point it (and --lab-dim) at the
     machine's amber so every incidental chrome accent (icon buttons, card
     buttons, progress fill, wheel picker, hovers) becomes denmoku amber in one
     shot. Purple survives ONLY where a rule explicitly means the JP role. */
  /* acv8v7 (owner: sitewide accent = WHITE): the interactive accent --lab (and its
     dim) were re-pointed to denmoku amber in Round 13. Re-point to WHITE so every
     incidental accent — wheel picker Done/selection, hovers, active tints, primary
     fills, minimap thumb — reads white instead of amber. */
  --lab:#ffffff;
  --lab-dim:rgba(255,255,255,.45);
}

/* ========================================================================
 * the reference build - Pass D: light-mode legibility + stereo-native primary button
 * ------------------------------------------------------------------------
 * The active-line word-wipe uses transparent text + white gradient +
 * lavender drop-shadow (Apple-Music-style). On paper that's white-on-cream
 * (invisible) ringed in purple (haze). Rewire for light mode to ink-on-
 * paper wipe with no ghost filter.
 *
 * Primary card play button was red - landing has zero red buttons; every
 * transport on the boombox is piano-key silver. Align the primary to the
 * same piano-key shape as the other card-btns, with a slightly larger
 * icon so "play" still reads as the main action (landing's pattern at
 * the site landing (index.html) lines 189-221 - .pkey + .pkey.play
 * uses larger font-size on the symbol, identical gradient otherwise).
 * ====================================================================== */

/* (Light-mode rules for .tok.singing .tok-glow, .rom.singing, .rom.sung
 * are now handled by the base rules reading --lyric-* vars. Light theme
 * overrides only the var values below.) */

/* Motion toggles: when off, neutralize the relevant animation in light */
.u-app[data-lyric-bounce="off"] .card.is-active .tok.singing .tok-glow{animation:none}
.u-app[data-lyric-rom-scale="off"] .rom.singing{transform:none !important}

/* Preview singing: when on, the first 3 tokens of the active line fake the

 * are visible without audio playback. */
.u-app[data-lyric-preview="on"] .card.is-active .card-text > .tok:nth-child(1) .tok-glow{
  color:var(--lyric-wipe-sung);

  filter:drop-shadow(0 0 var(--lyric-wipe-glow-blur)
    color-mix(in srgb,var(--lyric-wipe-glow) var(--lyric-wipe-glow-intensity),transparent));
}
.u-app[data-lyric-preview="on"] .card.is-active .card-text > .tok:nth-child(2) .tok-glow{
  color:transparent;
  background-image:linear-gradient(90deg,
    var(--lyric-wipe-sung) calc(50% - var(--lyric-wipe-fade-start)),
    var(--lyric-wipe-sung) 50%,
    color-mix(in srgb,var(--lyric-wipe-trail) var(--lyric-wipe-trail-alpha),transparent)
      calc(50% + var(--lyric-wipe-fade-end)));
  -webkit-background-clip:text;background-clip:text;
  animation:none;
  filter:drop-shadow(0 0 var(--lyric-wipe-glow-blur)
    color-mix(in srgb,var(--lyric-wipe-glow) var(--lyric-wipe-glow-intensity),transparent));
}
.u-app[data-lyric-preview="on"] .card.is-active .card-text > .tok:nth-child(3) .tok-glow{
  color:color-mix(in srgb,var(--lyric-wipe-trail) var(--lyric-wipe-trail-alpha),transparent);
  background-image:none;
  filter:drop-shadow(0 0 var(--lyric-wipe-glow-blur)
    color-mix(in srgb,var(--lyric-wipe-glow) var(--lyric-wipe-glow-intensity),transparent));
}

/* ========================================================================
 * Pass E - Cassette console faceplate (2026-04-23)
 * ------------------------------------------------------------------------
 * Reframes the topbar as ONE console: aluminum faceplate, welded piano-key
 * transport, program-selector mode nav with mint CRT LEDs, cassette-style
 * back/icon/browse switches. Drops the generic pill/lavender vocabulary
 * that earlier passes left behind. Tokens live under --chrome-* so the
 * tweaker can tune the whole face in one shot.
 * ===================================================================== */
/* Round 13: the "cassette console" --chrome-* tokens are RE-POINTED at the
   denmoku material world. Re-mapping the tokens (not the 60+ consuming rules)
   converts the whole topbar/transport to graphite body + amber LCD + machined
   keys in one shot. The mint CRT LED becomes --den-amber; the aluminum
   faceplate becomes graphite (--den-body); the stripe texture is killed (it
   read as cassette aluminum). */
:root{
  /* Dark: denmoku graphite body, amber LCD wells, machined dark keys */
  --chrome-face:linear-gradient(180deg,#262B33 0%,#1A1E24 55%,#14171C 100%);
  --chrome-face-solid:var(--den-body);
  --chrome-hard:#000000;
  --chrome-led:#ffffff;  /* acv8v7 (owner): the LED/active accent (scrub glow, active pill border, progress) = WHITE, not amber */
  --chrome-led-off:#2A2E34;
  --chrome-rec:var(--den-red);
  --chrome-gold:var(--den-amber);
  --chrome-key-top:#3A424D;
  --chrome-key-mid:#262B33;
  --chrome-key-bot:#14171C;
  --chrome-key-split:55%;
  --chrome-key-ink:#E6E9EE;
  --chrome-key-ink-dim:color-mix(in srgb,var(--chrome-key-ink) 55%,transparent);
  --chrome-shadow:rgba(0,0,0,0.85);
  --chrome-divider:rgba(255,255,255,0.06);
  --chrome-topbar-tex:none;
}

/* Shared key gradient - one source of truth */
@supports (background: linear-gradient(to bottom,red 50%,blue)){
  :root{
    --chrome-key-bg:linear-gradient(to bottom,
      var(--chrome-key-top) 0%,
      var(--chrome-key-top) var(--chrome-key-split),
      var(--chrome-key-bot) var(--chrome-key-split),
      var(--chrome-key-bot) 100%);
    --chrome-key-bg-hot:linear-gradient(to bottom,
      color-mix(in srgb,var(--chrome-key-top) 85%,white) 0%,
      color-mix(in srgb,var(--chrome-key-top) 85%,white) var(--chrome-key-split),
      color-mix(in srgb,var(--chrome-key-bot) 90%,white) var(--chrome-key-split),
      color-mix(in srgb,var(--chrome-key-bot) 90%,white) 100%);
  }
}

   aspect-ratio. No absolute positioning, no padding-reservation games —
   the flex container does the work and it scales correctly at any
   screen/zoom level. */
.u-master-topbar{
  display:block !important;
  position:relative !important;
  padding:6px 12px 6px 12px !important;
  /* Round 13: the denmoku rail — machined graphite, not the old near-black.

.u-master-topbar > .u-tb-stack{

     then center in the remaining mid-area — equidistant from the back
     chip and from the art. Per-breakpoint art widths set in the
     media queries below adjust the right padding to match. */
  margin:0;

  justify-content:center;
  align-items:stretch;
  min-height:96px;

  position:static !important;

/* Back arrow absolutely positioned to the topbar's left edge so it
   doesn't drag the pill row off-center. Override transport's

.u-master-topbar .u-tb-row--transport{position:static !important}
.u-master-topbar .u-back{

  top:53px !important;

.u-tb-stack{

.u-master-topbar > .u-art-btn{

   the menu doesn't shift the card stack down — same don't-move-the-cards

  padding:14px 16px 16px;

.u-tb-row--menu .u-mode-nav{gap:18px !important;padding:2px 4px !important}

/* Every chip carries the same outlined box (drawn with an inset shadow so
   it never changes the element's size). The active mode reuses the exact

.u-tb-row--menu .u-mode-chip{

  background:linear-gradient(180deg,#262B33,#1A1E24 55%,#14171C) !important;

.u-theme-chip{

/* Glyph sized to the mode-chip LED (7px) so it reads as the same leading

/* Round 12 (E8): compositor-only ack — a scale breath plus a white opacity

/* af3r1o — removed the orphaned LISTEN/Watchman-TV comment block (that whole

/* ─── Pitch reveal · r2txev (overlay version) ─────────────────────── */
:root {
  --pitch-heiban: #84c5ff;
  --pitch-atamadaka: #ff9ec6;
  --pitch-nakadaka: #ffb86b;
  --pitch-odaka: #a3f5c8;
  --pitch-kansai: #c5a3ff;
  --pitch-drop: #ff9ec6;
  --pitch-accent: #c5a3ff;
}
/* 200ms opacity = the all-rows release at drill end (F); transform carries
   the drill chip's settle (240ms ease-lift). */
.word-row { position: relative; transition: opacity 200ms var(--ease-out), transform 240ms var(--ease-lift); }
.word-row .wc-jp { border-bottom: 2.5px solid var(--border, #2c243a); transition: border-bottom-color 0.15s ease; }
.word-row.pitch-heiban    .wc-jp { border-bottom-color: var(--pitch-heiban); }
.word-row.pitch-atamadaka .wc-jp { border-bottom-color: var(--pitch-atamadaka); }
.word-row.pitch-nakadaka  .wc-jp { border-bottom-color: var(--pitch-nakadaka); }
.word-row.pitch-odaka     .wc-jp { border-bottom-color: var(--pitch-odaka); }
.word-row.pitch-kansai    .wc-jp { border-bottom-color: var(--pitch-kansai); border-bottom-style: dashed; }
.word-row.pitch-unknown   .wc-jp { border-bottom-color: rgba(126,112,149,0.35); border-bottom-style: dotted; }
.word-row.pitch-pending   .wc-jp { border-bottom-color: rgba(126,112,149,0.2); }
.word-row.is-expanded .wc { box-shadow: 0 0 0 2px var(--pitch-accent); }

/* Fixed-position overlay — escapes the card-face 3D-rotateY transform
 * that was clipping the inline expansion. Centered, modal-style; tap
 * the backdrop or X button to dismiss. */
.pitch-overlay {
  position: fixed; inset: 0; z-index: 9999;
  display: flex; align-items: center; justify-content: center;
  /* Reserve the source-line strip lane (top) and the card's own toolbar lane
     (bottom, 54px buttons + inset) so card content can never slide under
     either — this was the mobile collision in the owner's 2026-06-11 screenshot. */
  padding: max(64px, calc(env(safe-area-inset-top, 0px) + 58px)) 16px
           calc(env(safe-area-inset-bottom, 0px) + 96px);
  /* Round 12 (D2): the backdrop is split into two children built in JS —
     a dim layer (plain rgba, animates opacity only) and a blur layer that
     is never animated (backdrop-filter mid-fade re-filters every frame;
     it toggles on after the dim settles). The overlay itself stays bare. */
  background: transparent;
}
/* Belt-and-braces: if a card is still taller than the lane, it scrolls
   internally instead of colliding. */
.pitch-overlay .pitch-flip { max-height: 100%; }
.pitch-overlay .pitch-face { max-height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch; }
/* Kept for the scene lightbox (entry fade + exit mirror). */
@keyframes pitchOverlayFade { from { opacity: 0; } to { opacity: 1; } }
@keyframes pitchOverlayFadeOut { from { opacity: 1; } to { opacity: 0; } }
.pitch-detail {
  position: relative;
  max-width: 460px;
  width: 100%;
  padding: 22px 22px 18px;
  background: var(--surface, #1a1422);
  border: 1px solid rgba(197,163,255,0.3);
  border-radius: 18px;
  box-shadow: 0 24px 60px rgba(0,0,0,0.7), 0 0 0 1px rgba(197,163,255,0.1);
}
.pitch-detail .pd-stage { display: flex; justify-content: center; padding: 4px 0 2px; }
.pitch-detail .pd-stack { position: relative; display: inline-block; }
.pitch-detail .pd-mora-row {
  display: flex; gap: 0;
  /* Round 13: the reading word — M PLUS Rounded 800 34px (>=30 so the
     screen stroke is legal), white + navy stroke + hard drop on the LD front. */
  font-family: var(--f-voice); font-weight: 800;
  font-size: 34px; line-height: 1.0;
  padding-top: 28px;
  /* Pulled from CSS vars set by JS at open-time per theme */
  color: var(--pd-mora-dim, #7e7095);
}
.pitch-detail:not(.pitch-back) .pd-mora-row .mora{
  -webkit-text-stroke:2.5px var(--ink-stroke);
  paint-order:stroke fill;
  text-shadow:0 3px 0 var(--ink-drop);  /* amedqe: BLACK drop (was navy --pd-drop #02103B) */
}
.pitch-detail .pd-mora-row .mora {
  display: inline-block; min-width: 1em; padding: 0 0.04em;
  text-align: center; position: relative;
  /* Smooth reveal — color + glow transition together. Every mora's
     reveal feels active (was: instant flicker, mostly visible only for
     lit-high). */
  transition: color 0.22s ease, text-shadow 0.22s ease, opacity 0.22s ease;
}
.pitch-detail .pd-mora-row .mora.drop-marker { min-width: 0.6em; font-size: 0.55em; color: var(--pd-mora-low, #A9B2D8); -webkit-text-stroke:0; opacity: 0.8; padding-left: 0.2em; }
/* lit-low: subtle glow added so the reveal is perceptible on low-pitch
   morae too — previously only lit-high got a glow, so low-pitch reveals
   read as "no change" and the user only noticed the high-pitch reveal. */
/* Round 13: the reveal is perceptible by BRIGHTNESS (dim -> low -> high),
   not by a soft glow. Taste law 4: the only blur in the app is the lyric
   glow strip; every mora keeps the same crisp hard drop as its base. */
.pitch-detail .pd-mora-row .mora.lit-low {
  color: var(--pd-mora-low, #A9B2D8);
  text-shadow: 0 3px 0 var(--ink-drop);
}
.pitch-detail .pd-mora-row .mora.lit-high {
  color: var(--pd-mora-high, #F4F6FF);
  text-shadow: 0 3px 0 var(--ink-drop);
}
/* Round 13: SQUARE-WAVE pitch contour. Neutral ink (#F4F6FF, 14.6:1 on the
   navy screen, NO role color, NO glow), 3px crispEdges, H/V plateaus only.
   A faint dot grid (8px cell, <5% modulation, >4px period — legal) sits ONLY
   behind the contour band, never behind kana. The per-mora 4x4 squares are
   visible neutral-ink markers that light on their audio window. */
.pitch-detail .pd-svg {
  position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible;
  background:radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px);
  background-size:8px 8px;
}
.pitch-detail.pitch-back .pd-svg{ background:none; }
.pitch-detail .pd-path-bg { stroke: rgba(244,246,255,0.22); stroke-width: 2; fill: none; shape-rendering:crispEdges; stroke-linecap: square; stroke-linejoin: miter; }
.pitch-detail .pd-path-fg { stroke: #F4F6FF; stroke-width: 3; fill: none; shape-rendering:crispEdges; stroke-linecap: square; stroke-linejoin: miter; }
.pitch-detail .pd-anchor { fill: rgba(244,246,255,0.55); shape-rendering:crispEdges; transition: fill 0.1s ease, opacity 0.1s ease; }
.pitch-detail .pd-anchor.lit-h { fill: #F4F6FF; }
.pitch-detail .pd-anchor.lit-l { fill: rgba(244,246,255,0.85); }
/* Leading-edge dot stays hidden (the square-wave per-mora dots carry the read);
   no glow filter anywhere on the contour (Taste Law 4). */
.pitch-detail .pd-dot { fill: #F4F6FF; opacity: 0; }
.pitch-detail .pd-dot { display: none !important; }
/* Meaning-first front: romaji line + definition + "hear the definition". */
.pitch-detail .pd-rom-line { font-family: var(--f-mono); font-size: 11px; letter-spacing: .06em; color: var(--pd-mora-low, #b4a7c8); text-align: center; margin-top: 6px; }
.pitch-detail .pd-card-divider { height: 1px; background: var(--pd-border, rgba(197,163,255,0.28)); margin: 12px 0; }/* vm9uvq: was 12px 2px — match the full-bleed flip strip rule, no random 2px inset */
.pitch-detail .pd-def { font-size: 19px; line-height: 1.3; color: var(--pd-mora-high, #f3e8ff); text-align: center; text-wrap: balance; }
.pitch-detail .pd-def-listen { position: relative; display: flex; width: fit-content; align-items: center; gap: 6px; margin: 12px auto 16px; padding: 7px 14px; border-radius: 999px; background: var(--pd-note-bg, rgba(197,163,255,0.12)); border: 1px solid var(--pd-border, rgba(197,163,255,0.28)); color: var(--pd-mora-high, #f3e8ff); font-size: 11.5px; letter-spacing: .02em; cursor: pointer; transition: background 120ms var(--ease-out), color 120ms var(--ease-out); }/* vm9uvq: margin-bottom 0->16px so the pill never collides with the IN CONTEXT strip's top border (flex item, no margin-collapse, so the gap is guaranteed) */
.pitch-detail .pd-def-listen:hover { background: var(--pd-accent-dim, rgba(197,163,255,0.2)); }
/* E4: pre-painted .playing ring (covers pd-def-listen AND pb-ctx-listen —
   the context button shares the class). In 120ms, out 200ms. */
.pitch-detail .pd-def-listen::after{
  content:"";position:absolute;inset:-1px;border-radius:inherit;
  border:1px solid var(--lab);box-shadow:0 0 0 1px rgba(255,255,255,.18);
  opacity:0;pointer-events:none;transition:opacity 200ms var(--ease-out);
}
.pitch-detail .pd-def-listen.playing::after{opacity:1;transition:opacity 120ms var(--ease-out)}
/* Replay affordance — the pitch animation auto-plays once on open; without a
   visible control nobody discovers that tapping the card replays it. The chip
   has NO handler of its own: its click bubbles to the face's tap-to-replay. */
/* vm9uvq (owner: "unified style, symmetrical borders"): the replay circle and the
   "hear the definition" pill are both audio affordances. The card's theme layer
   forces the pill to white-glass (see the !important overrides up top), so match
   the replay to THAT — same rgba(255,255,255,.12) fill + 1px inset ring — and add
   the same ring to the pill, so the two read as one family (and match the card's
   other glass controls). Circle vs pill keeps their different verbs legible. */
.pitch-detail .pd-replay { position: absolute; top: 12px; right: 12px; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color:#fff; border:0; background:rgba(255,255,255,.12); box-shadow:inset 0 0 0 1px rgba(255,255,255,.16); cursor: pointer; transition: color .15s, background .15s, transform .15s; }
.pitch-detail .pd-replay:hover { color:#fff; background:rgba(255,255,255,.2); }
.pitch-detail .pd-replay:active { transform: scale(.9); }
.pitch-detail.pitch-back .pd-replay { display: none; }
.pitch-detail .pd-def-listen.playing { background: var(--pd-accent-dim, rgba(197,163,255,0.3)); }
.pitch-back .pb-context-label { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--pd-mora-dim, #7e7095); margin-top: 18px; margin-bottom: 6px; }
/* Word-card bottom toolbar — mirrors the study sheet's slow/loop/play/share/close
   row (owner: those buttons should be on the word card too). Acts on the source LINE. */
.pitch-overlay .pd-toolbar { position:absolute; left:0; right:0; bottom:max(18px, calc(env(safe-area-inset-bottom,0px) + 14px)); padding:0 12px; display:flex; align-items:center; justify-content:center; z-index:3; pointer-events:none; }
.pitch-overlay .pd-toolbar .card-actions-tray { display:flex; align-items:center; gap:8px; width:100%; max-width:460px; justify-content:space-between; pointer-events:none; opacity:1; transform:none; overflow:visible; padding:8px 0; }
/* me8vg9: word-card toolbar = TRUE graphite denmoku keys, white glyphs — now
   byte-identical to the study-card toolbar (was translucent rgba(.32)/no-shadow,
   which read as a different button despite the "graphite" comment). */
.pitch-overlay .pd-toolbar .card-btn { width:48px; height:48px; border-radius:50%; padding:0; font-size:0; background:rgba(18,18,24,.32); border:0; color:#fff; box-shadow:inset 0 0 0 1px rgba(255,255,255,.10); pointer-events:auto; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all .18s var(--ease-out); } /* rlmpek: glass, matching the bottom-row controls */
.pitch-overlay .pd-toolbar .card-btn svg { width:24px; height:24px; }
.pitch-overlay .pd-toolbar .card-btn:active { transform:translateY(var(--travel)); box-shadow:inset 0 1px 0 var(--den-hi); transition:none; }
.pitch-overlay .pd-toolbar .card-btn.primary { width:48px; color:#FFFFFF; background:rgba(18,18,24,.32); } /* naofd1: play matches its siblings + the study toolbar (was .40, stood out) */
.pitch-overlay .pd-toolbar .card-btn.primary.playing,.pitch-overlay .pd-toolbar .card-btn.primary.active { box-shadow:inset 0 1px 0 var(--den-hi), inset 0 0 0 2px var(--den-red), 0 2px 0 #000; }
.pitch-overlay .pd-toolbar .card-btn.active { color:#FFFFFF; box-shadow:inset 0 1px 0 var(--den-hi), inset 0 0 0 2px color-mix(in srgb,#FFFFFF 40%,transparent), 0 2px 0 #000; }
.pitch-detail .pd-foot {
  display: flex; gap: 8px; align-items: center; justify-content: space-between;
  margin-top: 10px; font-size: 11px; color: var(--text-dim, #7e7095);
}
.pitch-detail .pd-foot .pd-info { font-family: var(--f-mono); font-size: 10px; }
.pitch-detail .pd-note { font-size: 12px; color: var(--pd-mora-dim, #b4a7c8); font-style: italic; margin-top: 8px; padding: 8px 10px; background: var(--pd-note-bg, rgba(197,163,255,0.08)); border-left: 3px solid var(--pd-accent, #c5a3ff); border-radius: 6px; }
.pitch-detail .pd-foot { margin-top: 12px; padding: 8px 0; font-size: 12px; color: var(--pd-mora-dim, #b4a7c8); text-align: center; }
.pitch-detail .pd-foot .pd-info { font-style: italic; }
/* Legend block inside the overlay — explains the accent type */
.pitch-detail .pd-legend {
  margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--pd-border, rgba(197,163,255,0.18));
  font-size: 11.5px; color: var(--pd-mora-dim, #b4a7c8); line-height: 1.55;
}
.pitch-detail .pd-legend .pl-row { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
.pitch-detail .pd-legend .pl-name { font-weight: 700; color: var(--pd-mora-high, #f3e8ff); font-size: 13px; }
.pitch-detail .pd-legend .pl-romaji { font-family: var(--f-mono); font-size: 10px; color: var(--pd-mora-dim, #7e7095); letter-spacing: 0.04em; }
.pitch-detail .pd-legend .pl-explain { color: var(--pd-mora-low, #d4c8e8); }
.pitch-detail .pd-legend .pl-hint { margin-top: 8px; font-size: 10.5px; color: var(--pd-mora-dim, #7e7095); text-align: center; letter-spacing: 0.02em; }

/* ─── Flip card · front = pitch reveal, back = English meaning ──────
 * The overlay card now has two faces on a 3D rotateY flip — same
 * metaphor (and timing) as the song page's study cards. The front
 * keeps everything it had (mora reveal + contour animation + accent
 * legend); the back carries the plain-English meaning. A flip strip
 * pinned to the bottom of each face turns the card over. */
.pitch-flip {
  max-width: 460px; width: 100%;
  perspective: 1600px; -webkit-perspective: 1600px;
  /* Round 12 (D2): entry is a JS-driven FLIP from the tapped chip's rect
     (460ms spring-pop) — the keyframe pop is gone. */
}
.pitch-flip-inner {
  position: relative;
  display: grid;
  transform-style: preserve-3d; -webkit-transform-style: preserve-3d;
  /* Round 12 (D3): NO height transition — both faces are measured once at
     open and the container height is swapped in one write at the 90-degree
     crossing (setFlipped), where the card is edge-on and the jump is
     invisible. Destination-state transitions: base = back-to-front (300ms,
     no overshoot), .flipped = front-to-back (460ms spring). */
  transition: transform 300ms var(--ease-in-out);
}
.pitch-flip-inner.flipped { transform: rotateY(180deg); transition: transform 460ms var(--spring-pop); }
/* Both faces share the single grid cell, so the container sizes to the
 * taller face and nothing resizes mid-flip. */
.pitch-flip .pitch-face {
  grid-area: 1 / 1;
  display: flex; flex-direction: column;
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
  animation: none !important; /* kill the per-face pop so the back doesn't flash */
}
.pitch-flip .pitch-face.pitch-back { transform: rotateY(180deg); }
/* Short fronts (brief def, no image) left a void between the def and the
   IN CONTEXT strip — the card is sized by the TALLER face. Auto top margin
   on the first child + the strip's own auto margin centers the content
   block in whatever height the back face dictates. */
.pitch-flip .pitch-detail > :first-child { margin-top: auto; }

/* Bottom flip affordance — "the bottom of the card flips it" */
.pitch-detail .pd-flip {
  margin-top: auto;            /* pin to the bottom of the (flex-column) face */
  margin-left: -22px; margin-right: -22px; margin-bottom: -18px; /* bleed to card edges */
  padding: 13px 22px;
  /* owner: no separating lines on the word card — the flip control reads as
     tappable from its label + icon + hover fill, no top border needed. */
  border-radius: 0 0 18px 18px;
  display: flex; align-items: center; justify-content: center; gap: 9px;
  font-family: var(--f-mono);
  font-size: 11.5px; font-weight: 700; letter-spacing: 0.05em;
  color: var(--pd-mora-low, #b4a7c8);
  cursor: pointer; user-select: none; -webkit-user-select: none;
  transition: color 0.16s ease, background 0.16s ease;
}
.pitch-detail .pd-flip:hover { color: var(--pd-mora-high, #f3e8ff); background: var(--pd-note-bg, rgba(197,163,255,0.08)); }
.pitch-detail .pd-flip:active { background: var(--pd-accent-dim, rgba(197,163,255,0.18)); }
.pitch-detail .pd-flip svg { width: 15px; height: 15px; opacity: 0.85; flex: none; }

/* Back face — English meaning explanation */
.pitch-detail.pitch-back { text-align: center; }
.pitch-back .pb-body { display: flex; flex-direction: column; justify-content: center; flex: 1 1 auto; padding: 14px 0; }/* symmetric top/bottom buffer (was 8/4 — lopsided once you read it as a framed block) */
.pitch-back .pb-word {
  font-family: var(--f-voice); font-weight: 700;
  /* Round 13: focus word in its ROLE hue (purple JP / orange particle), set
     via --pd-accent in the back palette (#B794F6 on #15121E = 6.4:1). */
  font-size: 27px; line-height: 1.1; color: var(--pd-accent, #B794F6);
}
.pitch-back .pb-rom {
  font-family: var(--f-mono); font-size: 11px;
  letter-spacing: 0.07em; color: var(--pd-mora-dim, #7e7095); margin-top: 4px;
}
.pitch-back .pb-divider { display: none; } /* owner: no separating lines — even spacing only */
/* The word's MEANING (definition). Prominent, like the old front definition.
   Even vertical rhythm to the blocks below; no dividers. */
.pitch-back .pb-def {
  font-family: var(--f-voice); font-weight: 400;
  font-size: 19px; line-height: 1.3; color: var(--pd-mora-high, #f3e8ff);
  text-wrap: balance; margin-top: 18px;
}
.pitch-back .pb-en {
  /* mana2 (owner, uniform cards): match the FRONT definition exactly (19px / 400 /
     lh 1.3, same M PLUS Rounded) so both faces of every word card read the same —
     was 22px/700, noticeably heavier than the front. */
  font-family: var(--f-voice); font-weight: 400;
  font-size: 19px; line-height: 1.3; color: var(--pd-mora-high, #f3e8ff);
}
.pitch-back .pb-hint {
  margin-top: 13px; font-size: 13.5px; line-height: 1.5;
  color: var(--pd-mora-low, #d4c8e8); text-wrap: balance;
}
.pitch-back .pb-listen { margin-top: 14px; font-size: 10.5px; letter-spacing: 0.03em; color: var(--pd-mora-dim, #7e7095); }
.pitch-back .pb-jisho { display: inline-block; margin: 14px auto 0; font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .04em; color: var(--pd-mora-dim, #7e7095); text-decoration: none; border-bottom: 1px dotted currentColor; padding-bottom: 1px; }

  display:flex; align-items:center; gap:8px;
  width:100%; justify-content:space-between;   /* slow left-anchored, book right-anchored, rest even */
  max-width:none; opacity:1; pointer-events:none; overflow:visible; transition:none;
}
/* Round 13: study tray = graphite denmoku key tray UNDER the paper. Keys are
   den-keys with WHITE glyphs (Taste Law 8: amber is the machine's voice only,
   never here). PLAY wears a --den-red 2px ring while playing. */
#cardSheet .card-actions .card-btn,
#cardSheet .card-actions .card-btn.primary,
.card.is-active #cardSheet .card-actions .card-btn{
  width:48px; height:48px; border-radius:50%; padding:0; font-size:0;  /* owner: circle, matching the Pitch toolbar (was a den-key rounded square) */
  background:linear-gradient(180deg,#262B33,#1A1E24 55%,#14171C);
  border:1px solid var(--den-lo);
  color:#E6E9EE;
  box-shadow:inset 0 1px 0 var(--den-hi), 0 2px 0 #000;
  pointer-events:auto;
  transition:none;
}
#cardSheet .card-actions .card-btn svg{ width:24px; height:24px; }
#cardSheet .card-actions .card-btn:active{ transform:translateY(var(--travel)); box-shadow:inset 0 1px 0 var(--den-hi); transition:none; }
/* PLAY: 1.4x wide key, white glyph; --den-red 2px ring while playing. */
#cardSheet .card-actions .card-btn.primary{
  width:48px;
  color:#FFFFFF;
  background:linear-gradient(180deg,#2E343D,#1F242B 55%,#181C22);
}
#cardSheet .card-actions .card-btn.primary.playing,
#cardSheet .card-actions .card-btn.primary.active{
  box-shadow:inset 0 1px 0 var(--den-hi), inset 0 0 0 2px var(--den-red), 0 2px 0 #000;
}
/* active toggle state — iOS "pressed": solid light fill, dark glyph, round key.
   LOOP + SLOW share it; no amber, no spin. (PLAY keeps its own --den-red ring.)
   !important on the fill beats the glass-key rule (#cardSheet .card-actions
   .card-btn{ background:…!important }) so the lit key actually reads light. */
#cardSheet .card-actions .card-btn.active{
  background:#EDECE6 !important;
  color:var(--den-body);
  border-color:#EDECE6;
}
/* Status toggles (⟳ repeat / 🐢 slow) live INSIDE the play/pause pill, after the
   time, and are ALWAYS shown in Sing view (the parent .u-tp-sing hides them in
   immerse). OFF = the plain bright icon, exactly as before. ON = a filled round
   chip that mirrors the study-book active key (#EDECE6 fill + dark glyph), so the
   two surfaces share one toggle language. Tap toggles the feature on/off. */
.u-tp-flag{ display:inline-flex; align-items:center; justify-content:center; width:21px; height:21px; border-radius:50%; cursor:pointer; }
.u-tp-flag.is-on{ background:#EDECE6; color:var(--den-body); }
.u-tp-flag svg{ width:13px; height:13px; }
/* hairline dividers between every pill element (▶ | 0:00 | ⟳ | 🐢). Coloured to
   match the pill frame border (rgba(255,255,255,.12)); the uniform pill gap on
   each side keeps them spaced a bit off the icons and everything evenly spaced. */
.u-tp-div{ flex:0 0 auto; align-self:center; width:1px; height:14px; background:rgba(255,255,255,.12); }
/* The moved-in back face: strip its flip transform + absolute fill so it
   lays out as normal flow inside the sheet. */
#cardSheet .card-face.back{
  position:static !important;
  transform:none !important;
  inset:auto !important;
  width:auto !important;height:auto !important;
  background:transparent !important;
  -webkit-backface-visibility:visible !important;backface-visibility:visible !important;
  display:block !important;
  padding:2px 12px 12px !important;
  overflow:visible !important;
  /* lzwgvu: auto top/bottom margins center the card in the flex-column body
     when it's shorter than the viewport; they collapse to 0 (top-anchored,
     fully scrollable) when the content overflows. flex-shrink:0 stops the
     flex column from squashing a tall card. */
  margin-top:auto !important;margin-bottom:auto !important;
  flex-shrink:0 !important;
}
/* Round 13 SONGBOOK: word chips become paper PRINT ROWS. Each tile is a paper
   cell with a 6px solid role-tab on its left edge, 1px paper-rule separator,
   JP word in paper-ink, romaji in role-INK (KILL the lavender/candy fills —
   role HUES survive only as tabs + inks, never as surfaces). */
#cardSheet .card-face.back .wc{
  background:var(--paper) !important;
  border:0 !important;
  border-bottom:1px solid var(--paper-rule) !important;
  border-left:6px solid var(--role-jp-ink) !important;
  border-radius:0 !important;
  padding:8px 10px !important;
}
#cardSheet .card-face.back .wc-jp{border-left-color:var(--role-jp-ink) !important}
#cardSheet .card-face.back .wc-jp .wc-main{color:var(--paper-ink) !important;font-weight:700 !important;font-size:1.7rem !important}/* vm9uvq (owner): bigger study words once the book is open — they're the hero of this view */
#cardSheet .card-face.back .wc-jp .wc-sub{color:var(--role-jp-ink) !important;font-size:.92rem !important}      /* #4C2691 on paper = 9.8:1; grown with the JP above */
#cardSheet .card-face.back .wc-jp.particle{border-left-color:var(--role-prt-ink) !important}
#cardSheet .card-face.back .wc-jp.particle .wc-main{color:var(--paper-ink) !important}
#cardSheet .card-face.back .wc-jp.particle .wc-sub{color:var(--role-prt-ink) !important} /* #9A4A00 on paper = 5.0:1 */
#cardSheet .card-face.back .wc-en{border-left-color:var(--role-en-ink) !important}
#cardSheet .card-face.back .wc-en .wc-main{color:var(--paper-ink) !important}
#cardSheet .card-face.back .wc-en .wc-sub{color:var(--role-en-ink) !important}
/* Tapped/playing print row: paper-shade fill + 2px paper-ink inset ring
   (NO amber highlighter — amber is reserved for the machine). */
#cardSheet .card-face.back .wc.playing{
  background:var(--paper-shade) !important;
  box-shadow:inset 0 0 0 2px var(--paper-ink) !important;
}
/* gear/star belong to the flip-card chrome; not needed in the sheet */
#cardSheet .card-gear,
#cardSheet .card-star{display:none !important}
/* k0dxk2: the intro card's back IS the page how-to. The sheet lays it out as a
   plain block, so re-center it here (the book beckons users straight into this
   view) and pad the bottom so the closing line clears the fixed toolbar. */
#cardSheet .intro-face-back{ text-align:center !important; padding-bottom:78px !important; }
#cardSheet .intro-face-back .intro-back-list{ margin-left:auto !important; margin-right:auto !important; }
#cardSheet .intro-face-back .intro-back-lead{ margin-left:auto !important; margin-right:auto !important; }
#cardSheet .intro-face-back .intro-back-foot{ width:100%; text-align:center; }
/* the toolbar spans the FULL width: slow is anchored to the LEFT edge, the book
   to the RIGHT edge (exactly where the floating open-book corner button sits, so
   open/close share one location), and loop/play/share are evenly distributed
   between them. Left/right padding match the corner buttons' insets. */
#cardSheet .card-actions{
  justify-content:stretch !important;
  margin-inline:0 !important;
  padding-left:max(16px, calc(env(safe-area-inset-left,0px) + 12px)) !important;
  padding-right:max(16px, calc(env(safe-area-inset-right,0px) + 12px)) !important;
}
/* naofd1 (owner: unify the study + pitch bottom toolbars so the 5 buttons hold the
   SAME position + look across cards, at EVERY screen width). They were separate
   components: study sat 8px lower with 16px gutters; pitch sat 8px higher (an 8px
   tray padding), 12px gutters, a max-width:460 tray, and a heavier play fill. One
   shared spec now drives both: same bottom; safe-area-aware 16px side gutters (so
   a notched landscape doesn't shove them under the cutout); a capped + CENTERED
   440px tray so on wide screens the row stays grouped instead of flinging the
   outer buttons to the screen edges; 8px gaps; no vertical tray padding. */
#cardSheet .card-actions,
.pitch-overlay .pd-toolbar{
  bottom:max(18px, calc(env(safe-area-inset-bottom,0px) + 14px)) !important;
  justify-content:center !important;
  gap:0 !important;
  padding-top:0 !important; padding-bottom:0 !important;
  padding-left:max(16px, calc(env(safe-area-inset-left,0px) + 12px)) !important;
  padding-right:max(16px, calc(env(safe-area-inset-right,0px) + 12px)) !important;
  margin-inline:0 !important;
}
#cardSheet .card-actions-tray,
.pitch-overlay .pd-toolbar .card-actions-tray{
  width:100% !important;
  max-width:440px !important;
  margin:0 auto !important;
  justify-content:space-between !important;
  align-items:center !important;
  gap:8px !important;
  padding:0 !important;
}
/* ===== LONG-LINE STUDY-CARD SCROLL/ANCHOR (2026-07, owner: "scroll only the
   words while keeping the buttons in place at the bottom including the word by
   word"). the reference song's own lines max out at 6 study words so this was never
   exercised here; Odoriko/Shinunoga (and future songs) have 10-word lines whose
   word grid overflowed and collided with the fixed transport row + the
   Word-by-Word pill. Make a real study card a flex column that reserves the
   fixed-transport band, scrolls ONLY its .study-wrap word grid, and anchors the
   Word-by-Word + Explainer pills as a footer just above the transport. Scoped to
   #cardSheet + :has(.study-wrap) so (a) the sing-mode inline translation pill is
   untouched and (b) the intro/how-to back face keeps its native centering.
   Verified headless at 390x844 on 6- and 10-word lines: zero overlap, words
   scroll clear, short lines still centered. Every cloned song inherits this. */
#cardSheet .card-face.back:has(.study-wrap){
  display:flex !important;
  flex-direction:column !important;
  height:100% !important;
  box-sizing:border-box !important;
  margin:0 !important;
  overflow:hidden !important;
  /* #sheetBody already reserves the fixed-transport band at its own bottom, so
     the face only needs a hair of breathing room — this drops the Word-by-Word
     pill to just above the transport (owner: "directly above the play/share/back
     buttons") instead of floating ~112px up. */
  padding-bottom:6px !important;
}
#cardSheet .card-face.back .study-wrap{
  flex:1 1 auto !important;
  min-height:0 !important;
  overflow-y:auto !important;
  display:flex !important;
  flex-direction:column !important;
  justify-content:safe center !important;
  /* mana (owner): fade BOTH ends like the lyric list so words dissolve into the
     chrome ("fade top and bottom"). The bottom fade sits directly above the
     Word-by-Word pill + play/share/back transport row (both live below this wrap),
     so a word dissolves before it would slide under them. The drill center-anchors
     the heard row in the clear band. This scroller only moves on drill auto-scroll,
     not per frame, so the double mask is cheap. */
  -webkit-mask-image:linear-gradient(to bottom, transparent 0, #000 30px, #000 calc(100% - 34px), transparent 100%) !important;
          mask-image:linear-gradient(to bottom, transparent 0, #000 30px, #000 calc(100% - 34px), transparent 100%) !important;
}
#cardSheet .card-face.back .card-translation.has-translation,
#cardSheet .card-face.back .card-section-overview.has-overview{
  flex:0 0 auto !important;
}
/* The Word-by-Word pill wears the PLAY-key look (owner): graphite den-key gradient,
   slightly translucent so the field breathes through, white glyph; when playing it
   takes the same solid light fill (#EDECE6) as the active transport toggles. No
   more standalone wine band. */
#cardSheet .card-translation.has-translation{
  background:linear-gradient(180deg, rgba(46,52,61,.92), rgba(31,36,43,.92) 55%, rgba(24,28,34,.92)) !important;
  color:#FFFFFF !important;
  border:1px solid var(--den-lo) !important;
  box-shadow:inset 0 1px 0 var(--den-hi), 0 2px 0 #000 !important;
}
#cardSheet .card-translation.has-translation .pill-label{ color:#FFFFFF !important; }
#cardSheet .card-translation.has-translation:active{ transform:translateY(var(--travel)) !important; }
#cardSheet .card-translation.has-translation.playing{
  background:#EDECE6 !important;
  color:var(--den-body) !important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4), 0 2px 0 #000 !important;
}
#cardSheet .card-translation.has-translation.playing .pill-label{ color:var(--den-body) !important; }
/* ============================================================
   Round 12 (E/F/D) — small-state pattern, drill visual track,
   icon crossfade, sheet arrival pulse.
   ============================================================ */
/* E1: shared enter/exit pattern. Display-toggled elements flip display,
   wait a frame, then add .in so the transition actually runs. Mid-phrase
   (singing) appearances use .ui-fade-in instead — opacity only, no motion
   behind the live lyric. */
.ui-enter{opacity:0;transform:translateY(4px)}
.ui-enter.in{opacity:1;transform:none;transition:opacity var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out)}
.ui-exit{opacity:0 !important;transition:opacity 100ms var(--ease-in)}
.ui-fade-in{animation:uiFadeIn 160ms var(--ease-out) both}
@keyframes uiFadeIn{from{opacity:0}}

/* E6: play/pause glyph swap — a scale dip-and-return on the host svg.
   Out 80ms ease-in to scale .8 / opacity .4; the <use> href swaps at the
   dip's bottom (JS, 80ms); back in 140ms ease-out. (The stacked-glyph
   crossfade would mean restructuring every play-icon SVG; the dip is the
   sanctioned fallback.) */
.icon-swap-host{transition:transform 140ms var(--ease-out), opacity 140ms var(--ease-out)}
.icon-swap-host.icon-out{transform:scale(.8);opacity:.4;transition:transform 80ms var(--ease-in), opacity 80ms var(--ease-in)}

/* F: drill visual track. While the sheet's Word-by-Word drill runs, every
   row dims; the row being heard lifts 200ms before its JP clip and HOLDS
   through the EN gloss (the transfer window), wearing the E4 ring. */
/* Round 13: drill on paper. Dimmed rows fall to .30 (delta .70 >= .65 floor);
   the heard row lifts to full and wears a paper-ink inset ring (no lavender,
   no glow — the focal row reads as the inked print row). */
.card-face.back.drill-live .word-row{
  opacity:.30;
  transition:opacity 150ms var(--ease-out), transform 240ms var(--ease-lift);
}
.card-face.back.drill-live .word-row.drill-hot{
  opacity:1;
  transform:translateY(-2px) scale(1.03);
  transition:opacity 150ms var(--ease-out), transform 160ms var(--ease-out);
}
/* mana (owner): word-level focus — grade the drill's neighbour rows by distance
   from the heard row (like the sing list's .dist-p* depth-of-field) instead of the
   flat .30, so the eye lands on the word being spoken. No blur — keeps mobile
   scroll smooth. The heard row (.drill-hot, above) stays full brightness. */
.card-face.back.drill-live .word-row.drill-d1{opacity:.52}
.card-face.back.drill-live .word-row.drill-d2{opacity:.34}
.card-face.back.drill-live .word-row.drill-d3{opacity:.22}
.word-row .wc-jp{position:relative}
/* Round 14 (owner): the active word's marker used to be an inset ring on the JP
   cell — on the study sheet's dark back face (white word text) it read as "two
   white lines above/below." Removed. The reveal now reuses the SAME mechanism the
   lit pitch mora uses — and in the very same visual world: the study sheet's back
   face is white text on the dark --paper, exactly like the pitch card's dim->bright
   morae. Every row dims to .30 (upcoming); the heard row rises to full white + the
   2px .hit lift (rules above). That brightness step IS the "now" cue. No box, no
   glow, no layout shift. Driven off the timing map (currentTime), like both reveals. */

/* D1: arrival pulse — one paper-shade breath, no lavender. */
.sheet-arrive{animation:sheetArrivePulse 650ms var(--ease-in-out) both}
@keyframes sheetArrivePulse{
  0%{background-color:rgba(229,220,196,0)}
  31%{background-color:rgba(229,220,196,.55)}
  100%{background-color:rgba(229,220,196,0)}
}

@media (prefers-reduced-motion: reduce){
  /* G: tokens shrink; everything below collapses BY PATTERN (no blanket
     transition:none — the wipe, drill dims, pause raise and arrival pulse
     are kept deliberately). */
  :root{--dur-gentle:150ms;--dur-std:150ms;--dur-fast:100ms}
  .corner-btn{transition-duration:.05s !important}
  /* Stop the infinite attractor blinks for motion-sensitive users. */
  .u-mode-chip.active::before{animation:none !important}
  /* lw4x1m: hold the book beckon still (keep the white glyph + a faint white halo as the cue). */
  #openCardsBtn.book-beckon::after{animation:none !important;opacity:.28 !important;transform:none !important}
  .intro-cta--blink,.intro-cta.is-loading{animation:none !important;opacity:1 !important}
  /* Surfaces collapse to opacity-only. */
  #cardSheet .sheet-panel{transform:none !important;transition:opacity 160ms ease !important}
  .pitch-overlay .pitch-flip{transform:none !important;transition:opacity 160ms ease !important}
  .scene-lightbox img{transform:none !important;animation:none !important;transition:opacity 160ms ease !important}
  .u-master-topbar[data-menu-open="true"] .u-tb-row--menu{animation:rmFadeIn 160ms ease !important}
  .u-master-topbar[data-menu-open="false"] .u-tb-row--menu:not([hidden]){animation:rmFadeOut 100ms ease forwards !important}
  .u-mode-section.mode-entering{animation:rmFadeIn 160ms ease both !important}
  .card.intro .intro-countdown,.card.intro .intro-cta-stack{transform:none !important;transition-duration:100ms !important;transition-delay:0ms !important}
  .ui-enter{transform:none !important}
  /* Flip: 200ms turn, no spring; the JS height swap (~100ms in) stays.
     (A true face crossfade is blocked by the faces' inline opacity:1
     !important pins — see faceCss in expandPitchRow.) */
  .pitch-flip-inner{transition-duration:200ms !important;transition-timing-function:ease !important}
  /* Handoff scale pinned 1.0, tiers opacity-only at 200ms (overrides the
     engine block's transition:none at ~645 — spec G keeps a soft fade);
     stack scroll linear; lyric lifts die. */
  .u-mode-section[data-mode="sing"] .card .card-text-wrap{transform:none !important}
  .u-mode-section[data-mode="sing"] .card .card-text{transition:opacity 200ms ease !important}
  .card-stack.momentum{transition:transform 150ms linear !important}
  .tok-char.pre,.tok-char.hit{transform:none !important}
  .wipe-glow{opacity:.6 !important;transition:none !important}
  /* Flourishes: fly-off becomes a 150ms fade in place (transform:none would
     snap the card off its stack position); burst/stamp/pulse/spin die. */
  .card.flying-right,.card.flying-left{animation:rmFadeOut 150ms ease forwards !important}
  .card-star.burst{animation:none !important}
  .card.stamping-got .rate-stamp--got,.card.stamping-need .rate-stamp--need{animation:none !important}
  .u-tp-info--mode.is-pulse{animation:none !important}
  .u-tp-info--mode.is-pulse::before{animation:none !important}
  /* Drill: keep the dims + cadence, drop the chip lift. */
  .word-row.drill-hot{transform:none !important}
  /* Play/pause crossfade kept, shortened to 100ms. */
  .icon-swap-host,.icon-swap-host.icon-out{transition-duration:100ms !important}
}
@keyframes rmFadeIn{from{opacity:0}to{opacity:1}}
@keyframes rmFadeOut{to{opacity:0}}
/* Sing↔Learn switch: the incoming section eases in instead of popping.
   Animation (not transition) because the section comes from display:none.
   Round 12 (E2): opacity + a 6px rise over 240ms. */
.u-mode-section.mode-entering{animation:modeEnter 240ms var(--ease-out) both}
@keyframes modeEnter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ============================================================
 * Build 84d9lk — full-width segmented VFD transport bar
 * + iOS-style drum wheel picker (verse / line)
 * The Verse | Line | Time | Mode pill leaves its small centered
 * window and becomes a full-width bracketed VFD bar that drops
 * BELOW the title + album-art row, edge to edge, with larger
 * phosphor text. Theme-aware (mint-on-charcoal dark / mint-on-ink
 * light). Tapping Verse or Line opens a momentum wheel picker.
 * ============================================================ */

/* --- Layout: strip clearance off the stack, move it to the title
   row only, so the transport bar runs full width. The title row's
   min-height reserves the album-art vertical zone so the bar lands
   below the art rather than beside it. --- */
.u-master-topbar > .u-tb-stack{
  padding-left:0 !important; padding-right:0 !important;
  gap:10px !important;
}
.u-master-topbar .u-tb-row--meta{
  display:flex !important; align-items:center;
  padding:0 132px 0 56px;
  min-height:98px;
}
.u-master-topbar .u-tb-row--transport{
  width:100% !important;
  min-height:0 !important;
  padding:0 !important;
  margin:0 !important;
  justify-content:stretch !important;
  display:flex !important;
}
.u-master-topbar{min-height:162px !important;}

/* --- The bar: a row of bracketed VFD cells, edge to edge --- */
.u-master-topbar .u-counter{
  display:flex !important;
  width:100% !important;
  height:auto !important;
  min-height:0 !important;
  align-items:stretch !important;
  gap:7px;
  padding:0 !important;
  background:transparent !important;
  border:0 !important;
  box-shadow:none !important;
  border-radius:0 !important;
  overflow:visible !important;
}
/* Round 13: transport cells = one continuous amber LCD well. den-lcd ground,
   recessed inset, 1px den-lo dividers, DotGothic16 amber digits. */
.u-master-topbar .u-counter .u-tp-info{
  flex:1 1 auto;
  display:flex; align-items:center; justify-content:center;
  text-align:center; white-space:nowrap;
  padding:10px 8px !important;
  font-size:.92rem !important;
  letter-spacing:.06em !important;
  line-height:1.1 !important;
  border:1px solid var(--den-lo) !important;
  border-radius:var(--r-lcd);
  background:var(--den-lcd);
  box-shadow:
    inset 0 2px 6px rgba(0,0,0,0.8),
    0 1px 0 rgba(255,255,255,0.05);
}
/* tappable cells get a pressed/active phosphor lift */
.u-master-topbar .u-counter .u-tp-info--btn{cursor:pointer;transition:border-color .14s,box-shadow .14s;}
.u-master-topbar .u-counter .u-tp-info--btn:active,
.u-master-topbar .u-counter .u-tp-info--btn[aria-expanded="true"]{
  border-color:color-mix(in srgb,var(--chrome-led) 70%, var(--chrome-hard)) !important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.05),inset 0 2px 4px rgba(0,0,0,0.7),
             0 0 10px color-mix(in srgb,var(--chrome-led) 30%,transparent);
}
/* Press-drag scrub: every counter cell is grabbable. Press and drag to
   preview a target (vertical for section/line/mode, horizontal for time),
   release to commit. touch-action:none stops the page scrolling mid-drag;
   the cursor hints the drag axis; .is-scrubbing lights the cell phosphor. */
.u-master-topbar .u-counter .u-tp-info{
  touch-action:none; -webkit-user-select:none; user-select:none;
}
.u-master-topbar .u-counter .u-tp-info--section,
.u-master-topbar .u-counter .u-tp-info--mode,
.u-master-topbar .u-counter [data-page-item="linePos"]{cursor:ns-resize;}
.u-master-topbar .u-counter [data-page-item="timeNow"]{cursor:ew-resize;display:inline-flex;align-items:center;gap:.42em;}
/* Tiny play/pause glyph in the elapsed-time cell — mirrors the transport's
   play state so the cell reads as the play/pause control it doubles as. */
.u-time-pp{width:13px;height:13px;flex:0 0 auto;opacity:1;}
.u-master-topbar .u-counter .u-tp-info.is-scrubbing{
  border-color:var(--chrome-led) !important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.06),inset 0 2px 4px rgba(0,0,0,0.7),
             0 0 14px color-mix(in srgb,var(--chrome-led) 55%,transparent) !important;
}
.u-master-topbar .u-counter .u-tp-info.is-scrubbing b{color:var(--chrome-led);}

/* ----- Song-progress bar under the counter row ----------------------------
   An always-visible scrubber: grey track that fills white with elapsed
   progress, with a draggable thumb. Touch anywhere on it and slide to scrub
   the song (position on the bar = position in the song). The whole .u-counter-
   scrub box is the touch target (taller than the visible track so it's easy to
   grab); the track + fill + thumb live inside it. Absolutely positioned against
   .u-counter so it doesn't become a 5th flex cell. */
.u-master-topbar .u-counter{position:relative;}
.u-counter-scrub{
  position:absolute; left:0; right:0; top:calc(100% + 1px);
  height:22px; display:flex; align-items:center;
  pointer-events:auto; touch-action:none; cursor:pointer; z-index:2;
  -webkit-user-select:none; user-select:none;
}
.u-counter-progress{
  position:relative; width:100%; height:5px; border-radius:3px;
  background:rgba(255,255,255,0.16);
  transition:height .14s ease, background .14s ease, box-shadow .14s ease;
}
.u-counter-progress-fill{
  position:absolute; left:0; top:0; bottom:0; width:100%;
  background:var(--chrome-led); border-radius:3px;   /* always the LED colour, never white */
  transform:scaleX(0); transform-origin:left center;
  transition:transform 90ms linear;   /* round 12: compositor-only fill */
}
/* While dragging, just thicken the bar slightly + add a soft glow. The fill
   keeps its colour the whole time (no white-to-colour flip). */
.u-counter-scrub.is-scrubbing .u-counter-progress{
  height:9px;
  background:rgba(255,255,255,0.26);
  box-shadow:0 0 12px color-mix(in srgb,var(--chrome-led) 50%,transparent);
}
.u-counter-scrub.is-scrubbing .u-counter-progress-fill{ transition:none; }
/* Light theme: topbar is cream, so use the ink/lab colour for the track + fill. */

@media (max-width:520px){
  .u-master-topbar{min-height:128px !important;}
  .u-master-topbar .u-tb-row--meta{padding:0 84px 0 48px; min-height:70px;}
  .u-master-topbar .u-counter{gap:5px;}
  .u-master-topbar .u-counter .u-tp-info{
    padding:8px 4px !important; font-size:.8rem !important; letter-spacing:.03em !important;
  }
}
@media (min-width:900px){
  .u-master-topbar{min-height:190px !important;}
  .u-master-topbar .u-tb-row--meta{padding:0 144px 0 60px; min-height:118px;}
  .u-master-topbar .u-counter{gap:9px;}
  .u-master-topbar .u-counter .u-tp-info{padding:12px 10px !important; font-size:1.12rem !important;}
}

/* ===== iOS-style drum wheel picker ===== */
.u-wheel-overlay{
  position:fixed; inset:0; z-index:400;
  display:flex; align-items:flex-end; justify-content:center;
  /* z1wqyt (owner): the SKIP-TO-LINE / JUMP-TO-SECTION wheels were the last flat
     near-black slab. Lighten the screen-dim to a soft warm veil so the living
     field stays visible behind, and let the sheet itself be frosted glass. */
  background:rgba(8,5,12,.34);
  -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px);
  opacity:0; transition:opacity .22s ease;
}
.u-wheel-overlay.is-open{opacity:1;}
.u-wheel-overlay[hidden]{display:none;}
.u-wheel{
  width:100%; max-width:520px;
  /* Frosted glass instead of opaque var(--surface): translucent warm-dark so the
     field glows through, a backdrop-blur for legibility, a soft white hairline
     (was a hard var(--chrome-hard) border) and a lighter shadow. */
  background:rgba(20,15,23,.55);
  -webkit-backdrop-filter:blur(26px) saturate(1.3); backdrop-filter:blur(26px) saturate(1.3);
  border:1px solid rgba(255,255,255,.12); border-top:1px solid rgba(255,255,255,.18); border-bottom:0;
  border-radius:18px 18px 0 0;
  box-shadow:0 -10px 40px rgba(0,0,0,.32);
  transform:translateY(102%);
  transition:transform .22s cubic-bezier(.22,.61,.36,1);
  padding-bottom:env(safe-area-inset-bottom,0);
  overflow:hidden;
}
.u-wheel-overlay.is-open .u-wheel{transform:translateY(0);}
.u-wheel-head{
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 12px;
  border-bottom:1px solid color-mix(in srgb,var(--text) 12%,transparent);
}
.u-wheel-title{
  font-family:var(--f-ui); font-size:.7rem; letter-spacing:.16em;
  text-transform:uppercase; color:var(--text-muted);
}
.u-wheel-btn{
  appearance:none;-webkit-appearance:none; border:0; background:transparent;
  font-family:var(--f-ui); font-size:.98rem; font-weight:600;
  padding:6px 10px; cursor:pointer; border-radius:8px;
}
.u-wheel-btn--cancel{color:var(--text-muted);}
.u-wheel-btn--done{color:var(--lab); font-weight:700;}
.u-wheel-btn:active{background:color-mix(in srgb,var(--text) 8%,transparent);}
.u-wheel-viewport{position:relative; height:220px; overflow:hidden;}
.u-wheel-scroll{
  height:100%; overflow-y:auto; overflow-x:hidden;
  scroll-snap-type:y mandatory; -webkit-overflow-scrolling:touch;
  scrollbar-width:none; perspective:900px; touch-action:pan-y;
}
.u-wheel-scroll::-webkit-scrollbar{display:none;}
.u-wheel-item{
  height:44px; scroll-snap-align:center;
  display:flex; align-items:center; justify-content:center; gap:12px;
  font-family:var(--f-voice); font-size:1.06rem; color:var(--text);
  padding:0 20px; will-change:transform,opacity;
  transform-style:preserve-3d; backface-visibility:hidden;
  cursor:pointer; user-select:none; -webkit-user-select:none;
}
.u-wheel-item .wi-idx{
  font-family:var(--f-ui); font-size:.74rem; color:var(--text-dim);
  min-width:2.2em; text-align:right; flex-shrink:0;
}
.u-wheel-item .wi-main{
  font-family:var(--f-voice);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.u-wheel-item .wi-sub{
  font-family:var(--f-ui); font-size:.78rem; color:var(--text-muted); flex-shrink:0;
}
.u-wheel-item.is-centered{color:var(--lab); font-weight:600;}
.u-wheel-band{
  position:absolute; left:12px; right:12px; top:50%; height:44px;
  transform:translateY(-50%); pointer-events:none; z-index:1;
  border-top:1px solid color-mix(in srgb,var(--lab) 55%,transparent);
  border-bottom:1px solid color-mix(in srgb,var(--lab) 55%,transparent);
  background:color-mix(in srgb,var(--lab) 9%,transparent);
  border-radius:8px;
}
.u-wheel-viewport::before,.u-wheel-viewport::after{
  content:''; position:absolute; left:0; right:0; height:78px; pointer-events:none; z-index:2;
}
/* z1wqyt: drum-edge fades tinted to the glass (was opaque var(--surface), which
   painted flat-black bands on the frosted sheet) — fade to transparent so the field
   glow carries to the sheet edges. */
.u-wheel-viewport::before{top:0; background:linear-gradient(rgba(20,15,23,.80),rgba(20,15,23,0));}
.u-wheel-viewport::after{bottom:0; background:linear-gradient(rgba(20,15,23,0),rgba(20,15,23,.80));}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- ============================================================
         Chunky icon family v3 - matched set for the cassette console
         ------------------------------------------------------------
         Rules (kept consistent across every symbol):
           • 20x20 viewBox, shapes fill it with ~2px breathing room
           • Solid fills for "mass" (play, pause, first, pencil, sun,
             moon, turtle, speakers, star, fast, sliders)

             (chevrons, refresh, loop, copy, trash, check, close, brain)

           • All `currentColor` so theme + .on state tint them correctly

      <polygon points="5,3 5,17 17,10" fill="currentColor" stroke="none"/>
    </symbol>
    <symbol id="i-pause" viewBox="0 0 20 20">
