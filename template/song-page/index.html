  const _blurEl = document.createElement('div');
  _blurEl.className = 'pd-blur';
  _blurEl.style.cssText = 'position:absolute;inset:0;-webkit-backdrop-filter:none;backdrop-filter:none;opacity:0;pointer-events:none;';
  overlay.appendChild(_dimEl);
  overlay.appendChild(_blurEl);
  const detail = document.createElement('div');
  detail.className = 'pitch-detail pitch-face';
  detail.dataset.themeMode = isLight ? 'light' : 'dark';
  detail.style.cssText = faceCss(frontPalette);
  let accentType = pData ? pData.accent_type : 'unknown';
  const isKansai = pData && pData.confidence === 'kansai';
  detail.classList.add(accentType);
  if (isKansai) detail.classList.add('kansai');

  const morae = (pData && pData.morae) || _fallbackMorae(jpKey);
  const accent = pData ? pData.accent : 0;
  const isOdaka = accent >= morae.length && accent > 0;
  const pat = _patternFor(accent, morae.length);
  const info = _ACCENT_INFO[isKansai ? 'kansai' : accentType] || _ACCENT_INFO.unknown;

  const moraHtml = morae.map((m, i) =>
    `<span class="mora" data-idx="${i}" data-hl="${pat[i]||'L'}">${m}</span>`
  ).join('') + (isOdaka ? `<span class="mora drop-marker" data-idx="${morae.length}" data-hl="drop">↘</span>` : '');

  // Meaning-first card (learner redesign). The FRONT shows the word with its
  // animated pitch reveal (line + characters appearing over time — NO dots, NO
  // accent-type theory; "just see it") and the DEFINITION beneath it, plus a
  // tap-to-hear-the-definition control. The BACK explains the word IN CONTEXT
  // (this line + the song). The pitch-accent *lesson* is gone from this card.
  //
  // English data rides on the row as data-attrs:
  //   data-en        = short display gloss (may contain romaji like "pinsaro
  //                    (slang)") — DISPLAY ONLY, never spoken.
  //   data-en-speak  = curated English definition; matches the en audio clip.
  //   data-en-hint   = terse contextual note (fallback for the in-context face).
  //   data-en-context= richer in-context explanation (Change 3; falls back to hint).
  const enMain    = (row.dataset.en || '').trim();
  const enHint    = (row.dataset.enHint || '').trim();
  const enSpeak   = (row.dataset.enSpeak || enMain).trim();
  const enContext = (row.dataset.enContext || enHint).trim();
  const enAudioUrl = _audioUrlFor(secId, uidKey, 'en');
  // In-context explanation audio (back face). Generated per word from `context`.
  const ctxAudioUrl = enContext ? _audioUrlFor(secId, uidKey, 'ctx') : null;
  // Scene image (dual-coding: pair the word with a nonverbal channel so the
  // concept gets a second retrieval route — picture-superiority). Served like
  // audio via the _redirects rewrite; only concrete/imageable words have one,
  // so the frame stays hidden until the image actually loads and is removed
  // on 404. Filename mirrors the audio convention.
  const sceneImgUrl = `images/word_${secId}_${_romUid(uidKey)}.webp`;
  // Definition shown on the front = the curated English (matches the audio and
  // is always clean English — never the romaji display gloss).
  const frontDef  = enSpeak || enMain;

  detail.innerHTML = `
    <div class="pd-stage">
      <div class="pd-stack">
        <svg class="pd-svg" preserveAspectRatio="none"></svg>
        <div class="pd-mora-row jp">${moraHtml}</div>
      </div>
    </div>
    ${rom ? `<div class="pd-rom-line">${escapeHtml(rom)}</div>` : ''}
    <div class="pd-flip" data-flip="back" role="button" tabindex="0" aria-label="Flip to definition and context">
      <span class="pd-flip-label">DEFINITION AND CONTEXT</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg>
    </div>
  `;

  // ── Back face — what the word means IN CONTEXT (this line + the song) ──
  const back = document.createElement('div');
  back.className = 'pitch-detail pitch-face pitch-back';
  back.dataset.themeMode = isLight ? 'light' : 'dark';
  back.style.cssText = faceCss(backPalette); // blue, matching the EN-meaning tile
  back.innerHTML = `
    <div class="pb-body">
      <div class="pb-word">${escapeHtml(jpKey)}</div>
      ${rom ? `<div class="pb-rom">${escapeHtml(rom)}</div>` : ''}
      <div class="pb-def">${escapeHtml(frontDef) || '—'}</div>
      ${enContext ? `<div class="pb-context-label">in this line</div>
      <div class="pb-en">${escapeHtml(enContext)}</div>` : ''}
      <div class="pb-links"><a class="pb-jisho" href="https://jisho.org/search/${encodeURIComponent(jpKey)}" target="_blank" rel="noopener noreferrer" aria-label="Open in Jisho dictionary">jisho.org ↗</a><a class="pb-jisho" href="https://youglish.com/pronounce/${encodeURIComponent(jpKey)}/japanese" target="_blank" rel="noopener noreferrer" aria-label="Hear it in real speech on YouGlish">hear it in the wild ↗</a></div>
    </div>
    <div class="pd-flip" data-flip="front" role="button" tabindex="0" aria-label="Flip back to the word">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg>
      <span class="pd-flip-label">WORD</span>
    </div>
  `;

  // Scene-image frame tap: bound via pointerup (NOT click-only) because the
  // overlay's backdrop-dismiss installs a 700ms capture-phase ghost-click
  // swallow that eats click handlers on iOS (the v0.31 lesson, which this
  // frame originally fell victim to). pointerup fires before the synthesized
  // click and isn't swallowed; the click fallback keeps keyboard/AT working,
  // deduped by timestamp.
  const _imgFrame = back.querySelector('.pb-img-frame');
  if (_imgFrame){
    let _lastImgOpen = 0;
    const _openScene = (e) => {
      e.stopPropagation(); e.preventDefault();
      const now = performance.now();
      if (now - _lastImgOpen < 400) return;
      _lastImgOpen = now;
      openSceneLightbox(_imgFrame);
    };
    _imgFrame.addEventListener('pointerup', _openScene);
    _imgFrame.addEventListener('click', _openScene);
  }

  // Jisho deep-dive link: navigation must not double as a card tap (the
  // face's tap-to-replay/flip handlers sit above it in the bubble path).
  back.querySelectorAll('.pb-jisho').forEach(a => {
    a.addEventListener('pointerup', (e) => e.stopPropagation());
    a.addEventListener('click', (e) => e.stopPropagation());
  });

  // Flip mechanism — front and back ride a single rotateY inner.
  const flip = document.createElement('div');
  flip.className = 'pitch-flip';
  // The dim/blur children are positioned; the flip must be too, or it
  // paints UNDER them (positioned boxes beat static ones in paint order).
  flip.style.position = 'relative';
  flip.style.zIndex = '1';
  const flipInner = document.createElement('div');
  flipInner.className = 'pitch-flip-inner';
  flipInner.appendChild(detail);
  flipInner.appendChild(back);
  flip.appendChild(flipInner);
  overlay.appendChild(flip);
  document.body.appendChild(overlay);

  // ── D2 entry choreography ──
  // Dim fades up; blur snaps on only after the dim's transitionend (so the
  // expensive filter never paints mid-animation). The card FLIPs from the
  // tapped chip's rect to its centered resting place: translate+scale start
  // transform, released to identity on a 460ms spring; opacity rides a
  // shorter 140ms fade. The chip vector is kept for the exit (25% back).
  requestAnimationFrame(() => { _dimEl.style.opacity = '1'; });
  const _onDimEnd = (ev) => {
    if (ev.propertyName !== 'opacity') return;
    _dimEl.removeEventListener('transitionend', _onDimEnd);
    if (!overlay._closing) _blurEl.style.opacity = '1';
  };
  _dimEl.addEventListener('transitionend', _onDimEnd);
  let _entryDone = false, _pendingAuto = null;
  const _whenEntryDone = (fn) => { if (_entryDone) fn(); else _pendingAuto = fn; };
  const _finishEntry = () => {
    if (_entryDone) return;
    _entryDone = true;
    flip.style.transition = '';
    flip.style.transform = '';
    if (_pendingAuto){ const fn = _pendingAuto; _pendingAuto = null; fn(); }
  };
  {
    // the owner (consistent entrance): every word card now enters the SAME way — a
    // calm rise + scale from center. It used to grow out of the tapped word's
    // on-screen rect, so each word launched the card from a different direction
    // (the "popping out of different directions"). Fixed vector + spring-gentle
    // (no spring-pop overshoot) = one intentional motion every time.
    overlay._flipVec = { dx: 0, dy: 56 };
    flip.style.transform = 'scale(.985)';
    flip.style.opacity = '0';
    void flip.offsetWidth;   // commit the start state
    flip.style.transition = 'transform 240ms var(--ease-out), opacity 240ms var(--ease-out)';
    flip.style.transform = 'scale(1)';
    flip.style.opacity = '1';
    flip.addEventListener('transitionend', (ev) => {
      if (ev.target === flip && ev.propertyName === 'transform') _finishEntry();
    });
    setTimeout(_finishEntry, 700);   // backstop (reduced-motion / lost event)
  }

  // ── Source-line strip (Change 2) — show WHICH line this word came from, so a
  // learner isn't staring at a full-screen card with no context, plus a play
  // control that drives THAT line. Sits at the top of the overlay as an
  // absolutely-positioned sibling (NOT inside the flipping inner, so it isn't
  // mirrored by the rotateY). All taps stopPropagation so they don't hit the
  // backdrop-close or the card's tap-to-replay.
  if (srcLine && srcLine.text){
    const _hi = (txt, w) => {
      const i = w ? txt.indexOf(w) : -1;
      if (i < 0) return escapeHtml(txt);
      return escapeHtml(txt.slice(0, i))
        + '<b style="color:' + roleHue + ';font-weight:800;">' + escapeHtml(w) + '</b>'
        + escapeHtml(txt.slice(i + w.length));
    };
    const strip = document.createElement('div');
    strip.className = 'pd-line-strip';
    strip.style.cssText = 'position:absolute!important;top:max(14px,env(safe-area-inset-top))!important;left:0!important;right:0!important;display:flex!important;justify-content:center!important;padding:0 14px!important;pointer-events:none!important;z-index:2!important;';
    // Context-only strip: shows WHICH line the word came from (tapped word
    // highlighted) + its translation. No play button here — transport lives on
    // the study sheet ("previous screen"), the word card shouldn't duplicate it.
    strip.innerHTML = `
      <div class="pd-line-card" style="pointer-events:auto;text-align:center;max-width:560px;width:100%;background:rgba(20,12,24,0.28);-webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);color:#F4F6FF;border:1px solid rgba(255,255,255,.10);border-radius:14px;padding:9px 14px;box-shadow:0 6px 20px rgba(0,0,0,.22);">
        <div class="pd-line-jp" style="font-family:var(--f-voice);font-size:14px;font-weight:600;line-height:1.35;">${_hi(srcLine.text, jpKey)}</div>
        ${srcLine.enInline ? `<div class="pd-line-en" style="font-size:11px;opacity:0.7;margin-top:2px;line-height:1.3;">${escapeHtml(srcLine.enInline)}</div>` : ''}
      </div>`;
    overlay.appendChild(strip);
  }

  // Bottom toolbar (owner: the study-sheet controls should also be on the word
  // card) — slow / loop / play / share / close, acting on the word's source LINE.
  // Reuses renderActions() so it's identical to the study sheet; wired here to
  // lineIdx. studyclose exits the whole study flow (matches the sheet's book).
  if (typeof renderActions === 'function'){
    const toolbar = document.createElement('div');
    toolbar.className = 'pd-toolbar';
    toolbar.innerHTML = renderActions();
    // The studyclose button is already a back-arrow (renderActions); on the word
    // card it returns to the word grid, so give it the more specific label.
    const _backBtn = toolbar.querySelector('.card-btn[data-action="studyclose"]');
    if (_backBtn) _backBtn.setAttribute('aria-label', 'back to word study');
    overlay.appendChild(toolbar);
    if (typeof loopingIdx !== 'undefined' && loopingIdx === lineIdx){
      const lb = toolbar.querySelector('.card-btn[data-action="loop"]');
      if (lb) lb.classList.add('active');
    }
    const _stopWordAudio = () => {
      if (_expandedAudio){ try { _expandedAudio.pause(); _expandedAudio.onloadedmetadata = null; } catch(_){} _expandedAudio = null; }
      if (_expandedRaf){ cancelAnimationFrame(_expandedRaf); _expandedRaf = null; }
      if (_expandedStill){ clearTimeout(_expandedStill); _expandedStill = null; }
      try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch(_){}
    };
    toolbar.querySelectorAll('.card-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const action = btn.dataset.action;
        const idx = lineIdx;
        // On the word card the book is a BACK button — step back one level to the
        // word grid (Word study), leaving the study sheet open. (NOT a full exit.)
        if (action === 'studyclose'){ collapsePitchRow(); return; }
        if (action === 'play'){ _stopWordAudio(); togglePlayForCard(idx); }
        else if (action === 'loop'){
          _stopWordAudio();
          // af3r1o — this toggle lives on the word card (always inside the study
          // sheet): just ARM/disarm the loop via setLoop, never start YouTube
          // behind the sheet. Closing the sheet re-anchors the looped line.
          if (loopingIdx === idx){ SFX.loopOff(); setLoop(-1); }
          else { SFX.loopOn(); setLoop(idx); }
          toolbar.querySelectorAll('.card-btn[data-action="loop"]').forEach(b => b.classList.toggle('active', loopingIdx === idx));
        }
        else if (action === 'slowdown'){ SFX.toggle(); playbackRate = (playbackRate < 1) ? 1 : 0.75; localStorage.setItem('tapLines_rate', String(playbackRate)); applyPlaybackRate(); }
        else if (action === 'share'){ SFX.tap(); shareLyricLine(idx, btn); }
      });
    });
  }

  // Front contour always renders the JP word. Build the SVG lazily the
  // first time the front face is actually on-screen — measuring it while
  // it's rotated away (the EN-open path lands on the back first) would
  // mirror the contour against the flipped X axis.
  const frontAudioUrl = _audioUrlFor(secId, uidKey, 'jp');
  const totalCols = morae.length + (isOdaka ? 1 : 0);
  let _frontBuilt = false;
  const buildFrontViz = (autoplay) => {
    if (_frontBuilt) return; _frontBuilt = true;
    requestAnimationFrame(() => {
      _buildPitchSvg(detail, morae, pat, isOdaka);
      // D2 still beat: the first auto-play waits for the entry spring to
      // land, then holds a 350ms beat on the static gray contour before the
      // word's audio + the exact contour draw start together. NOT a new
      // autoplay — this is the same single open-time play, re-timed.
      if (autoplay && frontAudioUrl) _whenEntryDone(() => _startPitchAnimation(detail, frontAudioUrl, tData, totalCols, 350));
    });
  };

  // Back-face tap → hear the English meaning (mirrors the front's
  // tap-to-replay). No contour animation on the back; just the audio.
  const playEnAudio = () => {
    if (!enAudioUrl) return;
    // TOGGLE: tapping while this same clip is playing pauses it (owner: a
    // second tap shouldn't restart a 14-second definition over itself).
    if (_expandedAudio && _expandedAudio._src === enAudioUrl && !_expandedAudio.paused){
      try { _expandedAudio.pause(); } catch(_){}
      _expandedAudio = null;
      return;
    }
    if (_expandedAudio) { try { _expandedAudio.pause(); _expandedAudio.onloadedmetadata = null; } catch(_){} _expandedAudio = null; }
    if (_expandedRaf) { cancelAnimationFrame(_expandedRaf); _expandedRaf = null; }
    const a = new Audio(_withAudioV(enAudioUrl));
    a._src = enAudioUrl;
    _expandedAudio = a;
    a.play().catch(err => console.warn('en meaning audio failed', err));
  };
  // owner: NO explanation on the FRONT — the front is just the word + its pitch,
  // and it speaks only the word. The meaning + context (and their audio) live on
  // the BACK now, so the word clip's onended must NOT chain a definition.
  detail._enAudioUrl = null;
  // Back "hear it in context" control → plays the per-word context clip.
  const playCtxAudio = () => {
    if (!ctxAudioUrl) return;
    if (_expandedAudio && _expandedAudio._src === ctxAudioUrl && !_expandedAudio.paused){
      try { _expandedAudio.pause(); } catch(_){}
      _expandedAudio = null;
      return;
    }
    if (_expandedAudio) { try { _expandedAudio.pause(); _expandedAudio.onloadedmetadata = null; } catch(_){} _expandedAudio = null; }
    if (_expandedRaf) { cancelAnimationFrame(_expandedRaf); _expandedRaf = null; }
    const a = new Audio(_withAudioV(ctxAudioUrl));
    a._src = ctxAudioUrl;
    _expandedAudio = a;
    a.play().catch(err => console.warn('context audio failed', err));
  };
  // Back face = "definition and context" (owner). Speak the natural DEFINITION,
  // then the in-this-line CONTEXT, as one explanation. Each stage skips
  // gracefully if its clip is missing; tracks _expandedAudio so flipping away,
  // closing, or re-tapping stops it like any other word-card audio.
  const playBackExplain = () => {
    if (_expandedAudio) { try { _expandedAudio.pause(); _expandedAudio.onloadedmetadata = null; } catch(_){} _expandedAudio = null; }
    if (_expandedRaf) { cancelAnimationFrame(_expandedRaf); _expandedRaf = null; }
    const queue = [enAudioUrl, ctxAudioUrl].filter(Boolean);
    if (!queue.length) return;
    let k = 0;
    const next = () => {
      if (k >= queue.length){ _expandedAudio = null; return; }
      const u = queue[k++];
      const a = new Audio(_withAudioV(u));
      a._src = u;
      _expandedAudio = a;
      a.onended = () => { if (_expandedAudio === a) next(); };
      a.onerror = () => { if (_expandedAudio === a) next(); };
      a.play().catch(() => { if (_expandedAudio === a) next(); });
    };
    next();
  };
  // The dedicated "hear it in context" pill was removed — tapping the card
  // itself already replays the in-context clip (handler below), so the extra
  // button was redundant. playCtxAudio() lives on, called by that tap handler.
  // mana2 (owner): tapping the back face replays the in-context meaning, mirroring
  // the front's tap-to-replay so both faces behave identically. A tap while it's
  // sounding stops it. Buttons/links inside handle themselves (stopPropagation).
  back.addEventListener('click', (e) => {
    if (e.target.closest('.pd-flip') || e.target.closest('.pb-ctx-listen') || e.target.closest('.pb-jisho')) return;
    e.stopPropagation();
    if (_expandedStill || _expandedRaf || (_expandedAudio && !_expandedAudio.paused)) { stopWordCardAudio(); return; }
    playBackExplain();
  });

  // Card height follows the ACTIVE face. The grid overlay sizes the card to
  // the TALLER face — with scene images on the back, that left most FRONTS
  // 50-70% empty purple (stress harness; owner: "the card is too large").
  // Round 12 (D3): BOTH faces are measured once at open (hide one, read,
  // restore — synchronous, no paint in between). No height transition: the
  // container height changes in ONE style write at the 90-degree crossing
  // of the rotateY, where the card is edge-on and the jump can't be seen.
  let _faceH = null;
  let _hSwapTimer = null;
  const _measureFaces = () => {
    const prev = flipInner.style.height;
    flipInner.style.height = 'auto';
    back.style.display = 'none';
    const hF = flipInner.offsetHeight;
    back.style.display = '';
    detail.style.display = 'none';
    const hB = flipInner.offsetHeight;
    detail.style.display = '';
    flipInner.style.height = prev;
    const ovEl = flip.closest('.pitch-overlay');
    const hMax = Math.round((ovEl ? ovEl.clientHeight : window.innerHeight) * 0.80);
    _faceH = { front: Math.min(hF, hMax), back: Math.min(hB, hMax) };
  };
  const setFlipped = (toBack) => {
    // Flipping = leaving the visible face; whatever that face was saying
    // (definition, in-context, word clip) stops with it. Same lifecycle rule
    // as closing the overlay — audio never outlives its surface.
    stopWordCardAudio();
    if (!_faceH) _measureFaces();
    flipInner.classList.toggle('flipped', toBack);
    // Height write at the crossing: the 460ms spring (front→back) is edge-on
    // around t=92ms; the 300ms ease-in-out (back→front) around t=105ms.
    const targetH = (toBack ? _faceH.back : _faceH.front) + 'px';
    if (_hSwapTimer) clearTimeout(_hSwapTimer);
    const _writeH = () => { _hSwapTimer = null; flipInner.style.height = targetH; };
    _hSwapTimer = setTimeout(_writeH, toBack ? 92 : 105);
    // transitionend backstop — if the timer was throttled past the whole
    // flip (background tab), land the height with the transform.
    flipInner.addEventListener('transitionend', function _hbs(ev){
      if (ev.target !== flipInner || ev.propertyName !== 'transform') return;
      flipInner.removeEventListener('transitionend', _hbs);
      if (_hSwapTimer){ clearTimeout(_hSwapTimer); _writeH(); }
    });
    if (!toBack) buildFrontViz(true); // building/replaying the contour when the pitch side shows
    else {
      // mana2 (owner): "flip card just speaks the card." The front auto-plays the
      // word; the back auto-plays its DEFINITION then CONTEXT. Wait for the flip
      // to settle past the edge-on crossing so audio doesn't fight it.
      setTimeout(() => { if (flipInner.classList.contains('flipped')) playBackExplain(); }, 300);
    }
  };
  // The scene image arrives async and can grow the back face after the
  // open-time measurement — refresh the cached heights once when it lands.
  if (_imgFrame){
    const _sceneImg = _imgFrame.querySelector('.pb-img');
    if (_sceneImg) _sceneImg.addEventListener('load', () => {
      try {
        _measureFaces();
        if (flipInner.classList.contains('flipped')) flipInner.style.height = _faceH.back + 'px';
      } catch(_){}
    }, { once:true });
  }

  // Bottom flip strips — "the bottom of the card flips it". Stop the tap
  // from bubbling to the face's replay handler.
  flipInner.querySelectorAll('.pd-flip').forEach(strip => {
    const toggle = (e) => { e.stopPropagation(); e.preventDefault(); try { SFX.tap(); } catch(_){}
      setFlipped(strip.dataset.flip === 'back'); };
    strip.addEventListener('click', toggle);
    strip.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') toggle(e); });
  });

  // Initial face: always open on the meaning-first FRONT and auto-pronounce the
  // word, no matter which tile (JP or EN) was tapped. The definition + "hear the
  // definition" are right there; the in-context explanation is one flip away.
  buildFrontViz(true);
  // Measure both faces once layout settles; open at the FRONT's natural
  // height (not the taller back's). Single un-transitioned height write.
  requestAnimationFrame(() => { try { _measureFaces(); flipInner.style.height = _faceH.front + 'px'; } catch(_){} });
  // Self-check: did the overlay actually render with non-zero size?
  // If not, surface via toast so we can see WHAT'S failing instead of
  // guessing.
  requestAnimationFrame(() => {
    const r = overlay.getBoundingClientRect();
    if (r.width === 0 || r.height === 0 || !document.body.contains(overlay)) {
      _showPitchToast(`overlay 0×0! dom=${document.body.contains(overlay)}`);
    } else {
      _showPitchToast(`opened ${row.dataset.pitchKey} (${r.width|0}×${r.height|0})`);
    }
  });
  overlay._row = row;
  _activeOverlay = overlay;

  // rb28m3 — final tap model (owner): tap ON the (front) card replays the word
  // audio + contour; tap OUTSIDE closes it (wired below). The contour is built
  // lazily by buildFrontViz, so a first tap that beats the build still works.
  const replayAudio = () => {
    if (!_frontBuilt) { buildFrontViz(true); return; }
    // Replays keep a short 150ms still beat (D2) — reset to the gray
    // contour, breathe, then audio + draw together.
    if (frontAudioUrl) _startPitchAnimation(detail, frontAudioUrl, tData, totalCols, 150);
  };
  detail.addEventListener('click', (e) => {
    if (e.target.closest('.pd-flip')) return; // flip strip handles itself
    // If this click came from a swipe (suppressed via the touchend navigation
    // handler below), ignore it.
    if (detail._swallowNextClick) { detail._swallowNextClick = false; e.stopPropagation(); return; }
    e.stopPropagation();
    // owner: tap the pitch to toggle — if the word/definition is sounding, a tap
    // STOPS it; otherwise it replays the word + definition from the top.
    if (_expandedStill || _expandedRaf || (_expandedAudio && !_expandedAudio.paused)) {
      stopWordCardAudio();
      return;
    }
    replayAudio();
  });

  // 6429c5 — word-to-word navigation removed (owner). The overlay no longer
  // swipes/scrolls/arrow-keys to the next or previous word; it shows the one
  // word you opened until you tap outside to close. Tap-to-replay is the only
  // on-card gesture. (Was gpnt34's swipe-up/down + trackpad-wheel + arrow keys.)
  // (v3s2sr — JP pattern-name audio chip removed.)
  // Overlay backdrop tap → close. (owner: "tap outside of that card to
  // make it go back".) Detail-card taps are handled by the inner
  // listener above (single = replay, double = close, X = close).
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) { e.stopPropagation(); collapsePitchRow(); }
  });
  overlay.addEventListener('touchend', (e) => {
    if (e.target !== overlay) return;
    e.stopPropagation();
    // 1re37z — kill the iOS ghost click. collapsePitchRow() removes the overlay
    // synchronously here, so the synthesized `click` that follows this touchend
    // would land on the word tile now exposed underneath — replaying its audio
    // and reopening a fresh overlay. Tapping a few times to exit stacked another
    // play each time (owner: "registers all the taps and plays every single one
    // over each other ... you can't exit"). preventDefault suppresses the ghost
    // click; the one-shot capture swallow is a backstop for iOS builds that emit
    // it anyway.
    e.preventDefault();
    const swallow = (ce) => { ce.stopPropagation(); ce.preventDefault(); };
    document.addEventListener('click', swallow, { capture: true, once: true });
    setTimeout(() => document.removeEventListener('click', swallow, true), 700);
    collapsePitchRow();
  }, { passive: false });
}
let _activeOverlay = null;

function _audioUrlFor(secId, rom, lang) {
  if (!secId || !rom) return null;
  const uid = _romUid(rom);
  // Versioned at the SOURCE: every card/pitch player that builds a URL here
  // inherits the AUDIO_V cache-bust, so a replaced clip can never be shadowed
  // by the immutable-cached old bytes (the "still sounds like TTS" trap).
  if (lang === 'en') return _withAudioV(`audio/en/word_${secId}_${uid}_en.mp3`);
  if (lang === 'ctx') return _withAudioV(`audio/en/word_${secId}_${uid}_ctx.mp3`);
  return _withAudioV(`audio/jp/word_${secId}_${uid}.mp3`);
}

function _fallbackMorae(jp) {
  // Crude split when pitch data hasn't loaded — just chars
  const SMALL = 'ャュョゃゅょァィゥェォぁぃぅぇぉ';
  const out = []; let i = 0;
  while (i < jp.length) {
    if (i+1 < jp.length && SMALL.includes(jp[i+1])) { out.push(jp[i]+jp[i+1]); i += 2; }
    else { out.push(jp[i]); i++; }
  }
  return out;
}

// t3ow6s — Kanshudo-style step-line pitch contour.
//
// Right-angle steps over the kana: horizontal segments at H or L level
// per mora, vertical risers between morae of different pitch, and a
// drop bracket ┐ extending past the last mora for odaka words. This is
// the NHK dictionary / Kanshudo notation, more familiar to JP learners
// than the diagonal polyline we had before.
function _buildPitchSvg(detail, morae, pat, isOdaka) {
  const svg = detail.querySelector('.pd-svg');
  const stack = detail.querySelector('.pd-stack');
  const moraEls = Array.from(detail.querySelectorAll('.pd-mora-row .mora'));
  const stackRect = stack.getBoundingClientRect();
  // Per mora: center x AND half-width (so we know each mora's left/right
  // edge for the horizontal segment span).
  const positions = moraEls.map(el => {
    const r = el.getBoundingClientRect();
    return { cx: r.left - stackRect.left + r.width / 2, w: r.width };
  });
  const n = morae.length;
  const stageH = 26; const padY = 5;
  const yH = padY;            // high line y
  const yL = stageH - padY;   // low line y
  const w = stackRect.width;
  svg.setAttribute('width', w);
  svg.setAttribute('height', stageH + 6);
  svg.setAttribute('viewBox', `0 0 ${w} ${stageH+6}`);
  svg.innerHTML = '';

  // Build step-path. For each mora, draw a horizontal at its level
  // spanning the mora's width. Between consecutive morae of different
  // levels, draw a vertical at the midpoint of the gap.
  // ALSO record cumulative path length per mora so the audio→line
  // animation can map "mora i finished" → "path drawn up to checkpoint i"
  // (piecewise-linear interpolation). Fixes the prior linear-time mapping
  // where odaka's drop-bracket ate animation budget and the line
  // under-drew during the actual morae playback.
  let pathD = '';
  let prevY = null;
  let prevRight = null;
  let cumLen = 0;
  const moraCumLens = [];
  positions.slice(0, n).forEach((p, i) => {
    const y = pat[i] === 'H' ? yH : yL;
    const segHalf = p.w * 0.42;
    const xL = p.cx - segHalf;
    const xR = p.cx + segHalf;
    let segLen = 0;
    if (i === 0) {
      pathD = `M ${xL.toFixed(2)} ${y} L ${xR.toFixed(2)} ${y}`;
      segLen = xR - xL;
    } else if (prevY !== y) {
      const midX = (prevRight + xL) / 2;
      pathD += ` L ${midX.toFixed(2)} ${prevY} L ${midX.toFixed(2)} ${y} L ${xR.toFixed(2)} ${y}`;
      segLen = (midX - prevRight) + Math.abs(prevY - y) + (xR - midX);
    } else {
      pathD += ` L ${xR.toFixed(2)} ${y}`;
      segLen = xR - prevRight;
    }
    cumLen += segLen;
    moraCumLens.push(cumLen);
    prevY = y;
    prevRight = xR;
  });
  // Drop bracket for odaka — line continues past the last mora at H,
  // then drops to L. Treated as the (n+1)th checkpoint, drawn during
  // the trailing audio silence so it doesn't steal time from morae.
  if (isOdaka && prevY === yH) {
    const dropX = prevRight + (positions[0]?.w || 30) * 0.5;
    pathD += ` L ${dropX.toFixed(2)} ${yH} L ${dropX.toFixed(2)} ${yL}`;
    cumLen += (dropX - prevRight) + (yL - yH);
    moraCumLens.push(cumLen);
  }

  const NS = 'http://www.w3.org/2000/svg';
  // Background ghost path (faint outline of where the line will draw)
  const bg = document.createElementNS(NS, 'path');
  bg.setAttribute('class', 'pd-path-bg');
  bg.setAttribute('d', pathD);
  svg.appendChild(bg);

  // Round 13: one 4x4px SQUARE dot per mora, sitting on its pitch plateau
  // (crispEdges, neutral ink — see .pd-anchor CSS). The nodes are still keyed
  // by data-idx/data-hl so the audio timing lights them (lit-h / lit-l) exactly
  // as before; only the SHAPE changed circle -> rect.
  const anchorPts = positions.slice(0, n).map((p, i) => ({
    x: p.cx, y: pat[i] === 'H' ? yH : yL, hl: pat[i]
  }));
  anchorPts.forEach((p, i) => {
    const c = document.createElementNS(NS, 'rect');
    c.setAttribute('class', 'pd-anchor');
    c.setAttribute('x', (p.x - 2).toFixed(2));
    c.setAttribute('y', (p.y - 2).toFixed(2));
    c.setAttribute('width', '4');
    c.setAttribute('height', '4');
    c.dataset.idx = i; c.dataset.hl = p.hl;
    svg.appendChild(c);
  });

  // Foreground animated path
  const fg = document.createElementNS(NS, 'path');
  fg.setAttribute('class', 'pd-path-fg');
  fg.setAttribute('d', pathD);
  svg.appendChild(fg);

  // Leading-edge dot rides along the step-path
  const dot = document.createElementNS(NS, 'circle');
  dot.setAttribute('class', 'pd-dot');
  dot.setAttribute('r', '4');
  dot.setAttribute('cx', '0'); dot.setAttribute('cy', '0');
  svg.appendChild(dot);

  const len = fg.getTotalLength();
  fg.style.strokeDasharray = len;
  fg.style.strokeDashoffset = len;
  detail._pdSvgState = { fg, dot, pathLen: len, anchors: svg.querySelectorAll('.pd-anchor'), moraEls, moraCumLens };
}

function _startPitchAnimation(detail, audioUrl, tData, totalCols, stillMs) {
  // Stop any prior animation. yse31y — the actual .play() fires later inside
  // onloadedmetadata, so a clip tapped before its metadata loaded would still
  // play from its own pending callback even after we drop the reference here,
  // stacking audio on a fast re-tap. Null its onloadedmetadata so the pending
  // callback is a no-op, in addition to pausing whatever's already sounding.
  if (_expandedAudio) {
    try { _expandedAudio.pause(); _expandedAudio.onloadedmetadata = null; } catch(_){}
    _expandedAudio = null;
  }
  if (_expandedRaf) { cancelAnimationFrame(_expandedRaf); _expandedRaf = null; }
  if (_expandedStill) { clearTimeout(_expandedStill); _expandedStill = null; }
  const st = detail._pdSvgState;
  if (!st) {
    setTimeout(() => _startPitchAnimation(detail, audioUrl, tData, totalCols, stillMs), 60);
    return;
  }
  // Reset visuals NOW — the still beat (D2) holds on the static gray
  // contour with unlit anchors, then audio + the exact draw start together.
  st.fg.style.strokeDashoffset = st.pathLen;
  st.dot.classList.remove('active');
  st.anchors.forEach(a => a.classList.remove('lit-h','lit-l'));
  st.moraEls.forEach(m => m.classList.remove('lit-low','lit-high'));
  if (stillMs > 0) {
    _expandedStill = setTimeout(() => {
      _expandedStill = null;
      _armPitchAudio(detail, st, audioUrl, tData, totalCols);
    }, stillMs);
    return;
  }
  _armPitchAudio(detail, st, audioUrl, tData, totalCols);
}

function _armPitchAudio(detail, st, audioUrl, tData, totalCols) {
  const audio = new Audio(_withAudioV(audioUrl));
  _expandedAudio = audio;
  // Boundary table
  let starts, ends;
  if (tData && tData.mora_starts) {
    starts = tData.mora_starts.slice();
    ends = tData.mora_ends.slice();
    if (totalCols > starts.length) {
      // Odaka — append one virtual col after last mora end
      const last = ends[ends.length-1];
      starts.push(last); ends.push(tData.duration);
    }
  } else {
    // Even-division fallback against actual audio duration
    starts = []; ends = [];
  }
  audio.onloadedmetadata = () => {
    // yse31y — bail if a newer tap already superseded this clip. Belt-and-
    // suspenders with the onloadedmetadata=null above: guarantees only the
    // current _expandedAudio ever reaches play(), so taps never overlap.
    if (_expandedAudio !== audio) return;
    if (!starts.length) {
      const d = audio.duration || 1.0;
      starts = Array.from({length: totalCols}, (_, i) => i * d / totalCols);
      ends   = Array.from({length: totalCols}, (_, i) => (i+1) * d / totalCols);
    }
    audio.play().catch(err => console.warn('pitch audio play failed', err));
    // hc7rmh — per-mora path checkpoints. Build a piecewise-linear
    // mapping from audio time → drawn path length. Each mora's audio
    // window draws exactly that mora's segment of the path. Odaka's
    // drop-bracket uses the trailing silence after the last mora.
    // Replaces the prior single-span linear mapping that under-drew
    // during morae and over-allocated path to silence on odaka words.
    const cps = [{ t: starts[0] ?? 0, len: 0 }];
    const cumLens = st.moraCumLens || [];
    for (let i = 0; i < ends.length && i < cumLens.length; i++) {
      cps.push({ t: ends[i], len: cumLens[i] });
    }
    // The manual cumLen sum can fall a few px short of the browser-measured
    // getTotalLength, so lenAt would top out below pathLen and the contour
    // would never fully draw on some words (the reveal stopped before the
    // end). Pin the final checkpoint to the true path length so the reveal
    // always completes through the whole word.
    if (cps.length > 1) cps[cps.length - 1].len = st.pathLen;
    function lenAt(t) {
      if (t <= cps[0].t) return 0;
      for (let i = 1; i < cps.length; i++) {
        if (t <= cps[i].t) {
          const dt = cps[i].t - cps[i-1].t;
          if (dt <= 0) return cps[i].len;
          const local = (t - cps[i-1].t) / dt;
          return cps[i-1].len + local * (cps[i].len - cps[i-1].len);
        }
      }
      return st.pathLen; // past the last checkpoint → fully drawn
    }
    // Force the reveal to its completed state (full line + every mora lit).
    // Called on audio end so a trailing-frame gap never leaves it short.
    const finishReveal = () => {
      st.fg.style.strokeDashoffset = 0;
      st.dot.classList.remove('active');
      for (let i = 0; i < st.anchors.length; i++) {
        const hl = st.anchors[i].dataset.hl;
        st.anchors[i].classList.add(hl === 'H' ? 'lit-h' : 'lit-l');
        const me = st.moraEls[i];
        if (me && !me.classList.contains('drop-marker')) me.classList.add(hl === 'H' ? 'lit-high' : 'lit-low');
      }
    };
    // A8: audio.currentTime reports the DECODE clock; what the ear hears
    // lags by the device's output latency (Bluetooth especially). Estimate
    // once per page and pull the visual mapping back by it so the contour
    // edge tracks the heard mora, not the decoded one.
    const _outLat = (window.__outLat !== undefined) ? window.__outLat
      : (window.__outLat = (() => {
          try {
            const c = new (window.AudioContext || window.webkitAudioContext)();
            const v = c.outputLatency || 0.02;
            c.close();
            return v;
          } catch(_){ return 0.02; }
        })());
    const tick = () => {
      if (!audio || audio.paused) return;
      const t = Math.max(0, audio.currentTime - _outLat);
      const len = lenAt(t);
      st.fg.style.strokeDashoffset = Math.max(0, st.pathLen - len);
      if (len > 0 && len < st.pathLen) {
        const pt = st.fg.getPointAtLength(len);
        st.dot.setAttribute('cx', pt.x.toFixed(2));
        st.dot.setAttribute('cy', pt.y.toFixed(2));
        st.dot.classList.add('active');
      } else if (len >= st.pathLen) {
        const pt = st.fg.getPointAtLength(st.pathLen);
        st.dot.setAttribute('cx', pt.x.toFixed(2)); st.dot.setAttribute('cy', pt.y.toFixed(2));
      }
      for (let i = 0; i < st.anchors.length; i++) {
        if (t >= starts[i]) {
          const hl = st.anchors[i].dataset.hl;
          st.anchors[i].classList.add(hl === 'H' ? 'lit-h' : 'lit-l');
          const me = st.moraEls[i];
          if (me && !me.classList.contains('drop-marker')) me.classList.add(hl === 'H' ? 'lit-high' : 'lit-low');
        }
      }
      _expandedRaf = requestAnimationFrame(tick);
    };
    audio.onended = () => {
      if (_expandedAudio !== audio) return; // superseded by a newer tap
      cancelAnimationFrame(_expandedRaf); _expandedRaf = null;
      finishReveal(); // complete the contour through the whole word
      // owner: the curated English definition plays right after the word as ONE
      // continuous sound. It becomes the tracked _expandedAudio so a tap (toggle)
      // or leaving the surface still stops it.
      const enUrl = detail._enAudioUrl;
      if (enUrl) {
        const en = new Audio(_withAudioV(enUrl));
        en._src = enUrl;
        _expandedAudio = en;
        en.play().catch(err => console.warn('definition chain failed', err));
        en.onended = () => { if (_expandedAudio === en) _expandedAudio = null; };
      } else {
        _expandedAudio = null;
      }
      // Overlay stays until the user taps off (collapse). No auto-close.
    };
    _expandedRaf = requestAnimationFrame(tick);
  };
  audio.onerror = () => console.warn('audio error', audioUrl);
}

function collapsePitchRow() {
  if (_expandedAudio) { try { _expandedAudio.pause(); } catch(_){} _expandedAudio = null; }
  if (_expandedRaf) { cancelAnimationFrame(_expandedRaf); _expandedRaf = null; }
  if (_expandedStill) { clearTimeout(_expandedStill); _expandedStill = null; }
  if (_activeOverlay) {
    // Unbind the per-overlay keyboard nav handler
    if (_activeOverlay._keyNav) try { document.removeEventListener('keydown', _activeOverlay._keyNav); } catch(_){}
    // The handle is nulled immediately so a re-open during the exit creates
    // a fresh overlay rather than fighting this one.
    const ov = _activeOverlay; _activeOverlay = null;
    ov._closing = true;
    ov.style.setProperty('pointer-events', 'none', 'important');
    // D2 exit: blur drops on frame 1 (never animated), the card retreats a
    // quarter of the way back toward its chip while shrinking and fading,
    // and the dim fades last. Removal on the dim's transitionend with a
    // 250ms backstop.
    const blurEl = ov.querySelector('.pd-blur');
    if (blurEl) blurEl.style.opacity = '0';
    const flipEl = ov.querySelector('.pitch-flip');
    if (flipEl) {
      const v = ov._flipVec || { dx: 0, dy: 0 };
      flipEl.style.transition = 'transform 180ms var(--ease-in), opacity 160ms var(--ease-in)';
      flipEl.style.transform = `translate(${(v.dx * 0.25).toFixed(1)}px,${(v.dy * 0.25).toFixed(1)}px) scale(0.9)`;
      flipEl.style.opacity = '0';
    }
    let _gone = false;
    const _remove = () => { if (_gone) return; _gone = true; try { ov.remove(); } catch(_){} };
    const dimEl = ov.querySelector('.pd-dim');
    if (dimEl) {
      dimEl.style.transition = 'opacity 160ms var(--ease-in)';
      dimEl.style.opacity = '0';
      dimEl.addEventListener('transitionend', _remove);
    }
    setTimeout(_remove, 250);
  }
  if (_expandedRow) {
    _expandedRow.classList.remove('is-expanded');
    _expandedRow = null;
  }
}

// Escape key dismisses overlay
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && _expandedRow) collapsePitchRow();
});

// owner: audio belongs to the surface that started it — if the page is hidden
// (tab switch, app backgrounded, screen lock) any word/clip/word-card audio
// stops so nothing keeps talking off-screen. The song + podcast are left alone:
// those are deliberate listening that should survive backgrounding.
document.addEventListener('visibilitychange', () => {
  if (document.hidden){
    try { stopVocabAudio(); } catch(_){}
    try { collapsePitchRow(); } catch(_){}
  }
});
window.addEventListener('pagehide', () => {
  try { stopVocabAudio(); } catch(_){}
  try { collapsePitchRow(); } catch(_){}
});

/* ===== Round 13: THE DENMOKU PUNCH (FINAL-DESIGN §6) =====
   One delegated pointerdown listener. Every tappable CHROME control flashes
   inverse video (100ms steps(1)) the instant it's pressed, before its action
   fires. NEVER inside the lyric stage / wipe — those selectors aren't matched,
   and we bail outright if the press lands inside .stage / .card-stack / a lyric
   layer. .punch is removed on animationend (or a 160ms backstop). */
(function(){
  // tappable chrome (NOT lyrics): den-keys, transport LCD segments, corner
  // toggles, podcast keys, the Word-by-Word / Explainer bars, the songbook
  // print rows, drill rate keys.
  var PUNCH_SEL = [
    '.u-back', '.corner-btn', '.den-key', '.drill-btn',
    '#cardSheet .card-actions .card-btn', '.pitch-overlay .pd-toolbar .card-btn',
    '.u-skip-btn', '.u-play-btn',
    '.u-tp-info--btn', '.u-tp-info--mode', '.u-mode-chip',
    '#cardSheet .card-translation.has-translation',
    '#cardSheet .card-section-overview.has-overview',
    '#cardSheet .card-face.back .wc'
  ].join(',');
  // hard exclusions — the press must not be inside the lyric stage or wipe
  var BLOCK_SEL = '.stage, .card-stack, .lyric-layer, .rom-layer, .wipe-glow, .card-text, .card-romaji';
  document.addEventListener('pointerdown', function(e){
    if (e.target.closest && e.target.closest(BLOCK_SEL)) return;
    var el = e.target.closest ? e.target.closest(PUNCH_SEL) : null;
    if (!el || el.classList.contains('punch')) return;
    el.classList.add('punch');
    var clear = function(){ el.classList.remove('punch'); };
    el.addEventListener('animationend', clear, { once:true });
    setTimeout(clear, 160);
  }, true);
})();

</script>
